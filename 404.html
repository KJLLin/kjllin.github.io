<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; frame-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>404 页面未找到 · KJLLin</title>
  <meta name="description" content="页面未找到 - KJLLin 个人网站">
  <style>
    .bg-base{position:fixed;inset:0;z-index:-1;background:var(--color-bg);transition:background var(--transition-base)}
    .container{max-width:600px;margin:0 auto;padding:120px 16px 40px;text-align:center}
    .error-code{
      font-size:clamp(72px,15vw,120px);font-weight:700;color:var(--color-accent);
      line-height:1;margin-bottom:8px;letter-spacing:-2px;
      animation:fadeUp .6s var(--ease-out) forwards;
    }
    .error-subtitle{
      font-size:20px;font-weight:600;color:var(--color-text-primary);
      margin-bottom:12px;animation:fadeUp .6s var(--ease-out) .08s both;
    }
    .error-desc{
      font-size:14px;color:var(--color-text-tertiary);line-height:1.6;
      margin-bottom:32px;animation:fadeUp .6s var(--ease-out) .16s both;
    }
    .card-glass{padding:36px 28px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);box-shadow:var(--glass-shadow);animation:fadeUp .6s var(--ease-out) .24s both}
    .card-glass .icon-area{font-size:56px;margin-bottom:12px;opacity:.7;color:var(--color-text-tertiary)}
    .card-glass .suggest-title{font-size:15px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px}
    .card-glass .suggest-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .card-glass .suggest-links a{
      display:inline-flex;align-items:center;gap:6px;padding:9px 20px;
      border-radius:var(--radius-full);font-size:14px;font-weight:500;
      text-decoration:none;color:var(--color-accent);
      background:var(--color-accent-glow);
      transition:all var(--transition-fast);
    }
    .card-glass .suggest-links a:hover{background:var(--color-accent);color:var(--color-text-on-accent);transform:translateY(-1px);box-shadow:0 4px 12px var(--color-accent-glow)}
    .card-glass .suggest-links a:active{transform:scale(.96);transition:transform var(--duration-instant) var(--spring-default)}

    .footer-note{text-align:center;margin-top:28px;font-size:13px;color:var(--color-text-tertiary);animation:fadeUp .6s var(--ease-out) .32s both}
    .footer-note a{color:var(--color-accent);text-decoration:none}
    .footer-note a:hover{text-decoration:underline}

    @media(max-width:520px){
      .container{padding:100px 12px calc(28px + env(safe-area-inset-bottom, 0px))}
      .error-code{font-size:clamp(56px,18vw,90px)}
      .error-subtitle{font-size:17px}
      .card-glass{padding:28px 18px}
      .card-glass .suggest-links{flex-direction:column;align-items:stretch}
      .card-glass .suggest-links a{justify-content:center}
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <!-- 全局导航栏 -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <div class="error-code">404</div>
    <div class="error-subtitle">页面未找到</div>
    <div class="error-desc">你访问的页面可能已被移除、名称已更改，或者暂时不可用。</div>

    <div class="card-glass">
      <div class="icon-area"><i class="fas fa-compass"></i></div>
      <div class="suggest-title">试试这些页面</div>
      <div class="suggest-links">
        <a href="/"><i class="fas fa-home"></i> 返回首页</a>
        <a href="/chat"><i class="fas fa-envelope"></i> 站内信</a>
        <a href="/game/"><i class="fas fa-gamepad"></i> 游戏中心</a>
      </div>
    </div>

    <div class="footer-note">或者 <a href="javascript:history.back()">返回上一页</a></div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s)};
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode)}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI()});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();
    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
    KJ.initNav(null, { homeUrl: '/' });
    })();
  </script>
</body>
</html>
