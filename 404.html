<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; frame-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="/vendor/fontawesome/css/subset.min.css">
  <link rel="preload" as="font" type="font/woff2" href="/vendor/fontawesome/webfonts/fa-solid-900.woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>404 页面未找到 · KJLLin</title>
  <meta name="description" content="页面未找到 - KJLLin 个人网站">
  <style>
    .bg-base{position:fixed;inset:0;z-index:-1;background:var(--color-bg);transition:background var(--transition-base)}
    /* 一层很淡的顶部光，避免整页死平 */
    .bg-base::after{
      content:'';position:absolute;left:50%;top:-30%;
      width:min(900px,120vw);height:min(700px,90vh);
      transform:translateX(-50%);
      background:radial-gradient(closest-side, var(--color-accent-glow), transparent 72%);
      pointer-events:none;
    }
    body{min-height:100vh;display:flex;flex-direction:column}
    .container{
      flex:1;
      max-width:560px;margin:0 auto;
      padding:104px 16px 56px;
      display:flex;flex-direction:column;justify-content:center;
      text-align:center;
    }
    .error-code{
      font-size:clamp(84px,15vw,132px);font-weight:800;
      line-height:.94;margin-bottom:10px;letter-spacing:-.05em;
      background:linear-gradient(165deg, var(--color-text-primary) 6%, var(--color-accent) 96%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:fadeUp .55s var(--spring-default) both;
    }
    html[data-theme="dark"] .error-code{
      background:linear-gradient(165deg, #ffffff 6%, var(--color-accent) 96%);
      -webkit-background-clip:text;background-clip:text;
    }
    .error-subtitle{
      font-size:19px;font-weight:600;color:var(--color-text-primary);
      margin-bottom:10px;letter-spacing:-.01em;
      animation:fadeUp .55s var(--spring-default) .06s both;
    }
    .error-desc{
      font-size:14px;color:var(--color-text-tertiary);line-height:1.65;
      margin-bottom:30px;
      animation:fadeUp .55s var(--spring-default) .12s both;
    }
    .card-glass{
      padding:34px 28px;border-radius:var(--radius-lg);
      border:1px solid var(--color-border);
      border-top-color:var(--surface-border);
      background:var(--surface-2);
      backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);
      box-shadow:var(--shadow-md);
      animation:fadeUp .55s var(--spring-default) .18s both;
    }
    .card-glass .icon-area{font-size:48px;margin-bottom:14px;opacity:.55;color:var(--color-text-tertiary)}
    .card-glass .suggest-title{font-size:14px;font-weight:600;color:var(--color-text-secondary);margin-bottom:14px}
    .card-glass .suggest-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .card-glass .suggest-links a{
      display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
      border-radius:var(--radius-full);font-size:14px;font-weight:500;
      text-decoration:none;color:var(--color-accent);
      background:var(--color-accent-glow);
      transition: background var(--transition-fast), color var(--transition-fast),
                  transform 320ms var(--spring-release), box-shadow 240ms var(--spring-default);
    }
    .card-glass .suggest-links a:hover{background:var(--color-accent);color:var(--color-text-on-accent);transform:translateY(-2px);box-shadow:0 8px 20px var(--color-accent-glow)}
    .card-glass .suggest-links a:active{transform:scale(.96);transition:transform 90ms var(--spring-press)}

    .footer-note{text-align:center;margin-top:26px;font-size:13px;color:var(--color-text-tertiary);animation:fadeUp .55s var(--spring-default) .24s both}
    .footer-note a{color:var(--color-accent);text-decoration:none}
    .footer-note a:hover{text-decoration:underline}

    @media(max-width:520px){
      .container{padding:92px 12px calc(32px + env(safe-area-inset-bottom, 0px))}
      .error-code{font-size:clamp(64px,18vw,92px)}
      .error-subtitle{font-size:17px}
      .card-glass{padding:26px 18px}
      .card-glass .suggest-links{flex-direction:column;align-items:stretch}
      .card-glass .suggest-links a{justify-content:center}
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <!-- 全局导航栏 -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <div class="error-code">404</div>
    <div class="error-subtitle">页面未找到</div>
    <div class="error-desc">你访问的页面可能已被移除、名称已更改，或者暂时不可用。</div>

    <div class="card-glass">
      <div class="icon-area"><i class="fas fa-compass"></i></div>
      <div class="suggest-title">试试这些页面</div>
      <div class="suggest-links">
        <a href="/"><i class="fas fa-home"></i> 返回首页</a>
        <a href="/chat"><i class="fas fa-envelope"></i> 站内信</a>
        <a href="/game/"><i class="fas fa-gamepad"></i> 游戏中心</a>
      </div>
    </div>

    <div class="footer-note">或者 <a href="javascript:history.back()">返回上一页</a></div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s)};
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode)}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI()});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();
    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
    KJ.initNav(null, { homeUrl: '/' });
    })();
  </script>
</body>
</html>
