<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>登录设备 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html {
      --win-ease: cubic-bezier(0.4,0,0.2,1); --bounce: cubic-bezier(0.34,1.56,0.64,1);
      --transition-fast: 200ms var(--win-ease); --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      transition: background-color var(--transition-normal);
    }
    * { margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased; }
    :root {
      --bg-body:#f3f3f3;--bg-mica:rgba(255,255,255,0.85);--bg-mica-hover:rgba(255,255,255,0.95);
      --border-mica:rgba(0,0,0,0.06);--text-primary:#1a1a1a;--text-secondary:#5e5e5e;--text-tertiary:#8e8e8e;
      --accent:#0078d4;--accent-light:#0099ff;--accent-glow:rgba(0,120,212,0.1);--danger:#e74c3c;--success:#34c88a;
      --shadow-rest:0 2px 8px rgba(0,0,0,0.06);--shadow-hover:0 4px 16px rgba(0,0,0,0.09);
    }
    [data-theme="dark"]:root {
      --bg-body:#0f0f0f;--bg-mica:rgba(20,20,20,0.85);--bg-mica-hover:rgba(26,26,26,0.95);
      --border-mica:rgba(255,255,255,0.07);--text-primary:#f0f0f0;--text-secondary:#a0a0a0;--text-tertiary:#707070;
      --accent-glow:rgba(0,120,212,0.15);--shadow-rest:0 2px 8px rgba(0,0,0,0.25);--shadow-hover:0 4px 16px rgba(0,0,0,0.35);
    }
    html,body{width:100%;min-height:100vh;overflow-x:clip}
    body{background:var(--bg-body);color:var(--text-primary)}
    .bg-base{position:fixed;inset:0;background:var(--bg-body);z-index:-3;pointer-events:none}
    .mica{background:var(--bg-mica);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--border-mica)}

    .top-menu{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .menu-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:var(--radius-md);box-shadow:var(--shadow-rest);pointer-events:all}
    .menu-logo{font-size:18px;font-weight:700;color:var(--accent);padding:6px 14px}
    .menu-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
    .menu-item:hover,.menu-item.active{color:var(--accent);background:var(--accent-glow)}
    .menu-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:16px;cursor:pointer;background:rgba(220,220,220,0.4);color:var(--text-primary);display:grid;place-items:center}
    [data-theme="dark"] .menu-btn{background:rgba(40,40,40,0.4)}
    .menu-btn:hover{background:var(--accent-glow);color:var(--accent)}
    .theme-btn,#themeBtn{border-radius:50%}
    .hamburger{display:none}
    .mobile-menu-dropdown{display:none;position:absolute;top:calc(100%+8px);left:16px;right:16px;padding:8px;border-radius:var(--radius-md);box-shadow:var(--shadow-hover);flex-direction:column;gap:2px;pointer-events:all;z-index:101}
    .mobile-menu-dropdown.open{display:flex}
    .mobile-menu-dropdown .menu-item{display:block;width:100%;text-align:left}

    .container{max-width:720px;margin:0 auto;padding:80px 16px 40px}
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.5s var(--win-ease)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .page-header .icon{font-size:44px;margin-bottom:6px}
    .page-header h1{font-size:24px;font-weight:700;color:var(--accent)}

    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-tertiary);text-decoration:none;font-size:13px;margin-bottom:20px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--accent)}

    .card{padding:24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-rest);margin-bottom:16px;animation:fadeUp 0.5s var(--win-ease) 0.05s both}
    .card h2{font-size:17px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .card h2 .badge{font-size:12px;font-weight:500;padding:3px 10px;border-radius:12px;margin-left:auto}
    .badge-current{background:rgba(52,200,138,0.12);color:var(--success)}
    .badge-past{background:rgba(0,0,0,0.04);color:var(--text-tertiary)}
    [data-theme="dark"] .badge-past{background:rgba(255,255,255,0.05)}

    /* 设备列表 */
    .device-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-mica)}
    .device-item:last-child{border-bottom:none}
    .device-icon{width:42px;height:42px;border-radius:var(--radius-sm);background:rgba(0,120,212,0.08);display:grid;place-items:center;font-size:20px;color:var(--accent);flex-shrink:0}
    .device-icon.mobile{background:rgba(52,200,138,0.08);color:var(--success)}
    .device-icon.desktop{background:rgba(0,120,212,0.08);color:var(--accent)}
    .device-info{flex:1;min-width:0}
    .device-info .device-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
    .device-info .device-detail{font-size:12px;color:var(--text-tertiary);margin-top:2px;display:flex;align-items:center;gap:6px}
    .device-info .device-detail .sep{width:3px;height:3px;border-radius:50%;background:var(--text-tertiary);display:inline-block}
    .device-time{font-size:12px;color:var(--text-tertiary);text-align:right;flex-shrink:0}
    .device-time .ip{font-size:11px;color:var(--text-tertiary);margin-top:2px;font-family:"Consolas","Cascadia Code",monospace}

    /* 统计条 */
    .stats-bar{display:flex;gap:16px;justify-content:center;padding:12px 0;margin-bottom:8px}
    .stat-item{text-align:center}
    .stat-num{font-size:22px;font-weight:700;color:var(--accent);line-height:1}
    .stat-label{font-size:11px;color:var(--text-tertiary);margin-top:2px}

    /* 空状态 */
    .empty-state{text-align:center;padding:32px 16px;color:var(--text-tertiary)}
    .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}
    .empty-state p{font-size:14px;line-height:1.6}

    @media(max-width:520px){
      .menu-item{display:none}.hamburger{display:grid}.card{padding:16px}
      .device-time{font-size:11px}
    }
    @media(min-width:521px){
      .hamburger{display:none!important}.mobile-menu-dropdown{display:none!important}
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
      <button id="themeBtn" class="menu-btn theme-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
    </div>
  </header>

  <div class="container">
    <a href="/account/" class="back-link"><i class="fas fa-arrow-left"></i> 返回账号安全中心</a>
    <div class="page-header"><div class="icon">📱</div><h1>登录设备管理</h1></div>

    <div id="loginPrompt" class="card mica" style="text-align:center;padding:40px">
      <p style="color:var(--text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/account/devices/" style="color:var(--accent);font-weight:600;text-decoration:none" id="loginLink" hidden>→ 前往登录</a>
    </div>

    <div id="devicesContent" style="display:none">
      <!-- 统计概览 -->
      <div class="card mica">
        <div class="stats-bar">
          <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">登录设备</div></div>
          <div class="stat-item"><div class="stat-num" id="statBrowser">0</div><div class="stat-label">浏览器数</div></div>
          <div class="stat-item"><div class="stat-num" id="statOS">0</div><div class="stat-label">操作系统</div></div>
          <div class="stat-item"><div class="stat-num" id="statIP">0</div><div class="stat-label">IP 地址</div></div>
        </div>
      </div>

      <!-- 当前设备 -->
      <div class="card mica">
        <h2>💻 当前设备 <span class="badge badge-current">当前</span></h2>
        <div id="currentDevice"></div>
      </div>

      <!-- 历史设备列表 -->
      <div class="card mica">
        <h2>📋 最近 1 年登录过的设备</h2>
        <div id="deviceList">
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    const $=s=>document.querySelector(s);
    let sb,user;
    try{sb=KJ.createSupabase()}catch(e){}

    function parseUA(){const u=navigator.userAgent;let b='Unknown';if(u.includes('Edg/'))b='Edge';else if(u.includes('Chrome/'))b='Chrome';else if(u.includes('Firefox/'))b='Firefox';else if(u.includes('Safari/')&&!u.includes('Chrome/'))b='Safari';let os='Unknown';let osVer='';if(u.includes('Windows NT 10')){os='Windows';osVer='10/11'}else if(u.includes('Windows NT 6')){os='Windows';osVer='7/8'}else if(u.includes('Mac OS X')){os='macOS';const m=u.match(/Mac OS X ([0-9_]+)/);if(m)osVer=m[1].replace(/_/g,'.')}else if(u.includes('Linux')&&!u.includes('Android')){os='Linux'}else if(u.includes('Android')){os='Android';const m=u.match(/Android ([0-9.]+)/);if(m)osVer=m[1]}else if(u.includes('iOS')||u.includes('iPhone')||u.includes('iPad')){os='iOS';const m=u.match(/OS ([0-9_]+)/);if(m)osVer=m[1].replace(/_/g,'.')};const screen='屏幕: '+window.screen.width+'×'+window.screen.height+', '+navigator.language;return{browser:b,os:os,osVer:osVer,screen:screen}}
    
    function deviceIcon(os){
      if(/android/i.test(os))return'<i class="fab fa-android"></i>';
      if(/ios|iphone|ipad/i.test(os))return'<i class="fab fa-apple"></i>';
      if(/mac/i.test(os))return'<i class="fas fa-laptop"></i>';
      if(/windows/i.test(os))return'<i class="fab fa-windows"></i>';
      if(/linux/i.test(os))return'<i class="fab fa-linux"></i>';
      return'<i class="fas fa-globe"></i>';
    }
    function deviceType(os){return/android|ios|iphone|ipad/i.test(os)?'mobile':'desktop'}

    function loadDevices(){
      const currentEl=$('#currentDevice');
      const listEl=$('#deviceList');
      const ua=parseUA();
      const currentKey=ua.browser+'|'+ua.os;

      // 渲染当前设备
      currentEl.innerHTML='<div class="device-item">'+
        '<div class="device-icon '+deviceType(ua.os)+'">'+deviceIcon(ua.os)+'</div>'+
        '<div class="device-info"><div class="device-name">'+KJ.escapeHtml(ua.browser)+' · '+KJ.escapeHtml(ua.os+(ua.osVer?' '+ua.osVer:''))+'</div>'+
        '<div class="device-detail">'+KJ.escapeHtml(ua.screen)+'</div></div>'+
        '<div class="device-time"><span style="color:var(--success);font-weight:500">🟢 在线</span></div></div>';

      // 加载历史记录
      try{
        let history=JSON.parse(localStorage.getItem('kjllin_login_history')||'[]');
        const oneYearAgo=Date.now()-365*24*60*60*1000;

        // 过滤1年内 + 去重(同browser+os保留最新)
        const seen={};const unique=[];
        for(let i=history.length-1;i>=0;i--){
          const r=history[i];
          const t=new Date(r.time).getTime();
          if(t<oneYearAgo)continue;
          const k=(r.browser||'')+'|'+(r.os||'');
          if(!seen[k]){seen[k]=true;unique.push(r)}
        }

        // 去掉当前设备
        const historical=unique.filter(r=>{
          const k=(r.browser||'')+'|'+(r.os||'');
          return k!==currentKey;
        });

        // 统计
        const osSet=new Set();const browserSet=new Set();const ipSet=new Set();
        unique.forEach(r=>{
          browserSet.add(r.browser||'');
          osSet.add(r.os||'');
          if(r.ip)ipSet.add(r.ip);
        });
        $('#statTotal').textContent=unique.length;
        $('#statBrowser').textContent=browserSet.size;
        $('#statOS').textContent=osSet.size;
        $('#statIP').textContent=ipSet.size;

        if(historical.length===0){
          listEl.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>暂无其他设备登录记录<br><span style="font-size:12px">使用更多设备登录后将在此显示</span></p></div>';
          return;
        }

        const lines=historical.map(r=>{
          const d=new Date(r.time);
          const ts=d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
          const daysAgo=Math.floor((Date.now()-d.getTime())/86400000);
          let timeAgo;
          if(daysAgo<1)timeAgo='今天';
          else if(daysAgo<2)timeAgo='昨天';
          else if(daysAgo<7)timeAgo=daysAgo+'天前';
          else if(daysAgo<30)timeAgo=Math.floor(daysAgo/7)+'周前';
          else if(daysAgo<365)timeAgo=Math.floor(daysAgo/30)+'个月前';
          else timeAgo='1年前';
          
          return '<div class="device-item">'+
            '<div class="device-icon '+deviceType(r.os||'')+'">'+deviceIcon(r.os||'')+'</div>'+
            '<div class="device-info"><div class="device-name">'+KJ.escapeHtml(r.browser||'--')+'</div>'+
            '<div class="device-detail">'+KJ.escapeHtml(r.os||'--')+' <span class="sep"></span> '+timeAgo+'</div></div>'+
            '<div class="device-time"><div>'+ts+'</div><div class="ip">'+KJ.escapeHtml(r.ip||'--')+'</div></div></div>';
        });
        listEl.innerHTML=lines.join('');
      }catch(e){
        listEl.innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>加载失败</p></div>';
      }
    }

    async function loadUser(){
      if(!sb)return;
      try{
        const{data:{session}}=await sb.auth.getSession();
        if(!session?.user){showLoginPrompt();return}
        user=session.user;
        $('#loginPrompt').style.display='none';$('#devicesContent').style.display='block';
        loadDevices();
      }catch(e){showLoginPrompt()}
    }

    // Theme
    const themeBtn=$('#themeBtn');
    function updateThemeUI(){
      var state = KJ.applyTheme('#f3f3f3', '#0f0f0f');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    }
    themeBtn.addEventListener('click',function(){
      var state = KJ.toggleTheme();
      KJ.applyTheme('#f3f3f3', '#0f0f0f');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    });
    KJ.onSystemThemeChange(updateThemeUI);
    updateThemeUI();

    // 汉堡菜单
    const hamburgerBtn=$('#hamburgerBtn'),mobileMenu=$('#mobileMenu');
    hamburgerBtn.addEventListener('click',function(e){e.stopPropagation();mobileMenu.classList.toggle('open')});
    document.addEventListener('click',function(e){if(!hamburgerBtn.contains(e.target)&&!mobileMenu.contains(e.target))mobileMenu.classList.remove('open')});

    if(!sb){$('#loginMsg').textContent='网络错误，请刷新后重试';return}

    let authReady = false;
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
        authReady = true;
        if (session?.user) { loadUser(); return; }
        showLoginPrompt();
      } else if (event === 'SIGNED_OUT') {
        authReady = true; showLoginPrompt();
      } else if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
        if (session?.user) loadUser();
      }
    });

    function showLoginPrompt() {
      $('#loginPrompt').style.display = '';
      $('#devicesContent').style.display = 'none';
      $('#loginMsg').textContent = '请登录后管理账号';
      $('#loginLink').hidden = false;
    }

    setTimeout(() => { if (!authReady) loadUser(); }, 3000);
    setTimeout(() => {
      if ($('#loginMsg').textContent === '加载中...') {
        $('#loginMsg').textContent = '加载超时，请检查网络后刷新页面';
        $('#loginLink').hidden = false;
        $('#loginLink').textContent = '→ 刷新页面';
        $('#loginLink').href = 'javascript:location.reload()';
      }
    }, 8000);
    })();
  </script>
</body>
</html>
