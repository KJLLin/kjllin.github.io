<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <title>登录设备 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── 导航栏（使用 theme.css 令牌） ── */
    .top-menu{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .menu-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);box-shadow:var(--glass-shadow);pointer-events:all;background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-nav);-webkit-backdrop-filter:var(--blur-nav)}
    .menu-logo{font-size:18px;font-weight:700;color:var(--color-accent);padding:6px 14px}
    .menu-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--color-text-secondary);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
    .menu-item:hover,.menu-item.active{color:var(--color-accent);background:var(--color-accent-glow)}
    .menu-item.active{font-weight:600}
    .menu-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:16px;cursor:pointer;background:var(--color-bg-hover);color:var(--color-text-primary);display:grid;place-items:center;transition:all var(--transition-fast)}
    .menu-btn:hover{background:var(--color-accent-glow);color:var(--color-accent)}
    #themeBtn{border-radius:50%}
    .hamburger{display:none}
    .mobile-menu-dropdown{display:none;position:fixed;top:58px;top:calc(58px + env(safe-area-inset-top, 0px));left:16px;right:16px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);flex-direction:column;gap:2px;pointer-events:all;z-index:101;background:var(--color-bg-glass-solid);backdrop-filter:var(--blur-surface);-webkit-backdrop-filter:var(--blur-surface);max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow-y:auto}
    .mobile-menu-dropdown.open{display:flex}
    .mobile-menu-dropdown .menu-item{display:block;width:100%;text-align:left}

    /* ── 页面布局 ── */
    .container{max-width:760px;margin:0 auto;padding:80px 16px 40px;position:relative;z-index:1}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-tertiary);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--color-accent)}

    /* ── 页面标题 ── */
    .page-header{text-align:center;margin-bottom:32px;animation:fadeUp 0.6s var(--ease-out) forwards}
    .page-header .icon{font-size:48px;margin-bottom:10px;display:block}
    .page-header h1{font-size:28px;font-weight:700;color:var(--color-text-primary);letter-spacing:-0.3px}
    .page-header .subtitle{font-size:13px;color:var(--color-text-tertiary);margin-top:6px}

    /* ── 统计卡片 ── */
    .stats-card{text-align:center;padding:12px 16px;animation:fadeUp 0.6s var(--ease-out) 0.05s both}
    .stats-bar{display:flex;gap:8px;justify-content:center;padding:8px 0}
    .stat-item{text-align:center;flex:1;max-width:100px}
    .stat-num{font-size:28px;font-weight:700;color:var(--color-accent);line-height:1.1}
    .stat-label{font-size:11px;color:var(--color-text-tertiary);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

    /* ── 标题卡片 ── */
    .section-card{margin-bottom:20px;padding:16px 20px;animation:fadeUp 0.6s var(--ease-out) 0.12s both}
    .section-card h2{font-size:16px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .section-card h2 .count{font-size:12px;font-weight:500;color:var(--color-text-tertiary);margin-left:auto}

    /* ── 当前设备标记 ── */
    .current-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:var(--radius-full);background:var(--color-success-bg);color:var(--color-success);margin-left:auto;flex-shrink:0}

    /* ── 设备列表项 ── */
    .device-item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--color-border);transition:all var(--transition-fast)}
    .device-item:last-child{border-bottom:none}
    .device-item:hover{background:var(--color-bg-hover);border-radius:var(--radius-sm);padding-left:16px;padding-right:16px}
    .device-item:hover:first-child{padding-top:21px}
    .device-item:hover:last-child{padding-bottom:21px}
    .device-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:20px;flex-shrink:0;transition:all var(--transition-fast)}
    .device-icon.desktop{background:var(--color-accent-glow);color:var(--color-accent)}
    .device-icon.mobile{background:var(--color-success-bg);color:var(--color-success)}
    .device-item:hover .device-icon.desktop{background:rgba(0,120,212,0.18)}
    .device-item:hover .device-icon.mobile{background:rgba(52,199,89,0.18)}
    .device-info{flex:1;min-width:0}
    .device-info .name{font-size:14px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:6px}
    .device-info .detail{font-size:12px;color:var(--color-text-tertiary);margin-top:3px;display:flex;align-items:center;gap:8px}
    .device-info .detail .dot{width:3px;height:3px;border-radius:50%;background:var(--color-text-tertiary);display:inline-block}
    .device-time{font-size:12px;color:var(--color-text-tertiary);text-align:right;flex-shrink:0;line-height:1.4}
    .device-time .ip{font-size:11px;font-family:var(--font-mono);color:var(--color-text-tertiary)}
    .cloud-badge{font-size:10px;color:var(--color-accent);font-weight:500}

    /* ── 空状态 ── */
    .empty-state{text-align:center;padding:40px 16px;color:var(--color-text-tertiary)}
    .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:0.5}
    .empty-state p{font-size:14px;line-height:1.7}

    /* ── 加载动画 ── */
    .skeleton{background:linear-gradient(90deg,var(--color-bg-hover) 25%,var(--color-bg-active) 50%,var(--color-bg-hover) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--radius-sm)}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    @media(max-width:520px){
      .menu-item{display:none}.hamburger{display:grid}
      .container{padding:72px 12px calc(28px + env(safe-area-inset-bottom, 0px))}
      .page-header h1{font-size:22px}.page-header .icon{font-size:40px}
      .page-header .subtitle{font-size:12px}
      .stats-bar{gap:4px;flex-wrap:wrap}
      .stat-item{max-width:72px;flex:1 1 60px}
      .stat-num{font-size:22px}.stat-label{font-size:10px}
      .device-item{padding:12px 0;gap:10px;flex-wrap:wrap}
      .device-icon{width:36px;height:36px;font-size:16px}
      .device-item:hover{margin-left:0;margin-right:0;padding-left:8px;padding-right:8px}
      .device-item:first-child:hover{margin-top:0;padding-top:12px}
      .device-item:last-child:hover{margin-bottom:0;padding-bottom:12px}
      .device-info{flex:1 1 60%}.device-info .name{font-size:13px}
      .device-info .detail{font-size:11px;flex-wrap:wrap;gap:4px}
      .device-time{font-size:11px;flex:1 1 auto;text-align:left;margin-top:4px;width:100%}
      .card-glass{padding:16px 14px !important}
    }
    @media(min-width:521px){.hamburger{display:none!important}.mobile-menu-dropdown{display:none!important}}
  </style>
</head>
<body>
  <div style="position:fixed;inset:0;background:var(--color-bg);z-index:-3;pointer-events:none"></div>
  <header class="top-menu">
    <nav class="menu-bar" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
    </div>
  </header>

  <div class="container">
    <a href="/account/" class="back-link"><i class="fas fa-arrow-left"></i> 返回账号安全中心</a>
    <div class="page-header"><span class="icon">📱</span><h1>登录设备管理</h1><p class="subtitle">查看和管理最近 1 年内登录过的所有设备</p></div>

    <div id="loginPrompt" class="card" style="text-align:center;padding:48px 24px">
      <p style="color:var(--color-text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/account/devices/" class="btn btn-primary" style="text-decoration:none" id="loginLink" hidden>前往登录</a>
    </div>

    <div id="devicesContent" style="display:none">
      <!-- 统计 -->
      <div class="card card-glass stats-card">
        <div class="stats-bar">
          <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">登录设备</div></div>
          <div class="stat-item"><div class="stat-num" id="statBrowser">0</div><div class="stat-label">浏览器</div></div>
          <div class="stat-item"><div class="stat-num" id="statOS">0</div><div class="stat-label">操作系统</div></div>
          <div class="stat-item"><div class="stat-num" id="statIP">0</div><div class="stat-label">IP 地址</div></div>
        </div>
      </div>

      <!-- 当前设备 -->
      <div class="card card-glass section-card">
        <h2>💻 当前设备 <span class="current-badge">当前</span></h2>
        <div id="currentDevice" style="min-height:52px"></div>
      </div>

      <!-- 历史设备 -->
      <div class="card card-glass section-card" style="animation-delay:0.18s">
        <h2>📋 最近 1 年登录过的设备 <span class="count" id="historyCount"></span></h2>
        <div id="deviceList"></div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s);};
    var sb,user;
    try{sb=KJ.createSupabase();}catch(e){}

    function deviceIcon(os){
      if(/android/i.test(os))return'<i class="fab fa-android"></i>';
      if(/ios|iphone|ipad/i.test(os))return'<i class="fab fa-apple"></i>';
      if(/mac/i.test(os))return'<i class="fas fa-laptop"></i>';
      if(/windows/i.test(os))return'<i class="fab fa-windows"></i>';
      if(/linux/i.test(os))return'<i class="fab fa-linux"></i>';
      return'<i class="fas fa-desktop"></i>';
    }
    function deviceType(os){return/android|ios|iphone|ipad/i.test(os)?'mobile':'desktop';}

    // 数字跳动动画
    function animateCount(el,target){
      if(!el)return;
      var current=parseInt(el.textContent)||0;
      if(current===target)return;
      var step=Math.max(1,Math.ceil(Math.abs(target-current)/20));
      var timer=setInterval(function(){
        current+=current<target?step:-step;
        if((step>0&&current>=target)||(step<0&&current<=target)){current=target;clearInterval(timer);}
        el.textContent=current;
      },30);
    }

    function formatTimeAgo(d){
      var days=Math.floor((Date.now()-d.getTime())/86400000);
      if(days<1)return'今天';
      if(days<2)return'昨天';
      if(days<7)return days+'天前';
      if(days<30)return Math.floor(days/7)+'周前';
      if(days<365)return Math.floor(days/30)+'个月前';
      return '1年前';
    }

    async function loadDevices(){
      var currentEl=$('#currentDevice');
      var listEl=$('#deviceList');
      var ua=KJ.parseUA();
      var currentKey=ua.browser+'|'+ua.os;

      // 渲染当前设备
      currentEl.innerHTML='<div class="device-item">'+
        '<div class="device-icon '+deviceType(ua.os)+'">'+deviceIcon(ua.os)+'</div>'+
        '<div class="device-info"><div class="name">'+KJ.escapeHtml(ua.browser)+' · '+KJ.escapeHtml(ua.os+(ua.osVer?' '+ua.osVer:''))+'</div>'+
        '<div class="detail">'+KJ.escapeHtml(ua.screen)+'</div></div>'+
        '<div class="device-time"><span style="color:var(--color-success);font-weight:500">🟢 在线</span></div></div>';

      // 3. 合并 Supabase + localStorage 数据
      var allRecords=[];
      var oneYearAgo=Date.now()-365*86400000;

      // 3a. 从 Supabase 读取
      if(sb&&user){
        try{
          var r1=await sb.from('login_devices')
            .select('*').eq('user_id',user.id)
            .order('logged_in_at',{ascending:false}).limit(50);
          if(!r1.error&&r1.data){
            for(var j=0;j<r1.data.length;j++){
              var rd=r1.data[j];
              allRecords.push({browser:rd.browser,os:rd.os,ip:rd.ip,time:rd.logged_in_at||rd.created_at,source:'cloud'});
            }
          }
        }catch(e){console.warn('Supabase device read:',e)}
      }

      // 3b. 从 localStorage 补充（去重）
      try{
        var history=JSON.parse(localStorage.getItem('kjllin_login_history')||'[]');
        var seenMap={};
        for(var k=0;k<allRecords.length;k++){var rr=allRecords[k];seenMap[rr.browser+'|'+rr.os+'|'+rr.time]=true;}
        for(var m=history.length-1;m>=0;m--){
          var hr=history[m];
          var ht=new Date(hr.time).getTime();
          if(ht<oneYearAgo)continue;
          var hk=hr.browser+'|'+hr.os+'|'+hr.time;
          if(!seenMap[hk]){seenMap[hk]=true;allRecords.push({browser:hr.browser,os:hr.os,ip:hr.ip,time:hr.time,source:'local'});}
        }
      }catch(e){}

      // 3c. 去重（browser+os 保留最新）+ 过滤 1 年外
      var dedup={};var unique=[];
      for(var n=0;n<allRecords.length;n++){
        var ar=allRecords[n];
        var at=new Date(ar.time).getTime();
        if(at<oneYearAgo)continue;
        var ak=(ar.browser||'')+'|'+(ar.os||'');
        if(!dedup[ak]||new Date(ar.time)>new Date(dedup[ak].time))dedup[ak]=ar;
      }
      for(var dk in dedup)unique.push(dedup[dk]);
      unique.sort(function(a,b){return new Date(b.time)-new Date(a.time);});

      // 3d. 去掉当前设备
      var historical=unique.filter(function(r){
        return (r.browser||'')+'|'+(r.os||'')!==currentKey;
      });

      // 统计
      var osSet={};var brSet={};var ipSet={};
      for(var p=0;p<unique.length;p++){var ur=unique[p];brSet[ur.browser||'']=true;osSet[ur.os||'']=true;if(ur.ip)ipSet[ur.ip]=true;}
      var total=unique.length,brCount=Object.keys(brSet).length,osCount=Object.keys(osSet).length,ipCount=Object.keys(ipSet).length;
      animateCount($('#statTotal'),total);
      animateCount($('#statBrowser'),brCount);
      animateCount($('#statOS'),osCount);
      animateCount($('#statIP'),ipCount);
      $('#historyCount').textContent=historical.length+' 台';

      if(historical.length===0){
        listEl.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>暂无其他设备登录记录</p><p style="font-size:12px;margin-top:4px">使用更多设备登录后将在此显示</p></div>';
        return;
      }

      var lines=[];
      for(var q=0;q<historical.length;q++){
        var dv=historical[q];
        var d=new Date(dv.time);
        var ts=d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
        var timeAgo=formatTimeAgo(d);
        var dt=deviceType(dv.os||'');
        lines.push(
          '<div class="device-item" style="animation:fadeUp 0.4s var(--ease-out) '+(0.05+q*0.03).toFixed(2)+'s both">'+
          '<div class="device-icon '+dt+'">'+deviceIcon(dv.os||'')+'</div>'+
          '<div class="device-info"><div class="name">'+KJ.escapeHtml(dv.browser||'--')+'</div>'+
          '<div class="detail">'+KJ.escapeHtml(dv.os||'--')+' <span class="dot"></span> '+timeAgo+
          (dv.source==='cloud'?' <span class="cloud-badge">☁️</span>':'')+'</div></div>'+
          '<div class="device-time"><div>'+ts+'</div><div class="ip">'+KJ.escapeHtml(dv.ip||'--')+'</div></div></div>'
        );
      }
      listEl.innerHTML=lines.join('');
    }

    async function loadUser(){
      if(!sb)return;
      try{
        var r=await sb.auth.getSession();
        if(!r.data.session||!r.data.session.user){showLoginPrompt();return}
        user=r.data.session.user;
        $('#loginPrompt').style.display='none';$('#devicesContent').style.display='block';
        loadDevices();
      }catch(e){showLoginPrompt()}
    }

    function showLoginPrompt(){
      $('#loginPrompt').style.display='';$('#devicesContent').style.display='none';
      $('#loginMsg').textContent='请登录后管理账号';
      $('#loginLink').hidden=false;
    }

    // 主题
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    // 移动端菜单
    var hb=$('#hamburgerBtn'),mm=$('#mobileMenu');
    hb.addEventListener('click',function(e){e.stopPropagation();mm.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!hb.contains(e.target)&&!mm.contains(e.target))mm.classList.remove('open');});

    if(!sb){$('#loginMsg').textContent='网络错误，请刷新后重试';return}

    var authReady=false;
    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){authReady=true;if(session&&session.user){loadUser();return}showLoginPrompt();}
      else if(event==='SIGNED_OUT'){authReady=true;showLoginPrompt();}
      else if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session&&session.user)loadUser();}
    });

    setTimeout(function(){if(!authReady)loadUser();},3000);
    setTimeout(function(){
      if($('#loginMsg').textContent==='加载中...'){$('#loginMsg').textContent='加载超时，请检查网络后刷新页面';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}
    },8000);
    })();
  </script>
</body>
</html>
