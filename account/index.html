<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>账号安全 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html {
      --win-ease: cubic-bezier(0.4,0,0.2,1); --bounce: cubic-bezier(0.34,1.56,0.64,1);
      --transition-fast: 200ms var(--win-ease); --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      transition: background-color var(--transition-normal);
    }
    * { margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased; }
    :focus:not(:focus-visible) { outline: none; }
    :root {
      --bg-body:#f3f3f3;--bg-mica:rgba(255,255,255,0.85);--bg-mica-hover:rgba(255,255,255,0.95);
      --border-mica:rgba(0,0,0,0.06);--text-primary:#1a1a1a;--text-secondary:#5e5e5e;--text-tertiary:#8e8e8e;
      --accent:#0078d4;--accent-light:#0099ff;--accent-glow:rgba(0,120,212,0.1);--danger:#e74c3c;
      --success:#34c88a;--warning:#f0ad4e;
      --shadow-rest:0 2px 8px rgba(0,0,0,0.06);--shadow-hover:0 4px 16px rgba(0,0,0,0.09);
    }
    [data-theme="dark"]:root {
      --bg-body:#0f0f0f;--bg-mica:rgba(20,20,20,0.85);--bg-mica-hover:rgba(26,26,26,0.95);
      --border-mica:rgba(255,255,255,0.07);--text-primary:#f0f0f0;--text-secondary:#a0a0a0;--text-tertiary:#707070;
      --accent-glow:rgba(0,120,212,0.15);--shadow-rest:0 2px 8px rgba(0,0,0,0.25);--shadow-hover:0 4px 16px rgba(0,0,0,0.35);
    }
    html,body{width:100%;min-height:100vh;overflow-x:hidden}
    body{background:var(--bg-body);color:var(--text-primary)}
    .bg-base{position:fixed;inset:0;background:var(--bg-body);z-index:-3;pointer-events:none}
    .mica{background:var(--bg-mica);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--border-mica)}

    /* 导航栏 */
    .top-menu{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .menu-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:var(--radius-md);box-shadow:var(--shadow-rest);pointer-events:all}
    .menu-logo{font-size:18px;font-weight:700;color:var(--accent);padding:6px 14px}
    .menu-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
    .menu-item:hover,.menu-item.active{color:var(--accent);background:var(--accent-glow)}
    .menu-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:16px;cursor:pointer;background:rgba(220,220,220,0.4);color:var(--text-primary);display:grid;place-items:center}
    [data-theme="dark"] .menu-btn{background:rgba(40,40,40,0.4)}
    .menu-btn:hover{background:var(--accent-glow);color:var(--accent)}
    .theme-btn,#themeBtn{border-radius:50%}
    .hamburger{display:none}
    .mobile-menu-dropdown{display:none;position:absolute;top:calc(100%+8px);left:16px;right:16px;padding:8px;border-radius:var(--radius-md);box-shadow:var(--shadow-hover);flex-direction:column;gap:2px;pointer-events:all;z-index:101}
    .mobile-menu-dropdown.open{display:flex}
    .mobile-menu-dropdown .menu-item{display:block;width:100%;text-align:left}

    .container{max-width:720px;margin:0 auto;padding:80px 16px 40px}

    /* 页面标题 */
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.5s var(--win-ease)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .page-header .icon{font-size:44px;margin-bottom:6px}
    .page-header h1{font-size:24px;font-weight:700;color:var(--accent)}

    /* 通用卡片 */
    .card{padding:22px 24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-rest);margin-bottom:16px;transition:box-shadow var(--transition-fast)}
    .card:hover{box-shadow:var(--shadow-hover)}
    .card:nth-child(1){animation:fadeUp 0.5s var(--win-ease) 0.05s both}
    .card:nth-child(2){animation:fadeUp 0.5s var(--win-ease) 0.1s both}
    .card:nth-child(3){animation:fadeUp 0.5s var(--win-ease) 0.15s both}
    .card:nth-child(4){animation:fadeUp 0.5s var(--win-ease) 0.2s both}
    .card:nth-child(5){animation:fadeUp 0.5s var(--win-ease) 0.25s both}
    .card:nth-child(6){animation:fadeUp 0.5s var(--win-ease) 0.3s both}
    .card h2{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .card h2 .card-action{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;margin-left:auto;display:flex;align-items:center;gap:4px}
    .card h2 .card-action:hover{color:var(--accent-light)}

    .info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-mica);font-size:14px}
    .info-row:last-child{border-bottom:none}
    .info-row .label{color:var(--text-secondary)}
    .info-row .value{font-family:"Consolas","Cascadia Code",monospace;font-size:13px;color:var(--text-primary)}

    /* 安全状态指示器 */
    .security-status{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:8px}
    .security-status.good{background:rgba(52,200,138,0.08);color:var(--success)}
    .security-status.warn{background:rgba(240,173,78,0.08);color:var(--warning)}
    .security-status.danger{background:rgba(231,76,60,0.08);color:var(--danger)}
    .security-status .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .security-status.good .dot{background:var(--success)}
    .security-status.warn .dot{background:var(--warning)}
    .security-status.danger .dot{background:var(--danger)}

    /* 按钮 */
    .btn{padding:10px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all var(--transition-fast);display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:var(--accent);color:#fff;text-decoration:none}.btn-primary:hover{background:var(--accent-light)}
    .btn-outline{background:transparent;border:1px solid var(--border-mica);color:var(--text-secondary);text-decoration:none}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
    .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}.btn-danger:hover{background:rgba(231,76,60,0.08)}
    .btn-sm{padding:6px 14px;font-size:13px;border-radius:var(--radius-sm)}

    /* 个人资料头部 */
    .profile-header{display:flex;align-items:center;gap:16px}
    .avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;flex-shrink:0}
    .profile-text{flex:1}
    .profile-text .name{font-size:20px;font-weight:600}
    .profile-text .email{font-size:13px;color:var(--text-tertiary);font-family:"Consolas","Cascadia Code",monospace;margin-top:2px}

    /* 双列安全网格 */
    .security-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .security-item{text-align:center;padding:14px 12px;border-radius:var(--radius-sm);background:rgba(0,0,0,0.02)}
    [data-theme="dark"] .security-item{background:rgba(255,255,255,0.03)}
    .security-item .si-icon{font-size:24px;margin-bottom:6px}
    .security-item .si-label{font-size:12px;color:var(--text-tertiary);margin-bottom:2px}
    .security-item .si-value{font-size:14px;font-weight:600;color:var(--text-primary)}

    /* 危险区域 */
    .danger-zone{border:1px dashed rgba(231,76,60,0.3);border-radius:var(--radius-lg);padding:20px 24px;text-align:center}
    .danger-zone h3{font-size:15px;color:var(--danger);margin-bottom:6px}
    .danger-zone p{font-size:12px;color:var(--text-tertiary);margin-bottom:12px}

    /* Toast */
    .kj-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:20px;font-size:14px;z-index:300;background:var(--text-primary);color:var(--bg-body);box-shadow:0 4px 16px rgba(0,0,0,0.15);animation:kjToastIn .3s cubic-bezier(.34,1.56,.64,1)}
    @keyframes kjToastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}}

    @media(max-width:520px){
      .menu-item{display:none}.hamburger{display:grid}
      .card{padding:16px}.profile-header{flex-direction:column;text-align:center}
      .security-grid{grid-template-columns:1fr 1fr;gap:8px}
    }
    @media(min-width:521px){
      .hamburger{display:none!important}.mobile-menu-dropdown{display:none!important}
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
      <button id="themeBtn" class="menu-btn theme-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
    </div>
  </header>

  <div class="container">
    <div class="page-header"><div class="icon">🔒</div><h1>账号安全中心</h1></div>

    <!-- 登录提示 -->
    <div id="loginPrompt" class="card mica" style="text-align:center;padding:40px">
      <p style="color:var(--text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/account/" style="color:var(--accent);font-weight:600;text-decoration:none" id="loginLink" hidden>→ 前往登录</a>
    </div>

    <!-- 主内容区 -->
    <div id="accountContent" style="display:none">

      <!-- 个人资料卡片 -->
      <div class="card mica">
        <h2>👤 个人资料
          <a href="/account/profile/" class="card-action">编辑 <i class="fas fa-chevron-right"></i></a>
        </h2>
        <div class="profile-header">
          <div class="avatar" id="profileAvatar">U</div>
          <div class="profile-text">
            <div class="name" id="profileName">--</div>
            <div class="email" id="profileEmail">--</div>
          </div>
        </div>
      </div>

      <!-- 安全概览卡片 -->
      <div class="card mica">
        <h2>🛡️ 安全概览
          <a href="/account/password/" class="card-action">修改密码 <i class="fas fa-chevron-right"></i></a>
        </h2>
        <div class="security-grid">
          <div class="security-item">
            <div class="si-icon">🔑</div>
            <div class="si-label">密码强度</div>
            <div class="si-value" id="pwdStrength">检测中</div>
          </div>
          <div class="security-item">
            <div class="si-icon">📧</div>
            <div class="si-label">绑定邮箱</div>
            <div class="si-value" id="emailStatus">已验证</div>
          </div>
          <div class="security-item">
            <div class="si-icon">🔐</div>
            <div class="si-label">两步验证</div>
            <div class="si-value" style="color:var(--text-tertiary)">未开启</div>
          </div>
          <div class="security-item">
            <div class="si-icon">📱</div>
            <div class="si-label">绑定设备</div>
            <div class="si-value" id="deviceCount">--</div>
          </div>
        </div>
      </div>

      <!-- 登录信息卡片 -->
      <div class="card mica">
        <h2>📊 账号信息</h2>
        <div class="info-row"><span class="label">用户 ID</span><span class="value" id="infoUserId">--</span></div>
        <div class="info-row"><span class="label">注册时间</span><span class="value" id="infoCreated">--</span></div>
        <div class="info-row"><span class="label">最近登录</span><span class="value" id="infoLastLogin">--</span></div>
        <div class="info-row"><span class="label">账号状态</span><span class="value" id="infoStatus" style="color:var(--success)">正常</span></div>
      </div>

      <!-- 设备信息卡片 -->
      <div class="card mica">
        <h2>💻 当前设备</h2>
        <div class="info-row"><span class="label">浏览器</span><span class="value" id="deviceCurrent">检测中...</span></div>
        <div class="info-row"><span class="label">操作系统</span><span class="value" id="deviceOS">--</span></div>
        <div class="info-row"><span class="label">屏幕 / 语言</span><span class="value" id="deviceScreen">--</span></div>
        <div class="info-row"><span class="label">IP 地址</span><span class="value" id="deviceIP">获取中...</span></div>
        <div class="info-row"><span class="label">连接状态</span><span class="value" id="deviceOnline" style="color:var(--success)">🟢 在线</span></div>
      </div>

      <!-- 最近登录记录 -->
      <div class="card mica">
        <h2>🕐 最近登录</h2>
        <div id="loginHistory" style="color:var(--text-tertiary);font-size:13px">加载中...</div>
      </div>

      <!-- 危险区域 -->
      <div class="danger-zone">
        <h3><i class="fas fa-exclamation-triangle"></i> 危险区域</h3>
        <p>退出登录后需要重新输入密码才能访问账号相关功能</p>
        <button class="btn btn-danger" id="logoutBtn">退出登录</button>
      </div>

    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    const $=s=>document.querySelector(s);
    let sb,user;
    try{sb=KJ.createSupabase()}catch(e){}

    function formatDate(iso){if(!iso)return'--';const d=new Date(iso);return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
    function parseUA(){const u=navigator.userAgent;let b='Unknown';if(u.includes('Edg/'))b='Edge';else if(u.includes('Chrome/'))b='Chrome';else if(u.includes('Firefox/'))b='Firefox';else if(u.includes('Safari/')&&!u.includes('Chrome/'))b='Safari';let os='Unknown';let osVer='';if(u.includes('Windows NT 10')){os='Windows';osVer='10/11'}else if(u.includes('Windows NT 6')){os='Windows';osVer='7/8'}else if(u.includes('Mac OS X')){os='macOS';const m=u.match(/Mac OS X ([0-9_]+)/);if(m)osVer=m[1].replace(/_/g,'.')}else if(u.includes('Linux')&&!u.includes('Android')){os='Linux'}else if(u.includes('Android')){os='Android';const m=u.match(/Android ([0-9.]+)/);if(m)osVer=m[1]}else if(u.includes('iOS')||u.includes('iPhone')||u.includes('iPad')){os='iOS';const m=u.match(/OS ([0-9_]+)/);if(m)osVer=m[1].replace(/_/g,'.')};const screen='屏幕: '+window.screen.width+'×'+window.screen.height+', '+navigator.language;return{browser:b,os:os,osVer:osVer,screen:screen}}
    async function loadIP(){const apis=['https://api.ipify.org?format=json','https://api.ip.sb/ip','https://httpbin.org/ip'];for(const url of apis){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);const r=await fetch(url,{signal:c.signal});clearTimeout(t);const d=await r.json();const ip=d.ip||d.origin||'';if(ip&&!ip.includes('<'))return ip.replace(/^https?:\/\//,'')}catch(e){}}return'获取失败'}
    function deviceKey(ua){return ua.browser+'|'+ua.os}

    function saveLoginRecord(ip){
      const ua=parseUA();
      const record={browser:ua.browser+' '+(ua.osVer||''),os:ua.os,time:new Date().toISOString(),ip:ip};
      try{
        let history=JSON.parse(localStorage.getItem('kjllin_login_history')||'[]');
        history.push(record);
        if(history.length>10)history=history.slice(-10);
        localStorage.setItem('kjllin_login_history',JSON.stringify(history));
      }catch(e){}
    }

    function renderLoginHistory(){
      const el=$('#loginHistory');if(!el)return;
      try{
        let history=JSON.parse(localStorage.getItem('kjllin_login_history')||'[]');
        if(!history.length){el.innerHTML='<div class="info-row"><span class="label">暂无记录</span></div>';return}
        const seen={};const unique=[];
        for(let i=history.length-1;i>=0;i--){
          const r=history[i];const k=deviceKey({browser:r.browser,os:r.os});
          if(!seen[k]){seen[k]=true;unique.push(r)}
        }
        if(unique.length>3)unique.length=3;
        const lines=unique.map(r=>{
          const d=new Date(r.time);
          const ts=d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
          return '<div class="info-row"><span class="label">'+KJ.escapeHtml(r.os)+' · '+KJ.escapeHtml(r.browser)+'</span><span class="value" style="font-size:11px">'+ts+'<br>'+KJ.escapeHtml(r.ip||'--')+'</span></div>';
        });
        el.innerHTML=lines.join('');
        // 更新设备数量
        const countEl=$('#deviceCount');
        if(countEl)countEl.textContent=unique.length+' 台';
      }catch(e){el.innerHTML='加载失败'}
    }

    async function loadUser(){
      if(!sb)return;
      try{
        const{data:{session}}=await sb.auth.getSession();
        if(!session?.user){showLoginPrompt();return}
        user=session.user;
        $('#loginPrompt').style.display='none';$('#accountContent').style.display='block';
        const nick=user.user_metadata?.nick||user.email?.split('@')[0]||'用户';
        $('#profileAvatar').textContent=nick.charAt(0).toUpperCase();
        $('#profileName').textContent=nick;
        $('#profileEmail').textContent=user.email;
        $('#emailStatus').textContent=user.email_confirmed_at?'已验证':'待验证';
        if(!user.email_confirmed_at) $('#emailStatus').style.color='var(--warning)';
        $('#infoUserId').textContent=user.id.substring(0,12)+'...';
        $('#infoCreated').textContent=formatDate(user.created_at);
        try{
          const{data}=await sb.from('users').select('last_login_time,status').eq('id',user.id).limit(1);
          if(data?.length){
            $('#infoLastLogin').textContent=formatDate(data[0].last_login_time);
            $('#infoStatus').textContent=data[0].status==='active'?'正常':'待审核';
          }
        }catch(e){}
        const ua=parseUA();
        $('#deviceCurrent').textContent=ua.browser;
        $('#deviceOS').textContent=ua.os+(ua.osVer?' '+ua.osVer:'');
        $('#deviceScreen').textContent=ua.screen;
        loadIP().then(ip=>{
          $('#deviceIP').textContent=ip;
          saveLoginRecord(ip);
          renderLoginHistory();
        });
        renderLoginHistory();
        // 密码强度检测（基于注册时间推算）
        const daysSinceCreated=Math.floor((Date.now()-new Date(user.created_at).getTime())/86400000);
        const el=$('#pwdStrength');
        if(daysSinceCreated>90){el.textContent='建议修改';el.style.color='var(--warning)'}
        else{el.textContent='正常';el.style.color='var(--success)'}
      }catch(e){
        console.error('loadUser failed:',e);
        showLoginPrompt();
      }
    }

    $('#logoutBtn').addEventListener('click',async()=>{
      if(!confirm('确定退出登录？'))return;
      if(!sb){window.location.href='/';return}
      try{await sb.auth.signOut()}catch(e){console.warn('Sign out error:',e)}
      window.location.href='/';
    });

    // Theme
    const themeBtn=$('#themeBtn');
    function updateThemeUI(){
      var state = KJ.applyTheme('#f3f3f3', '#0f0f0f');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    }
    themeBtn.addEventListener('click',function(){
      var state = KJ.toggleTheme();
      KJ.applyTheme('#f3f3f3', '#0f0f0f');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    });
    KJ.onSystemThemeChange(updateThemeUI);
    updateThemeUI();

    // 移动端汉堡菜单
    const hamburgerBtn=$('#hamburgerBtn'),mobileMenu=$('#mobileMenu');
    hamburgerBtn.addEventListener('click',function(e){e.stopPropagation();mobileMenu.classList.toggle('open')});
    document.addEventListener('click',function(e){if(!hamburgerBtn.contains(e.target)&&!mobileMenu.contains(e.target))mobileMenu.classList.remove('open')});

    if(!sb){
      $('#loginMsg').textContent='网络错误，请刷新后重试';
      return;
    }

    let authReady = false;
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
        authReady = true;
        if (session?.user) { loadUser(); return; }
        showLoginPrompt();
      } else if (event === 'SIGNED_OUT') {
        authReady = true;
        showLoginPrompt();
      } else if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
        if (session?.user) loadUser();
      }
    });

    function showLoginPrompt() {
      $('#loginPrompt').style.display = '';
      $('#accountContent').style.display = 'none';
      $('#loginMsg').textContent = '请登录后管理账号';
      $('#loginLink').hidden = false;
    }

    setTimeout(() => { if (!authReady) loadUser(); }, 3000);
    setTimeout(() => {
      if ($('#loginMsg').textContent === '加载中...') {
        $('#loginMsg').textContent = '加载超时，请检查网络后刷新页面';
        $('#loginLink').hidden = false;
        $('#loginLink').textContent = '→ 刷新页面';
        $('#loginLink').href = 'javascript:location.reload()';
      }
    }, 8000);
    })();
  </script>
</body>
</html>
