<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <title>编辑资料 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .top-menu{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .menu-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);box-shadow:var(--glass-shadow);pointer-events:all;background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-nav);-webkit-backdrop-filter:var(--blur-nav)}
    .menu-logo{font-size:18px;font-weight:700;color:var(--color-accent);padding:6px 14px}
    .menu-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--color-text-secondary);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
    .menu-item:hover,.menu-item.active{color:var(--color-accent);background:var(--color-accent-glow)}.menu-item.active{font-weight:600}
    .menu-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:16px;cursor:pointer;background:var(--color-bg-hover);color:var(--color-text-primary);display:grid;place-items:center;transition:all var(--transition-fast)}
    .menu-btn:hover{background:var(--color-accent-glow);color:var(--color-accent)}#themeBtn{border-radius:50%}
    .hamburger{display:none}
    .mobile-menu-dropdown{display:none;position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:16px;right:16px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);flex-direction:column;gap:2px;pointer-events:all;z-index:101;background:var(--color-bg-glass-solid);backdrop-filter:var(--blur-surface);-webkit-backdrop-filter:var(--blur-surface);max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow-y:auto}
    .mobile-menu-dropdown.open{display:flex}
    .mobile-menu-dropdown .menu-item{display:block;width:100%;text-align:left}

    .container{max-width:520px;margin:0 auto;padding:80px 16px 40px}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-tertiary);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--color-accent)}
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.6s var(--ease-out) forwards}
    .page-header .icon{font-size:44px;margin-bottom:8px;display:block}
    .page-header h1{font-size:24px;font-weight:700;color:var(--color-text-primary)}

    .card-glass-form{padding:32px 28px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);box-shadow:var(--glass-shadow);animation:fadeUp 0.6s var(--ease-out) 0.08s both;margin-bottom:16px}
    .card-glass-form h2{font-size:17px;font-weight:600;color:var(--color-text-primary);margin-bottom:24px;display:flex;align-items:center;gap:8px}

    .avatar-section{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
    .avatar-large{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-light));color:var(--color-text-on-accent);display:grid;place-items:center;font-size:34px;font-weight:700;margin-bottom:8px;box-shadow:0 6px 20px var(--color-accent-glow)}
    .avatar-hint{font-size:12px;color:var(--color-text-tertiary)}

    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px}
    .form-group input{width:100%;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-bg-input);color:var(--color-text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition:all var(--transition-fast)}
    .form-group input:focus{border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-glow)}
    .form-group input:disabled{opacity:0.6;cursor:not-allowed}
    .form-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:5px}

    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:14px}
    .info-row:last-child{border-bottom:none}
    .info-row .label{color:var(--color-text-secondary)}
    .info-row .value{font-family:var(--font-mono);font-size:13px;color:var(--color-text-primary)}

    .btn-save{width:100%;padding:11px 24px;border:none;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition-fast);display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn-save:hover:not(:disabled){background:var(--color-accent-hover)}
    .btn-save:disabled{opacity:0.5;cursor:not-allowed}

    @media(max-width:520px){.menu-item{display:none}.hamburger{display:grid}.card-glass-form{padding:24px 20px}.container{padding:72px 12px calc(28px + env(safe-area-inset-bottom, 0px))}.page-header h1{font-size:20px}.page-header .icon{font-size:36px}.avatar-large{width:64px;height:64px;font-size:28px}.info-row .value{font-size:11px;word-break:break-all}}
    @media(min-width:521px){.hamburger{display:none!important}.mobile-menu-dropdown{display:none!important}}
  </style>
</head>
<body>
  <div style="position:fixed;inset:0;background:var(--color-bg);z-index:-3;pointer-events:none"></div>
  <header class="top-menu">
    <nav class="menu-bar"><span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/account/" class="menu-item active"><i class="fas fa-shield-halved"></i> 账号</a>
    </div>
  </header>

  <div class="container">
    <a href="/account/" class="back-link"><i class="fas fa-arrow-left"></i> 返回账号安全中心</a>
    <div class="page-header"><span class="icon">👤</span><h1>编辑个人资料</h1></div>

    <div id="loginPrompt" class="card-glass-form" style="text-align:center;padding:48px 24px">
      <p style="color:var(--color-text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/account/profile/" class="btn-save" style="text-decoration:none;width:auto;display:inline-flex" id="loginLink" hidden>前往登录</a>
    </div>

    <div id="profileContent" style="display:none">
      <div class="card-glass-form">
        <h2><i class="fas fa-user-edit"></i> 个人资料</h2>
        <div class="avatar-section"><div class="avatar-large" id="profileAvatarLarge">U</div><div class="avatar-hint">头像取自昵称首字母</div></div>
        <div class="form-group"><label>昵称</label><input type="text" id="nickInput" placeholder="设置你的昵称" maxlength="20"><div class="form-hint">1-20 个字符，支持中英文和数字</div></div>
        <div class="form-group"><label>邮箱</label><input type="email" id="emailShow" disabled><div class="form-hint">邮箱不可修改，如需更换请联系管理员</div></div>
        <button class="btn-save" id="saveBtn"><i class="fas fa-save"></i> 保存修改</button>
      </div>

      <div class="card-glass-form">
        <h2>📋 账号信息</h2>
        <div class="info-row"><span class="label">用户 ID</span><span class="value" id="infoUserId">--</span></div>
        <div class="info-row"><span class="label">注册时间</span><span class="value" id="infoCreated">--</span></div>
        <div class="info-row"><span class="label">邮箱验证</span><span class="value" id="infoVerified">--</span></div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s);};
    var sb,user;
    try{sb=KJ.createSupabase();}catch(e){}

    function fmtDate(iso){if(!iso)return'--';var d=new Date(iso);return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}

    async function loadUser(){
      if(!sb)return;
      try{
        var r=await sb.auth.getSession();
        if(!r.data.session||!r.data.session.user){showLoginPrompt();return}
        user=r.data.session.user;
        $('#loginPrompt').style.display='none';$('#profileContent').style.display='block';
        var nick=user.user_metadata&&user.user_metadata.nick||(user.email||'').split('@')[0]||'用户';
        $('#profileAvatarLarge').textContent=nick.charAt(0).toUpperCase();
        $('#nickInput').value=nick;
        $('#emailShow').value=user.email||'';
        $('#infoUserId').textContent=user.id.substring(0,12)+'...';
        $('#infoCreated').textContent=fmtDate(user.created_at);
        if(user.email_confirmed_at){$('#infoVerified').textContent='已验证 ✅';$('#infoVerified').style.color='var(--color-success)';}
        else{$('#infoVerified').textContent='未验证';$('#infoVerified').style.color='var(--color-warning)';}
      }catch(e){console.error('loadUser:',e);showLoginPrompt();}
    }

    $('#saveBtn').addEventListener('click',async function(){
      var nick=$('#nickInput').value.trim();
      if(!nick||nick.length>20){KJ.toast('昵称需1-20个字符');return}
      var btn=$('#saveBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 保存中...';
      try{
        await sb.from('users').update({nick:nick}).eq('id',user.id);
        await sb.auth.updateUser({data:{nick:nick}});
        $('#profileAvatarLarge').textContent=nick.charAt(0).toUpperCase();
        KJ.toast('资料已更新');
      }catch(e){KJ.toast('更新失败：'+e.message)}
      btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> 保存修改';
    });

    function showLoginPrompt(){$('#loginPrompt').style.display='';$('#profileContent').style.display='none';$('#loginMsg').textContent='请登录后管理账号';$('#loginLink').hidden=false;}

    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    var hb=$('#hamburgerBtn'),mm=$('#mobileMenu');
    hb.addEventListener('click',function(e){e.stopPropagation();mm.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!hb.contains(e.target)&&!mm.contains(e.target))mm.classList.remove('open');});

    if(!sb){$('#loginMsg').textContent='网络错误，请刷新后重试';return}

    var authReady=false;
    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){authReady=true;if(session&&session.user){loadUser();return}showLoginPrompt();}
      else if(event==='SIGNED_OUT'){authReady=true;showLoginPrompt();}
      else if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session&&session.user)loadUser();}
    });
    setTimeout(function(){if(!authReady)loadUser();},3000);
    setTimeout(function(){if($('#loginMsg').textContent==='加载中...'){$('#loginMsg').textContent='加载超时，请检查网络';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}},8000);
    })();
  </script>
</body>
</html>
