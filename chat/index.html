<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0078d4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>站内信 · KJLLin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- 全局加载遮罩 -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loader-ring"></div>
  <span class="loader-text">正在加载...</span>
</div>

<!-- 全局通知 -->
<div id="toast" class="toast hidden"></div>

<!-- 主布局容器 -->
<div id="appShell" class="app-shell">

  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">KJLLin</span>
      <span class="topbar-sep">·</span>
      <span class="topbar-title">站内信</span>
    </div>
    <div class="topbar-right">
      <button id="themeBtn" class="btn-icon" title="切换主题">🌓</button>
      <span id="userTag" class="user-tag"></span>
      <button id="logoutBtn" class="btn-text">退出</button>
    </div>
  </header>

  <!-- 主体：左右分栏 -->
  <div class="main-layout">

    <!-- 左侧：搜索 + 对话列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input
          type="email"
          id="searchInput"
          class="search-input"
          placeholder="输入邮箱查找用户..."
          autocomplete="off"
        >
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="conv-list" id="convList">
        <div class="conv-empty">暂无对话，搜索用户邮箱发起私信</div>
      </div>
    </aside>

    <!-- 右侧：聊天窗口 -->
    <main class="chat-main hidden-mobile" id="chatMain">
      <!-- 空状态 -->
      <div class="chat-placeholder" id="chatPlaceholder">
        <div class="placeholder-icon">💬</div>
        <p>选择左侧对话或搜索用户开始私信</p>
      </div>

      <!-- 聊天区域 -->
      <div class="chat-view hidden" id="chatView">
        <!-- 对话头部 -->
        <div class="chat-view-header" id="chatViewHeader">
          <span id="chatPartnerName"></span>
        </div>
        <!-- 消息列表 -->
        <div class="msg-list" id="msgList"></div>
        <!-- 输入栏 -->
        <div class="input-bar">
          <textarea
            id="msgInput"
            class="msg-textarea"
            placeholder="输入消息，Enter 发送..."
            rows="1"
            maxlength="500"
          ></textarea>
          <button id="sendBtn" class="btn-send">发送</button>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
