<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com https://*.hcaptcha.com https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>站内信 · KJLLin</title>
  <meta name="description" content="KJLLin 站内信 - 实时私密消息、在线状态、游戏邀请">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- 背景 -->
<div class="bg-base"></div>

<!-- 全局加载遮罩 -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loader-ring"></div>
  <span class="loader-text">正在加载...</span>
</div>

<!-- 全局通知 -->
<div id="toast" class="toast hidden"></div>

<!-- ================== 全局导航栏 ================== -->
<header class="top-menu">
  <nav class="menu-bar mica" id="menuBar">
    <span class="menu-logo">KJLLin</span>
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item active"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
    <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
    <span id="userTag" class="menu-user-tag"></span>
    <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
    <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
  </nav>
  <div class="mobile-menu-dropdown mica" id="mobileMenu">
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item active"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
    <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
  </div>
</header>

<!-- 主布局容器 -->
<div id="appShell" class="app-shell">

  <!-- 主体：左右分栏 -->
  <div class="main-layout">

    <!-- 左侧：搜索 + 对话列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="输入手机号/昵称/邮箱查找用户..."
          autocomplete="off"
        >
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="conv-list" id="convList">
        <div class="conv-empty">暂无对话，搜索用户（手机号/昵称/邮箱）发起私信</div>
      </div>
      <!-- 屏蔽的用户（折叠） -->
      <div class="blocked-section" id="blockedSection" style="display:none">
        <div class="blocked-header" id="blockedHeader">
          <i class="fas fa-chevron-right" id="blockedChevron"></i>
          <span>屏蔽的用户</span>
          <span class="blocked-count" id="blockedCount">0</span>
        </div>
        <div class="conv-list blocked-list" id="blockedList" style="display:none"></div>
      </div>
      <!-- 右键菜单 -->
      <div class="conv-menu hidden" id="convMenu">
        <div class="conv-menu-item" data-action="block"><i class="fas fa-ban"></i> 屏蔽用户</div>
        <div class="conv-menu-item" data-action="unblock" style="display:none"><i class="fas fa-check-circle"></i> 取消屏蔽</div>
        <div class="conv-menu-item danger" data-action="delete"><i class="fas fa-trash"></i> 删除聊天记录</div>
      </div>
    </aside>

    <!-- 右侧：聊天窗口 -->
    <main class="chat-main hidden-mobile" id="chatMain">
      <!-- 空状态 -->
      <div class="chat-placeholder" id="chatPlaceholder">
        <div class="placeholder-icon"><i class="fas fa-comments"></i></div>
        <p>选择左侧对话或搜索用户开始私信</p>
      </div>

      <!-- 聊天区域 -->
      <div class="chat-view hidden" id="chatView">
        <!-- 对话头部 -->
        <div class="chat-view-header" id="chatViewHeader">
          <span id="chatPartnerName"></span>
        </div>
        <!-- 消息列表 -->
        <div class="msg-list" id="msgList"></div>
        <!-- 输入栏 -->
        <div class="input-bar">
          <textarea
            id="msgInput"
            class="msg-textarea"
            placeholder="输入消息，Enter 发送..."
            rows="1"
            maxlength="500"
          ></textarea>
          <button id="sendBtn" class="btn-send">发送</button>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="/common.js"></script>
<script src="app.js"></script>
</body>
</html>
