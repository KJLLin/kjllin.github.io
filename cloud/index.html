<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>资源云盘 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    html {
      --win-ease: var(--spring-default);
      --bounce: var(--spring-bounce);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    :focus:not(:focus-visible) { outline: none; }
    pre, code, .mono, .file-name, .preview-content pre, .search-box {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace;
    }
    :root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --success: var(--color-success);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
    }
    [data-theme="dark"]:root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --success: var(--color-success);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: clip; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    .bg-base { position: fixed; inset: 0; background: var(--color-bg); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(4%,4%) scale(1.05)} }

    .mica {
      background: var(--bg-mica);
      background-image: var(--iridescent);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      box-shadow: var(--shadow-rest);
    }

    .container { max-width: 960px; margin: 0 auto; padding: 80px 16px calc(40px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }

    .page-header { text-align: center; margin-bottom: 36px; animation: fadeUp 0.7s var(--win-ease) forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .header-icon { font-size: 56px; margin-bottom: 12px; animation: scaleIn 0.5s var(--bounce) 0.1s both; }
    .header-title { font-size: 28px; font-weight: 700; color: var(--text-primary); }
    .header-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; padding: 16px 20px; border-radius: var(--radius-md); animation: slideUp 0.6s var(--win-ease) 0.2s both; }
    .btn { padding: 9px 18px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all var(--transition-fast); font-family: inherit; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-outline { background: transparent; border: 1px solid var(--border-mica); color: var(--text-secondary); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    .search-box { flex: 1; min-width: 160px; padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-mica); background: var(--bg-mica); color: var(--text-primary); font-size: 14px; font-family: inherit; transition: border-color var(--transition-fast); }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-tertiary); }

    .storage-info { margin-left: auto; font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
    .storage-bar { width: 80px; height: 4px; border-radius: 2px; background: var(--border-mica); margin-top: 4px; overflow: hidden; }
    .storage-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s var(--win-ease); }

    /* ====================== 空间切换（公共/私有） ====================== */
    .space-tabs {
      display: flex; gap: 4px; padding: 4px; border-radius: var(--radius-md);
      margin: 0 auto 20px; width: max-content;
      animation: slideUp 0.6s var(--win-ease) 0.15s both;
    }
    .space-tab {
      padding: 9px 26px; border-radius: var(--radius-sm); border: none;
      background: transparent; color: var(--text-secondary);
      font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: all var(--transition-fast);
    }
    .space-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 10px var(--accent-glow); }
    .space-tab:not(.active):hover { background: var(--bg-mica-hover); color: var(--text-primary); }
    .space-tab:active { transform: scale(0.96); }
    @media (max-width: 520px) { .space-tab { flex: 1; padding: 9px 12px; } .space-tabs { width: 100%; } }

    /* ====================== 管理员私有空间管理条 ====================== */
    .admin-manage-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 18px; border-radius: var(--radius-md);
      margin-bottom: 20px;
      animation: slideUp 0.6s var(--win-ease) 0.18s both;
    }
    .manage-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .manage-email-input {
      flex: 1; min-width: 180px; padding: 9px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica); background: var(--bg-mica); color: var(--text-primary);
      font-size: 14px; font-family: inherit; transition: border-color var(--transition-fast);
    }
    .manage-email-input:focus { border-color: var(--accent); }
    .manage-email-input::placeholder { color: var(--text-tertiary); }
    .admin-target-banner {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 18px; border-radius: var(--radius-md);
      margin-bottom: 14px; font-size: 13px; color: var(--accent);
      animation: slideUp 0.4s var(--win-ease) both;
    }
    .admin-target-banner .banner-actions { margin-left: auto; }
    @media (max-width: 520px) {
      .admin-manage-bar { flex-direction: column; align-items: stretch; }
      .manage-email-input { min-width: auto; }
      .admin-target-banner .banner-actions { margin-left: 0; }
    }

    /* 管理员徽章（标题旁） */
    .admin-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 12px; border-radius: var(--radius-full); background: var(--accent-glow); color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; vertical-align: middle; margin-left: 10px; }

    /* 上传进度条 */
    .upload-progress-wrap { margin-top: 12px; display: none; }
    .upload-progress-wrap.active { display: block; }
    .upload-progress-bar { width: 100%; height: 6px; border-radius: 3px; background: var(--border-mica); overflow: hidden; }
    .upload-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
    .upload-progress-text { font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: flex; justify-content: space-between; }

    .drop-zone { border: 2px dashed var(--border-mica); border-radius: var(--radius-md); padding: 32px; text-align: center; margin-bottom: 20px; transition: all var(--transition-normal); animation: slideUp 0.6s var(--win-ease) 0.25s both; color: var(--text-tertiary); }
    .drop-zone.dragover { border-color: var(--accent); background: var(--accent-glow); }
    .drop-zone-icon { font-size: 40px; margin-bottom: 8px; }
    .drop-zone-text { font-size: 14px; }

    .file-list { display: flex; flex-direction: column; gap: 6px; animation: slideUp 0.6s var(--win-ease) 0.3s both; }
    .file-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); transition: all var(--transition-fast); cursor: default; }
    .file-item:hover { transform: translateX(4px); box-shadow: var(--shadow-hover); border-color: var(--border-mica-hover); }
    .file-icon { font-size: 28px; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 14px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .file-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .file-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: none; background: rgba(220,220,220,0.3); cursor: pointer; font-size: 14px; display: grid; place-items: center; transition: all var(--transition-fast); }
    [data-theme="dark"] .file-btn { background: rgba(40,40,40,0.4); }
    .file-btn:hover { background: var(--accent-glow); color: var(--accent); }
    .file-btn.del-btn:hover { background: rgba(231,76,60,0.15); color: var(--danger); }
    .file-btn:active { transform: scale(0.9); }

    /* ====================== 文件列表骨架屏（数据加载阶段占位） ====================== */
    .sk-file {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--radius-md);
    }
    .sk-line {
      border-radius: var(--radius-xs);
      background: linear-gradient(90deg, rgba(120,120,128,0.10) 25%, rgba(120,120,128,0.22) 37%, rgba(120,120,128,0.10) 63%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .sk-file .sk-block { width: 28px; height: 28px; border-radius: var(--radius-sm); flex-shrink: 0; }
    .sk-file .sk-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .sk-file .sk-name { height: 14px; }
    .sk-file .sk-meta { height: 11px; width: 40%; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); animation: slideUp 0.6s var(--win-ease) 0.3s both; }
    .empty-icon { font-size: 56px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 15px; }

    /* 加载中 */
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(255,255,255,0.6);
      display: grid; place-items: center; z-index: 10; border-radius: var(--radius-md);
    }
    [data-theme="dark"] .loading-overlay { background: rgba(0,0,0,0.5); }
    .loading-spin {
      width: 28px; height: 28px; border: 3px solid var(--border-mica);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: grid; place-items: center; padding: 20px; animation: fadeIn 0.2s var(--win-ease); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .overlay.hidden { display: none; }
    .preview-card { background: var(--bg-mica); background-image: var(--iridescent); border-radius: var(--radius-lg); border: 1px solid var(--border-mica); border-top: 1px solid var(--color-border-glass); box-shadow: 0 16px 48px rgba(0,0,0,0.2); max-width: 90vw; max-height: 85vh; overflow: auto; padding: 28px; position: relative; animation: scaleIn 0.3s var(--bounce); }
    .preview-close { position: absolute; top: 10px; right: 14px; width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: rgba(0,0,0,0.08); cursor: pointer; font-size: 18px; display: grid; place-items: center; }
    [data-theme="dark"] .preview-close { background: rgba(255,255,255,0.1); }
    .preview-close:hover { background: rgba(231,76,60,0.2); color: var(--danger); }
    .preview-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--accent); }
    .preview-content { word-break: break-all; }
    .preview-content img { max-width: 100%; max-height: 60vh; border-radius: var(--radius-sm); }
    .preview-content pre { background: rgba(0,0,0,0.05); padding: 16px; border-radius: var(--radius-sm); overflow-x: auto; font-size: 13px; line-height: 1.5; max-height: 50vh; white-space: pre-wrap; word-break: break-all; }
    [data-theme="dark"] .preview-content pre { background: rgba(255,255,255,0.05); }
    .preview-content video { max-width: 100%; max-height: 60vh; border-radius: var(--radius-sm); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 20px; font-size: 14px; z-index: 300; background: var(--text-primary); color: var(--bg-body); box-shadow: 0 4px 16px rgba(0,0,0,0.15); animation: toastIn 0.3s var(--bounce); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ========== 认证页面 ========== */
    .auth-page {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 140px); padding: 20px 0;
      animation: fadeUp 0.5s var(--win-ease) forwards;
    }
    .auth-card {
      width: 100%; max-width: 400px; padding: 36px 28px;
      border-radius: var(--radius-lg); box-shadow: var(--shadow-rest);
      background: var(--bg-mica);
      background-image: var(--iridescent);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
    }
    .auth-header { text-align: center; margin-bottom: 28px; }
    .auth-header h2 { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
    .auth-header p { font-size: 13px; color: var(--text-tertiary); }
    .auth-header .header-icon { font-size: 40px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica); background: var(--bg-mica);
      color: var(--text-primary); font-size: 14px; font-family: inherit;
      transition: border-color var(--transition-fast);
    }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .link { color: var(--accent); font-size: 13px; cursor: pointer; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .auth-card .btn { width: 100%; justify-content: center; padding: 11px; font-size: 15px; }

    /* 用户信息栏 */
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .container { padding: 72px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
      .toolbar { padding: 12px 14px; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .auth-card { padding: 24px 18px; }
      .auth-header .header-icon { font-size: 32px; }
      .auth-header h2 { font-size: 20px; }
      .file-name { max-width: 160px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-box { min-width: auto; }
      .storage-info { margin-left: 0; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    * { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item active"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item active"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <!-- 认证页面（未登录时自动跳转） -->
    <div class="auth-page hidden" id="authPage"></div>

    <!-- ========== 认证检查加载 ========== -->
    <div class="loading-overlay" id="authLoading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px">
      <div class="loading-spinner"></div>
      <p style="color:var(--text-tertiary);margin-top:14px;font-size:14px">正在验证身份...</p>

    <!-- ========== 云盘内容（登录后显示） ========== -->
    <div class="drive-content hidden" id="driveContent">
    <div class="page-header">
      <div class="header-icon"><i class="fas fa-cloud"></i></div>
      <h1 class="header-title">资源云盘 <span class="admin-badge" id="adminBadge" style="display:none"><i class="fas fa-shield-halved"></i> 管理员</span></h1>
      <p class="header-sub" id="headerSub">云端存储 · 随时随地访问你的文件</p>
    </div>

    <div class="space-tabs mica" id="spaceTabs">
      <button class="space-tab active" data-space="public" type="button"><i class="fas fa-globe"></i> 公共空间</button>
      <button class="space-tab" data-space="private" type="button"><i class="fas fa-lock"></i> 私有空间</button>
    </div>

    <!-- 管理员私有空间管理条（私有空间 + 管理员可见） -->
    <div class="admin-manage-bar mica hidden" id="adminManageBar">
      <span class="manage-label"><i class="fas fa-user-gear"></i> 输入用户邮箱可管理其私有文件</span>
      <input type="email" class="manage-email-input" id="adminEmailInput" placeholder="user@example.com" autocomplete="off">
      <button class="btn btn-primary" id="adminEmailViewBtn" type="button"><i class="fas fa-magnifying-glass"></i> 查看</button>
      <button class="btn btn-outline" id="adminEmailClearBtn" type="button"><i class="fas fa-eraser"></i> 清除</button>
    </div>

    <div class="toolbar mica">
      <button class="btn btn-primary" id="uploadBtn"><i class="fas fa-upload"></i> 上传文件</button>
      <input type="file" id="fileInput" multiple hidden>
      <input type="text" class="search-box" id="searchBox" placeholder="搜索文件...">
      <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-arrows-rotate"></i> 刷新</button>
      <div class="storage-info">
        <span id="storageText">已用 --</span>
        <div class="storage-bar"><div class="storage-bar-fill" id="storageBar" style="width:0%"></div></div>
      </div>

    <div class="drop-zone mica" id="dropZone">
      <div class="drop-zone-icon"><i class="fas fa-folder"></i></div>
      <div class="drop-zone-text">拖拽文件到此处或点击上方按钮上传</div>
    </div>

    <div class="upload-progress-wrap mica" id="uploadProgressWrap" style="padding:14px 18px;border-radius:var(--radius-md);box-shadow:var(--shadow-rest)">
      <div class="upload-progress-text">
        <span id="uploadProgressLabel">正在上传...</span>
        <span id="uploadProgressPercent">0%</span>
      </div>
      <div class="upload-progress-bar"><div class="upload-progress-fill" id="uploadProgressFill"></div></div>
    </div>

    <!-- 管理员正在管理某用户私有空间的横幅 -->
    <div class="admin-target-banner mica hidden" id="adminTargetBanner"></div>

    <div style="position:relative">
      <div class="file-list" id="fileList"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><i class="fas fa-inbox"></i></div>
        <div class="empty-text" id="emptyText">暂无文件，上传你的第一个文件吧</div>
      </div>
    </div>
    </div><!-- .drive-content -->
  </div>

  <div class="overlay hidden" id="previewOverlay">
    <div class="preview-card">
      <button class="preview-close" id="previewClose"><i class="fas fa-xmark"></i></button>
      <div class="preview-title" id="previewTitle"></div>
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>

  <div id="captchaModal" class="overlay hidden" style="z-index:250">
    <div class="preview-card" style="max-width:380px;text-align:center">
      <h3 style="margin-bottom:12px">文件超过5MB，请完成验证</h3>
      <div id="captchaCloud"></div>
      <button class="btn btn-outline" id="captchaCancelBtn" style="margin-top:12px">取消</button>
    </div>
  </div>

  <div id="shareModal" class="overlay hidden" style="z-index:260">
    <div class="preview-card" style="max-width:420px">
      <h3 style="margin-bottom:6px"><i class="fas fa-paper-plane"></i> 发送给站内信好友</h3>
      <p id="shareFileTitle" style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px;word-break:break-all"></p>
      <input id="shareUserSearch" class="search-box-input" placeholder="搜索昵称/邮箱/手机号..." autocomplete="off" style="width:100%;padding:10px 14px;border:1px solid var(--border-mica);border-radius:var(--radius-full);background:var(--bg-mica);color:var(--text-primary);font-size:14px;margin-bottom:10px">
      <div id="shareUserList" style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px"></div>
      <div id="shareEmpty" style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px">输入关键词搜索好友</div>
      <button class="btn btn-outline" id="shareCancelBtn" style="margin-top:12px;width:100%">取消</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    const $ = s => document.querySelector(s);


    // ====================== Supabase 初始化 ======================
    // 公共空间：cloud-drive（公开桶，文件可通过公开 URL 访问）
    // 私有空间：cloud-drive-private（私有桶，预览/下载需限时签名 URL）
    let currentSpace = 'public';
    function bucketName() { return currentSpace === 'private' ? 'cloud-drive-private' : 'cloud-drive'; }
    function isPrivateSpace() { return currentSpace === 'private'; }
    function spaceLabel() { return isPrivateSpace() ? '私有空间' : '公共空间'; }
    function updateSpaceUI() {
      $('#headerSub').textContent = isPrivateSpace()
        ? '私有空间 · 文件不公开，仅自己可见（下载链接限时有效）'
        : '云端存储 · 随时随地访问你的文件';
    }
    var sb = KJ.createSupabase();
    KJ.initMessageBanner(sb);

    // ====================== 认证模块 ======================
    let currentUser = null;
    let isAdmin = false; // 管理员可查看/管理所有用户的文件
    let adminTarget = null; // 管理员私有空间管理目标用户 {id, nick}

    // 查询当前用户是否为管理员
    async function fetchIsAdmin(userId) {
      if (!sb || !userId) return false;
      try {
        const { data } = await sb.from('users').select('is_admin').eq('id', userId).maybeSingle();
        return data?.is_admin === true;
      } catch(e) { return false; }
    }

    function showAuthPage() {
      _initDone = true;
      // 隐藏加载态
      const loader = document.getElementById('authLoading'); if (loader) loader.style.display = 'none';
      // 跳转到统一登录页，登录后返回云盘
      window.location.href = '/login/?redirect=/cloud/';
    }

    function showDrivePage(user) {
      _initDone = true;
      // 隐藏加载态
      const loader = document.getElementById('authLoading'); if (loader) loader.style.display = 'none';
      currentUser = user;
      $('#authPage').classList.add('hidden');
      $('#driveContent').classList.remove('hidden');
      // 查询管理员权限后再加载文件（管理员可管理所有文件）
      fetchIsAdmin(user.id).then(function(admin) {
        isAdmin = admin;
        // 管理员徽章显隐
        const badge = document.getElementById('adminBadge');
        if (badge) badge.style.display = admin ? 'inline-flex' : 'none';
        updateAdminManageUI();
        loadAndRender();
      }).catch(function() {
        isAdmin = false;
        const badge = document.getElementById('adminBadge');
        if (badge) badge.style.display = 'none';
        updateAdminManageUI();
        loadAndRender();
      });
    }

    // 退出
    async function doLogout() {
      try {
        await sb.auth.signOut();
      } catch(e) {
        console.warn('Sign out error:', e);
      }
      currentUser = null;
      showAuthPage();
      KJ.toast('已安全退出');
    }

    // 会话检查
    async function checkSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) {
          showDrivePage(session.user);
        } else {
          showAuthPage();
        }
      } catch(e) {
        showAuthPage();
      }
    }

    // 监听认证状态变化（先注册，后检查）
    let _initDone = false;
    document.addEventListener('DOMContentLoaded', () => {
      if (sb) {
        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
            if (session?.user) currentUser = session.user;
            return;
          }
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            if (session?.user) { _initDone = true; showDrivePage(session.user); return; }
            if (!_initDone) { _initDone = true; showAuthPage(); }
          } else if (event === 'SIGNED_OUT' || event === 'USER_DELETED') {
            currentUser = null;
            showAuthPage();
          }
        });
      }
    });

    // 超时保护：5s 后若仍无响应，强制检查
    setTimeout(() => {
      const loader = document.getElementById('authLoading');
      if (loader && loader.style.display !== 'none' && !_initDone) {
        console.warn('Cloud init timeout, force-checking session');
        checkSession();
      }
    }, 5000);

    // ====================== 文件管理 ======================
    let _storageOk = true;

    async function listFiles(_retry) {
      if (!sb) return [];
      try {
        // 公共空间：所有用户共享全桶视图（cloud_read_all），递归列出所有用户目录
        // 私有空间：普通用户仅列自己的目录；管理员递归全部（指定 adminTarget 时仅列该用户目录）
        const scanAll = !isPrivateSpace() || (isAdmin && !adminTarget);
        const prefix = scanAll ? '' : (adminTarget ? adminTarget.id + '/' : (currentUser?.id ? currentUser.id + '/' : ''));
        const bucket = sb.storage.from(bucketName());
        const { data, error } = await bucket.list(prefix, {
          sortBy: { column: 'created_at', order: 'desc' }
        });
        if (error) throw error;
        _storageOk = true;

        let items = data || [];
        let basePrefix = prefix;
        if (scanAll) {
          // 递归列出所有用户目录下的文件（公共空间所有用户；私有空间管理员）
          const allFiles = [];
          for (const entry of items) {
            if (entry.id) {
              // 是文件（根目录遗留文件，owner 为空）
              allFiles.push({ name: entry.name, id: entry.id, metadata: entry.metadata, created_at: entry.created_at, updated_at: entry.updated_at, owner: entry.owner || '' });
            } else {
              // 是用户目录，递归列出
              try {
                const { data: subFiles } = await bucket.list(entry.name, {
                  sortBy: { column: 'created_at', order: 'desc' }
                });
                for (const f of (subFiles || [])) {
                  if (f.id) {
                    allFiles.push({ name: entry.name + '/' + f.name, id: f.id, metadata: f.metadata, created_at: f.created_at, updated_at: f.updated_at, owner: entry.name });
                  }
                }
              } catch(e) { /* 跳过无法访问的目录 */ }
            }
          }
          items = allFiles;
          basePrefix = '';
        }

        return items.filter(f => f.name !== '.emptyFolderPlaceholder' && f.id).map(f => {
          // 非递归路径下补全完整路径（userId/文件名），owner 从 path 第一段解析
          const fullName = (basePrefix && f.name.indexOf('/') === -1) ? basePrefix + f.name : f.name;
          const ownerSeg = fullName.indexOf('/') === -1 ? '' : fullName.split('/')[0];
          return {
            name: fullName,
            id: f.id || fullName,
            size: f.metadata?.size || 0,
            type: f.metadata?.mimetype || '',
            created: f.created_at,
            updated: f.updated_at || f.created_at,
            owner: f.owner || ownerSeg
          };
        });
      } catch(e) {
        // 首次失败可能因 access token 过期/轮换被拒（PGRST301）：强制刷新会话后重试一次
        if (!_retry) {
          try { await sb.auth.refreshSession(); } catch(_) {}
          return listFiles(true);
        }
        console.warn('List files failed:', e.message);
        if (_storageOk) {
          _storageOk = false;
          KJ.toast('云存储读取失败: ' + (e.message || '请检查存储桶配置'), 5000);
        }
        return [];
      }
    }

    // 存储对象名只允许 ASCII（字母/数字/下划线等）；中文等非 ASCII 字符（含 URL 编码的 %XX）
    // 都会被存储端以 Invalid key 拒绝。因此把文件名可逆编码成只含十六进制+下划线的
    // ASCII 安全串用于存储路径，展示时再用 decodeName 还原成中文等原名。
    function encodeName(name) {
      let out = '', s = String(name || '');
      for (let i = 0; i < s.length; i++) {
        const cp = s.codePointAt(i);
        if (cp > 0xffff) i++; // 代理对，cp 已是完整码点
        if (/[0-9a-fA-F]/.test(s[i])) out += s[i];
        else out += '_' + cp.toString(16).toUpperCase() + '_';
      }
      return out.slice(0, 220);
    }
    // 仅含 十六进制+下划线 的才视为"已编码"并解码；其余（旧 ASCII 文件）原样返回
    function decodeName(key) {
      const s = String(key || '');
      if (!/^[0-9a-fA-F_]+$/.test(s)) return s;
      let out = '', i = 0;
      while (i < s.length) {
        if (s[i] === '_') {
          const j = s.indexOf('_', i + 1);
          if (j === -1 || j === i + 1) { out += s[i]; i++; }
          else {
            const h = s.slice(i + 1, j);
            if (/^[0-9a-fA-F]{1,6}$/.test(h)) { out += String.fromCodePoint(parseInt(h, 16)); i = j + 1; }
            else { out += s[i]; i++; }
          }
        } else { out += s[i]; i++; }
      }
      return out;
    }

    async function uploadFile(file) {
      if (!sb) { KJ.toast('云存储不可用'); return false; }
      if (!currentUser) { KJ.toast('请先登录'); return false; }

      let session;
      try {
        session = (await sb.auth.getSession()).data.session;
      } catch(e) {
        KJ.toast('获取登录态失败，请刷新页面');
        return false;
      }
      if (!session) { KJ.toast('登录已过期，请重新登录'); return false; }

      // 对象名用 ASCII 安全编码（中文等非 ASCII 字符会因 Invalid key 被存储拒绝）
      const path = currentUser.id + '/' + Date.now() + '_' + encodeName(file.name);

      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        const wrap = $('#uploadProgressWrap');
        const fill = $('#uploadProgressFill');
        const percentEl = $('#uploadProgressPercent');
        const labelEl = $('#uploadProgressLabel');

        wrap.classList.add('active');
        fill.style.width = '0%';
        percentEl.textContent = '0%';
        labelEl.textContent = `上传中: ${file.name}`;

        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            fill.style.width = pct + '%';
            percentEl.textContent = pct + '%';
          }
        });

        xhr.addEventListener('load', () => {
          wrap.classList.remove('active');
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(true);
          } else {
            let errMsg = '上传失败';
            try { const r = JSON.parse(xhr.responseText); errMsg = r.message || r.error || errMsg; } catch(_) {}
            if (xhr.status === 401 || xhr.status === 403) errMsg = '登录已过期，请刷新页面后重新登录';
            else if (xhr.status === 404) errMsg = '存储桶不存在，请联系管理员';
            else if (xhr.status === 413) errMsg = '文件过大';
            KJ.toast('上传失败: ' + errMsg);
            resolve(false);
          }
        });

        xhr.addEventListener('error', () => {
          wrap.classList.remove('active');
          KJ.toast('上传失败：网络错误，请检查连接后重试');
          resolve(false);
        });

        xhr.open('POST', KJ.SUPABASE_URL + '/storage/v1/object/' + bucketName() + '/' + path);
        xhr.setRequestHeader('Authorization', 'Bearer ' + session?.access_token);
        xhr.setRequestHeader('Cache-Control', 'max-age=3600');
        xhr.send(file);
      });
    }

    async function deleteCloudFile(name) {
      if (!sb) return false;
      if (!currentUser) { KJ.toast('请先登录'); return false; }
      try {
        const { error } = await sb.storage.from(bucketName()).remove([name]);
        if (error) throw error;
        return true;
      } catch(e) {
        console.error('Delete failed:', e.message);
        KJ.toast('删除失败: ' + e.message);
        return false;
      }
    }

    function getPublicUrl(name) {
      if (!sb) return '';
      return sb.storage.from(bucketName()).getPublicUrl(name).data.publicUrl;
    }

    // 获取文件访问 URL：公共空间用公开 URL；私有空间用 5 分钟限时签名 URL
    async function getFileUrl(name) {
      if (!isPrivateSpace()) return getPublicUrl(name);
      try {
        const { data, error } = await sb.storage.from(bucketName()).createSignedUrl(name, 300);
        if (error) throw error;
        return data.signedUrl;
      } catch(e) {
        console.warn('Signed URL failed:', e.message);
        KJ.toast('获取文件链接失败，请稍后重试');
        return '';
      }
    }

    // 预览 URL：图片走存储端缩略图（限制尺寸，避免加载超大原图）；其余类型返回原 URL
    async function getPreviewUrl(name, type) {
      const isImg = type && type.indexOf('image/') === 0;
      if (!isImg) return getFileUrl(name);
      const transform = { width: 1600, quality: 80, resize: 'contain' };
      try {
        if (!isPrivateSpace()) {
          const { data } = sb.storage.from(bucketName()).getPublicUrl(name, { transform });
          return data.publicUrl;
        }
        const { data, error } = await sb.storage.from(bucketName()).createSignedUrl(name, 300, { transform });
        if (error) throw error;
        return data.signedUrl;
      } catch(e) {
        console.warn('thumb url failed:', e.message);
        return getFileUrl(name);
      }
    }

    // 非图片的可预览类型，超过阈值则不允许预览（避免加载超大文件）
    function previewTooLarge(type, size) {
      size = Number(size) || 0;
      if (!size) return false;               // 大小未知则放行
      const t = type || '';
      if (t.indexOf('image/') === 0) return false;   // 图片走缩略图，不设限
      if (t.indexOf('video/') === 0 || t.indexOf('audio/') === 0) return size > 5 * 1024 * 1024;
      return size > 2 * 1024 * 1024;                 // 文本/json/html/css/md 等
    }

    async function clearAll() {
      if (!sb) return;
      const msg = isAdmin
        ? `确定要清空${spaceLabel()}中所有用户的文件吗？此操作不可恢复。`
        : `确定要清空你在${spaceLabel()}的所有文件吗？此操作不可恢复。`;
      if (!confirm(msg)) return;
      const files = await listFiles();
      // 仅删除当前用户自己的文件（管理员要清空所有人文件请逐个删除，不提供批量）
      const mine = files.filter(f => f.owner === (currentUser?.id || ''));
      if (mine.length === 0) { KJ.toast('没有可删除的文件'); return; }
      const paths = mine.map(f => f.name);
      try {
        const { error } = await sb.storage.from(bucketName()).remove(paths);
        if (error) throw error;
        KJ.toast('已清空 ' + paths.length + ' 个文件');
        await loadAndRender();
      } catch(e) {
        KJ.toast('清空失败: ' + e.message);
      }
    }

    // ====================== 文件图标 ======================
    function getFileIcon(type, name) {
      if (type.startsWith('image/')) return '<i class="fas fa-file-image"></i>';
      if (type.startsWith('video/')) return '<i class="fas fa-video"></i>';
      if (type.startsWith('audio/')) return '<i class="fas fa-music"></i>';
      if (type.includes('pdf')) return '<i class="fas fa-file-pdf"></i>';
      if (type.includes('zip') || type.includes('rar') || type.includes('tar') || type.includes('7z')) return '<i class="fas fa-box-archive"></i>';
      if (type.includes('text') || type.includes('javascript') || type.includes('json') || type.includes('html') || type.includes('css')) return '<i class="fas fa-file-lines"></i>';
      if (name.endsWith('.md')) return '<i class="fas fa-file-pen"></i>';
      if (name.endsWith('.doc') || name.endsWith('.docx')) return '<i class="fas fa-file-word"></i>';
      if (name.endsWith('.xls') || name.endsWith('.xlsx')) return '<i class="fas fa-file-excel"></i>';
      if (name.endsWith('.ppt') || name.endsWith('.pptx')) return '<i class="fas fa-file-powerpoint"></i>';
      return '<i class="fas fa-paperclip"></i>';
    }

    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '--';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function formatDate(iso) {
      if (!iso) return '--';
      const d = new Date(iso);
      return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ====================== 渲染 ======================
    let cachedFiles = [];

    // 上传者信息缓存：userId → {nick, email, is_admin}
    const ownerCache = {};

    // 批量查询上传者信息（跳过已缓存项）；返回是否有新增缓存
    async function fetchOwnerInfo(userIds) {
      if (!sb) return false;
      const ids = [...new Set(userIds)].filter(id => id && !ownerCache[id]);
      if (ids.length === 0) return false;
      try {
        const { data, error } = await sb.from('users').select('id,nick,email,is_admin').in('id', ids);
        if (error) throw error;
        for (const u of (data || [])) {
          ownerCache[u.id] = { nick: u.nick || '', email: u.email || '', is_admin: u.is_admin === true };
        }
        return (data || []).length > 0;
      } catch(e) {
        console.warn('Fetch owner info failed:', e.message);
        return false;
      }
    }

    // 上传者显示名：昵称 → 邮箱前缀 → id 前 8 位
    function ownerDisplayName(ownerId) {
      const info = ownerCache[ownerId];
      if (info) {
        if (info.nick) return KJ.escapeHtml(info.nick);
        if (info.email) return KJ.escapeHtml(info.email.split('@')[0]);
      }
      return KJ.escapeHtml(ownerId.substring(0, 8)) + '…';
    }

    // 文件列表骨架屏（数据加载阶段占位）
    function renderFilesSkeleton() {
      const list = $('#fileList');
      const empty = $('#emptyState');
      if (empty) empty.style.display = 'none';
      const widths = [55, 40, 62, 48, 35];
      let html = '';
      for (let i = 0; i < 5; i++) {
        html += '<div class="sk-file mica" aria-hidden="true">' +
          '<div class="sk-line sk-block"></div>' +
          '<div class="sk-info">' +
            '<div class="sk-line sk-name" style="width:' + widths[i] + '%"></div>' +
            '<div class="sk-line sk-meta"></div>' +
          '</div>' +
        '</div>';
      }
      list.innerHTML = html;
    }
    function removeFilesSkeleton() {
      document.querySelectorAll('#fileList .sk-file').forEach(el => el.remove());
    }

    async function loadAndRender() {
      renderFilesSkeleton();
      try {
        cachedFiles = await listFiles();
        renderFiles(true);   // 仅首次加载播放进场动画
      } catch(e) {
        console.warn('loadAndRender error:', e);
        const empty = $('#emptyState');
        empty.querySelector('.empty-text').textContent = '加载文件失败，请刷新重试';
        empty.style.display = 'block';
      } finally {
        showLoading(false);
        removeFilesSkeleton();
      }
    }

    // 解析存储路径为显示文件名（路径格式：{userId}/{timestamp}_{encodedName}）
    function parseDisplayName(fullName) {
      let name = fullName;
      // 去掉用户目录前缀
      const slash = name.indexOf('/');
      if (slash !== -1) name = name.substring(slash + 1);
      // 去掉时间戳前缀
      name = name.replace(/^\d+_/, '');
      // 还原 ASCII 安全编码：让中文等原名可显示；旧 ASCII 文件原样返回
      return decodeName(name);
    }

    // animate：仅首次数据加载（骨架屏切换）时播放进场动画，
    // 后续搜索/上传者信息/空间切换等重渲染不再重播，避免动画反复快速执行
    function renderFiles(animate) {
      const query = $('#searchBox').value.toLowerCase().trim();
      const filtered = query ? cachedFiles.filter(f => parseDisplayName(f.name).toLowerCase().includes(query)) : cachedFiles;
      const list = $('#fileList');
      const empty = $('#emptyState');

      if (!sb) {
        empty.querySelector('.empty-text').textContent = '云存储服务暂不可用，请检查网络连接';
        empty.style.display = 'block';
        list.innerHTML = '';
        updateStorage();
        return;
      }

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.querySelector('.empty-text').textContent = query ? '没有匹配的文件' : (isPrivateSpace() ? '私有空间暂无文件，上传的文件不会公开' : '暂无文件，上传你的第一个文件吧');
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        // 上传者标签：公共空间所有用户可见；私有空间保持管理员视图
        const showOwnerMeta = !isPrivateSpace() || isAdmin;
        list.innerHTML = filtered.map((f, i) => {
          const displayName = KJ.escapeHtml(parseDisplayName(f.name));
          // 上传者：优先昵称/邮箱前缀（ownerCache），无缓存回退 id 前8位；管理员上传者加盾牌
          let ownerLabel = '';
          if (showOwnerMeta && f.owner) {
            const shield = ownerCache[f.owner]?.is_admin ? '<i class="fas fa-shield-halved"></i> ' : '';
            ownerLabel = `<div class="file-meta">${shield}上传者: ${ownerDisplayName(f.owner)}</div>`;
          }
          // 删除按钮：仅管理员或文件所有者可见（RLS 服务端已强制，此处为 UI 层隐藏）
          const canDelete = isAdmin || (f.owner && f.owner === currentUser?.id);
          return `
          <div class="file-item mica" ${animate ? `style="animation:slideUp 0.4s var(--win-ease) ${i * 0.04}s both"` : ''}>
            <div class="file-icon">${getFileIcon(f.type, parseDisplayName(f.name))}</div>
            <div class="file-info">
              <div class="file-name" title="${displayName}">${displayName}</div>
              <div class="file-meta">${formatSize(f.size)} · ${formatDate(f.updated || f.created)}</div>
              ${ownerLabel}
            </div>
            <div class="file-actions">
              <button class="file-btn" data-action="preview" data-path="${KJ.escapeHtml(f.name)}" data-name="${displayName}" data-type="${KJ.escapeHtml(f.type)}" data-size="${Number(f.size)||0}" title="预览"><i class="fas fa-eye"></i></button>
              <button class="file-btn" data-action="download" data-path="${KJ.escapeHtml(f.name)}" data-name="${displayName}" title="下载"><i class="fas fa-download"></i></button>
              <button class="file-btn" data-action="share" data-path="${KJ.escapeHtml(f.name)}" data-name="${displayName}" title="发送给站内信好友"><i class="fas fa-paper-plane"></i></button>
              ${canDelete ? `<button class="file-btn del-btn" data-action="delete" data-name="${KJ.escapeHtml(f.name)}" title="删除"><i class="fas fa-trash"></i></button>` : ''}
            </div>
          </div>`;
        }).join('');
        // 异步补全上传者信息（先渲染列表，owner 信息到达后更新，不阻塞）
        if (showOwnerMeta) {
          const owners = filtered.map(f => f.owner).filter(Boolean);
          if (owners.length > 0) {
            fetchOwnerInfo(owners).then(updated => { if (updated) renderFiles(false); });
          }
        }
      }
      updateStorage();
    }

    function showLoading(show) {
      const existing = document.querySelector('.loading-overlay');
      if (show && !existing) {
        const div = document.createElement('div');
        div.className = 'loading-overlay';
        div.innerHTML = '<div class="loading-spin"></div>';
        $('#fileList').parentElement.appendChild(div);
      } else if (!show && existing) {
        existing.remove();
      }
    }

    function updateStorage() {
      // 普通用户只统计自己的文件（公共空间全桶可见，仅计 owner 为自己的）；管理员显示全量
      const scoped = isAdmin ? cachedFiles : cachedFiles.filter(f => f.owner === currentUser?.id);
      const total = scoped.reduce((s, f) => s + (f.size || 0), 0);
      const MAX = 50 * 1024 * 1024;
      const pct = Math.min(100, Math.round((total / MAX) * 100));
      $('#storageText').textContent = total ? `已用 ${formatSize(total)}` : '已用 --';
      $('#storageBar').style.width = pct + '%';
      $('#storageBar').style.background = pct > 95 ? 'var(--danger)' : pct > 80 ? '#f39c12' : 'var(--accent)';
    }

    // ====================== 上传 ======================
    // 允许上传的文件类型白名单
    var ALLOWED_TYPES = [
      'image/', 'video/', 'audio/',
      'text/plain', 'text/markdown', 'text/csv',
      'application/pdf', 'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.ms-excel',
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      'application/vnd.ms-powerpoint',
      'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'application/zip', 'application/x-zip-compressed',
      'application/x-rar-compressed', 'application/x-7z-compressed',
      'application/gzip', 'application/x-tar',
      'application/json', 'application/xml'
    ];
    var BLOCKED_EXTS = ['.exe','.dll','.bat','.cmd','.sh','.msi','.vbs','.ps1','.js','.vba','.scr','.com','.pif'];

    async function handleFiles(fileList) {
      if (!KJ.rateLimit('cloud_upload', 2000, 1, '上传过于频繁，请稍后再试')) return;
      const files = Array.from(fileList);
      if (files.length === 0) return;
      let success = 0;
      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) { KJ.toast(`"${file.name}" 超过 10MB 限制`); continue; }
        // 类型白名单检查
        var typeAllowed = false;
        for (var i = 0; i < ALLOWED_TYPES.length; i++) {
          if (file.type && file.type.indexOf(ALLOWED_TYPES[i]) === 0) { typeAllowed = true; break; }
        }
        // 扩展名黑名单
        var ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
        if (BLOCKED_EXTS.indexOf(ext) !== -1) { KJ.toast(`"${file.name}" 文件类型不允许上传`); continue; }
        // 纯文本文件允许（即使 MIME 不匹配）
        if (!typeAllowed && !file.type) { typeAllowed = true; }
        if (!typeAllowed) { KJ.toast(`"${file.name}" 文件类型不允许上传（${file.type || '未知'}）`); continue; }
        const ok = await uploadFile(file);
        if (ok) success++;
      }
      if (success > 0) {
        KJ.toast(`成功上传 ${success} 个文件`);
        await loadAndRender();
      }
    }

    // ====================== 删除 ======================
    async function deleteFile(name) {
      if (!confirm(`确定删除 "${parseDisplayName(name)}" 吗？`)) return;
      const ok = await deleteCloudFile(name);
      if (ok) {
        KJ.toast('已删除');
        await loadAndRender();
      }
    }

    // ====================== 预览 ======================
    function previewFile(url, name, type, size) {
      $('#previewTitle').textContent = name;
      const content = $('#previewContent');
      // 非图片且文件过大：不加载，提示下载
      if (previewTooLarge(type, size)) {
        content.innerHTML = `<p style="color:var(--text-tertiary)">文件较大，暂不支持在线预览</p><p style="margin-top:8px">你可以点击「下载」查看</p>`;
        $('#previewOverlay').classList.remove('hidden');
        return;
      }
      if (type.startsWith('image/')) {
        content.innerHTML = '';
        const img = document.createElement('img');
        img.src = url;
        img.alt = name;
        img.style.cssText = 'max-width:100%;max-height:calc(80vh - 120px);object-fit:contain;border-radius:12px';
        content.appendChild(img);
      } else if (type.startsWith('video/')) {
        content.innerHTML = '';
        const video = document.createElement('video');
        video.controls = true;
        video.src = url;
        content.appendChild(video);
      } else if (type.startsWith('audio/')) {
        content.innerHTML = '';
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;
        content.appendChild(audio);
      } else if (type.startsWith('text/') || type.includes('javascript') || type.includes('json') || type.includes('html') || type.includes('css') || name.endsWith('.md')) {
        fetch(url).then(r => r.ok ? r.text() : Promise.reject()).then(text => {
          const pre = document.createElement('pre');
          pre.textContent = text;
          content.innerHTML = '';
          content.appendChild(pre);
        }).catch(() => {
          content.innerHTML = '';
          const p = document.createElement('p');
          p.style.color = 'var(--text-tertiary)';
          p.textContent = '无法加载文件内容';
          content.appendChild(p);
        });
      } else {
        content.innerHTML = `<p style="color:var(--text-tertiary)">此文件类型不支持在线预览</p><p style="margin-top:8px">你可以直接下载查看</p>`;
      }
      $('#previewOverlay').classList.remove('hidden');
    }

    function downloadFile(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // 文件列表事件委托（预览/下载先取访问 URL：私有空间需签名）
    $('#fileList').addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'preview') {
        // 图片走缩略图(免加载超大原图)；其余类型过大时由预览内部拦截提示
        getPreviewUrl(btn.dataset.path, btn.dataset.type).then(url => { if (url) previewFile(url, btn.dataset.name, btn.dataset.type, btn.dataset.size); });
      } else if (action === 'download') {
        getFileUrl(btn.dataset.path).then(url => { if (url) downloadFile(url, btn.dataset.name); });
      } else if (action === 'delete') {
        deleteFile(btn.dataset.name);
      } else if (action === 'share') {
        openShare(btn.dataset.path, btn.dataset.name);
      }
    });

    // ====================== 分享文件给站内信好友 ======================
    let _sharePath = '', _shareName = '', _shareFriends = [];
    async function buildShareUrl(path) {
      // 公共空间：公开 URL；私有空间：1 小时限时签名 URL
      if (!isPrivateSpace()) {
        const { data } = sb.storage.from(bucketName()).getPublicUrl(path);
        return data.publicUrl;
      }
      const { data } = await sb.storage.from(bucketName()).createSignedUrl(path, 3600);
      return data && data.signedUrl ? data.signedUrl : '';
    }
    function renderShareFriends(query) {
      const list = $('#shareUserList');
      const empty = $('#shareEmpty');
      const q = (query || '').trim().toLowerCase();
      const shown = q
        ? _shareFriends.filter(u => ((u.nick||'')+' '+(u.email||'')+' '+(u.phone||'')).toLowerCase().includes(q))
        : _shareFriends;
      if (!shown.length) { list.innerHTML = ''; empty.style.display=''; empty.textContent = q ? '未找到匹配的好友' : '暂无可联系的用户'; return; }
      empty.style.display = 'none';
      list.innerHTML = shown.map(u => {
        const dn = KJ.escapeHtml(u.nick || u.email || u.phone || '用户');
        const sub = KJ.escapeHtml(u.email || u.phone || '');
        return `<button type="button" class="share-user-item" data-id="${u.id}" data-nick="${KJ.escapeHtml(u.nick || '')}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;border-radius:10px;background:transparent;color:var(--text-primary);font-size:14px;cursor:pointer;width:100%;text-align:left;transition:background .2s" onmouseover="this.style.background='var(--bg-mica-hover)'" onmouseout="this.style.background='transparent'">
          <span style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;flex-shrink:0">${KJ.escapeHtml((dn||'?').charAt(0).toUpperCase())}</span>
          <span style="min-width:0;flex:1;display:flex;flex-direction:column"><span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dn}</span>${sub?`<span style="font-size:11px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sub}</span>`:''}</span>
          <i class="fas fa-paper-plane" style="color:var(--text-tertiary);font-size:12px"></i></button>`;
      }).join('');
    }
    async function openShare(path, name) {
      if (!sb || !currentUser) { KJ.toast('请先登录'); return; }
      _sharePath = path; _shareName = name;
      $('#shareFileTitle').textContent = '分享：' + name;
      $('#shareUserSearch').value = '';
      $('#shareModal').classList.remove('hidden');
      renderShareFriends('');

    async function renderShareFriendsLoad() {
      try {
        const { data } = await sb.from('users').select('id,nick,email,phone').neq('id', currentUser.id).limit(100);
        if (Array.isArray(data)) _shareFriends = data;
        renderShareFriends($('#shareUserSearch').value);
      } catch(e) { console.warn('share friends load failed:', e); }
    }
    async function sendShareTo(uid) {
      const btn = document.querySelector('.share-user-item[data-id="' + uid + '"]');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }
      try {
        const url = await buildShareUrl(_sharePath);
        const body = '📎 我在云盘分享了文件「' + _shareName + '」\n' + (url || '(获取链接失败)') + (url && isPrivateSpace() ? '\n（私有空间链接 1 小时内有效）' : '');
        const { error } = await sb.from('private_messages').insert({
          sender_id: currentUser.id,
          recipient_id: uid,
          text: body
        });
        if (error) throw error;
        KJ.toast('已发送给好友');
        $('#shareModal').classList.add('hidden');
      } catch(e) {
        KJ.toast('发送失败：' + (e.message || '未知错误'));
        if (btn) { btn.disabled = false; btn.style.opacity = ''; }
      }
    }

    // ====================== 大文件人机验证（>5MB；服务端 siteverify 强制校验，防绕过） ======================
    let _cloudCaptchaToken='', _captchaResolve=null, _captchaTarget=null, _cloudWidgetId=null;
    const CLOUD_SITEKEY='abe0d880-7704-481a-b892-9b982f7c5890';

    // 显式渲染 hCaptcha 到 #captchaCloud。
    // 不在页面加载时用 class="h-captcha" 自动渲染：隐藏容器内自动渲染的 widget 可能为空/0尺寸，
    // 导致弹窗打开后“无反应”。改为打开弹窗时才渲染，widget 可靠可见可交互。
    function ensureCloudWidget(){
      const cont=document.getElementById('captchaCloud');
      if(!cont)return false;
      if(_cloudWidgetId!==null)return true;
      if(typeof hcaptcha==='undefined')return false;
      try{
        cont.innerHTML='';
        _cloudWidgetId=hcaptcha.render(cont,{
          sitekey:CLOUD_SITEKEY,
          size:'normal',
          callback:function(t){_cloudCaptchaToken=t;if(_captchaResolve){_captchaResolve(t);_captchaResolve=null;}},
          'expired-callback':function(){_cloudCaptchaToken='';}
        });
        return true;
      }catch(e){_cloudWidgetId=null;return false;}
    }

    function requireCaptcha(targetFile){
      return new Promise((resolve)=>{
        _captchaTarget=targetFile;
        if(_cloudCaptchaToken){const t=_cloudCaptchaToken;_cloudCaptchaToken='';resolve(t);return;}
        _captchaResolve=resolve;
        $('#captchaModal').classList.remove('hidden');
        // api.js 为异步加载，未就绪则轮询等待渲染完成
        (function tryWidget(){ if(!ensureCloudWidget())setTimeout(tryWidget,400); })();
      });
    }

    function resetCloudCaptcha(){
      _cloudCaptchaToken='';
      $('#captchaModal').classList.add('hidden');
      if(_cloudWidgetId!==null){try{if(typeof hcaptcha!=='undefined')hcaptcha.reset(_cloudWidgetId)}catch(_){}}
    }
    $('#captchaCancelBtn').addEventListener('click',()=>{
      $('#captchaModal').classList.add('hidden');
      if(_captchaResolve){_captchaResolve(false);_captchaResolve=null;}
      _cloudCaptchaToken='';
      if(_cloudWidgetId!==null){try{if(typeof hcaptcha!=='undefined')hcaptcha.reset(_cloudWidgetId)}catch(_){}}
    });

    // 修改 handleFiles 函数：大文件（>5MB）上传前需通过服务端 upload-ticket 接口
    // 获取票据（接口内部完成 hCaptcha siteverify；数据库触发器强制校验票据）
    const _origHandleFiles = handleFiles;
    handleFiles = async function(fileList) {
      const files = Array.from(fileList);
      const largeFiles = files.filter(f => f.size > 5 * 1024 * 1024);
      if (largeFiles.length > 0) {
        const token = await requireCaptcha(largeFiles[0].name);
        if (!token) { KJ.toast('验证取消'); return; }
        let ticketOk = false;
        try {
          const { data: { session } } = await sb.auth.getSession();
          const res = await fetch(KJ.SUPABASE_URL + '/functions/v1/upload-ticket', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': KJ.SUPABASE_KEY,
              'Authorization': 'Bearer ' + (session?.access_token || '')
            },
            body: JSON.stringify({ token: token, files: largeFiles.length })
          });
          let d = null;
          try { d = await res.json(); } catch(_) {}
          if (d && d.success) {
            ticketOk = true;
          } else {
            // 服务端透传 expired（timeout-or-duplicate）时提示重新勾选
            var errMsg = (d && d.error) || ('HTTP ' + res.status + ' ' + (res.statusText || ''));
            var errCodes = (d && d.codes && d.codes.length) ? ('\n[错误码] ' + d.codes.join(', ')) : '';
            var errRaw = (d && d.raw) ? ('\n[原始] ' + d.raw) : '';
            console.error('[upload-ticket] 验证失败:', errMsg, errCodes, 'status=' + res.status, 'body=', JSON.stringify(d));
            KJ.toast(errMsg + errCodes + errRaw);
          }
        } catch(e) {
          console.error('[upload-ticket] 请求异常:', e);
          KJ.toast('验证服务请求异常，请重试');
        }
        resetCloudCaptcha();
        if (!ticketOk) return;
      }
      // 传入一开始捕获的 File 数组快照，而不是 live FileList：
      // change 回调里的 e.target.value='' 会立刻清空并失效原 FileList，
      // 经人机验证的多次 await 后再 Array.from(fileList) 会得到空数组 → 静默不上传、无进度条。
      return _origHandleFiles(files);
    };

    // ====================== 初始化 ======================
    document.addEventListener('DOMContentLoaded', () => {
      if (sb) {
        checkSession();
      } else {
        showAuthPage();
      }
    });
  </script>
<div id="toast" class="toast hidden"></div>
</body>
</html>
