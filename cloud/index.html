<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 资源云盘 - 在线文件管理">
  <title>资源云盘 · KJLLin</title>
  <style>
    html {
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent; outline: none;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    :root {
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255,255,255,0.85);
      --bg-mica-scroll: rgba(255,255,255,0.92);
      --bg-mica-hover: rgba(255,255,255,0.9);
      --border-mica: rgba(0,0,0,0.06);
      --border-mica-hover: rgba(0,120,212,0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0,120,212,0.1);
      --accent-glow-weak: rgba(0,120,212,0.05);
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.09);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.08);
      --danger: #e74c3c;
      --success: #34c88a;
      --scroll-bar: #c4c4c4;
    }
    [data-theme="dark"]:root {
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20,20,20,0.85);
      --bg-mica-scroll: rgba(20,20,20,0.92);
      --bg-mica-hover: rgba(26,26,26,0.9);
      --border-mica: rgba(255,255,255,0.07);
      --border-mica-hover: rgba(0,120,212,0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0,120,212,0.15);
      --accent-glow-weak: rgba(0,120,212,0.07);
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.25);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.3);
      --scroll-bar: #4a4a4a;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(4%,4%) scale(1.05)} }
    @keyframes micaFloatMobile { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(2%,2%) scale(1.02)} }

    .mica {
      background: var(--bg-mica);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
    }

    /* 顶部导航 */
    .top-menu {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 8px 16px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .menu-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-rest);
      pointer-events: all;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }
    .menu-bar.scrolled {
      background: var(--bg-mica-scroll);
      box-shadow: var(--shadow-scroll);
      transform: translateY(-2px);
    }
    .menu-logo { font-size: 18px; font-weight: 700; color: var(--accent); padding: 6px 14px; letter-spacing: 0.2px; }
    .menu-item {
      padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13.5px;
      font-weight: 500; color: var(--text-secondary); text-decoration: none;
      cursor: pointer; border: none; background: none;
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .menu-item:hover { color: var(--accent); background: var(--accent-glow); }
    .menu-item.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; }
    .menu-divider { width: 1px; height: 20px; background: var(--border-mica); margin: 0 4px; }
    .menu-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
      font-size: 16px; cursor: pointer;
      background: rgba(220,220,220,0.4); color: var(--text-primary);
      display: grid; place-items: center;
      transition: all var(--transition-fast);
    }
    [data-theme="dark"] .menu-btn { background: rgba(40,40,40,0.4); }
    .menu-btn:hover { background: var(--accent-glow); color: var(--accent); }
    .menu-btn:active { transform: scale(0.92); }
    .hamburger { display: none; }
    .mobile-menu-dropdown {
      display: none; position: absolute; top: 100%; left: 16px; right: 16px;
      margin-top: 8px; padding: 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-hover); flex-direction: column; gap: 2px;
    }
    .mobile-menu-dropdown.open { display: flex; }

    /* 主体 */
    .container { max-width: 960px; margin: 0 auto; padding: 80px 16px 40px; position: relative; z-index: 1; }

    /* 页头 */
    .page-header {
      text-align: center; margin-bottom: 36px;
      animation: fadeUp 0.7s var(--win-ease) forwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .header-icon { font-size: 56px; margin-bottom: 12px; animation: scaleIn 0.5s var(--bounce) 0.1s both; }
    .header-title { font-size: 28px; font-weight: 700; color: var(--text-primary); }

    /* 工具栏 */
    .toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 20px; padding: 16px 20px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-rest);
      animation: slideUp 0.6s var(--win-ease) 0.2s both;
    }
    .btn {
      padding: 9px 18px; border-radius: var(--radius-sm); border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all var(--transition-fast);
      font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-outline { background: transparent; border: 1px solid var(--border-mica); color: var(--text-secondary); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(231,76,60,0.1); }
    .btn:active { transform: scale(0.96); }

    .search-box {
      flex: 1; min-width: 160px; padding: 9px 14px;
      border-radius: var(--radius-sm); border: 1px solid var(--border-mica);
      background: var(--bg-mica); color: var(--text-primary);
      font-size: 14px; font-family: inherit;
      transition: border-color var(--transition-fast);
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-tertiary); }

    .storage-info {
      margin-left: auto; font-size: 12px; color: var(--text-tertiary);
      white-space: nowrap;
    }
    .storage-bar {
      width: 80px; height: 4px; border-radius: 2px; background: var(--border-mica);
      margin-top: 4px; overflow: hidden;
    }
    .storage-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s var(--win-ease); }

    /* 拖拽上传区 */
    .drop-zone {
      border: 2px dashed var(--border-mica);
      border-radius: var(--radius-md); padding: 32px;
      text-align: center; margin-bottom: 20px;
      transition: all var(--transition-normal);
      animation: slideUp 0.6s var(--win-ease) 0.25s both;
      color: var(--text-tertiary);
    }
    .drop-zone.dragover { border-color: var(--accent); background: var(--accent-glow); }
    .drop-zone-icon { font-size: 40px; margin-bottom: 8px; }
    .drop-zone-text { font-size: 14px; }

    /* 文件列表 */
    .file-list {
      display: flex; flex-direction: column; gap: 6px;
      animation: slideUp 0.6s var(--win-ease) 0.3s both;
    }
    .file-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-rest);
      transition: all var(--transition-fast);
      cursor: default;
    }
    .file-item:hover { transform: translateX(4px); box-shadow: var(--shadow-hover); border-color: var(--border-mica-hover); }
    .file-icon { font-size: 28px; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .file-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .file-btn {
      width: 30px; height: 30px; border-radius: var(--radius-sm);
      border: none; background: rgba(220,220,220,0.3); cursor: pointer;
      font-size: 14px; display: grid; place-items: center;
      transition: all var(--transition-fast);
    }
    [data-theme="dark"] .file-btn { background: rgba(40,40,40,0.4); }
    .file-btn:hover { background: var(--accent-glow); color: var(--accent); }
    .file-btn.del-btn:hover { background: rgba(231,76,60,0.15); color: var(--danger); }
    .file-btn:active { transform: scale(0.9); }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-tertiary);
      animation: slideUp 0.6s var(--win-ease) 0.3s both;
    }
    .empty-icon { font-size: 56px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 15px; }

    /* 预览弹窗 */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; display: grid; place-items: center;
      padding: 20px;
      animation: fadeIn 0.2s var(--win-ease);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .overlay.hidden { display: none; }
    .preview-card {
      background: var(--bg-mica); border-radius: var(--radius-lg);
      box-shadow: 0 16px 48px rgba(0,0,0,0.2);
      max-width: 90vw; max-height: 85vh; overflow: auto;
      padding: 28px; position: relative;
      animation: scaleIn 0.3s var(--bounce);
    }
    .preview-close {
      position: absolute; top: 10px; right: 14px;
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      border: none; background: rgba(0,0,0,0.08); cursor: pointer;
      font-size: 18px; display: grid; place-items: center;
    }
    [data-theme="dark"] .preview-close { background: rgba(255,255,255,0.1); }
    .preview-close:hover { background: rgba(231,76,60,0.2); color: var(--danger); }
    .preview-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--accent); }
    .preview-content { word-break: break-all; }
    .preview-content img { max-width: 100%; max-height: 60vh; border-radius: var(--radius-sm); }
    .preview-content pre {
      background: rgba(0,0,0,0.05); padding: 16px; border-radius: var(--radius-sm);
      overflow-x: auto; font-size: 13px; line-height: 1.5; max-height: 50vh;
      white-space: pre-wrap; word-break: break-all;
    }
    [data-theme="dark"] .preview-content pre { background: rgba(255,255,255,0.05); }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 24px; border-radius: 20px; font-size: 14px; z-index: 300;
      background: var(--text-primary); color: var(--bg-body);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      animation: toastIn 0.3s var(--bounce);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* 响应式 */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 16px 40px; }
      .toolbar { padding: 12px 14px; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: micaFloatMobile 14s ease-in-out infinite; }
    }
    @media (max-width: 520px) {
      .menu-item { display: none; }
      .hamburger { display: grid; }
    }
    @media (min-width: 521px) {
      .hamburger { display: none !important; }
      .mobile-menu-dropdown { display: none !important; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    * { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <!-- 导航 -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <div class="menu-divider"></div>
      <a href="/" class="menu-item">🏠 首页</a>
      <a href="/chat" class="menu-item">💬 聊天</a>
      <a href="/game/" class="menu-item">🎮 游戏</a>
      <a href="/cloud/" class="menu-item active">☁️ 云盘</a>
      <div class="menu-divider"></div>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题">🌙</button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单">☰</button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item">🏠 首页</a>
      <a href="/chat" class="menu-item">💬 聊天</a>
      <a href="/game/" class="menu-item">🎮 游戏</a>
      <a href="/cloud/" class="menu-item active">☁️ 云盘</a>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <div class="header-icon">☁️</div>
      <h1 class="header-title">资源云盘</h1>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar mica">
      <button class="btn btn-primary" id="uploadBtn">📤 上传文件</button>
      <input type="file" id="fileInput" multiple hidden>
      <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索文件...">
      <button class="btn btn-outline" id="clearAllBtn">🗑 清空</button>
      <div class="storage-info">
        <span id="storageText">已用 0 MB</span>
        <div class="storage-bar"><div class="storage-bar-fill" id="storageBar" style="width:0%"></div></div>
      </div>
    </div>

    <!-- 拖拽区 -->
    <div class="drop-zone mica" id="dropZone">
      <div class="drop-zone-icon">📁</div>
      <div class="drop-zone-text">拖拽文件到此处或点击上方按钮上传</div>
    </div>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div class="empty-text">暂无文件，上传你的第一个文件吧</div>
    </div>
  </div>

  <!-- 预览弹窗 -->
  <div class="overlay hidden" id="previewOverlay">
    <div class="preview-card">
      <button class="preview-close" id="previewClose">✕</button>
      <div class="preview-title" id="previewTitle"></div>
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const root = document.documentElement;
    const metaTheme = $('meta[name="theme-color"]');
    const STORAGE_KEY = 'kjllin_cloud_files';
    const MAX_STORAGE = 50 * 1024 * 1024; // 50MB

    // ====================== 文件管理 ======================
    function loadFiles() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch(e) { return []; }
    }
    function saveFiles(files) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); }
      catch(e) { showToast('存储空间不足，请清理文件'); }
    }

    function addFile(name, type, dataUrl) {
      const files = loadFiles();
      const file = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name, type, dataUrl,
        size: Math.round(dataUrl.length * 0.75),
        date: new Date().toISOString()
      };
      files.unshift(file);
      saveFiles(files);
      renderFiles();
      showToast('上传成功');
    }

    function deleteFile(id) {
      let files = loadFiles();
      files = files.filter(f => f.id !== id);
      saveFiles(files);
      renderFiles();
      showToast('已删除');
    }

    function clearAll() {
      if (!confirm('确定要清空所有文件吗？此操作不可恢复。')) return;
      saveFiles([]);
      renderFiles();
      showToast('已清空');
    }

    // ====================== 文件图标 ======================
    function getFileIcon(type, name) {
      if (type.startsWith('image/')) return '🖼️';
      if (type.startsWith('video/')) return '🎬';
      if (type.startsWith('audio/')) return '🎵';
      if (type.includes('pdf')) return '📕';
      if (type.includes('zip') || type.includes('rar') || type.includes('tar')) return '📦';
      if (type.includes('text') || type.includes('javascript') || type.includes('json') || type.includes('html') || type.includes('css')) return '📄';
      if (name.endsWith('.md')) return '📝';
      if (name.endsWith('.doc') || name.endsWith('.docx')) return '📃';
      if (name.endsWith('.xls') || name.endsWith('.xlsx')) return '📊';
      if (name.endsWith('.ppt') || name.endsWith('.pptx')) return '📽️';
      return '📎';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ====================== 渲染 ======================
    function renderFiles() {
      const files = loadFiles();
      const query = $('#searchBox').value.toLowerCase().trim();
      const filtered = query ? files.filter(f => f.name.toLowerCase().includes(query)) : files;

      const list = $('#fileList');
      const empty = $('#emptyState');

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        list.innerHTML = filtered.map((f, i) => `
          <div class="file-item mica" style="animation:slideUp 0.4s var(--win-ease) ${i * 0.04}s both">
            <div class="file-icon">${getFileIcon(f.type, f.name)}</div>
            <div class="file-info">
              <div class="file-name" title="${f.name}">${f.name}</div>
              <div class="file-meta">${formatSize(f.size)} · ${formatDate(f.date)}</div>
            </div>
            <div class="file-actions">
              <button class="file-btn" onclick="previewFile('${f.id}')" title="预览">👁</button>
              <button class="file-btn" onclick="downloadFile('${f.id}')" title="下载">⬇</button>
              <button class="file-btn del-btn" onclick="deleteFile('${f.id}')" title="删除">🗑</button>
            </div>
          </div>
        `).join('');
      }
      updateStorage();
    }

    function updateStorage() {
      const files = loadFiles();
      const total = files.reduce((s, f) => s + f.size, 0);
      const pct = Math.min(100, Math.round((total / MAX_STORAGE) * 100));
      $('#storageText').textContent = `已用 ${formatSize(total)}`;
      $('#storageBar').style.width = pct + '%';
      if (pct > 80) $('#storageBar').style.background = '#f39c12';
      else if (pct > 95) $('#storageBar').style.background = 'var(--danger)';
      else $('#storageBar').style.background = 'var(--accent)';
    }

    // ====================== 上传 ======================
    function handleFiles(fileList) {
      Array.from(fileList).forEach(file => {
        if (file.size > 10 * 1024 * 1024) {
          showToast('文件过大，最大支持 10MB');
          return;
        }
        const total = loadFiles().reduce((s, f) => s + f.size, 0);
        if (total + file.size > MAX_STORAGE) {
          showToast('存储空间不足，请清理旧文件');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => addFile(file.name, file.type, reader.result);
        reader.readAsDataURL(file);
      });
    }

    // ====================== 预览 ======================
    function previewFile(id) {
      const files = loadFiles();
      const f = files.find(x => x.id === id);
      if (!f) return;
      $('#previewTitle').textContent = f.name;
      const content = $('#previewContent');
      if (f.type.startsWith('image/')) {
        content.innerHTML = `<img src="${f.dataUrl}" alt="${f.name}">`;
      } else if (f.type.startsWith('text/') || f.type.includes('javascript') || f.type.includes('json') || f.type.includes('html') || f.type.includes('css') || f.name.endsWith('.md')) {
        fetch(f.dataUrl).then(r => r.text()).then(text => {
          content.innerHTML = `<pre>${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
        }).catch(() => content.innerHTML = '<pre>无法预览此文件</pre>');
      } else if (f.type.startsWith('video/')) {
        content.innerHTML = `<video controls style="max-width:100%;max-height:60vh"><source src="${f.dataUrl}" type="${f.type}"></video>`;
      } else if (f.type.startsWith('audio/')) {
        content.innerHTML = `<audio controls src="${f.dataUrl}"></audio>`;
      } else {
        content.innerHTML = `<p style="color:var(--text-tertiary)">此文件类型不支持预览</p><p style="margin-top:8px">文件大小: ${formatSize(f.size)}</p>`;
      }
      $('#previewOverlay').classList.remove('hidden');
    }

    function downloadFile(id) {
      const files = loadFiles();
      const f = files.find(x => x.id === id);
      if (!f) return;
      const a = document.createElement('a');
      a.href = f.dataUrl;
      a.download = f.name;
      a.click();
    }

    // ====================== Toast ======================
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // ====================== 事件 ======================
    $('#uploadBtn').addEventListener('click', () => $('#fileInput').click());
    $('#fileInput').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
    $('#clearAllBtn').addEventListener('click', clearAll);
    $('#searchBox').addEventListener('input', renderFiles);
    $('#previewClose').addEventListener('click', () => $('#previewOverlay').classList.add('hidden'));
    $('#previewOverlay').addEventListener('click', function(e) {
      if (e.target === this) this.classList.add('hidden');
    });

    // 拖拽上传
    const dropZone = $('#dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    // ====================== 主题 ======================
    const themeBtn = $('#themeBtn');
    function initTheme() {
      try {
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const localDark = localStorage.getItem('theme') === 'dark';
        if (localDark || sysDark) { root.dataset.theme = 'dark'; themeBtn.textContent = '☀️'; metaTheme.content = '#0f0f0f'; }
        else { themeBtn.textContent = '🌙'; metaTheme.content = '#f3f3f3'; }
      } catch(e) { themeBtn.textContent = '🌙'; }
    }
    function toggleTheme() {
      try {
        const isDark = root.dataset.theme === 'dark';
        if (isDark) { root.dataset.theme = ''; localStorage.removeItem('theme'); themeBtn.textContent = '🌙'; metaTheme.content = '#f3f3f3'; }
        else { root.dataset.theme = 'dark'; localStorage.setItem('theme', 'dark'); themeBtn.textContent = '☀️'; metaTheme.content = '#0f0f0f'; }
      } catch(e) {}
    }
    themeBtn.addEventListener('click', toggleTheme);

    // 移动端菜单
    const hamburgerBtn = $('#hamburgerBtn');
    const mobileMenu = $('#mobileMenu');
    hamburgerBtn.addEventListener('click', () => mobileMenu.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) mobileMenu.classList.remove('open');
    });

    // 滚动
    let isScrolling = false;
    const menuBar = $('#menuBar');
    window.addEventListener('scroll', () => {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        menuBar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    });

    window.addEventListener('DOMContentLoaded', initTheme);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', initTheme);

    // 初始化
    renderFiles();
  </script>
</body>
</html>
