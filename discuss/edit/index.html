<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://*.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://*.hcaptcha.com; frame-src 'self' https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>编辑帖子 · 讨论版 · KJLLin</title>
  <meta name="description" content="编辑讨论 - KJLLin 讨论版">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    html{--win-ease:var(--spring-default);--bounce:var(--spring-bounce);--transition-fast:200ms var(--win-ease);--transition-normal:300ms var(--win-ease);--radius-sm:8px;--radius-md:12px;--radius-lg:16px;transition:background-color var(--transition-normal)}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
    body{background:var(--bg-body);color:var(--text-primary)}
    :root{--bg-body:var(--color-bg);--bg-mica:var(--color-bg-glass);--bg-mica-hover:var(--color-bg-glass-hover);--border-mica:var(--color-border);--text-primary:var(--color-text-primary);--text-secondary:var(--color-text-secondary);--text-tertiary:var(--color-text-tertiary);--accent:var(--color-accent);--accent-light:var(--color-accent-light);--accent-glow:var(--color-accent-glow);--danger:var(--color-danger);--shadow-rest:var(--shadow-sm);--shadow-hover:var(--shadow-lg)}
    [data-theme="dark"]:root{--bg-body:var(--color-bg);--bg-mica:var(--color-bg-glass);--bg-mica-hover:var(--color-bg-glass-hover);--border-mica:var(--color-border);--text-primary:var(--color-text-primary);--text-secondary:var(--color-text-secondary);--text-tertiary:var(--color-text-tertiary);--accent-glow:var(--color-accent-glow);--shadow-rest:var(--shadow-sm);--shadow-hover:var(--shadow-lg)}
    body{background:var(--bg-body);color:var(--text-primary)}
    .bg-base{position:fixed;inset:0;background:var(--bg-body);z-index:-3;pointer-events:none}
    .mica{background:var(--bg-mica);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);border:1px solid var(--border-mica);border-top:1px solid var(--color-border-glass);box-shadow:var(--glass-shadow)}

    .container{max-width:860px;margin:0 auto;padding:80px 16px calc(40px + env(safe-area-inset-bottom, 0px))}
    .page-header{margin-bottom:24px;animation:fadeUp 0.5s var(--win-ease)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .page-header .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-tertiary);text-decoration:none;font-weight:500;padding:6px 14px;border-radius:var(--radius-sm);transition:all var(--transition-fast)}
    .page-header .back-link:hover{color:var(--accent);background:var(--accent-glow)}
    .page-header h1{font-size:24px;font-weight:700;color:var(--text-primary);margin-top:12px}

    .card{padding:24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-rest);animation:fadeUp 0.5s var(--win-ease) 0.1s both}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
    .form-group input{width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-mica);background:rgba(0,0,0,0.02);color:var(--text-primary);font-size:14px;font-family:inherit}
    [data-theme="dark"] .form-group input{background:rgba(255,255,255,0.03)}
    .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);outline:none}
    .captcha-row{display:flex;justify-content:center;margin-bottom:16px;min-height:78px}
    .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .btn{font-size:13px;padding:8px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:inherit;font-weight:500;transition:all var(--transition-fast)}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-light)}
    .btn-primary:active{transform:scale(0.96);transition:transform var(--duration-instant) var(--spring-default)}
    .btn-secondary{background:var(--bg-mica);color:var(--text-secondary);border:1px solid var(--border-mica)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
    .btn-secondary:active{transform:scale(0.96);transition:transform var(--duration-instant) var(--spring-default)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}

    .EasyMDEContainer{margin-bottom:0}
    .EasyMDEContainer .CodeMirror{border-radius:var(--radius-sm);border:1px solid var(--border-mica)!important;background:var(--bg-mica)!important;color:var(--text-primary)!important;font-size:14px;line-height:1.7}
    .EasyMDEContainer .CodeMirror-cursor{border-left-color:var(--accent)!important}
    .EasyMDEContainer .editor-toolbar{border-radius:var(--radius-sm) var(--radius-sm) 0 0;border:1px solid var(--border-mica)!important;border-bottom:none!important;background:var(--bg-mica)!important}
    .EasyMDEContainer .editor-toolbar button{color:var(--text-secondary)!important}
    .EasyMDEContainer .editor-toolbar button:hover,.EasyMDEContainer .editor-toolbar button.active{color:var(--accent)!important;background:var(--accent-glow)!important;border-color:var(--accent)!important}
    .EasyMDEContainer .editor-statusbar{border-radius:0 0 var(--radius-sm) var(--radius-sm);border:1px solid var(--border-mica)!important;border-top:none!important;background:var(--bg-mica)!important;color:var(--text-tertiary)!important}

    .loading-state{text-align:center;padding:60px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow-rest);animation:fadeUp 0.5s var(--win-ease)}
    .loading-state .spinner{width:36px;height:36px;margin:0 auto 12px;border:3px solid var(--accent-glow);border-top:3px solid var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-state{text-align:center;padding:60px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow-rest);animation:fadeUp 0.5s var(--win-ease)}
    .error-state .icon{font-size:48px;margin-bottom:12px}
    .error-state .text{font-size:15px;color:var(--text-secondary);margin-bottom:16px}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:20px;font-size:14px;z-index:300;background:var(--text-primary);color:var(--bg-body);box-shadow:0 4px 16px rgba(0,0,0,0.15);animation:toastIn 0.3s var(--bounce)}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}}

    @media(max-width:768px){.card{padding:18px}.container{padding:72px 12px calc(40px + env(safe-area-inset-bottom, 0px))}}
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <a href="/discuss/" class="back-link"><i class="fas fa-arrow-left"></i> 返回讨论版</a>
      <h1><i class="fas fa-pen-to-square"></i> 编辑讨论</h1>
    </div>

    <div class="loading-state mica" id="loadingState">
      <div class="spinner"></div>
      <div style="color:var(--text-tertiary);font-size:14px">正在加载帖子...</div>
    </div>

    <div class="error-state mica" id="errorState" style="display:none">
      <div class="icon"><i class="fas fa-face-frown"></i></div>
      <div class="text" id="errorText"></div>
      <a href="/discuss/" class="btn btn-primary" style="text-decoration:none;display:inline-block;line-height:1.4">返回讨论版</a>
    </div>

    <div class="card mica" id="editForm" style="display:none">
      <div class="form-group">
        <label>讨论标题</label>
        <input type="text" id="postTitle" placeholder="输入讨论标题..." maxlength="100">
      </div>
      <textarea id="postContent" style="display:none;"></textarea>
      <div id="editorContainer"></div>
      <div class="captcha-row">
        <div class="h-captcha" id="captchaDiscuss" data-sitekey="abe0d880-7704-481a-b892-9b982f7c5890" data-size="normal" data-callback="onCaptchaDiscuss" data-expired-callback="onCaptchaDiscussExpired"></div>
      </div>
      <div class="btn-row">
        <a href="/discuss/" class="btn btn-secondary" style="text-decoration:none;line-height:1.4">取消</a>
        <button class="btn btn-primary" id="submitBtn">更新讨论</button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s)},root=document.documentElement;
    var themeBtn=$('#themeBtn'),sb=KJ.createSupabase();
    if(sb) KJ.initMessageBanner(sb);
    var currentUser=null,easyMDE=null,captchaToken='',postId='',postData=null;
    window.onCaptchaDiscuss=function(t){captchaToken=t};
    window.onCaptchaDiscussExpired=function(){captchaToken=''};

    function toast(msg){var e=document.querySelector('.toast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}
    function showError(msg){$('#loadingState').style.display='none';$('#editForm').style.display='none';$('#errorState').style.display='';$('#errorText').textContent=msg}
    function formatDate(iso){if(!iso)return'';var d=new Date(iso);return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}

    // Theme
    function updateThemeUI(){var s=KJ.applyTheme('#f3f3f3','#000');themeBtn.innerHTML=KJ.getThemeIcon(s.mode)}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI()});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();
    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        KJ.initNav(null, { homeUrl: '/' });

    // Get post ID from URL
    postId=new URLSearchParams(location.search).get('id');
    if(!postId){showError('缺少帖子 ID');}

    // EasyMDE
    var _emLoaded=false;
    function loadEasyMDE(cb){if(_emLoaded){cb();return}if(window.EasyMDE){_emLoaded=true;cb();return}var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js';s.onload=function(){_emLoaded=true;cb()};s.onerror=function(){var ls=document.getElementById('loadingState');if(ls)ls.style.display='none';var c=document.getElementById('editorContainer');if(c)c.innerHTML='<div style="text-align:center;padding:20px;color:var(--danger);font-size:14px"><i class="fas fa-triangle-exclamation"></i> 编辑器加载失败，请检查网络后刷新页面</div>'};document.head.appendChild(s)}
    function initEditor(initVal){if(!window.EasyMDE){loadEasyMDE(function(){initEditor(initVal)});return}if(easyMDE)return;easyMDE=new EasyMDE({element:document.getElementById('postContent'),spellChecker:false,autoDownloadFontAwesome:false,status:['lines','words','cursor'],toolbar:['bold','italic','heading','|','quote','unordered-list','ordered-list','|','code','link','image','table','|','preview','side-by-side','|','guide'],minHeight:'280px',maxHeight:'500px',renderingConfig:{codeSyntaxHighlighting:true},previewRender:function(plainText){var html=plainText;try{if(window.marked)html=window.marked.parse(plainText);}catch(e){html=plainText}if(window.DOMPurify){html=DOMPurify.sanitize(html,{ALLOWED_TAGS:['h1','h2','h3','h4','h5','h6','p','br','hr','strong','em','b','i','u','s','del','a','ul','ol','li','blockquote','pre','code','img','table','thead','tbody','tr','th','td','span','div','sub','sup'],ALLOWED_ATTR:['href','title','target','rel','src','alt','width','height','class','id','type','checked','disabled'],ALLOW_DATA_ATTR:false})}else{return '<pre>'+KJ.escapeHtml(plainText)+'</pre>'}return html}});if(initVal)easyMDE.value(initVal)}

    // Load post（防重入：INITIAL_SESSION 与 getSession 双触发时只加载一次）
    var _postLoaded=false;
    function loadPost(user){
      if(_postLoaded)return;
      currentUser=user;
      if(!postId){showError('缺少帖子 ID');return}
      if(!sb||!currentUser){$('#loadingState').style.display='none';showError('请先登录');return}
      sb.from('posts').select('*').eq('id',postId).single().then(function(r){
        if(r.error||!r.data){showError('帖子不存在或已被删除');return}
        var p=r.data;
        if(p.user_id!==currentUser.id){showError('你只能编辑自己的帖子');return}
        _postLoaded=true;
        postData=p;
        $('#postTitle').value=p.title||'';
        $('#loadingState').style.display='none';
        $('#editForm').style.display='';
        loadEasyMDE(function(){initEditor(p.content||'')});
      }).catch(function(){showError('加载帖子失败，请稍后重试')});
    }

    // Submit
    var _submitting=false;
    $('#submitBtn').addEventListener('click',async function(){
      if(_submitting)return;
      if(!KJ.rateLimit('discuss_edit', 5000, 1, '编辑过于频繁，请稍后再试')) return;
      if(!currentUser){toast('请先登录');return}
      if(!postData){toast('帖子数据未加载');return}
      var title=$('#postTitle').value.trim(),content=easyMDE?easyMDE.value().trim():'';
      if(!title){toast('请输入讨论标题');return}
      if(!content){toast('请输入讨论内容');return}
      if(content.length > 50000){toast('讨论内容过长，请限制在50000字以内');return}
      if(typeof hcaptcha==='undefined'){toast('人机验证加载中，请稍后重试');return}
      if(!captchaToken){toast('请完成人机验证');return}
      _submitting=true;var btn=$('#submitBtn');btn.disabled=true;btn.textContent='更新中...';
      try{
        var cr=await fetch(KJ.SUPABASE_URL+'/functions/v1/verify-captcha',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:captchaToken})});
        var cd=await cr.json();
        if(!cd||!cd.success){
          // hCaptcha token 约 2 分钟过期且一次性，明确提示重新验证
          toast(cd&&cd.expired?'人机验证已过期，请重新勾选验证':'人机验证未通过，请重试');
          captchaToken='';try{hcaptcha.reset('captchaDiscuss')}catch(_){}_submitting=false;btn.disabled=false;btn.textContent='更新讨论';return}
      }catch(_){toast('网络错误，请稍后重试');_submitting=false;btn.disabled=false;btn.textContent='更新讨论';return}
      try{
        var{error}=await sb.from('posts').update({title,content,updated_at:new Date().toISOString()}).eq('id',postId).eq('user_id',currentUser.id);
        if(error){
          // 如果 updated_at 列不存在，回退到仅更新 title/content
          if(error.code==='42703'){
            var{error:err2}=await sb.from('posts').update({title,content}).eq('id',postId).eq('user_id',currentUser.id);
            if(err2)throw err2;
          }else{throw error}
        }
        toast('讨论已更新！');
        window.location.href='/discuss/view/?id='+postId;
      }catch(e){toast('更新失败：'+(e.message||'未知错误'));captchaToken='';try{hcaptcha.reset('captchaDiscuss')}catch(_){}}
      finally{_submitting=false;btn.disabled=false;btn.textContent='更新讨论'}
    });

    // Auth
    if(sb){
      sb.auth.onAuthStateChange(function(event,session){
        if(event==='SIGNED_IN'||event==='INITIAL_SESSION'){if(session?.user)loadPost(session.user)}
        else if(event==='SIGNED_OUT'){showError('请先登录')}
        else if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session?.user)currentUser=session.user}
      });
      sb.auth.getSession().then(function(r){if(r?.data?.session?.user)loadPost(r.data.session.user);else showError('请先登录')}).catch(function(){showError('网络错误，请刷新后重试')});
    }else showError('服务暂不可用');
    })();
  </script>  <div id="toast" class="toast hidden"></div>
</body>
</html>
