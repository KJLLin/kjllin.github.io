  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">

  <style>
    /* ====================== Win11 全局规范 ====================== */
    html {
      --win-ease: var(--spring-default);
      --bounce: var(--spring-bounce);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    :focus:not(:focus-visible) { outline: none; }
    pre, code, .mono, .CodeMirror, .editor-toolbar button {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    :root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
    }
    [data-theme="dark"]:root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(10,132,255,0.07);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: clip; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    /* ====================== 粒子背景 ====================== */
    #particlesCanvas {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }

    /* ====================== 加载遮罩 ====================== */
    #loader {
      position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.5s var(--win-ease);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-tertiary); animation: fadePulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ====================== 云母组件 ====================== */
    .mica {
      background: var(--bg-mica);
      background-image: var(--iridescent);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      box-shadow: var(--glass-shadow);
    }

    /* ====================== 布局 ====================== */
    .container { max-width: 860px; margin: 0 auto; padding: 80px 16px calc(40px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }

    /* ====================== 页面标题 ====================== */
    .page-title {
      text-align: center; margin-bottom: 36px; animation: fadeUp 0.6s var(--win-ease) forwards;
    }
    .page-title h1 {
      font-size: 28px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px;
    }
    .page-title p {
      font-size: 14px; color: var(--text-tertiary);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* ====================== 认证区域 ====================== */
    .auth-area {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
      padding: 12px 20px; border-radius: var(--radius-lg);
    }
    .auth-area .user-info {
      display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary);
    }
    .auth-area .user-info .nick { font-weight: 600; color: var(--accent); }
    .auth-btns { display: flex; gap: 8px; align-items: center; }

    /* ====================== 工具栏（搜索 / 只看关注） ====================== */
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; border-radius: var(--radius-lg); margin-bottom: 20px;
      animation: fadeUp 0.5s var(--win-ease) 0.05s both;
    }
    .search-box { position: relative; flex: 1; min-width: 220px; }
    .search-box .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: var(--text-tertiary); pointer-events: none;
    }
    .search-box input {
      width: 100%; padding: 9px 14px 9px 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica);
      background: var(--bg-mica-hover); color: var(--text-primary);
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-box input::placeholder { color: var(--text-tertiary); }
    .search-box input::-webkit-search-cancel-button { cursor: pointer; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 8px 14px; border-radius: var(--radius-full);
      border: 1px solid var(--border-mica); background: transparent;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--border-mica-hover); color: var(--accent); }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* 最新 / 热榜 排序页签（借鉴洛谷） */
    .sort-tabs {
      display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px;
      padding: 4px; border-radius: var(--radius-lg);
      background: var(--bg-mica-hover);
      animation: fadeUp 0.5s var(--win-ease) 0.05s both;
    }
    .sort-tab {
      border: none; background: transparent; color: var(--text-secondary);
      font-size: 13px; padding: 7px 18px; border-radius: var(--radius-sm);
      cursor: pointer; font-family: inherit; transition: all var(--transition-fast);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .sort-tab:hover { color: var(--accent); }
    .sort-tab.active { background: var(--color-bg); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .login-prompt {
      text-align: center; padding: 48px 20px; border-radius: var(--radius-lg);
      margin-bottom: 24px;
      animation: fadeUp 0.5s var(--win-ease) 0.1s both;
    }
    .login-prompt .icon { font-size: 48px; margin-bottom: 12px; }
    .login-prompt .text { font-size: 16px; color: var(--text-secondary); margin-bottom: 16px; }
    .login-prompt .hint { font-size: 13px; color: var(--text-tertiary); }

    .btn {
      font-size: 13px; padding: 8px 20px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-family: inherit; font-weight: 500;
      transition: all var(--transition-fast);
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-secondary {
      background: var(--bg-mica); color: var(--text-secondary);
      border: 1px solid var(--border-mica);
    }
    .btn-secondary:hover { border-color: var(--border-mica-hover); color: var(--accent); }
    .btn-danger {
      background: transparent; color: var(--danger); font-size: 12px;
      padding: 4px 10px; border: 1px solid transparent;
    }
    .btn-danger:hover { border-color: var(--danger); background: rgba(232,17,35,0.06); }
    .btn-sm { font-size: 12px; padding: 6px 14px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ====================== 文章列表 ====================== */
    .post-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      padding: 24px; border-radius: var(--radius-lg);
      position: relative;
      animation: fadeUp 0.4s var(--win-ease) both;
      transition: box-shadow var(--transition-normal), transform var(--transition-normal);
    }
    .post-card:hover {
      transform: translateY(-2px);
    }
    .post-card .post-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 8px; margin-bottom: 6px;
    }
    .post-card .post-title {
      font-size: 19px; font-weight: 600; color: var(--text-primary); flex: 1;
      word-break: break-word;
    }
    .vis-badge {
      display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
      padding: 2px 8px; border-radius: var(--radius-full); background: var(--bg-mica-hover);
      color: var(--text-tertiary); font-size: 11px; font-weight: 500; vertical-align: middle;
    }
    .post-card .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .post-card .post-footer {
      font-size: 12px; color: var(--text-tertiary); margin-top: 14px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .post-card .post-footer .author { font-weight: 600; color: var(--accent); }
    .post-card .post-footer .footer-spacer { flex: 1; }
    .post-card .like-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: none; cursor: pointer;
      font-size: 12px; color: var(--text-tertiary); font-family: inherit;
      padding: 4px 10px; border-radius: var(--radius-full);
      transition: all var(--transition-fast);
    }
    .post-card .like-btn:hover { background: var(--accent-glow); color: var(--color-danger); }
    .post-card .like-btn .like-count { font-weight: 600; }
    .post-card .like-btn.like-static { cursor: default; }
    .post-card .like-btn.like-static:hover { background: transparent; color: var(--text-tertiary); }
    .follow-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 3px 12px; border-radius: var(--radius-full);
      border: 1px solid var(--border-mica-hover); background: transparent;
      color: var(--accent); cursor: pointer; font-family: inherit; line-height: 1.5;
      transition: all var(--transition-fast); white-space: nowrap;
    }
    .follow-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .follow-btn.following { border-color: transparent; background: var(--accent-glow); }
    .post-card .post-content {
      font-size: 14px; color: var(--text-secondary); line-height: 1.75;
      word-break: break-word;
    }
    .post-card .post-content h1,
    .post-card .post-content h2,
    .post-card .post-content h3,
    .post-card .post-content h4 { margin: 16px 0 8px; color: var(--text-primary); }
    .post-card .post-content h1 { font-size: 1.35em; }
    .post-card .post-content h2 { font-size: 1.2em; }
    .post-card .post-content h3 { font-size: 1.1em; }
    .post-card .post-content p { margin: 8px 0; }
    .post-card .post-content code {
      background: var(--accent-glow); padding: 2px 6px; border-radius: 4px;
      font-family: "Consolas","Cascadia Code","SF Mono",monospace; font-size: 0.9em;
    }
    .post-card .post-content pre {
      background: var(--code-bg, #1a1a2e); padding: 18px; border-radius: var(--radius-sm);
      overflow-x: auto; font-size: 13px; line-height: 1.6;
      color: var(--code-color, #cdd6f4); border: 1px solid var(--border-mica);
    }
    [data-theme="dark"] .post-card .post-content pre {
      --code-bg: #0d1117; --code-color: #c9d1d9;
    }
    .post-card .post-content pre code { background: none; padding: 0; color: inherit; }
    /* 代码块包装器 + 复制按钮 */
    .code-block-wrapper { position: relative; margin: 10px 0; }
    .code-block-wrapper pre { margin: 0; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(30,30,46,0.8); color: rgba(255,255,255,0.5);
      font-size: 14px; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; transition: opacity var(--transition-fast), color var(--transition-fast);
      z-index: 2;
    }
    [data-theme="dark"] .copy-btn {
      background: rgba(13,17,23,0.85);
    }
    .copy-btn:hover {
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.2);
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn.copied { color: var(--color-success); border-color: var(--color-success-bg); }
    .post-card .post-content ul,
    .post-card .post-content ol { padding-left: 20px; margin: 6px 0; }
    .post-card .post-content a { color: var(--accent); }
    .post-card .post-content blockquote {
      border-left: 3px solid var(--accent); padding-left: 12px;
      margin: 8px 0; color: var(--text-tertiary);
    }
    .post-card .post-content img { max-width: 100%; border-radius: var(--radius-sm); margin: 8px 0; }
    .post-card .post-content table {
      border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px;
    }
    .post-card .post-content th,
    .post-card .post-content td {
      border: 1px solid var(--border-mica); padding: 8px 12px; text-align: left;
    }
    .post-card .post-content th { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
    .post-empty {
      text-align: center; padding: 48px 20px; color: var(--text-tertiary);
      font-size: 15px; animation: fadeUp 0.5s var(--win-ease) 0.1s both;
    }

    /* ====================== 分页控件（洛谷风格数字页码 × Apple 材质） ====================== */
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border-radius: var(--radius-lg); margin-top: 20px;
      animation: fadeUp 0.4s var(--win-ease) both; flex-wrap: wrap;
    }
    .page-btn {
      min-width: 32px; height: 32px; padding: 0 8px; border-radius: var(--radius-sm);
      border: 1px solid transparent; background: transparent;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center;
      transition: transform 80ms cubic-bezier(0.23,0.01,0,1), background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }
    .page-btn:hover:not(:disabled):not(.active) { background: var(--bg-mica-hover); color: var(--accent); }
    .page-btn:active:not(:disabled) { transform: scale(0.92); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    /* 当前页：accent 实底（Apple segmented 高亮范式） */
    .page-btn.active {
      background: var(--accent); color: #fff; font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow); cursor: default;
    }
    .page-btn.nav-btn { padding: 0 10px; }
    .page-ellipsis {
      min-width: 24px; text-align: center; color: var(--text-tertiary);
      font-size: 13px; user-select: none; letter-spacing: 1px;
    }
    .page-total { font-size: 12px; color: var(--text-tertiary); margin-left: 10px; white-space: nowrap; }

    /* ====================== 文章骨架屏（数据加载阶段占位） ====================== */
    .sk-card {
      display: flex; align-items: center; gap: 14px;
      padding: 24px; border-radius: var(--radius-lg);
      animation: fadeUp 0.4s var(--win-ease) both;
    }
    .sk-line {
      border-radius: var(--radius-xs);
      background: linear-gradient(90deg, rgba(120,120,128,0.10) 25%, rgba(120,120,128,0.22) 37%, rgba(120,120,128,0.10) 63%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .sk-card .sk-circle { width: 40px; height: 40px; border-radius: var(--radius-full); flex-shrink: 0; }
    .sk-card .sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .sk-card .sk-title { height: 18px; }
    .sk-card .sk-meta { height: 12px; width: 38%; }

    /* ====================== Toast 提示 ====================== */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      padding: 10px 24px; border-radius: var(--radius-sm);
      background: var(--bg-mica-scroll); background-image: var(--iridescent); color: var(--text-primary);
      font-size: 14px; z-index: 9998;
      box-shadow: var(--shadow-lg);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      animation: toastIn 0.3s var(--bounce);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ====================== 返回顶部 ====================== */
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover { transform: translateY(-2px); }

    /* ====================== 页脚 ====================== */
    .footer { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); margin-top: 40px; }

    /* ====================== 滚动条 ====================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ====================== 响应式 ====================== */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
      .page-title h1 { font-size: 24px; }
      .post-card { padding: 18px; }
      .auth-area { padding: 12px 16px; flex-direction: column; align-items: flex-start; }
      .toolbar { padding: 10px 12px; }
      .search-box { min-width: 100%; }
      .pagination { flex-wrap: wrap; gap: 8px; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .post-card .post-header { flex-direction: column; }
      .post-card .post-actions { align-self: flex-end; }
    }

    * { -webkit-user-select: none; user-select: none; }
    input, textarea, .CodeMirror { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <canvas id="particlesCanvas"></canvas>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <div id="loader">
    <div class="loader-content">
      <div class="loader-spin"></div>
      <div class="loader-text" id="loaderText">正在加载...</div>
      <div id="loaderError" style="display:none;margin-top:12px;font-size:12px;color:var(--color-danger,#e74c3c);max-width:300px;text-align:center;word-break:break-all"></div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    var _t1=setTimeout(function(){var t=document.getElementById('loaderText');if(t)t.textContent='正在加载... (网络较慢)';},5000);
    var _t2=setTimeout(function(){var t=document.getElementById('loaderText');if(t)t.textContent='加载时间较长，请检查网络连接';},10000);
    var _t3=setTimeout(function(){
      var l=document.getElementById('loader');
      if(l){l.style.opacity='0';setTimeout(function(){l.remove()},300);}
    },15000);
    function showError(msg){
      var el=document.getElementById('loaderError');
      if(el){el.style.display='';el.textContent=el.textContent+' | '+msg;}
      var lt=document.getElementById('loaderText');
      if(lt)lt.innerHTML='<i class="fas fa-triangle-exclamation"></i> 加载出错 - 查看下方详情';
    }
    window.onerror=function(msg,url,line){showError('JS错误('+line+'): '+msg);};
  </script>

  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <!-- ==================== 页面标题 ==================== -->
    <section class="page-title">
      <h1><i class="fas fa-book-open"></i> 文章广场</h1>
      <p>使用 Markdown 格式自由交流，分享想法与问题</p>
    </section>

    <!-- ==================== 认证区域 ==================== -->
    <div class="auth-area mica" id="authArea">
      <div class="user-info" id="userInfo">
        <span style="color:var(--text-tertiary);font-size:14px;">未登录</span>
      </div>
      <div class="auth-btns" id="authBtns"></div>
    </div>

    <!-- ==================== 工具栏：搜索 / 只看关注 ==================== -->
    <div class="toolbar mica" id="toolbar">
      <div class="search-box">
        <i class="fas fa-magnifying-glass search-icon"></i>
        <input type="search" id="searchInput" placeholder="搜索标题或内容..." autocomplete="off" enterkeyhint="search" aria-label="搜索文章">
      </div>
      <button class="filter-chip" id="followFilterChip" title="只显示已关注用户的文章"><i class="fas fa-user-check"></i> 只看关注</button>
    </div>

    <!-- ==================== 排序页签：最新 / 热榜 ==================== -->
    <div class="sort-tabs" id="sortTabs">
      <button type="button" class="sort-tab active" data-sort="latest"><i class="fas fa-clock"></i> 最新</button>
      <button type="button" class="sort-tab" data-sort="hot"><i class="fas fa-fire"></i> 热榜</button>
    </div>

    <!-- ==================== 登录提示（未登录时显示） ==================== -->
    <div class="login-prompt mica" id="loginPrompt">
      <div class="icon"><i class="fas fa-lock"></i></div>
      <div class="text">请登录后参与文章广场</div>
      <div class="hint"><a href="/login/?redirect=/discuss/" style="color:var(--accent);text-decoration:none;font-weight:600">→ 前往登录</a></div>
    </div>

    <!-- ==================== 文章列表 ==================== -->
    <div class="post-list" id="postList"></div>
    <!-- 空态提示（列表外层兄弟节点：避免被列表 innerHTML 重写销毁） -->
    <div class="post-empty" id="postEmpty" style="display:none"><i class="fas fa-inbox"></i> 暂无文章</div>

    <!-- ==================== 分页控件 ==================== -->
    <div class="pagination mica" id="pagination" style="display:none"></div>

    <footer class="footer">© 2026 KJLLin · All Rights Reserved</footer>
  </div>

  <button id="backTop" class="mica" aria-label="返回顶部">↑</button>

  <script>
    // ====================== 工具函数 ======================
    const $ = s => document.querySelector(s);
    const root = document.documentElement;

    const themeBtn = $('#themeBtn');
    const backTop = $('#backTop');
    const menuBar = $('#menuBar');
    let isScrolling = false;
    let touchStartData = {};

    // ====================== 粒子背景 ======================
    (function() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const count = 50;
      let animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticles() {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 0.5,
            o: Math.random() * 0.5 + 0.1
          });
        }
      }
      createParticles();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isDark = root.dataset.theme === 'dark';
        const color = isDark ? '255,255,255' : '0,120,212';
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color},${p.o})`;
          ctx.fill();
        }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(${color},${0.04 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        animId = requestAnimationFrame(draw);
      }
      draw();
    })();

    // ====================== 触摸点击判定 ======================
    function handleTouchStart(e) {
      touchStartData = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
    function handleTouchEnd(e, callback) {
      const t = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, time: Date.now() };
      const dx = Math.abs(t.x - touchStartData.x);
      const dy = Math.abs(t.y - touchStartData.y);
      const dt = t.time - touchStartData.time;
      if (dx < 10 && dy < 10 && dt < 300) { e.preventDefault(); e.stopPropagation(); callback(); }
    }

    // ====================== 主题（三模式：浅色/深色/跟随系统） ======================
    function updateThemeUI() {
      var state = KJ.applyTheme('#f5f5f7', '#000');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    }
    themeBtn.addEventListener('click', function() {
      KJ.toggleTheme();
      updateThemeUI();
    });
    KJ.onSystemThemeChange(updateThemeUI);
    updateThemeUI();

    // ====================== 滚动 ======================
    function handleScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        backTop.classList.toggle('show', window.scrollY > 300);
        menuBar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    }
    function goToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    // ====================== 移动端菜单 ======================
    KJ.setupMobileMenu('#hamburgerBtn', '#mobileMenu');
  KJ.initNav(null, { homeUrl: '/' });

    backTop.addEventListener('click', goToTop);
    backTop.addEventListener('touchstart', handleTouchStart);
    backTop.addEventListener('touchend', e => handleTouchEnd(e, goToTop));
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('beforeunload', () => {
      window.removeEventListener('scroll', handleScroll);
    });

    // ====================== 文章广场核心逻辑 ======================
    (function() {
      var _closeLoader = function(){
        var l = document.getElementById('loader');
        if(l){l.style.opacity='0';setTimeout(function(){l.remove();},300);}
      };
      var _forceTimer = setTimeout(_closeLoader, 15000);

      let currentUser;
      var sb = KJ.createSupabase();
      KJ.initMessageBanner(sb);

      function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const diff = now - d;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
        if (diff < 172800000) return '昨天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' }) +
          ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }

      // ====================== 认证 UI ======================
      function updateAuthUI(user) {
        currentUser = user;
        const authBtns = document.getElementById('authBtns');
        const userInfo = document.getElementById('userInfo');
        const loginPrompt = document.getElementById('loginPrompt');

        if (user) {
          const nick = user.user_metadata?.nick || user.email?.split('@')[0] || '用户';
          userInfo.innerHTML = '<span class="nick"><i class="fas fa-user"></i> ' + KJ.escapeHtml(nick) + '</span><span style="font-size:12px;color:var(--text-tertiary)">已登录</span>';
          authBtns.innerHTML =
            '<a href="/discuss/new/" class="btn btn-primary btn-sm" style="text-decoration:none;display:inline-block;line-height:1.4"><i class="fas fa-pen-to-square"></i> 写文章</a>' +
            '<button class="btn btn-secondary btn-sm" id="logoutBtn">退出登录</button>';
          loginPrompt.style.display = 'none';
          document.getElementById('logoutBtn').addEventListener('click', doLogout);
        } else {
          userInfo.innerHTML = '<span style="color:var(--text-tertiary);font-size:14px;">未登录</span>';
          authBtns.innerHTML =
            '<a href="/login/?redirect=/discuss/" class="btn btn-primary btn-sm" style="text-decoration:none;display:inline-block;line-height:1.4;">前往登录</a>';
          loginPrompt.style.display = 'block';
        }
      }

      async function doLogout() {
        try { await sb.auth.signOut(); } catch(e) { KJ.toast('退出登录失败，请重试'); return; }
        currentUser = null;
        updateAuthUI(null);
        resetInteractionState();
        KJ.toast('已退出登录');
        loadPosts();
      }

      // 登出 / 会话失效时清理关注与过滤状态
      function resetInteractionState() {
        myFollows = new Set();
        onlyFollowing = false;
        currentPage = 1;
        if (followFilterChip) followFilterChip.classList.remove('active');
      }

      // ====================== 文章列表（搜索 / 只看关注 / 分页 / 关注） ======================
      var _postsLoading = false;
      var PAGE_SIZE = 20;
      var searchQuery = '';        // 清洗后的搜索词
      var currentPage = 1;         // 当前页码（1 起）
      var onlyFollowing = false;   // 只看关注过滤
      var sortBy = 'latest';       // 排序：latest 最新 / hot 热榜
      var myFollows = new Set();   // 我关注过的用户 id
      var _totalPages = 0;
      var _searchTimer = null;

      // 搜索词清洗：去除会破坏 PostgREST or 语法的字符
      function sanitizeSearchQuery(raw) {
        return String(raw || '').replace(/[,()%`]/g, ' ').trim();
      }

      // 登录后批量拉取我的关注关系（卡片关注按钮与"只看关注"过滤依赖）
      async function loadMyInteractions() {
        myFollows = new Set();
        var uid = currentUser && currentUser.id;
        if (!uid || !sb) return;
        try {
          var results = await Promise.all([
            sb.from('user_follows').select('followed_id').eq('follower_id', uid)
          ]);
          if (results[0] && results[0].data) {
            results[0].data.forEach(function(r) { if (r.followed_id) myFollows.add(r.followed_id); });
          }
        } catch(e) {
          console.warn('Load interactions error:', e);
        }
      }

      // 搜索与关注过滤共用同一查询构建（count 与数据查询分别实例化，不可复用同一 builder）
      function buildPostsQuery(opts) {
        var q = sb.from('posts').select('*', opts || undefined);
        if (searchQuery) {
          q = q.or('title.ilike.%' + searchQuery + ',content.ilike.%' + searchQuery);
        }
        if (onlyFollowing) {
          q = q.in('user_id', Array.from(myFollows));
        }
        return q;
      }

      // 文章骨架屏：数据加载阶段占位（loader 遮罩负责 SDK/会话阶段，移除后由骨架接替）
      function renderPostsSkeleton() {
        var list = document.getElementById('postList');
        var empty = document.getElementById('postEmpty');
        if (empty) empty.style.display = 'none';
        var widths = ['62%', '48%', '70%', '55%', '40%'];
        var html = '';
        for (var i = 0; i < 5; i++) {
          html += '<div class="sk-card mica" aria-hidden="true">' +
            '<div class="sk-line sk-circle"></div>' +
            '<div class="sk-main">' +
              '<div class="sk-line sk-title" style="width:' + widths[i] + '"></div>' +
              '<div class="sk-line sk-meta"></div>' +
            '</div>' +
          '</div>';
        }
        list.insertAdjacentHTML('beforeend', html);
      }
      function removePostsSkeleton() {
        document.querySelectorAll('#postList .sk-card').forEach(function(el) { el.remove(); });
      }
      async function loadPosts() {
        // 防重入：已有加载任务进行中则跳过
        if (_postsLoading) return;
        _postsLoading = true;

        const list = document.getElementById('postList');
        const empty = document.getElementById('postEmpty');

        // SDK/会话阶段结束：关闭全屏 loader，由骨架屏接替数据加载阶段
        renderPostsSkeleton();
        updatePaginationState();
        _closeLoader();
        if (_forceTimer) { clearTimeout(_forceTimer); _forceTimer = null; }

        try {
          if (!sb) {
            if (empty) { empty.textContent = '文章服务暂不可用'; empty.style.display = ''; }
            renderPagination(0);
            return;
          }

          // 只看关注：未关注任何人时直接空态，避免 in() 空列表请求
          if (onlyFollowing && myFollows.size === 0) {
            list.innerHTML = '';
            if (empty) {
              empty.innerHTML = '<i class="fas fa-user-check"></i> 你还没有关注任何用户';
              empty.style.display = '';
            }
            renderPagination(0);
            return;
          }

          var data = [];
          var totalCount = 0;
          // 页码越界（如末页文章被删空）时修正页码后自动重查一次
          for (var attempt = 0; attempt < 2; attempt++) {
            var res = await Promise.all([
              buildPostsQuery({ count: 'exact', head: true }),
              buildPostsQuery()
                .order(sortBy === 'hot' ? 'likes_count' : 'created_at', { ascending: false })
                .range((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE - 1)
            ]);
            if (res[0].error) throw res[0].error;
            if (res[1].error) throw res[1].error;
            totalCount = res[0].count || 0;
            data = res[1].data || [];
            var totalPages = Math.ceil(totalCount / PAGE_SIZE);
            if (data.length === 0 && totalCount > 0 && currentPage > totalPages) {
              currentPage = Math.max(1, totalPages);
              continue;
            }
            break;
          }

          if (data.length === 0) {
            list.innerHTML = '';
            if (empty) {
              empty.innerHTML = '<i class="fas fa-inbox"></i> ' + (searchQuery ? '未找到相关文章' : '暂无文章');
              empty.style.display = '';
            }
            renderPagination(totalCount);
            return;
          }

          if (empty) empty.style.display = 'none';
          list.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px">共 ' + totalCount + ' 篇文章</div>' + data.map((p, i) => {
            const isOwner = currentUser && currentUser.id === p.user_id;
            const actions = isOwner
              ? '<span style="display:flex;gap:6px;flex-shrink:0">' +
                '<a href="/discuss/edit/?id=' + p.id + '" class="del-btn edit-post-btn" title="编辑" style="text-decoration:none;display:flex;align-items:center;justify-content:center"><i class="fas fa-pen-to-square"></i></a>' +
                '<button class="del-btn del-post-btn" data-id="' + p.id + '" title="删除"><i class="fas fa-trash"></i></button>' +
                '</span>'
              : '';
            const likesCount = p.likes_count || 0;
            const showFollow = currentUser && !isOwner && p.user_id;
            const following = showFollow && myFollows.has(p.user_id);

            return '<div class="post-card mica">' +
              '<div class="post-main">' +
                '<a href="/discuss/view/?id=' + p.id + '" class="post-title" style="text-decoration:none;color:var(--text-primary)">' + KJ.escapeHtml(p.title || '无标题') + '</a>' +
                (p.visibility === 'private' ? ' <span class="vis-badge"><i class="fas fa-lock"></i> 私有</span>' : '') +
              '</div>' +
              actions +
              '<div class="post-footer">' +
                '<span class="author"><i class="fas fa-user"></i> ' + KJ.escapeHtml(p.nick || '匿名') + '</span>' +
                (showFollow
                  ? '<button class="follow-btn' + (following ? ' following' : '') + '" data-author="' + p.user_id + '">' + (following ? '已关注' : '＋ 关注') + '</button>'
                  : '') +
                '<span>' + formatDate(p.created_at) + '</span>' +
                '<span class="footer-spacer"></span>' +
                '<span class="like-btn like-static" title="点赞数（进入文章详情可点赞）">' +
                  '<i class="fas fa-heart" style="color:var(--color-danger)"></i>' +
                  '<span class="like-count">' + likesCount + '</span>' +
                '</span>' +
              '</div>' +
            '</div>';
          }).join('');

          renderPagination(totalCount);

          // 绑定删除
          list.querySelectorAll('.del-post-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
              if (!KJ.rateLimit('discuss_delete', 3000, 1, '删除过于频繁，请稍后再试')) return;
              if (!confirm('确定删除此文章？')) return;
              if (!sb) { KJ.toast('服务暂不可用'); return; }
              try {
                var uid = currentUser?.id;
                if (!uid) { KJ.toast('请先登录'); return; }
                const { error } = await sb.from('posts').delete().eq('id', this.dataset.id).eq('user_id', uid);
                if (error) { KJ.toast('删除失败: ' + error.message); return; }
                KJ.toast('已删除'); loadPosts();
              } catch(e) { KJ.toast('删除失败，请重试'); }
            });
          });

          // 绑定关注（点赞已移至详情页）
          bindFollowButtons(list);

        } catch(e) {
          console.warn('Load posts error:', e);
          empty.textContent = '加载文章失败，请刷新页面重试';
          empty.style.display = '';
        } finally {
          // 所有路径（含空列表提前 return）都必须移除骨架、复位防重入锁并关闭遮罩
          removePostsSkeleton();
          var l = document.getElementById('loader');
          if (l) { l.style.opacity = '0'; setTimeout(function(){ l.remove(); }, 300); }
          if (_forceTimer) { clearTimeout(_forceTimer); _forceTimer = null; }
          _postsLoading = false;
          updatePaginationState();
        }
      }

      // ====================== 分页控件（洛谷风格数字页码） ======================
      // 事件委托：页码/前后翻页统一处理
      function bindPagination() {
        var pag = document.getElementById('pagination');
        if (!pag || pag._pagBound) return;
        pag._pagBound = true;
        pag.addEventListener('click', function(e) {
          var btn = e.target.closest('.page-btn');
          if (!btn || btn.disabled || btn.classList.contains('active')) return;
          var p = parseInt(btn.dataset.page, 10);
          if (!p || p < 1 || p > Math.max(_totalPages, 1) || _postsLoading) return;
          if (p === currentPage) return;
          currentPage = p;
          loadPosts();
        });
      }

      // 生成页码序列：总页数 ≤7 全显；否则 1 … c-1 c c+1 … 末页
      function pageSequence(total, current) {
        var seq = [];
        if (total <= 7) {
          for (var i = 1; i <= total; i++) seq.push(i);
          return seq;
        }
        seq.push(1);
        var lo = Math.max(2, current - 1);
        var hi = Math.min(total - 1, current + 1);
        if (lo > 2) seq.push('...');
        for (var j = lo; j <= hi; j++) seq.push(j);
        if (hi < total - 1) seq.push('...');
        seq.push(total);
        return seq;
      }

      function renderPagination(totalCount) {
        _totalPages = totalCount > 0 ? Math.ceil(totalCount / PAGE_SIZE) : 0;
        var pag = document.getElementById('pagination');
        if (!pag) return;
        pag.style.display = '';
        var html = '<button class="page-btn nav-btn" data-page="' + (currentPage - 1) + '" id="prevPageBtn" aria-label="上一页"><i class="fas fa-chevron-left"></i></button>';
        var seq = _totalPages > 0 ? pageSequence(_totalPages, currentPage) : [];
        for (var i = 0; i < seq.length; i++) {
          var it = seq[i];
          html += it === '...'
            ? '<span class="page-ellipsis">…</span>'
            : '<button class="page-btn' + (it === currentPage ? ' active' : '') + '" data-page="' + it + '">' + it + '</button>';
        }
        html += '<button class="page-btn nav-btn" data-page="' + (currentPage + 1) + '" id="nextPageBtn" aria-label="下一页"><i class="fas fa-chevron-right"></i></button>';
        html += '<span class="page-total">共 ' + _totalPages + ' 页</span>';
        pag.innerHTML = html;
        bindPagination();
        updatePaginationState();
      }

      function updatePaginationState() {
        var pag = document.getElementById('pagination');
        if (!pag || pag.style.display === 'none') return;
        var prev = document.getElementById('prevPageBtn');
        var next = document.getElementById('nextPageBtn');
        // count=0 时隐藏翻页
        if (_totalPages === 0) {
          if (prev) prev.style.display = 'none';
          if (next) next.style.display = 'none';
          return;
        }
        if (prev) { prev.style.display = ''; prev.disabled = _postsLoading || currentPage <= 1; }
        if (next) { next.style.display = ''; next.disabled = _postsLoading || currentPage >= _totalPages; }
      }

      // ====================== 关注用户 ======================
      function updateFollowUI(authorId, following) {
        document.querySelectorAll('.follow-btn[data-author="' + authorId + '"]').forEach(function(btn) {
          btn.classList.toggle('following', following);
          btn.textContent = following ? '已关注' : '＋ 关注';
        });
      }

      function bindFollowButtons(scope) {
        scope.querySelectorAll('.follow-btn').forEach(function(btn) {
          btn.addEventListener('click', async function() {
            if (!sb) { KJ.toast('服务暂不可用'); return; }
            var uid = currentUser && currentUser.id;
            if (!uid) { KJ.toast('请先登录'); return; }
            if (!KJ.rateLimit('discuss_follow', 800, 1, '操作过于频繁，请稍后再试')) return;
            var authorId = this.dataset.author;
            var following = myFollows.has(authorId);
            // 乐观更新（同作者的按钮同步刷新）
            if (following) myFollows.delete(authorId); else myFollows.add(authorId);
            updateFollowUI(authorId, !following);
            try {
              var res = following
                ? await sb.from('user_follows').delete().eq('follower_id', uid).eq('followed_id', authorId)
                : await sb.from('user_follows').insert({ follower_id: uid, followed_id: authorId });
              if (res.error) throw res.error;
            } catch(e) {
              if (following) myFollows.add(authorId); else myFollows.delete(authorId);
              updateFollowUI(authorId, following);
              KJ.toast('操作失败');
            }
          });
        });
      }

      // ====================== 搜索 / 只看关注 ======================
      var searchInput = document.getElementById('searchInput');
      var followFilterChip = document.getElementById('followFilterChip');

      function triggerSearch() {
        var q = sanitizeSearchQuery(searchInput.value);
        if (q === searchQuery) return;
        searchQuery = q;
        currentPage = 1;
        loadPosts();
      }

      if (searchInput) {
        searchInput.addEventListener('input', function() {
          if (_searchTimer) clearTimeout(_searchTimer);
          _searchTimer = setTimeout(triggerSearch, 300);
        });
        searchInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (_searchTimer) { clearTimeout(_searchTimer); _searchTimer = null; }
            triggerSearch();
          }
        });
      }

      if (followFilterChip) {
        followFilterChip.addEventListener('click', function() {
          var uid = currentUser && currentUser.id;
          if (!uid) { KJ.toast('请先登录'); return; }
          onlyFollowing = !onlyFollowing;
          followFilterChip.classList.toggle('active', onlyFollowing);
          currentPage = 1;
          loadPosts();
        });
      }

      // 最新 / 热榜 排序页签
      var sortTabs = document.getElementById('sortTabs');
      if (sortTabs) {
        sortTabs.querySelectorAll('.sort-tab').forEach(function(tab) {
          tab.addEventListener('click', function() {
            if (tab.dataset.sort === sortBy) return;
            sortBy = tab.dataset.sort;
            sortTabs.querySelectorAll('.sort-tab').forEach(function(x) { x.classList.toggle('active', x === tab); });
            currentPage = 1;
            loadPosts();
          });
        });
      }

      // ====================== 认证监听 ======================
      if (sb) {
        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            if (session?.user) {
              updateAuthUI(session.user);
              // 不在此处 loadPosts()，由 getSession().then() 统一加载，避免重复
            }
          } else if (event === 'SIGNED_OUT') {
            updateAuthUI(null);
            resetInteractionState();
            loadPosts();
          } else if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
            if (session?.user) currentUser = session.user;
          }
        });

        // 同步读 localStorage 立即显示登录态，避免闪烁
        function getStoredUser() {
          try {
            var now = Date.now();
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('sb-') === 0 && key.indexOf('auth-token') !== -1) {
                var val = JSON.parse(localStorage.getItem(key));
                if (val && val.user && val.expires_at) {
                  if (val.expires_at * 1000 > now) return val.user;
                  try { localStorage.removeItem(key); } catch(e) {}
                }
              }
            }
          } catch(e) {}
          return null;
        }
        var storedUser = getStoredUser();
        if (storedUser) updateAuthUI(storedUser);

        sb.auth.getSession().then(async ({ data: { session } }) => {
          if (session?.user) {
            updateAuthUI(session.user);
          } else {
            updateAuthUI(null);
          }
          // 登录后先拉取关注关系（列表卡片关注按钮与"只看关注"过滤依赖 myFollows）
          await loadMyInteractions();
          loadPosts();
        }).catch(function() {
          updateAuthUI(null);
          loadPosts();
        });
      } else {
        updateAuthUI(null);
        loadPosts();
      }
    })();
  </script>  <div id="toast" class="toast hidden"></div>
</body>
