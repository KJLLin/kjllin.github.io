<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 讨论版 | 使用 Markdown 自由交流">
  <title>讨论版 · KJLLin</title>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">

  <style>
    /* ====================== Win11 全局规范 ====================== */
    html {
      --win-ease: var(--spring-default);
      --bounce: var(--spring-bounce);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    :focus:not(:focus-visible) { outline: none; }
    pre, code, .mono, .CodeMirror, .editor-toolbar button {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    :root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255, 255, 255, 0.85);
      --bg-mica-scroll: rgba(255, 255, 255, 0.92);
      --bg-mica-hover: rgba(255, 255, 255, 0.9);
      --border-mica: rgba(0, 0, 0, 0.06);
      --border-mica-hover: rgba(0, 120, 212, 0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.1);
      --accent-glow-weak: rgba(0, 120, 212, 0.05);
      --danger: #e81123;
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.09);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.08);
      --scroll-bar: #c4c4c4;
    }
    [data-theme="dark"]:root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20,20,20,0.85);
      --bg-mica-scroll: rgba(20,20,20,0.92);
      --bg-mica-hover: rgba(26,26,26,0.9);
      --border-mica: rgba(255,255,255,0.07);
      --border-mica-hover: rgba(0,120,212,0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0,120,212,0.15);
      --accent-glow-weak: rgba(0,120,212,0.07);
      --danger: #ff6b6b;
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.25);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.3);
      --scroll-bar: #4a4a4a;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: clip; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    /* ====================== 粒子背景 ====================== */
    #particlesCanvas {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }

    /* ====================== 加载遮罩 ====================== */
    #loader {
      position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.5s var(--win-ease);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-tertiary); animation: fadePulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ====================== 云母组件 ====================== */
    .mica {
      background: var(--bg-mica);
      background-image: var(--iridescent);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      box-shadow: var(--glass-shadow);
    }

    /* ====================== 布局 ====================== */
    .container { max-width: 860px; margin: 0 auto; padding: 80px 16px calc(40px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }

    /* ====================== 页面标题 ====================== */
    .page-title {
      text-align: center; margin-bottom: 36px; animation: fadeUp 0.6s var(--win-ease) forwards;
    }
    .page-title h1 {
      font-size: 28px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px;
    }
    .page-title p {
      font-size: 14px; color: var(--text-tertiary);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* ====================== 认证区域 ====================== */
    .auth-area {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
      padding: 12px 20px; border-radius: var(--radius-lg);
    }
    .auth-area .user-info {
      display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary);
    }
    .auth-area .user-info .nick { font-weight: 600; color: var(--accent); }
    .auth-btns { display: flex; gap: 8px; align-items: center; }
    .login-prompt {
      text-align: center; padding: 48px 20px; border-radius: var(--radius-lg);
      margin-bottom: 24px;
      animation: fadeUp 0.5s var(--win-ease) 0.1s both;
    }
    .login-prompt .icon { font-size: 48px; margin-bottom: 12px; }
    .login-prompt .text { font-size: 16px; color: var(--text-secondary); margin-bottom: 16px; }
    .login-prompt .hint { font-size: 13px; color: var(--text-tertiary); }

    .btn {
      font-size: 13px; padding: 8px 20px; border-radius: var(--radius-sm);
      border: none; cursor: pointer; font-family: inherit; font-weight: 500;
      transition: all var(--transition-fast);
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-primary:active { transform: scale(0.96); }
    .btn-secondary {
      background: var(--bg-mica); color: var(--text-secondary);
      border: 1px solid var(--border-mica);
    }
    .btn-secondary:hover { border-color: var(--border-mica-hover); color: var(--accent); }
    .btn-danger {
      background: transparent; color: var(--danger); font-size: 12px;
      padding: 4px 10px; border: 1px solid transparent;
    }
    .btn-danger:hover { border-color: var(--danger); background: rgba(232,17,35,0.06); }
    .btn-sm { font-size: 12px; padding: 6px 14px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ====================== 帖子列表 ====================== */
    .post-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      padding: 24px; border-radius: var(--radius-lg);
      position: relative;
      animation: fadeUp 0.4s var(--win-ease) both;
      transition: box-shadow var(--transition-normal), transform var(--transition-normal);
    }
    .post-card:hover {
      transform: translateY(-2px);
    }
    .post-card .post-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 8px; margin-bottom: 6px;
    }
    .post-card .post-title {
      font-size: 19px; font-weight: 600; color: var(--text-primary); flex: 1;
      word-break: break-word;
    }
    .post-card .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .post-card .post-meta {
      font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .post-card .post-meta .author { font-weight: 600; color: var(--accent); }
    .post-card .post-content {
      font-size: 14px; color: var(--text-secondary); line-height: 1.75;
      word-break: break-word;
    }
    .post-card .post-content h1,
    .post-card .post-content h2,
    .post-card .post-content h3,
    .post-card .post-content h4 { margin: 16px 0 8px; color: var(--text-primary); }
    .post-card .post-content h1 { font-size: 1.35em; }
    .post-card .post-content h2 { font-size: 1.2em; }
    .post-card .post-content h3 { font-size: 1.1em; }
    .post-card .post-content p { margin: 8px 0; }
    .post-card .post-content code {
      background: var(--accent-glow); padding: 2px 6px; border-radius: 4px;
      font-family: "Consolas","Cascadia Code","SF Mono",monospace; font-size: 0.9em;
    }
    .post-card .post-content pre {
      background: var(--code-bg, #1a1a2e); padding: 18px; border-radius: var(--radius-sm);
      overflow-x: auto; font-size: 13px; line-height: 1.6;
      color: var(--code-color, #cdd6f4); border: 1px solid var(--border-mica);
    }
    [data-theme="dark"] .post-card .post-content pre {
      --code-bg: #0d1117; --code-color: #c9d1d9;
    }
    .post-card .post-content pre code { background: none; padding: 0; color: inherit; }
    /* 代码块包装器 + 复制按钮 */
    .code-block-wrapper { position: relative; margin: 10px 0; }
    .code-block-wrapper pre { margin: 0; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(30,30,46,0.8); color: rgba(255,255,255,0.5);
      font-size: 14px; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; transition: opacity var(--transition-fast), color var(--transition-fast);
      z-index: 2;
    }
    [data-theme="dark"] .copy-btn {
      background: rgba(13,17,23,0.85);
    }
    .copy-btn:hover {
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.2);
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn.copied { color: var(--color-success); border-color: var(--color-success-bg); }
    .post-card .post-content ul,
    .post-card .post-content ol { padding-left: 20px; margin: 6px 0; }
    .post-card .post-content a { color: var(--accent); }
    .post-card .post-content blockquote {
      border-left: 3px solid var(--accent); padding-left: 12px;
      margin: 8px 0; color: var(--text-tertiary);
    }
    .post-card .post-content img { max-width: 100%; border-radius: var(--radius-sm); margin: 8px 0; }
    .post-card .post-content table {
      border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px;
    }
    .post-card .post-content th,
    .post-card .post-content td {
      border: 1px solid var(--border-mica); padding: 8px 12px; text-align: left;
    }
    .post-card .post-content th { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
    .post-empty {
      text-align: center; padding: 48px 20px; color: var(--text-tertiary);
      font-size: 15px; animation: fadeUp 0.5s var(--win-ease) 0.1s both;
    }

    /* ====================== Toast 提示 ====================== */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      padding: 10px 24px; border-radius: var(--radius-sm);
      background: var(--bg-mica-scroll); background-image: var(--iridescent); color: var(--text-primary);
      font-size: 14px; z-index: 9998;
      box-shadow: var(--shadow-lg);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      animation: toastIn 0.3s var(--bounce);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ====================== 返回顶部 ====================== */
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover { transform: translateY(-2px); }

    /* ====================== 页脚 ====================== */
    .footer { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); margin-top: 40px; }

    /* ====================== 滚动条 ====================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ====================== 响应式 ====================== */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
      .page-title h1 { font-size: 24px; }
      .post-card { padding: 18px; }
      .auth-area { padding: 12px 16px; flex-direction: column; align-items: flex-start; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .post-card .post-header { flex-direction: column; }
      .post-card .post-actions { align-self: flex-end; }
    }

    * { -webkit-user-select: none; user-select: none; }
    input, textarea, .CodeMirror { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <canvas id="particlesCanvas"></canvas>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <div id="loader">
    <div class="loader-content">
      <div class="loader-spin"></div>
      <div class="loader-text" id="loaderText">正在加载...</div>
      <div id="loaderError" style="display:none;margin-top:12px;font-size:12px;color:#e74c3c;max-width:300px;text-align:center;word-break:break-all"></div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    var _t1=setTimeout(function(){document.getElementById('loaderText').textContent='正在加载... (网络较慢)';},5000);
    var _t2=setTimeout(function(){document.getElementById('loaderText').textContent='加载时间较长，请检查网络连接';},10000);
    var _t3=setTimeout(function(){
      var l=document.getElementById('loader');
      if(l){l.style.opacity='0';setTimeout(function(){l.remove()},300);}
    },15000);
    function showError(msg){
      var el=document.getElementById('loaderError');
      if(el){el.style.display='';el.textContent=el.textContent+' | '+msg;}
      var lt=document.getElementById('loaderText');
      if(lt)lt.innerHTML='<i class="fas fa-triangle-exclamation"></i> 加载出错 - 查看下方详情';
    }
    window.onerror=function(msg,url,line){showError('JS错误('+line+'): '+msg);};
  </script>

  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/settings/" class="menu-item"><i class="fas fa-gear"></i> 设置</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/settings/" class="menu-item"><i class="fas fa-gear"></i> 设置</a>
    </div>
  </header>

  <div class="container">
    <!-- ==================== 页面标题 ==================== -->
    <section class="page-title">
      <h1><i class="fas fa-comments"></i> 讨论版</h1>
      <p>使用 Markdown 格式自由交流，分享想法与问题</p>
    </section>

    <!-- ==================== 认证区域 ==================== -->
    <div class="auth-area mica" id="authArea">
      <div class="user-info" id="userInfo">
        <span style="color:var(--text-tertiary);font-size:14px;">未登录</span>
      </div>
      <div class="auth-btns" id="authBtns"></div>
    </div>

    <!-- ==================== 登录提示（未登录时显示） ==================== -->
    <div class="login-prompt mica" id="loginPrompt">
      <div class="icon"><i class="fas fa-lock"></i></div>
      <div class="text">请登录后参与讨论</div>
      <div class="hint"><a href="/login/?redirect=/discuss/" style="color:var(--accent);text-decoration:none;font-weight:600">→ 前往登录</a></div>
    </div>

    <!-- ==================== 帖子列表 ==================== -->
    <div class="post-list" id="postList">
      <div class="post-empty" id="postEmpty" style="display:none"><i class="fas fa-inbox"></i> 暂无讨论</div>
    </div>

    <footer class="footer">© 2026 KJLLin · All Rights Reserved</footer>
  </div>

  <button id="backTop" class="mica" aria-label="返回顶部">↑</button>

  <script>
    // ====================== 工具函数 ======================
    const $ = s => document.querySelector(s);
    const root = document.documentElement;

    const themeBtn = $('#themeBtn');
    const backTop = $('#backTop');
    const menuBar = $('#menuBar');
    let isScrolling = false;
    let touchStartData = {};

    // ====================== 粒子背景 ======================
    (function() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const count = 50;
      let animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticles() {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 0.5,
            o: Math.random() * 0.5 + 0.1
          });
        }
      }
      createParticles();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isDark = root.dataset.theme === 'dark';
        const color = isDark ? '255,255,255' : '0,120,212';
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color},${p.o})`;
          ctx.fill();
        }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(${color},${0.04 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        animId = requestAnimationFrame(draw);
      }
      draw();
    })();

    // ====================== 触摸点击判定 ======================
    function handleTouchStart(e) {
      touchStartData = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
    function handleTouchEnd(e, callback) {
      const t = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, time: Date.now() };
      const dx = Math.abs(t.x - touchStartData.x);
      const dy = Math.abs(t.y - touchStartData.y);
      const dt = t.time - touchStartData.time;
      if (dx < 10 && dy < 10 && dt < 300) { e.preventDefault(); e.stopPropagation(); callback(); }
    }

    // ====================== 主题（三模式：浅色/深色/跟随系统） ======================
    function updateThemeUI() {
      var state = KJ.applyTheme('#f5f5f7', '#000');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
    }
    themeBtn.addEventListener('click', function() {
      KJ.toggleTheme();
      updateThemeUI();
    });
    KJ.onSystemThemeChange(updateThemeUI);
    updateThemeUI();

    // ====================== 滚动 ======================
    function handleScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        backTop.classList.toggle('show', window.scrollY > 300);
        menuBar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    }
    function goToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    // ====================== 移动端菜单 ======================
    KJ.setupMobileMenu('#hamburgerBtn', '#mobileMenu');
  KJ.initNav(null, { homeUrl: '/' });

    backTop.addEventListener('click', goToTop);
    backTop.addEventListener('touchstart', handleTouchStart);
    backTop.addEventListener('touchend', e => handleTouchEnd(e, goToTop));
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('beforeunload', () => {
      window.removeEventListener('scroll', handleScroll);
    });

    // ====================== 讨论版核心逻辑 ======================
    (function() {
      var _closeLoader = function(){
        var l = document.getElementById('loader');
        if(l){l.style.opacity='0';setTimeout(function(){l.remove();},300);}
      };
      var _forceTimer = setTimeout(_closeLoader, 15000);

      let currentUser;
      var sb = KJ.createSupabase();
      KJ.initMessageBanner(sb);

      function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const now = new Date();
        const diff = now - d;
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
        if (diff < 172800000) return '昨天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' }) +
          ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }

      // ====================== 认证 UI ======================
      function updateAuthUI(user) {
        currentUser = user;
        const authBtns = document.getElementById('authBtns');
        const userInfo = document.getElementById('userInfo');
        const loginPrompt = document.getElementById('loginPrompt');

        if (user) {
          const nick = user.user_metadata?.nick || user.email?.split('@')[0] || '用户';
          userInfo.innerHTML = '<span class="nick"><i class="fas fa-user"></i> ' + KJ.escapeHtml(nick) + '</span><span style="font-size:12px;color:var(--text-tertiary)">已登录</span>';
          authBtns.innerHTML =
            '<a href="/discuss/new/" class="btn btn-primary btn-sm" style="text-decoration:none;display:inline-block;line-height:1.4"><i class="fas fa-pen-to-square"></i> 发帖</a>' +
            '<button class="btn btn-secondary btn-sm" id="logoutBtn">退出登录</button>';
          loginPrompt.style.display = 'none';
          document.getElementById('logoutBtn').addEventListener('click', doLogout);
        } else {
          userInfo.innerHTML = '<span style="color:var(--text-tertiary);font-size:14px;">未登录</span>';
          authBtns.innerHTML =
            '<a href="/login/?redirect=/discuss/" class="btn btn-primary btn-sm" style="text-decoration:none;display:inline-block;line-height:1.4;">前往登录</a>';
          loginPrompt.style.display = 'block';
        }
      }

      async function doLogout() {
        try { await sb.auth.signOut(); } catch(e) { KJ.toast('退出登录失败，请重试'); return; }
        currentUser = null;
        updateAuthUI(null);
        KJ.toast('已退出登录');
        loadPosts();
      }

      // ====================== 帖子列表 ======================
      var _postsLoading = false;
      async function loadPosts() {
        // 防重入：已有加载任务进行中则跳过
        if (_postsLoading) return;
        _postsLoading = true;

        const list = document.getElementById('postList');
        const empty = document.getElementById('postEmpty');

        if (!sb) {
          empty.textContent = '讨论服务暂不可用';
          empty.style.display = '';
          _postsLoading = false; return;
        }

        try {
          const { data, error } = await sb
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

          if (error) throw error;

          if (!data || data.length === 0) {
            list.innerHTML = '';
            list.appendChild(empty);
            empty.style.display = '';
            return;
          }

          empty.style.display = 'none';
          list.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px">共 ' + data.length + ' 篇讨论</div>' + data.map((p, i) => {
            const isOwner = currentUser && currentUser.id === p.user_id;
            const actions = isOwner
              ? '<span style="display:flex;gap:6px;flex-shrink:0">' +
                '<a href="/discuss/edit/?id=' + p.id + '" class="del-btn edit-post-btn" title="编辑" style="text-decoration:none;display:flex;align-items:center;justify-content:center"><i class="fas fa-pen-to-square"></i></a>' +
                '<button class="del-btn del-post-btn" data-id="' + p.id + '" title="删除"><i class="fas fa-trash"></i></button>' +
                '</span>'
              : '';

            return '<div class="post-card mica">' +
              '<div class="post-main">' +
                '<a href="/discuss/view/?id=' + p.id + '" class="post-title" style="text-decoration:none;color:var(--text-primary)">' + KJ.escapeHtml(p.title || '无标题') + '</a>' +
                '<div class="post-meta">' +
                  '<span class="author"><i class="fas fa-user"></i> ' + KJ.escapeHtml(p.nick || '匿名') + '</span>' +
                  '<span>' + formatDate(p.created_at) + '</span>' +
                '</div>' +
              '</div>' +
              actions +
              '</div>';
          }).join('');

          // 绑定删除
          list.querySelectorAll('.del-post-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
              if (!KJ.rateLimit('discuss_delete', 3000, 1, '删除过于频繁，请稍后再试')) return;
              if (!confirm('确定删除此讨论？')) return;
              if (!sb) { KJ.toast('服务暂不可用'); return; }
              try {
                var uid = currentUser?.id;
                if (!uid) { KJ.toast('请先登录'); return; }
                const { error } = await sb.from('posts').delete().eq('id', this.dataset.id).eq('user_id', uid);
                if (error) { KJ.toast('删除失败: ' + error.message); return; }
                KJ.toast('已删除'); loadPosts();
              } catch(e) { KJ.toast('删除失败，请重试'); }
            });
          });

        } catch(e) {
          console.warn('Load posts error:', e);
          empty.textContent = '加载讨论失败，请刷新页面重试';
          empty.style.display = '';
        }
        var l = document.getElementById('loader');
        if (l) { l.style.opacity = '0'; setTimeout(function(){ l.remove(); }, 300); }
        if (_forceTimer) { clearTimeout(_forceTimer); _forceTimer = null; }
        _postsLoading = false;
      }

      // ====================== 认证监听 ======================
      if (sb) {
        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            if (session?.user) {
              updateAuthUI(session.user);
              // 不在此处 loadPosts()，由 getSession().then() 统一加载，避免重复
            }
          } else if (event === 'SIGNED_OUT') {
            updateAuthUI(null);
            loadPosts();
          } else if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
            if (session?.user) currentUser = session.user;
          }
        });

        // 同步读 localStorage 立即显示登录态，避免闪烁
        function getStoredUser() {
          try {
            var now = Date.now();
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('sb-') === 0 && key.indexOf('auth-token') !== -1) {
                var val = JSON.parse(localStorage.getItem(key));
                if (val && val.user && val.expires_at) {
                  if (val.expires_at * 1000 > now) return val.user;
                  try { localStorage.removeItem(key); } catch(e) {}
                }
              }
            }
          } catch(e) {}
          return null;
        }
        var storedUser = getStoredUser();
        if (storedUser) updateAuthUI(storedUser);

        sb.auth.getSession().then(({ data: { session } }) => {
          if (session?.user) {
            updateAuthUI(session.user);
          } else {
            updateAuthUI(null);
          }
          loadPosts();
        }).catch(function() {
          updateAuthUI(null);
          loadPosts();
        });
      } else {
        updateAuthUI(null);
        loadPosts();
      }
      var l = document.getElementById('loader');
      if (l) { l.style.opacity = '0'; setTimeout(function(){ l.remove(); }, 300); }
      if (_forceTimer) clearTimeout(_forceTimer);
    })();
  </script>  <div id="toast" class="toast hidden"></div>
</body>
</html>
