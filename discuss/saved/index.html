<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="我收藏的文章 · KJLLin">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <title>我的收藏 · KJLLin</title>

  <style>
    :root {
      --accent: var(--color-accent);
      --accent-glow: var(--color-accent-glow);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border-glass);
      --radius-md: 12px;
      --radius-lg: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 92px 20px 72px; }

    .page-head { margin-bottom: 22px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-tertiary); text-decoration: none;
      margin-bottom: 12px; padding: 4px 10px 4px 0; border-radius: 8px;
      transition: color .18s ease;
    }
    .back-link:hover { color: var(--accent); }
    .page-title {
      font-size: 27px; font-weight: 700; letter-spacing: -.02em;
      display: flex; align-items: center; gap: 10px;
    }
    .page-title i { color: #ff9f0a; font-size: 21px; }
    .page-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 7px; }

    .list { display: flex; flex-direction: column; gap: 12px; }

    .bm-card {
      position: relative;
      padding: 16px 18px; border-radius: var(--radius-lg);
      background: var(--bg-mica);
      border: 1px solid var(--border-mica);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, background .18s ease;
      animation: fadeUp .4s cubic-bezier(.2,.8,.2,1) both;
    }
    .bm-card:hover { transform: translateY(-2px); border-color: var(--color-border-hover); background: var(--bg-mica-hover); }
    .bm-title {
      display: block; font-size: 16px; font-weight: 600; line-height: 1.45;
      color: var(--text-primary); text-decoration: none; padding-right: 40px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .bm-title:hover { color: var(--accent); }
    .bm-excerpt {
      font-size: 13px; line-height: 1.65; color: var(--text-secondary);
      margin-top: 6px;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .bm-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; font-size: 12px; color: var(--text-tertiary);
    }
    .bm-meta .author { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-weight: 500; }
    .bm-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; }
    .bm-meta .lock { font-size: 11px; }

    .bm-remove {
      position: absolute; top: 14px; right: 14px;
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border-mica); background: transparent;
      color: var(--text-tertiary); cursor: pointer; font-size: 12px;
      display: grid; place-items: center;
      transition: background .16s ease, color .16s ease, border-color .16s ease, transform .12s ease;
    }
    .bm-remove:hover { color: #ff453a; border-color: rgba(255,69,58,.4); background: rgba(255,69,58,.1); }
    .bm-remove:active { transform: scale(.9); }

    .state {
      text-align: center; padding: 64px 20px; border-radius: var(--radius-lg);
      background: var(--bg-mica); border: 1px solid var(--border-mica);
    }
    .state i { font-size: 42px; color: var(--text-tertiary); margin-bottom: 14px; display: block; opacity: .6; }
    .state h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .state p { font-size: 13px; color: var(--text-tertiary); line-height: 1.7; margin-bottom: 18px; }
    .state .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 20px; border-radius: 999px; text-decoration: none;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    }

    .more {
      display: block; width: 100%; margin-top: 18px; padding: 12px;
      border-radius: 12px; border: 1px solid var(--border-mica);
      background: transparent; color: var(--text-secondary);
      font-family: inherit; font-size: 13px; cursor: pointer;
      transition: background .16s ease, color .16s ease;
    }
    .more:hover { background: var(--bg-mica-hover); color: var(--accent); }
    .more:disabled { opacity: .6; cursor: default; }

    .skel { height: 92px; border-radius: var(--radius-lg); background: var(--bg-mica);
      border: 1px solid var(--border-mica); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }

    @media (max-width: 560px) {
      .container { padding: 78px 12px 60px; }
      .page-title { font-size: 23px; }
      .bm-card { padding: 14px; }
      .bm-title { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item active"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

<div class="container">
  <div class="page-head">
    <a href="/discuss/" class="back-link"><i class="fas fa-arrow-left"></i> 文章广场</a>
    <h1 class="page-title"><i class="fas fa-bookmark"></i> 我的收藏</h1>
    <p class="page-sub" id="pageSub">收藏的文章会留在这里，方便随时回看</p>
  </div>

  <div class="list" id="list"></div>
  <div id="stateBox"></div>
  <button class="more" id="moreBtn" hidden>加载更多</button>
</div>

<script src="/vendor/supabase.min.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var PAGE = 20;
  var state = { items: [], cursor: null, done: false, loading: false, user: null };
  var sb = null;

  function esc(s) { return KJ.escapeHtml(s == null ? '' : s); }

  /** 把 Markdown 摘要洗干净再展示：去掉标题井号、强调、链接、公式符号 */
  function plainExcerpt(raw, limit) {
    var s = String(raw || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/#{1,6}\s?/g, '')
      .replace(/[*_~`>|]/g, '')
      .replace(/\$\$?/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (limit && s.length > limit) s = s.slice(0, limit) + '…';
    return s;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var now = new Date();
    var diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
    return (d.getFullYear() === now.getFullYear())
      ? (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'
      : d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }

  function cardHtml(it) {
    var av = KJ.avatarHtml({ id: it.author_id, nick: it.author_nick, avatar_url: it.author_avatar }, { size: 20 });
    return '<div class="bm-card" data-post="' + esc(it.post_id) + '">' +
        '<a class="bm-title" href="/discuss/view/?id=' + encodeURIComponent(it.post_id) + '">' +
          esc(it.title) + (it.visibility === 'private' ? ' <span class="lock">🔒</span>' : '') + '</a>' +
        (plainExcerpt(it.excerpt, 120) ? '<div class="bm-excerpt">' + esc(plainExcerpt(it.excerpt, 120)) + '</div>' : '') +
        '<div class="bm-meta">' +
          '<span class="author">' + av + esc(it.author_nick || '匿名') + '</span>' +
          '<span class="dot"></span><span>' + fmtDate(it.published_at) + '</span>' +
          '<span class="dot"></span><span>收藏于 ' + fmtDate(it.bookmarked_at) + '</span>' +
        '</div>' +
        '<button class="bm-remove" data-remove="' + esc(it.post_id) + '" title="取消收藏" aria-label="取消收藏">' +
          '<i class="fas fa-xmark"></i></button>' +
      '</div>';
  }

  function render() {
    var box = $('#list');
    if (!state.items.length) {
      box.innerHTML = '';
      $('#stateBox').innerHTML =
        '<div class="state">' +
          '<i class="far fa-bookmark"></i>' +
          '<h3>还没有收藏的文章</h3>' +
          '<p>在文章详情页点「收藏」，之后就能在这里找到它</p>' +
          '<a class="btn" href="/discuss/"><i class="fas fa-book-open"></i> 去文章广场</a>' +
        '</div>';
      $('#moreBtn').hidden = true;
      return;
    }
    $('#stateBox').innerHTML = '';
    box.innerHTML = state.items.map(cardHtml).join('');
    $('#moreBtn').hidden = state.done;
    $('#moreBtn').disabled = false;
    $('#moreBtn').textContent = state.done ? '已经到底了' : '加载更多';
  }

  async function load(replace) {
    if (state.loading || (state.done && !replace)) return;
    state.loading = true;
    if (replace) {
      state.items = [];
      state.cursor = null;
      state.done = false;
      $('#list').innerHTML = Array(3).fill('<div class="skel"></div>').join('');
    } else {
      $('#moreBtn').disabled = true;
      $('#moreBtn').textContent = '加载中…';
    }

    try {
      var args = { p_limit: PAGE };
      if (!replace && state.cursor) args.p_before = state.cursor;
      var r = await sb.rpc('my_bookmarks', args);
      if (r.error) throw r.error;
      var rows = r.data || [];
      if (replace) state.items = rows; else state.items = state.items.concat(rows);
      if (rows.length < PAGE) state.done = true;
      if (rows.length) state.cursor = rows[rows.length - 1].bookmarked_at;
      render();
      $('#pageSub').textContent = '共 ' + state.items.length + (state.done ? '' : '+') + ' 篇';
    } catch (e) {
      console.warn('load bookmarks failed:', e);
      if (replace) {
        $('#list').innerHTML = '';
        $('#stateBox').innerHTML = '<div class="state"><i class="fas fa-triangle-exclamation"></i>' +
          '<h3>加载失败</h3><p>' + esc(e.message || '请稍后重试') + '</p></div>';
      }
    } finally {
      state.loading = false;
      $('#moreBtn').disabled = false;
    }
  }

  async function removeBookmark(postId, btn) {
    if (!state.user) return;
    btn.disabled = true;
    try {
      var r = await sb.from('post_bookmarks').delete()
        .eq('post_id', postId).eq('user_id', state.user.id);
      if (r.error) throw r.error;
      var card = btn.closest('.bm-card');
      if (card) {
        card.style.transition = 'opacity .2s ease, transform .2s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(.97)';
        setTimeout(function () { card.remove(); }, 180);
      }
      state.items = state.items.filter(function (x) { return x.post_id !== postId; });
      KJ.toast('已取消收藏');
      if (!state.items.length) setTimeout(function () { render(); }, 220);
    } catch (e) {
      btn.disabled = false;
      KJ.toast('取消失败，请稍后再试');
    }
  }

  async function boot() {
    sb = KJ.createSupabase();
    if (!sb) {
      $('#stateBox').innerHTML = '<div class="state"><i class="fas fa-plug-circle-xmark"></i>' +
        '<h3>组件未加载</h3><p>请刷新页面重试</p></div>';
      return;
    }
    var sess = null;
    try { sess = (await sb.auth.getSession()).data.session; } catch (e) {}
    if (!sess) {
      $('#stateBox').innerHTML = '<div class="state"><i class="fas fa-lock"></i>' +
        '<h3>登录后查看收藏</h3><p>收藏是跟账号走的，换设备也能看到</p>' +
        '<a class="btn" href="/login/?redirect=' + encodeURIComponent('/discuss/saved/') + '">去登录</a></div>';
      return;
    }
    state.user = sess.user;
    await load(true);
  }

  $('#moreBtn').addEventListener('click', function () { load(false); });

  $('#list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn) return;
    e.preventDefault();
    removeBookmark(btn.getAttribute('data-remove'), btn);
  });

  document.addEventListener('DOMContentLoaded', function () {
    try {
      if (KJ.initNav) KJ.initNav(sb);
      else if (KJ.setupMobileMenu) KJ.setupMobileMenu();
    } catch (e) {}
    boot();
  });
})();
</script>
</body>
</html>
