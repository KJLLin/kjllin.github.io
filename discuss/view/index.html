  <style>
    /* ====================== Win11 全局规范 ====================== */
    html {
      --win-ease: var(--spring-default);
      --bounce: var(--spring-bounce);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    pre, code, kbd, samp, .mono, .hljs {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    :root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(0,113,227,0.05);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
      --code-bg: #f6f8fa;
      --code-border: rgba(0,0,0,0.08);
      --hljs-bg: #f6f8fa;
    }
    [data-theme="dark"]:root {
      --bg-body: var(--color-bg);
      --bg-mica: var(--color-bg-glass);
      --bg-mica-scroll: var(--color-bg-glass-solid);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-light: var(--color-accent-light);
      --accent-glow: var(--color-accent-glow);
      --accent-glow-weak: rgba(10,132,255,0.07);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
      --shadow-hover: var(--shadow-lg);
      --shadow-scroll: var(--shadow-md);
      --scroll-bar: var(--scrollbar-thumb);
      --code-bg: #0d1117;
      --code-border: rgba(255,255,255,0.06);
      --hljs-bg: #0d1117;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: clip; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    /* ====================== 粒子背景 ====================== */
    #particlesCanvas {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }

    /* ====================== 加载遮罩 ====================== */
    #loader {
      position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.5s var(--win-ease);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-tertiary); animation: fadePulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ====================== 云母组件 ====================== */
    .mica {
      background: var(--bg-mica);
      background-image: var(--iridescent);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--border-mica);
      border-top: 1px solid var(--color-border-glass);
      box-shadow: var(--glass-shadow);
    }

    /* ====================== 布局 ====================== */
    .container { max-width: 860px; margin: 0 auto; padding: 80px 16px calc(40px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }

    /* ====================== 面包屑返回 ====================== */
    .back-link-wrap { margin-bottom: 20px; animation: fadeUp 0.5s var(--win-ease) forwards; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text-tertiary);
      text-decoration: none; font-weight: 500;
      padding: 6px 14px; border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .back-link:hover { color: var(--accent); background: var(--accent-glow); }
    .back-link .arrow { font-size: 16px; transition: transform var(--transition-fast); }
    .back-link:hover .arrow { transform: translateX(-3px); }

    /* ====================== 帖子卡片 ====================== */
    .post-card {
      padding: 32px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest);
      animation: fadeUp 0.6s var(--win-ease) 0.1s both;
    }
    .post-card .post-header { margin-bottom: 28px; }
    .post-card .post-title {
      font-size: 28px; font-weight: 700; color: var(--text-primary);
      line-height: 1.4; margin-bottom: 12px; word-break: break-word;
    }
    .post-card .post-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-tertiary);
    }
    .post-card .post-meta .author {
      font-weight: 600; color: var(--accent);
    }
    .post-card .post-meta .dot {
      width: 3px; height: 3px; border-radius: 50%; background: var(--text-tertiary);
    }
    .post-card .divider {
      border: none; border-top: 1px solid var(--border-mica);
      margin: 0 0 24px 0;
    }

    /* ====================== Markdown 内容区 ====================== */
    .markdown-body {
      color: var(--text-primary);
      line-height: 1.8; font-size: 15px;
      word-break: break-word; overflow-wrap: break-word;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--text-primary);
      margin: 24px 0 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    .markdown-body h1 { font-size: 24px; border-bottom: 1px solid var(--border-mica); padding-bottom: 8px; }
    .markdown-body h2 { font-size: 20px; border-bottom: 1px solid var(--border-mica); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 17px; }
    .markdown-body h4 { font-size: 15px; }
    .markdown-body p { margin: 10px 0; }
    .markdown-body a { color: var(--accent); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body img { max-width: 100%; border-radius: var(--radius-sm); }
    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px; margin: 12px 0;
      color: var(--text-secondary);
      background: var(--accent-glow-weak);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .markdown-body blockquote p { margin: 4px 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 10px 0; }
    .markdown-body li { margin: 4px 0; }
    .markdown-body hr {
      border: none; border-top: 1px solid var(--border-mica);
      margin: 24px 0;
    }
    .markdown-body table {
      width: 100%; border-collapse: collapse;
      margin: 12px 0; font-size: 14px;
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-mica);
      padding: 8px 12px; text-align: left;
    }
    .markdown-body th {
      background: var(--accent-glow-weak);
      font-weight: 600; color: var(--text-primary);
    }

    /* ====================== 内联代码 + 代码块 ====================== */
    .markdown-body code {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    .markdown-body :not(pre) > code {
      background: var(--code-bg);
      color: var(--accent);
      padding: 2px 6px; border-radius: 4px;
      font-size: 0.88em; border: 1px solid var(--code-border);
    }

    .code-block-wrapper {
      position: relative; margin: 14px 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--code-border);
      overflow: hidden;
    }
    .code-block-wrapper .copy-btn {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-mica);
      background: var(--bg-mica);
      color: var(--text-tertiary); font-size: 13px; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .code-block-wrapper .copy-btn:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .code-block-wrapper .copy-btn.copied {
      background: var(--color-success, #28a745); color: #fff; border-color: var(--color-success, #28a745);
    }
    .code-block-wrapper pre {
      margin: 0; padding: 18px; overflow-x: auto;
      background: var(--hljs-bg);
      font-size: 13px; line-height: 1.65;
    }
    .code-block-wrapper pre code {
      background: transparent !important;
      border: none !important; padding: 0 !important;
      color: inherit; font-size: inherit;
    }

    /* ====================== KaTeX ====================== */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .katex { font-size: 1.1em; }

    /* ====================== 404 提示 ====================== */
    .not-found {
      text-align: center; padding: 80px 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest);
      animation: fadeUp 0.6s var(--win-ease) forwards;
    }
    .not-found .icon { font-size: 64px; margin-bottom: 16px; }
    .not-found h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 8px; }
    .not-found p { font-size: 14px; color: var(--text-tertiary); margin-bottom: 20px; line-height: 1.6; }
    .not-found .btn {
      display: inline-block; padding: 10px 24px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 500;
      transition: all var(--transition-fast);
    }
    .not-found .btn:hover { background: var(--accent-light); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* ====================== 页脚 ====================== */
    .footer { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); margin-top: 40px; }

    /* ====================== 返回顶部 ====================== */
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover { transform: translateY(-2px); }

    /* ====================== 滚动条 ====================== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ====================== 响应式 ====================== */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
      .post-card { padding: 20px 16px; }
      .post-card .post-title { font-size: 22px; }
      .markdown-body { font-size: 14px; }
      .markdown-body h1 { font-size: 20px; }
      .markdown-body h2 { font-size: 18px; }
      .code-block-wrapper pre { padding: 14px; font-size: calc(12px + env(safe-area-inset-bottom, 0px)); }
      .not-found { padding: 60px 16px; }
      .not-found .icon { font-size: 48px; }
      .code-block-wrapper .copy-btn { opacity: 1; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .post-card .post-title { font-size: 20px; }
      .post-card .post-meta { font-size: 12px; }
      .markdown-body { font-size: 13px; }
      .not-found h2 { font-size: 18px; }
    }

    * { -webkit-user-select: none; user-select: none; }
    .markdown-body, .markdown-body *, pre, code { -webkit-user-select: text; user-select: text; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <canvas id="particlesCanvas"></canvas>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <div id="loader">
    <div class="loader-content">
      <div class="loader-spin"></div>
      <div class="loader-text">正在加载帖子...</div>

  <!-- ================== 全局导航栏 ================== -->

  <div class="container" id="mainContainer">
    <!-- 内容由 JS 渲染 -->
  </div>

  <footer class="footer">© 2026 KJLLin · All Rights Reserved</footer>

  <button id="backTop" class="mica" aria-label="返回顶部">↑</button>

  <script src="/common.js"></script>
  <script>
    // ====================== 元素引用 ======================
    const $ = s => document.querySelector(s);
    const root = document.documentElement;
    const metaTheme = $('meta[name="theme-color"]');
    const themeBtn = $('#themeBtn');
    const loader = $('#loader');
    const backTop = $('#backTop');
    const menuBar = $('#menuBar');
    const mainContainer = $('#mainContainer');
    let isScrolling = false;
    let touchStartData = {};

    // ====================== 粒子背景 ======================
    (function() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const count = 50;
      let animId;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticles() {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 0.5,
            o: Math.random() * 0.5 + 0.1
          });
        }
      }
      createParticles();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isDark = root.dataset.theme === 'dark';
        const color = isDark ? '255,255,255' : '0,120,212';
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color},${p.o})`;
          ctx.fill();
        }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(${color},${0.04 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        animId = requestAnimationFrame(draw);
      }
      draw();
    })();

    // ====================== 触摸点击判定 ======================
    function handleTouchStart(e) {
      touchStartData = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
    function handleTouchEnd(e, callback) {
      const t = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, time: Date.now() };
      const dx = Math.abs(t.x - touchStartData.x);
      const dy = Math.abs(t.y - touchStartData.y);
      const dt = t.time - touchStartData.time;
      if (dx < 10 && dy < 10 && dt < 300) { e.preventDefault(); e.stopPropagation(); callback(); }
    }

    // ====================== 主题（三模式：浅色/深色/跟随系统） ======================
    function updateThemeUI() {
      var state = KJ.applyTheme('#f5f5f7', '#000');
      themeBtn.innerHTML = KJ.getThemeIcon(state.mode);

      // 切换 highlight.js 主题
      const hlCss = document.querySelector('link[href*="highlight.js"]');
      if (hlCss) {
        hlCss.href = state.dark
          ? 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css'
          : 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css';
      }
    }
    function toggleTheme() {
      KJ.toggleTheme();
      updateThemeUI();
    }

    // ====================== 滚动 ======================
    function handleScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        backTop.classList.toggle('show', window.scrollY > 300);
        menuBar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    }
    function goToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    // ====================== 移动端菜单 ======================
    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        KJ.initNav(null, { homeUrl: '/' });

    // ====================== 事件绑定 ======================
    themeBtn.addEventListener('click', toggleTheme);
    
    
    backTop.addEventListener('click', goToTop);
    backTop.addEventListener('touchstart', handleTouchStart);
    backTop.addEventListener('touchend', e => handleTouchEnd(e, goToTop));
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('beforeunload', () => {
      window.removeEventListener('scroll', handleScroll);
    });

    // ====================== Markdown 渲染 + 代码复制 ======================

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      if (diff < 172800000) return '昨天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function wrapCodeBlocks(container) {
      container.querySelectorAll('pre').forEach(pre => {
        if (pre.parentElement.classList.contains('code-block-wrapper')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="fas fa-clipboard"></i>';
        copyBtn.title = '复制代码';
        wrapper.appendChild(copyBtn);

        copyBtn.addEventListener('click', () => {
          const code = pre.textContent || '';
          navigator.clipboard.writeText(code).then(() => {
            copyBtn.innerHTML = '<i class="fas fa-check"></i>';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = '<i class="fas fa-clipboard"></i>';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(() => {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(_) {}
            document.body.removeChild(ta);
            copyBtn.innerHTML = '<i class="fas fa-check"></i>';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = '<i class="fas fa-clipboard"></i>';
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        });

        // touch devices: always show
        copyBtn.addEventListener('touchstart', e => e.stopPropagation());
      });
    }

    function renderMarkdown(raw) {
      if (!raw) return '<p style="color:var(--text-tertiary);font-style:italic;">（无内容）</p>';
      // 配置 marked
      if (typeof marked.setOptions === 'function') {
        marked.setOptions({
          breaks: true,
          gfm: true
        });
      }
      let html;
      try {
        html = marked.parse(raw);
        // 使用 DOMPurify 净化（防 XSS）
        if (typeof DOMPurify !== 'undefined') {
          html = DOMPurify.sanitize(html, {
            ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','strong','em','b','i','u','s','del','a','ul','ol','li','blockquote','pre','code','img','table','thead','tbody','tr','th','td','span','div','sub','sup','details','summary'],
            ALLOWED_ATTR: ['href','title','target','rel','src','alt','width','height','class','id','type','checked','disabled'],
            ALLOW_DATA_ATTR: false
          });
        } else {
          // 回退：基础 XSS 过滤
          html = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                     .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
                     .replace(/\son\w+\s*=\s*'[^']*'/gi, '')
                     .replace(/javascript\s*:/gi, '');
        }
      } catch(e) {
        html = '<p style="color:var(--danger);">Markdown 渲染失败</p><pre>' + KJ.escapeHtml(raw) + '</pre>';
      }
      return html;
    }

    function renderPost(post) {
      // 更新标题
      document.title = (post.title || '无标题') + ' · KJLLin';

      // 构建面包屑
      const breadcrumb = '<div class="back-link-wrap">' +
        '<a href="/discuss/" class="back-link"><span class="arrow">←</span> 返回讨论版</a>' +
        '</div>';

      // 构建帖子卡片
      let html = breadcrumb;
      html += '<div class="post-card mica">';
      html += '<div class="post-header">';
      html += '<h1 class="post-title">' + KJ.escapeHtml(post.title || '无标题') + '</h1>';
      html += '<div class="post-meta">';
      html += '<span class="author">' + KJ.escapeHtml(post.nick || '匿名') + '</span>';
      html += '<span class="dot"></span>';
      html += '<span>' + formatDate(post.created_at) + '</span>';
      if (currentUser && currentUser.id === post.user_id) {
        html += '<span class="dot"></span>';
        html += '<a href="/discuss/edit/?id=' + post.id + '" style="color:var(--accent);text-decoration:none;font-size:13px"><i class="fas fa-pen-to-square"></i> 编辑</a>';
      }
      if (post.updated_at) {
        html += '<span class="dot"></span>';
        html += '<span title="最后编辑于 ' + formatDate(post.updated_at) + '">已编辑</span>';
      }
      html += '</div>';
      html += '</div>';
      html += '<hr class="divider">';
      html += '<div class="markdown-body" id="markdownBody">';
      html += renderMarkdown(post.content);
      html += '</div>';
      html += '</div>';

      mainContainer.innerHTML = html;

      // 代码块包装
      const mdBody = document.getElementById('markdownBody');
      if (mdBody) {
        wrapCodeBlocks(mdBody);
      }

      // KaTeX 渲染
      if (typeof renderMathInElement !== 'undefined') {
        try {
          renderMathInElement(document.body, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        } catch(e) {
          console.warn('KaTeX render error:', e);
        }
      }
    }

    function showNotFound() {
      document.title = '找不到帖子 · KJLLin';
      const breadcrumb = '<div class="back-link-wrap">' +
        '<a href="/discuss/" class="back-link"><span class="arrow">←</span> 返回讨论版</a>' +
        '</div>';
      mainContainer.innerHTML = breadcrumb +
        '<div class="not-found mica">' +
        '<div class="icon"><i class="fas fa-inbox"></i></div>' +
        '<h2>找不到这篇帖子</h2>' +
        '<p>帖子可能已被删除，或者链接地址不正确</p>' +
        '<a href="/discuss/" class="btn">← 回到讨论版</a>' +
        '</div>';
    }

    function showError(msg) {
      document.title = '加载失败 · KJLLin';
      const breadcrumb = '<div class="back-link-wrap">' +
        '<a href="/discuss/" class="back-link"><span class="arrow">←</span> 返回讨论版</a>' +
        '</div>';
      mainContainer.innerHTML = breadcrumb +
        '<div class="not-found mica">' +
        '<div class="icon"><i class="fas fa-triangle-exclamation"></i></div>' +
        '<h2>加载帖子失败</h2>' +
        '<p>' + KJ.escapeHtml(msg || '未知错误') + '</p>' +
        '<a href="/discuss/" class="btn">← 回到讨论版</a>' +
        '</div>';
    }

    // ====================== 核心：加载帖子 ======================
    let currentUser = null;

    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');

      if (!postId) {
        showNotFound();
        return;
      }

      const sb = KJ.createSupabase();
      KJ.initMessageBanner(sb);
      if (!sb) {
        showError('数据库连接失败，请刷新页面重试');
        return;
      }

      // 同时获取当前用户和帖子
      try {
        const [{ data: { session } }, { data, error }] = await Promise.all([
          sb.auth.getSession(),
          sb.from('posts').select('*').eq('id', postId).single()
        ]);
        currentUser = session?.user || null;

        if (error) {
          if (error.code === 'PGRST116') {
            showNotFound();
          } else {
            // 不暴露原始 PostgreSQL 错误信息给用户
            showError('帖子不存在或已删除');
            console.warn('Load post error:', error.code, error.message);
          }
          return;
        }

        if (!data) {
          showNotFound();
          return;
        }

        renderPost(data);
      } catch(e) {
        showError('加载帖子时发生错误');
        console.warn('Load post error:', e);
      }
    }

    // ====================== 初始化 ======================
    window.addEventListener('DOMContentLoaded', async () => {
      updateThemeUI();
      KJ.onSystemThemeChange(updateThemeUI);
      await loadPost();
      setTimeout(() => { loader.style.opacity = 0; setTimeout(() => loader.remove(), 500); }, 400);
    });
  </script>  <div id="toast" class="toast hidden"></div>
