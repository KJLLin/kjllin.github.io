<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="讨论帖 · KJLLin">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>帖子 · KJLLin</title>

  <!-- CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ====================== Win11 全局规范 ====================== */
    html {
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent; outline: none;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    pre, code, kbd, samp, .mono, .hljs {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    :root {
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255, 255, 255, 0.85);
      --bg-mica-scroll: rgba(255, 255, 255, 0.92);
      --bg-mica-hover: rgba(255, 255, 255, 0.9);
      --border-mica: rgba(0, 0, 0, 0.06);
      --border-mica-hover: rgba(0, 120, 212, 0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.1);
      --accent-glow-weak: rgba(0, 120, 212, 0.05);
      --danger: #e81123;
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.09);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.08);
      --scroll-bar: #c4c4c4;
      --code-bg: #f6f8fa;
      --code-border: rgba(0,0,0,0.08);
      --hljs-bg: #f6f8fa;
    }
    [data-theme="dark"]:root {
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20,20,20,0.85);
      --bg-mica-scroll: rgba(20,20,20,0.92);
      --bg-mica-hover: rgba(26,26,26,0.9);
      --border-mica: rgba(255,255,255,0.07);
      --border-mica-hover: rgba(0,120,212,0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0,120,212,0.15);
      --accent-glow-weak: rgba(0,120,212,0.07);
      --danger: #ff6b6b;
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.25);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.3);
      --scroll-bar: #4a4a4a;
      --code-bg: #0d1117;
      --code-border: rgba(255,255,255,0.06);
      --hljs-bg: #0d1117;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    /* ====================== 粒子背景 ====================== */
    #particlesCanvas {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }

    /* ====================== 加载遮罩 ====================== */
    #loader {
      position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.5s var(--win-ease);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-tertiary); animation: fadePulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ====================== 云母组件 ====================== */
    .mica {
      background: var(--bg-mica);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
    }

    /* ====================== 顶部菜单栏 ====================== */
    .top-menu {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 8px 16px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .menu-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-rest);
      pointer-events: all;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }
    .menu-bar.scrolled {
      background: var(--bg-mica-scroll);
      box-shadow: var(--shadow-scroll);
      transform: translateY(-2px);
    }
    .menu-logo {
      font-size: 18px; font-weight: 700; color: var(--accent);
      padding: 6px 14px; letter-spacing: 0.2px;
      margin-right: 4px;
    }
    .menu-item {
      padding: 7px 14px; border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; cursor: pointer;
      border: none; background: none;
      transition: all var(--transition-fast);
      white-space: nowrap; position: relative;
      letter-spacing: 0.3px;
    }
    .menu-item:hover { color: var(--accent); background: var(--accent-glow); }
    .menu-item.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; }
    .menu-item.active::after {
      content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 16px; height: 2px; border-radius: 1px; background: var(--accent);
    }
    .menu-divider { width: 1px; height: 20px; background: var(--border-mica); margin: 0 4px; }
    .menu-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
      font-size: 16px; cursor: pointer;
      background: rgba(220,220,220,0.4); color: var(--text-primary);
      display: grid; place-items: center;
      transition: all var(--transition-fast);
    }
    [data-theme="dark"] .menu-btn { background: rgba(40,40,40,0.4); }
    .menu-btn:hover { background: var(--accent-glow); color: var(--accent); }
    .menu-btn:active { transform: scale(0.92); }

    /* 移动端汉堡菜单 */
    .hamburger { display: none; }
    .mobile-menu-dropdown {
      display: none; position: absolute; top: 100%; left: 16px; right: 16px;
      margin-top: 8px; padding: 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-hover); flex-direction: column; gap: 2px;
      pointer-events: all; z-index: 101;
    }
    .mobile-menu-dropdown.open { display: flex; }

    /* ====================== 布局 ====================== */
    .container { max-width: 860px; margin: 0 auto; padding: 80px 16px 40px; position: relative; z-index: 1; }

    /* ====================== 面包屑返回 ====================== */
    .back-link-wrap { margin-bottom: 20px; animation: fadeUp 0.5s var(--win-ease) forwards; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text-tertiary);
      text-decoration: none; font-weight: 500;
      padding: 6px 14px; border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }
    .back-link:hover { color: var(--accent); background: var(--accent-glow); }
    .back-link .arrow { font-size: 16px; transition: transform var(--transition-fast); }
    .back-link:hover .arrow { transform: translateX(-3px); }

    /* ====================== 帖子卡片 ====================== */
    .post-card {
      padding: 32px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest);
      animation: fadeUp 0.6s var(--win-ease) 0.1s both;
    }
    .post-card .post-header { margin-bottom: 28px; }
    .post-card .post-title {
      font-size: 28px; font-weight: 700; color: var(--text-primary);
      line-height: 1.4; margin-bottom: 12px; word-break: break-word;
    }
    .post-card .post-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-tertiary);
    }
    .post-card .post-meta .author {
      font-weight: 600; color: var(--accent);
    }
    .post-card .post-meta .dot {
      width: 3px; height: 3px; border-radius: 50%; background: var(--text-tertiary);
    }
    .post-card .divider {
      border: none; border-top: 1px solid var(--border-mica);
      margin: 0 0 24px 0;
    }

    /* ====================== Markdown 内容区 ====================== */
    .markdown-body {
      color: var(--text-primary);
      line-height: 1.8; font-size: 15px;
      word-break: break-word; overflow-wrap: break-word;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--text-primary);
      margin: 24px 0 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    .markdown-body h1 { font-size: 24px; border-bottom: 1px solid var(--border-mica); padding-bottom: 8px; }
    .markdown-body h2 { font-size: 20px; border-bottom: 1px solid var(--border-mica); padding-bottom: 6px; }
    .markdown-body h3 { font-size: 17px; }
    .markdown-body h4 { font-size: 15px; }
    .markdown-body p { margin: 10px 0; }
    .markdown-body a { color: var(--accent); text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body img { max-width: 100%; border-radius: var(--radius-sm); }
    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px; margin: 12px 0;
      color: var(--text-secondary);
      background: var(--accent-glow-weak);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .markdown-body blockquote p { margin: 4px 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 24px; margin: 10px 0; }
    .markdown-body li { margin: 4px 0; }
    .markdown-body hr {
      border: none; border-top: 1px solid var(--border-mica);
      margin: 24px 0;
    }
    .markdown-body table {
      width: 100%; border-collapse: collapse;
      margin: 12px 0; font-size: 14px;
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-mica);
      padding: 8px 12px; text-align: left;
    }
    .markdown-body th {
      background: var(--accent-glow-weak);
      font-weight: 600; color: var(--text-primary);
    }

    /* ====================== 内联代码 + 代码块 ====================== */
    .markdown-body code {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace !important;
    }
    .markdown-body :not(pre) > code {
      background: var(--code-bg);
      color: var(--accent);
      padding: 2px 6px; border-radius: 4px;
      font-size: 0.88em; border: 1px solid var(--code-border);
    }

    .code-block-wrapper {
      position: relative; margin: 14px 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--code-border);
      overflow: hidden;
    }
    .code-block-wrapper .copy-btn {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-mica);
      background: var(--bg-mica);
      color: var(--text-tertiary); font-size: 13px; cursor: pointer;
      display: grid; place-items: center;
      opacity: 0; transition: opacity var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .code-block-wrapper .copy-btn:hover {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .code-block-wrapper .copy-btn.copied {
      background: #28a745; color: #fff; border-color: #28a745;
    }
    .code-block-wrapper pre {
      margin: 0; padding: 18px; overflow-x: auto;
      background: var(--hljs-bg);
      font-size: 13px; line-height: 1.65;
    }
    .code-block-wrapper pre code {
      background: transparent !important;
      border: none !important; padding: 0 !important;
      color: inherit; font-size: inherit;
    }

    /* ====================== KaTeX ====================== */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .katex { font-size: 1.1em; }

    /* ====================== 404 提示 ====================== */
    .not-found {
      text-align: center; padding: 80px 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest);
      animation: fadeUp 0.6s var(--win-ease) forwards;
    }
    .not-found .icon { font-size: 64px; margin-bottom: 16px; }
    .not-found h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 8px; }
    .not-found p { font-size: 14px; color: var(--text-tertiary); margin-bottom: 20px; line-height: 1.6; }
    .not-found .btn {
      display: inline-block; padding: 10px 24px; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 500;
      transition: all var(--transition-fast);
    }
    .not-found .btn:hover { background: var(--accent-light); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* ====================== 页脚 ====================== */
    .footer { text-align: center; padding: 40px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); margin-top: 40px; }

    /* ====================== 返回顶部 ====================== */
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover { transform: translateY(-2px); }

    /* ====================== 滚动条 ====================== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ====================== 响应式 ====================== */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 12px 40px; }
      .post-card { padding: 20px 16px; }
      .post-card .post-title { font-size: 22px; }
      .markdown-body { font-size: 14px; }
      .markdown-body h1 { font-size: 20px; }
      .markdown-body h2 { font-size: 18px; }
      .code-block-wrapper pre { padding: 14px; font-size: 12px; }
      .not-found { padding: 60px 16px; }
      .not-found .icon { font-size: 48px; }
      .code-block-wrapper .copy-btn { opacity: 1; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .menu-bar .menu-item { display: none; }
      .menu-bar .menu-item.mobile-show { display: block; }
      .hamburger { display: grid; }
      .menu-divider { display: none; }
      .post-card .post-title { font-size: 20px; }
      .post-card .post-meta { font-size: 12px; }
      .markdown-body { font-size: 13px; }
      .not-found h2 { font-size: 18px; }
    }
    @media (min-width: 521px) {
      .hamburger { display: none !important; }
      .mobile-menu-dropdown { display: none !important; }
    }

    * { -webkit-user-select: none; user-select: none; }
    .markdown-body, .markdown-body *, pre, code { -webkit-user-select: text; user-select: text; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
