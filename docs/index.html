<html lang="zh-CN">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>帮助文档 · KJLLin</title>
  <link rel="canonical" href="https://kjllin.dpdns.org/docs/">

  <meta name="description" content="KJLLin 帮助文档中心 - 游戏、社交、云盘使用指南">
  <style>
    :root {
      --ifm-color-primary: #0071e3;
      --ifm-color-primary-dark: #0064d0;
      --ifm-color-primary-darker: #005ec2;
      --ifm-color-primary-darkest: #004e9f;
      --ifm-color-primary-light: #0077ed;
      --ifm-color-primary-lighter: #1a8aff;
      --ifm-color-primary-lightest: #40a9ff;
      --ifm-code-background: var(--color-bg-glass-solid, #f6f8fa);
      --ifm-code-color: #e74c3c;
      --ifm-code-font-size: 90%;
      --ifm-font-family-base: "SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      --ifm-font-family-monospace: "SF Mono","Consolas","Cascadia Code","Fira Code",monospace;
      --ifm-heading-font-weight: 600;
      --ifm-h1-font-size: 2rem;
      --ifm-h2-font-size: 1.5rem;
      --ifm-h3-font-size: 1.2rem;
      --ifm-h4-font-size: 1rem;
      --ifm-navbar-background-color: var(--color-bg-glass);
      --ifm-navbar-height: 64px;
      --ifm-sidebar-width: 280px;
      --ifm-toc-width: 240px;
      --ifm-content-max-width: 820px;
      --doc-sidebar-bg: var(--color-bg);
      --doc-sidebar-category: var(--color-text-tertiary);
      --doc-sidebar-link: var(--color-text-secondary);
      --doc-sidebar-active: var(--ifm-color-primary);
      --doc-content-text: var(--color-text-secondary);
      --doc-content-heading: var(--color-text-primary);
      --doc-toc-link: var(--color-text-tertiary);
      --doc-toc-active: var(--ifm-color-primary);
      --doc-admonition-note-bg: rgba(0,113,227,0.06);
      --doc-admonition-note-border: #0071e3;
      --doc-admonition-tip-bg: rgba(48,209,88,0.08);
      --doc-admonition-tip-border: #30d158;
      --doc-admonition-warning-bg: rgba(255,159,10,0.08);
      --doc-admonition-warning-border: #ff9f0a;
      --doc-admonition-danger-bg: rgba(255,59,48,0.07);
      --doc-admonition-danger-border: #ff3b30;
      --doc-blockquote-bg: rgba(0,0,0,0.02);
      --doc-blockquote-border: var(--ifm-color-primary);
      --doc-table-border: var(--color-border);
      --doc-table-header-bg: rgba(0,0,0,0.03);
    }

    [data-theme="dark"] {
      --ifm-code-background: rgba(255,255,255,0.06);
      --ifm-code-color: #ff6b6b;
      --doc-admonition-note-bg: rgba(10,132,255,0.12);
      --doc-admonition-tip-bg: rgba(48,209,88,0.12);
      --doc-admonition-warning-bg: rgba(255,159,10,0.12);
      --doc-admonition-danger-bg: rgba(255,69,58,0.12);
      --doc-blockquote-bg: rgba(255,255,255,0.02);
      --doc-table-header-bg: rgba(255,255,255,0.04);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--ifm-font-family-base);
      background: var(--color-bg);
      color: var(--color-text-primary);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ====================== 文档整体布局 ====================== */
    .docs-wrapper {
      display: flex;
      padding-top: 64px;
      min-height: 100vh;
    }

    /* ====================== 左侧边栏 ====================== */
    .docs-sidebar {
      width: var(--ifm-sidebar-width);
      flex-shrink: 0;
      border-right: 1px solid var(--color-border);
      background: var(--doc-sidebar-bg);
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 16px 0 32px;
      z-index: 10;
    }
    .docs-sidebar::-webkit-scrollbar { width: 5px; }
    .docs-sidebar::-webkit-scrollbar-thumb { background: var(--color-scrollbar-thumb, rgba(0,0,0,0.12)); border-radius: 3px; }

    .sidebar-menu { list-style: none; padding: 0; margin: 0; }

    /* 分类标题 */
    .sidebar-category {
      margin: 4px 0;
    }
    .sidebar-category-title {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px 8px 20px;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--doc-sidebar-category);
      cursor: pointer;
      user-select: none;
      transition: color var(--transition-fast);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .sidebar-category-title:hover { color: var(--color-text-primary); }
    .sidebar-category-title:active { transform: scale(0.98); transition: transform var(--duration-instant) var(--spring-default); }
    .sidebar-category-title::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(-45deg) translateY(-2px);
      margin-left: auto;
      transition: transform var(--transition-fast);
      opacity: 0.5;
    }
    .sidebar-category.collapsed .sidebar-category-title::after {
      transform: rotate(45deg) translateY(-1px);
    }
    .sidebar-category-items {
      overflow: hidden;
      transition: max-height .3s var(--spring-smooth), opacity .2s var(--spring-default);
      max-height: 600px;
      opacity: 1;
    }
    .sidebar-category.collapsed .sidebar-category-items {
      max-height: 0;
      opacity: 0;
    }

    /* 侧边栏链接 */
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 28px;
      font-size: 13.5px;
      color: var(--doc-sidebar-link);
      text-decoration: none;
      transition: color var(--transition-fast), background var(--transition-fast);
      border-left: 3px solid transparent;
      line-height: 1.4;
      cursor: pointer;
    }
    .sidebar-link:hover {
      background: var(--color-accent-glow);
      color: var(--color-text-primary);
    }
    .sidebar-link.active {
      color: var(--doc-sidebar-active);
      background: var(--color-accent-glow);
      border-left-color: var(--doc-sidebar-active);
      font-weight: 600;
    }

    /* ====================== 中央内容区 ====================== */
    .docs-content-wrapper {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
    }
    .docs-content-inner {
      width: 100%;
      max-width: var(--ifm-content-max-width);
      padding: 32px 48px 80px;
      min-width: 0;
    }

    /* 面包屑 */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--color-text-tertiary);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .breadcrumbs a {
      color: var(--color-text-tertiary);
      text-decoration: none;
    }
    .breadcrumbs a:hover { color: var(--ifm-color-primary); }
    .breadcrumbs .sep { opacity: 0.4; font-size: 10px; }

    /* 标题 */
    .doc-title {
      font-size: var(--ifm-h1-font-size);
      font-weight: 700;
      color: var(--doc-content-heading);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .doc-meta {
      font-size: 13px;
      color: var(--color-text-tertiary);
      margin-bottom: 24px;
    }

    /* 内容排版 */
    .doc-body h2 {
      font-size: var(--ifm-h2-font-size);
      font-weight: 600;
      color: var(--doc-content-heading);
      margin: 36px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
      position: relative;
    }
    .doc-body h2 .anchor-icon {
      position: absolute;
      left: -22px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      font-size: 16px;
      color: var(--color-text-tertiary);
      transition: opacity var(--transition-fast);
    }
    .doc-body h2:hover .anchor-icon { opacity: 1; }

    .doc-body h3 {
      font-size: var(--ifm-h3-font-size);
      font-weight: 600;
      color: var(--doc-content-heading);
      margin: 28px 0 10px;
    }
    .doc-body h4 {
      font-size: var(--ifm-h4-font-size);
      font-weight: 600;
      color: var(--doc-content-heading);
      margin: 22px 0 8px;
    }

    .doc-body p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--doc-content-text);
      margin: 12px 0;
    }
    .doc-body strong { color: var(--color-text-primary); }
    .doc-body a {
      color: var(--ifm-color-primary);
      text-decoration: none;
    }
    .doc-body a:hover { text-decoration: underline; }

    .doc-body ul, .doc-body ol {
      margin: 10px 0;
      padding-left: 24px;
      color: var(--doc-content-text);
      font-size: 15px;
      line-height: 1.75;
    }
    .doc-body li { margin: 4px 0; }

    /* 代码块 */
    .doc-body pre {
      background: var(--ifm-code-background);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 14px 0;
      font-size: 13.5px;
      line-height: 1.6;
      font-family: var(--ifm-font-family-monospace);
    }
    .doc-body pre code {
      background: none;
      padding: 0;
      font-size: inherit;
      color: var(--color-text-primary);
      border: none;
    }
    .doc-body code {
      background: var(--ifm-code-background);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: var(--ifm-code-font-size);
      font-family: var(--ifm-font-family-monospace);
      color: var(--ifm-code-color);
      border: 1px solid var(--color-border);
    }
    .doc-body pre code { color: var(--color-text-primary); }

    /* 代码块语言标签 */
    .code-block-wrapper {
      position: relative;
      margin: 14px 0;
    }
    .code-block-wrapper .code-lang {
      position: absolute;
      top: 0;
      right: 12px;
      font-size: 11px;
      color: var(--color-text-tertiary);
      background: var(--color-bg-glass);
      padding: 2px 8px;
      border-radius: 0 8px 0 6px;
      text-transform: uppercase;
      font-family: var(--ifm-font-family-monospace);
      letter-spacing: 0.5px;
    }

    /* Admonition 提示框 */
    .admonition {
      border-left: 4px solid;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--doc-content-text);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .admonition .admonition-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    .admonition .admonition-content { flex: 1; min-width: 0; }
    .admonition .admonition-content p { margin: 4px 0; font-size: inherit; }
    .admonition .admonition-content p:first-child { margin-top: 0; }
    .admonition .admonition-heading {
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .admonition--note {
      background: var(--doc-admonition-note-bg);
      border-color: var(--doc-admonition-note-border);
    }
    .admonition--note .admonition-icon,
    .admonition--note .admonition-heading { color: var(--doc-admonition-note-border); }

    .admonition--tip {
      background: var(--doc-admonition-tip-bg);
      border-color: var(--doc-admonition-tip-border);
    }
    .admonition--tip .admonition-icon,
    .admonition--tip .admonition-heading { color: var(--doc-admonition-tip-border); }

    .admonition--warning {
      background: var(--doc-admonition-warning-bg);
      border-color: var(--doc-admonition-warning-border);
    }
    .admonition--warning .admonition-icon,
    .admonition--warning .admonition-heading { color: var(--doc-admonition-warning-border); }

    .admonition--danger {
      background: var(--doc-admonition-danger-bg);
      border-color: var(--doc-admonition-danger-border);
    }
    .admonition--danger .admonition-icon,
    .admonition--danger .admonition-heading { color: var(--doc-admonition-danger-border); }

    /* 引用块 */
    .doc-body blockquote {
      background: var(--doc-blockquote-bg);
      border-left: 3px solid var(--doc-blockquote-border);
      margin: 14px 0;
      padding: 10px 16px;
      font-size: 14px;
      color: var(--doc-content-text);
      line-height: 1.7;
      border-radius: 0 8px 8px 0;
    }
    .doc-body blockquote p { margin: 6px 0; }

    /* 表格 */
    .doc-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 14px;
      display: block;
      overflow-x: auto;
    }
    .doc-body thead { border-bottom: 2px solid var(--doc-table-border); }
    .doc-body th {
      background: var(--doc-table-header-bg);
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: var(--color-text-primary);
    }
    .doc-body td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--doc-table-border);
      color: var(--doc-content-text);
    }
    .doc-body tr:last-child td { border-bottom: none; }

    /* 步骤 */
    .steps { counter-reset: step; list-style: none; padding-left: 0; }
    .steps li {
      counter-increment: step;
      display: flex;
      gap: 12px;
      margin: 12px 0;
      align-items: flex-start;
    }
    .steps li::before {
      content: counter(step);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ifm-color-primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .steps li .step-content { font-size: 15px; line-height: 1.6; color: var(--doc-content-text); }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .feature-card {
      display: block;
      background: var(--color-bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .feature-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      border-color: var(--ifm-color-primary);
      text-decoration: none;
    }
    .feature-card .fc-icon {
      font-size: 22px;
      color: var(--ifm-color-primary);
      margin-bottom: 10px;
    }
    .feature-card h4 { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--color-text-primary); }
    .feature-card p { font-size: 12.5px; color: var(--color-text-tertiary); margin: 0; }

    /* 水平线 */
    .doc-body hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 32px 0;
    }

    /* ====================== 右侧目录 (TOC) ====================== */
    .docs-toc {
      width: var(--ifm-toc-width);
      flex-shrink: 0;
      position: sticky;
      top: 80px;
      height: calc(100vh - 96px);
      overflow-y: auto;
      padding: 24px 16px 32px 0;
      font-size: 13px;
    }
    .docs-toc::-webkit-scrollbar { width: 4px; }
    .docs-toc-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-tertiary);
      margin-bottom: 10px;
      padding-left: 8px;
    }
    .toc-item {
      display: block;
      padding: 4px 8px;
      color: var(--doc-toc-link);
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: color var(--transition-fast), background var(--transition-fast);
      line-height: 1.4;
      font-size: 12.5px;
    }
    .toc-item:hover { color: var(--color-text-primary); }
    .toc-item.active {
      color: var(--doc-toc-active);
      border-left-color: var(--doc-toc-active);
    }
    .toc-item.toc-h3 { padding-left: 18px; }
    .toc-item.toc-h4 { padding-left: 28px; font-size: 12px; }

    /* ====================== 移动端适配 ====================== */
    .mobile-sidebar-backdrop {
      display: none;
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 49;
      opacity: 0;
      transition: opacity .3s var(--spring-default);
      pointer-events: none;
    }
    .mobile-sidebar-backdrop.open { opacity: 1; pointer-events: auto; }

    .mobile-sidebar-toggle {
      display: none;
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 100;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--ifm-color-primary);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,113,227,0.35);
    }

    @media (max-width: 996px) {
      .docs-toc { display: none; }
      .docs-content-inner { padding: 24px 20px 60px; }

      .docs-sidebar {
        position: fixed;
        top: 64px;
        left: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform .3s var(--spring-smooth);
        box-shadow: none;
      }
      .docs-sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.12); }

      .mobile-sidebar-toggle { display: flex; align-items: center; justify-content: center; }
      .mobile-sidebar-backdrop { display: block; }
    }

    @media (max-width: 768px) {
      .doc-body h2 .anchor-icon { display: none; }
      .card-grid { grid-template-columns: 1fr; }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-tertiary);
    }
    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* 底部编辑链接 */
    .doc-footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border);
      font-size: 13px;
      color: var(--color-text-tertiary);
    }
    .doc-footer a { color: var(--ifm-color-primary); text-decoration: none; }
    .doc-footer a:hover { text-decoration: underline; }
  </style>
</head>

// ====================== 导航与路由 ======================
var currentSection = 'getting-started';

function navigateTo(section, el) {
  if (!docs[section]) return;
  currentSection = section;
  // 更新侧边栏激活态
  document.querySelectorAll('.sidebar-link').forEach(function(s) { s.classList.remove('active'); });
  if (el) el.classList.add('active');
  // 渲染内容
  renderContent(section);
  // 移动端关闭侧边栏
  closeMobileSidebar();
  // 滚动到顶部
  document.getElementById('docMain').scrollIntoView({ behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // 更新 URL hash
  if (window.location.hash !== '#' + section) {
    history.pushState(null, '', '#/' + section);
  }
}

function renderContent(section) {
  var d = docs[section];
  if (!d) {
    document.getElementById('docMain').innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="fas fa-file"></i></div><p>文档未找到</p></div>';
    document.getElementById('toc').innerHTML = '';
    return;
  }
  // 面包屑
  var breadcrumb = '<div class="breadcrumbs"><a href="/docs/">文档</a> <span class="sep">›</span> <span>' + d.category + '</span></div>';
  // 内容
  var html = breadcrumb;
  html += '<h1 class="doc-title">' + d.title + '</h1>';
  html += '<div class="doc-meta">' + d.meta + '</div>';
  html += '<div class="doc-body">' + d.content + '</div>';
  html += '<div class="doc-footer"><a href="/discuss/"><i class="fas fa-pen-to-square"></i> 在文章广场提供反馈</a></div>';
  document.getElementById('docMain').innerHTML = html;

  // 渲染右侧目录
  renderTOC(d.toc);

  // 滚动
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTOC(tocItems) {
  if (!tocItems || tocItems.length === 0) {
    document.getElementById('toc').innerHTML = '';
    return;
  }
  var html = '<div class="docs-toc-title">本页目录</div>';
  tocItems.forEach(function(item) {
    html += '<a class="toc-item" href="#' + item[1] + '" onclick="scrollToHeading(event, \'' + item[1] + '\')">' + item[0] + '</a>';
  });
  document.getElementById('toc').innerHTML = html;
}

function scrollToHeading(e, id) {
  e.preventDefault();
  var el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', '#' + id);
  }
}

// TOC scroll-spy
var tocObserver = null;
function setupTOCSpy() {
  if (tocObserver) tocObserver.disconnect();
  tocObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      var id = entry.target.id;
      var tocLink = document.querySelector('.toc-item[href="#' + id + '"]');
      if (tocLink) {
        if (entry.isIntersecting) {
          document.querySelectorAll('.toc-item').forEach(function(t) { t.classList.remove('active'); });
          tocLink.classList.add('active');
        }
      }
    });
  }, { rootMargin: '-80px 0px -80% 0px' });

  setTimeout(function() {
    document.querySelectorAll('.doc-body h2[id]').forEach(function(h) { tocObserver.observe(h); });
  }, 100);
}

// MutationObserver 监听内容变化后重新绑定 TOC spy
var contentObserver = new MutationObserver(function() {
  setupTOCSpy();
});
contentObserver.observe(document.getElementById('docMain'), { childList: true, subtree: true });

// ====================== 初始化 ======================
buildSidebar();

// URL路由
function resolveRoute() {
  var section = 'getting-started';
  var hash = window.location.hash;
  if (hash) {
    // 支持 #/section 和 #section 两种格式
    var s = hash.replace(/^#\//, '').replace(/^#/, '');
    if (docs[s]) section = s;
  }
  var el = document.querySelector('.sidebar-link[data-section="' + section + '"]');
  navigateTo(section, el);
}
resolveRoute();

window.addEventListener('popstate', resolveRoute);

// 点击文档内部链接时（跨文档导航），劫持并跳转
document.getElementById('docMain').addEventListener('click', function(e) {
  var target = e.target.closest('a[href^="#/"]');
  if (target) {
    e.preventDefault();
    var section = target.getAttribute('href').replace(/^#\//, '');
    if (docs[section]) {
      var el = document.querySelector('.sidebar-link[data-section="' + section + '"]');
      navigateTo(section, el);
    }
  }
});
</script>
<div id="toast" class="toast hidden"></div>
</body>
</html>
