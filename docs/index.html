  <title>帮助文档 · KJLLin</title>
  <style>
    :root {
      --bg: var(--color-bg, #f5f5f7);
      --bg-glass: var(--color-bg-glass, rgba(255,255,255,0.72));
      --border: var(--color-border, rgba(0,0,0,0.06));
      --text: var(--color-text-primary, #1d1d1f);
      --text2: var(--color-text-secondary, #6e6e73);
      --text3: var(--color-text-tertiary, #86868b);
      --accent: var(--color-accent, #0071e3);
      --spring: cubic-bezier(0.34,1.56,0.64,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* 布局 */
    .docs-layout {
      display: flex; min-height: 100vh; padding-top: 64px;
      max-width: 1280px; margin: 0 auto;
    }

    /* 侧边栏 */
    .sidebar {
      width: 260px; flex-shrink: 0; padding: 24px 16px 48px;
      border-right: 1px solid var(--border);
      position: sticky; top: 64px; height: calc(100vh - 64px);
      overflow-y: auto; background: var(--bg);
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb, rgba(0,0,0,0.15)); border-radius: 2px; }

    .sidebar-title {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      color: var(--text3); letter-spacing: 0.5px;
      margin: 20px 0 8px 12px;
    }
    .sidebar-title:first-child { margin-top: 0; }

    .sidebar-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px;
      font-size: 14px; color: var(--text2); cursor: pointer;
      transition: all .15s; text-decoration: none;
      margin-bottom: 1px;
    }
    .sidebar-item:hover { background: var(--accent-glow-weak, rgba(0,113,227,0.06)); color: var(--text); }
    .sidebar-item.active { background: var(--accent-glow-weak, rgba(0,113,227,0.1)); color: var(--accent); font-weight: 600; }
    .sidebar-item i { width: 18px; text-align: center; font-size: 13px; opacity: 0.7; }

    .sidebar-search {
      margin-bottom: 16px; position: relative;
    }
    .sidebar-search input {
      width: 100%; padding: 8px 12px 8px 32px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13px;
      background: var(--bg-glass); color: var(--text); outline: none;
    }
    .sidebar-search i {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text3); font-size: 13px;
    }

    /* 内容区 */
    .content {
      flex: 1; padding: 32px 48px 80px; min-width: 0; max-width: 800px;
    }
    .content h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .content h2 {
      font-size: 22px; font-weight: 600; margin: 32px 0 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .content h3 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
    .content p { font-size: 15px; line-height: 1.7; color: var(--text2); margin: 10px 0; }
    .content ul, .content ol { margin: 10px 0; padding-left: 20px; color: var(--text2); font-size: 15px; line-height: 1.7; }
    .content li { margin: 4px 0; }
    .content a { color: var(--accent); text-decoration: none; }
    .content a:hover { text-decoration: underline; }

    .content .tip {
      background: rgba(0,113,227,0.06); border: 1px solid rgba(0,113,227,0.15);
      border-radius: 10px; padding: 14px 18px; margin: 16px 0; font-size: 14px;
      color: var(--text2); display: flex; gap: 10px; align-items: flex-start;
    }
    .content .tip i { color: var(--accent); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    .content .warn {
      background: rgba(255,149,0,0.06); border: 1px solid rgba(255,149,0,0.2);
      border-radius: 10px; padding: 14px 18px; margin: 16px 0; font-size: 14px;
      color: var(--text2); display: flex; gap: 10px; align-items: flex-start;
    }
    .content .warn i { color: #ff9500; font-size: 16px; margin-top: 1px; flex-shrink: 0; }

    .content code {
      background: var(--accent-glow-weak, rgba(0,113,227,0.08));
      padding: 2px 6px; border-radius: 4px; font-size: 13px;
      font-family: "SF Mono","Consolas","Cascadia Code",monospace;
      color: var(--accent);
    }
    .content pre {
      background: var(--color-bg-glass-solid, rgba(0,0,0,0.04));
      border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 20px; overflow-x: auto; margin: 12px 0;
      font-size: 13px; line-height: 1.6;
    }

    .content .step {
      display: flex; gap: 12px; margin: 12px 0; align-items: flex-start;
    }
    .content .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent); color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
    }
    .content .step-text { font-size: 15px; color: var(--text2); line-height: 1.6; padding-top: 2px; }

    .content .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; margin: 16px 0;
    }
    .content .feature-card {
      background: var(--bg-glass); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; cursor: pointer; transition: all .2s; text-decoration: none; color: inherit;
    }
    .feature-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); border-color: var(--accent); }
    .feature-card i { font-size: 24px; color: var(--accent); margin-bottom: 10px; }
    .feature-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .feature-card p { font-size: 12px; color: var(--text3); margin: 0; }

    .content .empty-state { text-align: center; padding: 40px; color: var(--text3); }
    .content .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }

    /* 响应式 */
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .sidebar.open {
        display: block; position: fixed; top: 64px; left: 0; bottom: 0;
        width: 280px; z-index: 100; background: var(--bg);
        box-shadow: 4px 0 20px rgba(0,0,0,0.1);
      }
      .content { padding: 24px 20px 60px; }
      .mobile-sidebar-toggle {
        display: flex !important; position: fixed; bottom: 24px; right: 24px; z-index: 200;
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent); color: #fff; border: none;
        font-size: 18px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,113,227,0.3);
      }
    }
    .mobile-sidebar-toggle { display: none; }
  </style>
</head>

<script>
// ====================== 导航栏 ======================
KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
var themeBtn = document.getElementById('themeBtn');
function updateThemeUI() {
  var state = KJ.applyTheme('#f5f5f7', '#0a0a0a');
  themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
}
themeBtn.addEventListener('click', function(){ KJ.toggleTheme(); updateThemeUI(); });
KJ.onSystemThemeChange(updateThemeUI);
updateThemeUI();

var sb = KJ.createSupabase();
if (sb) KJ.initNav(sb, { homeUrl: '/' });
else KJ.initNav(null, { homeUrl: '/' });

function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('#sidebar') && !e.target.closest('#mobileSidebarBtn')) {
    document.getElementById('sidebar').classList.remove('open');
  }
});

// ====================== 导航与渲染 ======================
var currentSection = 'getting-started';

function navigateTo(section, el) {
  currentSection = section;
  document.querySelectorAll('.sidebar-item').forEach(function(s) { s.classList.remove('active'); });
  if (el) el.classList.add('active');
  renderContent(section);
  // 移动端关闭侧边栏
  document.getElementById('sidebar').classList.remove('open');
  // 重置搜索
  document.getElementById('docsSearch').value = '';
  document.querySelectorAll('.sidebar-item').forEach(function(s) { s.style.display = ''; });
}

function renderContent(section) {
  var d = docs[section];
  if (!d) { document.getElementById('docContent').innerHTML = '<div class="empty-state"><i class="fas fa-file"></i><p>文档未找到</p></div>'; return; }
  document.getElementById('docContent').innerHTML = '<h1>' + d.title + '</h1>' + d.content;
  document.getElementById('docContent').scrollTop = 0;
  window.scrollTo(0, 0);
}

function filterSidebar() {
  var q = document.getElementById('docsSearch').value.toLowerCase();
  document.querySelectorAll('.sidebar-item').forEach(function(s) {
    var text = (s.textContent || '').toLowerCase();
    s.style.display = !q || text.indexOf(q) !== -1 ? '' : 'none';
  });
}

// 初始渲染
renderContent('getting-started');

// 从 URL hash 加载指定文档
if (window.location.hash) {
  var hash = window.location.hash.substring(1);
  if (docs[hash]) {
    var el = document.querySelector('[data-section="' + hash + '"]');
    navigateTo(hash, el);
  }
}
</script>
