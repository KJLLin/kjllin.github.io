<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>恐龙快跑升级版 · KJLLin</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-panel: rgba(22, 22, 40, 0.92);
      --bg-controls: rgba(255, 255, 255, 0.06);
      --text: #e8e8e8;
      --text-secondary: #a0a0b8;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.25);
      --danger: #e74c3c;
      --gold: #f1c40f;
      --sky: #667eea;
      --border: rgba(255, 255, 255, 0.08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* 星空背景 */
    .stars-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* 主容器 */
    .game-shell {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px) 12px;
    }

    /* 顶部导航栏 */
    .top-bar {
      width: 100%; max-width: 820px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; margin-bottom: 10px;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      z-index: 10;
    }
    .top-bar .title { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: 0.3px; }
    .top-bar .title .emoji { margin-right: 6px; }
    .back-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-controls);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.2s, transform 0.15s;
    }
    .back-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }

    /* Canvas 容器 */
    .canvas-wrap {
      position: relative;
      width: 100%; max-width: 820px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03);
      background: #f7f7f7;
      flex-shrink: 0;
    }
    canvas {
      display: block; width: 100%; height: auto;
      background: #f7f7f7;
    }

    /* 分数面板 */
    .stats {
      width: 100%; max-width: 820px;
      display: flex; gap: 12px; margin-top: 10px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 100px;
      padding: 12px 16px; border-radius: var(--radius-md);
      background: var(--bg-panel);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-value.score-color { color: var(--accent); }
    .stat-value.coin-color { color: var(--gold); }

    /* 天气标签 */
    .weather-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
      background: rgba(255,255,255,0.08);
    }
    .weather-tag.sunny { color: #f1c40f; }
    .weather-tag.windy { color: #87ceeb; }
    .weather-tag.rainy { color: #667eea; }

    /* 移动端触控按钮 */
    .touch-controls {
      display: none;
      width: 100%; max-width: 820px;
      margin-top: 10px;
    }
    .ctrl-row {
      display: flex; gap: 10px;
      justify-content: center; align-items: center;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      min-width: 56px; height: 48px; padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text); font-size: 22px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.15s, transform 0.1s;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.12);
    }
    .ctrl-btn.jump-btn {
      background: linear-gradient(135deg, var(--accent), #ff8c5a);
      border-color: transparent;
      font-size: 16px; font-weight: 700;
      min-width: 80px; height: 52px;
    }
    .ctrl-label { font-size: 11px; color: var(--text-secondary); }

    /* 提示文字 */
    .hint {
      text-align: center; font-size: 12px;
      color: var(--text-secondary); margin-top: 8px;
      opacity: 0.7;
    }
    .hint kbd {
      display: inline-block; padding: 1px 6px;
      border-radius: 4px; background: var(--bg-controls);
      font-family: inherit; font-size: 11px;
    }

    /* 加载画面 */
    #loader {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      background: var(--bg);
    }
    .loader-spin {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 响应式 */
    @media (max-width: 768px) {
      .touch-controls { display: block; }
      .game-shell { justify-content: flex-start; padding-top: 8px; }
      .top-bar { padding: 8px 14px; margin-bottom: 8px; }
      .top-bar .title { font-size: 15px; }
      .stats { gap: 8px; }
      .stat-card { padding: 10px 12px; }
      .stat-value { font-size: 18px; }
    }
    @media (min-width: 769px) {
      .hint { display: block; }
    }

    /* 隐藏预加载图像 */
    #groundTexture, #dinoSpriteSheet, #coinImage, #flyImage, #xrzImage { display: none; }

    /* 适配安全区域 */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .game-shell { padding-bottom: env(safe-area-inset-bottom, 12px); }
    }
  </style>
</head>
<body>
  <div id="loader"><div class="loader-spin"></div></div>

  <!-- 星空背景 -->
  <canvas class="stars-canvas" id="starsCanvas"></canvas>

  <div class="game-shell">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <span class="title"><span class="emoji">🦖</span>恐龙快跑升级版</span>
      <span class="weather-tag sunny" id="weatherTag">☀️ 晴朗</span>
      <button class="back-btn" onclick="goBack()" aria-label="返回">←</button>
    </div>

    <!-- 画布 -->
    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <!-- 分数面板 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">🏃 分数</div>
        <div class="stat-value score-color" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🪙 金币</div>
        <div class="stat-value coin-color" id="coins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">💨 速度</div>
        <div class="stat-value" id="speed">2.5</div>
      </div>
      <div class="stat-card" id="weatherCard">
        <div class="stat-label">🌤 天气</div>
        <div class="stat-value" id="weatherText" style="font-size:16px;">晴朗</div>
        <div style="font-size:11px;color:var(--text-secondary)" id="windText">无风</div>
      </div>
    </div>

    <!-- 移动端触控按钮 -->
    <div class="touch-controls" id="touchControls">
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btnWindL" title="左风">🌬️⬅</button>
        <button class="ctrl-btn jump-btn" id="btnJump">🦘 跳跃</button>
        <button class="ctrl-btn" id="btnWindR" title="右风">🌬️➡</button>
      </div>
      <div class="ctrl-row" style="margin-top:6px;">
        <button class="ctrl-btn" id="btnRain" title="下雨">🌧️ 下雨</button>
        <button class="ctrl-btn" id="btnRestart" title="重新开始">🔄 重来</button>
      </div>
    </div>

    <!-- 键盘提示 -->
    <div class="hint">
      按 <kbd>空格/↑</kbd> 跳跃 · <kbd>A</kbd>/<kbd>D</kbd> 刮风 · <kbd>S</kbd> 下雨 · 游戏结束按 <kbd>R</kbd> 重来
    </div>
  </div>

  <!-- 预加载图像 -->
  <img id="groundTexture" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABLAAAAAMAgMAAAAPCKxBAAAABlBMVEX///9TU1NYzE1OAAAAAXRSTlMAQObYZgAAALJJREFUeF7t1EEKAyEMhtEvMNm7sPfJEVyY+1+ltLgYAsrQCtWhbxEhQvgxIJtSZypxa/WGshgzKdbq/UihMFMlt3o/CspEYoihIMaAb6mCvM6C+BTAeyo+wN4yykV/6pVfkdLpVyI1hh7GJ6QunUoLEQlQglNP2nkQkeF8+ei9cLxMue1qxVRfk1Ej0s6AEGWfVOk0QUtnK5Xo0Lac6wpdtnQqB6VxomPaz+dgF1PaqqmeWJlz1jYUaSIAAAAASUVORK5CYII=">
  <img id="dinoSpriteSheet" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAAvAgMAAABiRrxWAAAADFBMVEX///9TU1P39/f///+TS9URAAAAAXRSTlMAQObYZgAAAPpJREFUeF7d0jFKRkEMhdGLMM307itNLALyVmHvJuzTDMjdn72E95PGFEZSmeoU4YMMgxhskvQec8YSVFX1NhGcS5ywtbmC8khcZeKq+ZWJ4F8Sr2+ZCErjkJFEfcjAc/6/BMlfcz6xHdhRthYzIZhIHMcTVY1scUUiAphK8CMSPUbieTBhvD9Lj0vyV4wklEGzHpciKGOJoBp7XDcFs4kWxxM7Ey3iZ8JbzASAvMS7XLOJHTTvEkEZSeQl7DMuwVyCasqK5+XzQRYLUJlMbPXjFcn3m8eKBSjWZMJwvGIOvViAzCbUj1VEDoqFOEQGE3SyInJQLOQMJL4B7enP1UbLXJQAAAAASUVORK5CYII=">
  <img id="coinImage" src="https://epcdiy.org/image/coin.png" onload="onImageLoad()">
  <img id="flyImage" src="https://epcdiy.org/image/fly.png" onload="onImageLoad()">
  <img id="xrzImage" src="https://epcdiy.org/image/xrz.png" onload="onImageLoad()">

  <script>
    // ==================== 星空背景 ====================
    (function() {
      const sc = document.getElementById('starsCanvas');
      const sctx = sc.getContext('2d');
      let stars = [];
      const STAR_COUNT = 80;

      function resizeStars() {
        sc.width = window.innerWidth;
        sc.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * sc.width,
            y: Math.random() * sc.height,
            r: Math.random() * 1.8 + 0.5,
            a: Math.random(),
            da: (Math.random() - 0.5) * 0.015,
            maxA: Math.random() * 0.5 + 0.4
          });
        }
      }
      resizeStars();
      window.addEventListener('resize', resizeStars);

      function drawStars() {
        sctx.clearRect(0, 0, sc.width, sc.height);
        for (const s of stars) {
          s.a += s.da;
          if (s.a > s.maxA || s.a < 0.1) s.da *= -1;
          sctx.beginPath();
          sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          sctx.fillStyle = `rgba(255,255,255,${s.a})`;
          sctx.fill();
        }
        requestAnimationFrame(drawStars);
      }
      drawStars();
    })();

    // ==================== 返回按钮 ====================
    function goBack() {
      window.location.href = '/game/';
    }

    // ==================== 游戏核心变量 ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const coinsElement = document.getElementById('coins');
    const speedElement = document.getElementById('speed');
    const weatherTextElement = document.getElementById('weatherText');
    const windTextElement = document.getElementById('windText');
    const weatherTag = document.getElementById('weatherTag');

    const groundTextureImg = document.getElementById('groundTexture');
    const dinoSpriteSheetImg = document.getElementById('dinoSpriteSheet');
    const coinImg = document.getElementById('coinImage');
    const flyImg = document.getElementById('flyImage');
    const xrzImg = document.getElementById('xrzImage');

    let imagesToLoad = 3;
    let allImagesLoaded = false;

    function onImageLoad() {
      imagesToLoad--;
      if (imagesToLoad === 0) {
        allImagesLoaded = true;
        if (!window.gameStarted) {
          window.gameStarted = true;
          resetGame();
        }
      }
    }

    let fps = 60;
    let fpsInterval = 1000 / fps;
    let lastDrawTime = performance.now();

    // 游戏状态
    let gameSpeed = 2.5;
    let score = 0;
    let coinsCollected = 0;
    let isGameOver = false;
    let isJumping = false;
    let gravity = 0.5;
    let baseJumpVelocity = -12;
    let velocity = 0;
    let dinoY = 0;
    let dinoHeight = 47;
    let dinoWidth = 44;

    const GROUND_HEIGHT = 20;
    const GROUND_TILE_WIDTH = 1200;
    const ORIGINAL_GROUND_Y = canvas.height - GROUND_HEIGHT;
    const GROUND_Y = ORIGINAL_GROUND_Y - 6;
    const DINO_GROUND_Y = ORIGINAL_GROUND_Y - dinoHeight;
    let groundX = 0;
    let obstacleDistance = 233;
    let obstacleDistanceCur = 0;

    // 天气系统
    let currentWeather = 'sunny';
    let windDirection = 0;
    let windEffect = 0;
    let rainDrops = [];
    let weatherCooldown = 0;
    const cooldownDuration = 10 * 60;
    let manualWeatherActive = false;

    // 风粒子
    let windParticles = [];
    const maxParticles = 100;
    const particleSpawnRate = 0.1;

    let obstacles = [];
    let coins = [];

    let dinoAnimationFrame = 0;
    let dinoAnimationTimer = 0;
    const dinoAnimationInterval = 150;

    const dino = {
      x: 50,
      y: DINO_GROUND_Y,
      width: dinoWidth,
      height: dinoHeight,
      jump: function() {
        if (!isJumping && !isGameOver) {
          isJumping = true;
          const effectiveJumpVel = (currentWeather === 'rainy' && manualWeatherActive) ? baseJumpVelocity * 0.7 : baseJumpVelocity;
          velocity = effectiveJumpVel;
        }
      },
      update: function() {
        if (isJumping) {
          this.y += velocity;
          velocity += gravity;
          if (this.y >= DINO_GROUND_Y) {
            this.y = DINO_GROUND_Y;
            isJumping = false;
            velocity = 0;
          }
        }
        if (!isJumping) {
          dinoAnimationTimer += 16.67;
          if (dinoAnimationTimer >= dinoAnimationInterval) {
            dinoAnimationTimer = 0;
            dinoAnimationFrame = (dinoAnimationFrame + 1) % 4;
          }
        }
      },
      draw: function() {
        if (isGameOver) {
          ctx.drawImage(dinoSpriteSheetImg, 176, 0, 44, 47, this.x, this.y, this.width, this.height);
        } else {
          ctx.drawImage(dinoSpriteSheetImg, dinoAnimationFrame * 44, 0, 44, 47, this.x, this.y, this.width, this.height);
        }
      }
    };

    // ==================== 触屏支持 ====================
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
    }, { passive: false });

    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    let lastTapTime = 0;

    canvas.addEventListener('touchstart', function(e) {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchStartTime = Date.now();
    });

    canvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const dt = Date.now() - touchStartTime;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (isGameOver) {
        resetGame();
        return;
      }

      // 短点击 = 跳跃
      if (absDx < 30 && absDy < 30 && dt < 300) {
        dino.jump();
        return;
      }

      // 滑动检测（需要滑动超过40px）
      if (absDx < 40 && absDy < 40) return;

      if (absDy > absDx && dy < -40) {
        // 上滑 = 跳跃
        dino.jump();
      } else if (absDy > absDx && dy > 40) {
        // 下滑 = 下雨
        if (currentWeather !== 'rainy') {
          triggerRain();
        }
      } else if (absDx > absDy && dx < -40) {
        // 左滑 = 左风
        if (windDirection !== -1) {
          triggerWindLeft();
        }
      } else if (absDx > absDy && dx > 40) {
        // 右滑 = 右风
        if (windDirection !== 1) {
          triggerWindRight();
        }
      }
    });

    // 移动端按钮事件
    document.getElementById('btnJump').addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (isGameOver) resetGame();
      else dino.jump();
    });
    document.getElementById('btnWindL').addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (!isGameOver && windDirection !== -1) triggerWindLeft();
    });
    document.getElementById('btnWindR').addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (!isGameOver && windDirection !== 1) triggerWindRight();
    });
    document.getElementById('btnRain').addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (!isGameOver && currentWeather !== 'rainy') triggerRain();
    });
    document.getElementById('btnRestart').addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (isGameOver) resetGame();
    });

    function triggerRain() {
      currentWeather = 'rainy';
      manualWeatherActive = true;
      weatherTextElement.textContent = '下雨';
      windTextElement.textContent = '无风';
      windEffect = 0;
      windDirection = 0;
      weatherCooldown = cooldownDuration;
      rainDrops = [];
      windParticles = [];
      updateWeatherUI();
    }
    function triggerWindLeft() {
      currentWeather = 'windy';
      manualWeatherActive = true;
      weatherTextElement.textContent = '刮风';
      windTextElement.textContent = '← 左';
      windDirection = -1;
      windEffect = -1.5;
      weatherCooldown = cooldownDuration;
      rainDrops = [];
      windParticles = [];
      updateWeatherUI();
    }
    function triggerWindRight() {
      currentWeather = 'windy';
      manualWeatherActive = true;
      weatherTextElement.textContent = '刮风';
      windTextElement.textContent = '右 →';
      windDirection = 1;
      windEffect = 1.5;
      weatherCooldown = cooldownDuration;
      rainDrops = [];
      windParticles = [];
      updateWeatherUI();
    }

    function updateWeatherUI() {
      if (currentWeather === 'sunny') {
        weatherTag.className = 'weather-tag sunny';
        weatherTag.textContent = '☀️ 晴朗';
      } else if (currentWeather === 'windy') {
        weatherTag.className = 'weather-tag windy';
        weatherTag.textContent = '💨 刮风';
      } else if (currentWeather === 'rainy') {
        weatherTag.className = 'weather-tag rainy';
        weatherTag.textContent = '🌧️ 下雨';
      }
    }

    // ==================== 键盘输入 ====================
    document.addEventListener('keydown', function(e) {
      if ((e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') && !isGameOver) {
        e.preventDefault();
        dino.jump();
      }
      if (e.code === 'KeyS' && !isGameOver && currentWeather !== 'rainy') {
        e.preventDefault();
        triggerRain();
      }
      if (e.code === 'KeyA' && !isGameOver && windDirection !== -1) {
        e.preventDefault();
        triggerWindLeft();
      }
      if (e.code === 'KeyD' && !isGameOver && windDirection !== 1) {
        e.preventDefault();
        triggerWindRight();
      }
      if ((e.code === 'KeyR' || e.code === 'KeyS') && isGameOver) {
        e.preventDefault();
        resetGame();
      }
    });

    // ==================== 游戏逻辑 ====================
    function checkPitFall(dinoObj, pitList) {
      if (!isJumping) {
        const dinoX1 = dinoObj.x;
        const dinoX2 = dinoObj.x + dinoObj.width;
        for (const pit of pitList) {
          if (pit.type === 'pit') {
            if (dinoX1 >= pit.x && dinoX2 <= pit.x + pit.width) return true;
          }
        }
      }
      return false;
    }

    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    function spawnObstacle() {
      const rand = Math.random();
      let type;
      if (rand < 0.3) {
        type = Math.random() < 0.3 ? 'ptera' : 'cactus';
      } else if (rand < 0.7) {
        type = 'cactus';
      } else {
        type = 'pit';
      }
      const spawnChance = 0.5 + score * 0.00001;
      if (Math.random() > spawnChance) return;

      let obstacle;
      switch (type) {
        case 'cactus':
          obstacle = { x: canvas.width, y: ORIGINAL_GROUND_Y - 30, width: 20, height: 30, type: 'cactus', img: xrzImg };
          break;
        case 'ptera':
          obstacle = { x: canvas.width, y: ORIGINAL_GROUND_Y - 60 - Math.random() * 60, width: 45, height: 30, type: 'ptera', img: flyImg };
          break;
        case 'pit':
          obstacle = { x: canvas.width, y: ORIGINAL_GROUND_Y, width: 60 + Math.random() * 60, height: GROUND_HEIGHT, type: 'pit' };
          break;
        default: return;
      }
      obstacles.push(obstacle);
    }

    function spawnCoin() {
      const baseCoinRate = 0.015;
      const coinDifficultyFactor = 1 + score * 0.00002;
      if (Math.random() < baseCoinRate * coinDifficultyFactor) {
        const coinRadius = 12;
        coins.push({
          x: canvas.width,
          y: ORIGINAL_GROUND_Y - Math.random() * 150,
          radius: coinRadius,
          type: 'coin',
          img: coinImg
        });
      }
    }

    function updateWeatherAndEffects() {
      if (weatherCooldown > 0) {
        weatherCooldown--;
        if (weatherCooldown === 0) {
          currentWeather = 'sunny';
          weatherTextElement.textContent = '晴朗';
          windTextElement.textContent = '无风';
          windEffect = 0;
          windDirection = 0;
          rainDrops = [];
          windParticles = [];
          manualWeatherActive = false;
          updateWeatherUI();
        }
      }
      if (currentWeather === 'rainy' && manualWeatherActive) {
        if (Math.random() < 0.3) {
          rainDrops.push({ x: Math.random() * canvas.width, y: -10, length: 10 + Math.random() * 10, speed: 5 + Math.random() * 5 });
        }
        for (let i = rainDrops.length - 1; i >= 0; i--) {
          rainDrops[i].y += rainDrops[i].speed;
          if (rainDrops[i].y > canvas.height) rainDrops.splice(i, 1);
        }
      }
      if (currentWeather === 'windy' && manualWeatherActive) {
        for (let i = windParticles.length - 1; i >= 0; i--) {
          const p = windParticles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < -10 || p.x > canvas.width + 10 || p.y < -10 || p.y > canvas.height + 10) {
            windParticles.splice(i, 1);
          }
        }
        if (windParticles.length < maxParticles && Math.random() < particleSpawnRate) {
          windParticles.push({
            x: windDirection > 0 ? -10 : canvas.width + 10,
            y: Math.random() * canvas.height,
            vx: windDirection * (2 + Math.random() * 3),
            vy: Math.random() * 1 - 0.5,
            size: 1 + Math.random() * 2
          });
        }
      }
    }

    function gameLoop(currentTime) {
      if (isGameOver) {
        drawGameOver();
        return;
      }
      requestAnimationFrame(gameLoop);
      const elapsed = currentTime - lastDrawTime;
      if (elapsed <= fpsInterval) return;

      lastDrawTime = currentTime - (elapsed % fpsInterval);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      gameSpeed = 2.5 + score * 0.0005 + windEffect;

      updateWeatherAndEffects();

      groundX -= gameSpeed;
      if (groundX <= -GROUND_TILE_WIDTH) groundX = 0;

      ctx.drawImage(groundTextureImg, groundX, GROUND_Y, GROUND_TILE_WIDTH, GROUND_HEIGHT);
      ctx.drawImage(groundTextureImg, groundX + GROUND_TILE_WIDTH, GROUND_Y, GROUND_TILE_WIDTH, GROUND_HEIGHT);

      // 风粒子
      if (currentWeather === 'windy' && manualWeatherActive) {
        ctx.fillStyle = 'DarkKhaki';
        for (const p of windParticles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      obstacleDistanceCur += gameSpeed;
      if (obstacleDistanceCur > obstacleDistance) {
        obstacleDistanceCur = 0;
        spawnObstacle();
      }
      spawnCoin();

      const pits = [];
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= gameSpeed;
        if (o.type === 'pit') {
          pits.push(o);
        } else {
          if (o.type === 'cactus') {
            ctx.drawImage(xrzImg, o.x - o.width / 2, o.y - o.height, o.width * 2, o.height * 2);
          } else if (o.type === 'ptera') {
            ctx.drawImage(flyImg, o.x - o.width / 2, o.y - o.height / 2, o.width * 2, o.height * 2);
          }
          if (checkCollision({ x: dino.x, y: dino.y, width: dino.width, height: dino.height }, o)) {
            isGameOver = true;
          }
        }
        if (o.x + o.width < 0) obstacles.splice(i, 1);
      }

      for (const pit of pits) {
        ctx.fillStyle = '#f7f7f7';
        ctx.fillRect(pit.x, pit.y, pit.width, pit.height);
        if (checkPitFall(dino, pits)) isGameOver = true;
      }

      // 金币
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.x -= gameSpeed;
        ctx.drawImage(coinImg, c.x - c.radius, c.y - c.radius, c.radius * 2, c.radius * 2);
        const dx = dino.x + dino.width / 2 - c.x;
        const dy = dino.y + dino.height / 2 - c.y;
        if (Math.sqrt(dx * dx + dy * dy) < dino.width / 2 + c.radius) {
          coins.splice(i, 1);
          coinsCollected++;
          score += 100;
        }
        if (c.x + c.radius < 0) coins.splice(i, 1);
      }

      // 雨滴
      if (currentWeather === 'rainy' && manualWeatherActive) {
        ctx.strokeStyle = 'blue'; ctx.lineWidth = 1;
        for (const drop of rainDrops) {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 5, drop.y + drop.length);
          ctx.stroke();
        }
      }

      // 冷却条
      if (weatherCooldown > 0) {
        const bx = 10, by = 10, bw = 100, bh = 10;
        const fw = (weatherCooldown / cooldownDuration) * bw;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = 'rgba(0,128,255,0.7)';
        ctx.fillRect(bx, by, fw, bh);
        ctx.strokeStyle = 'black'; ctx.lineWidth = 1;
        ctx.strokeRect(bx, by, bw, bh);
      }

      dino.update();
      dino.draw();

      score++;
      scoreElement.textContent = score;
      coinsElement.textContent = coinsCollected;
      speedElement.textContent = gameSpeed.toFixed(1);
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = '40px "Segoe UI", "PingFang SC", Arial';
      ctx.fillStyle = '#ff6b35';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 50);
      ctx.font = '20px "Segoe UI", "PingFang SC", Arial';
      ctx.fillStyle = 'white';
      ctx.fillText(`最终分数: ${score}`, canvas.width / 2, canvas.height / 2);
      ctx.fillText(`收集金币: ${coinsCollected}`, canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillText('点击屏幕 / 按 R 键重新开始', canvas.width / 2, canvas.height / 2 + 62);
    }

    function resetGame() {
      if (!allImagesLoaded) {
        setTimeout(resetGame, 100);
        return;
      }
      isGameOver = false;
      score = 0;
      coinsCollected = 0;
      gameSpeed = 2.5;
      obstacles = [];
      coins = [];
      dino.y = DINO_GROUND_Y;
      isJumping = false;
      velocity = 0;
      currentWeather = 'sunny';
      windDirection = 0;
      windEffect = 0;
      rainDrops = [];
      windParticles = [];
      weatherTextElement.textContent = '晴朗';
      windTextElement.textContent = '无风';
      weatherCooldown = 0;
      manualWeatherActive = false;
      dinoAnimationFrame = 0;
      dinoAnimationTimer = 0;
      groundX = 0;
      obstacleDistanceCur = 0;
      scoreElement.textContent = score;
      coinsElement.textContent = coinsCollected;
      speedElement.textContent = gameSpeed.toFixed(1);
      updateWeatherUI();
      window.gameStarted = true;
      lastDrawTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // 加载完成后启动
    window.addEventListener('load', function() {
      document.getElementById('loader').style.display = 'none';
    });
    resetGame();
  </script>
</body>
