    <style>
        :root {
          --bg-body: var(--color-bg);
          --bg-mica: var(--color-bg-glass);
          --bg-mica-scroll: var(--color-bg-glass-solid);
          --bg-mica-hover: var(--color-bg-glass-hover);
          --border-mica: var(--color-border);
          --text-primary: var(--color-text-primary);
          --text-secondary: var(--color-text-secondary);
          --accent: var(--color-accent);
          --accent-glow: var(--color-accent-glow);
          --accent-glow-weak: rgba(0,113,227,0.05);
          --shadow-rest: var(--shadow-sm);
          --shadow-hover: var(--shadow-lg);
          --radius-sm: 8px; --radius-md: 12px;
        }
        .mica {
          background: var(--bg-mica);
          background-image: var(--iridescent);
          -webkit-backdrop-filter: blur(24px);
          backdrop-filter: blur(24px);
          border: 1px solid var(--border-mica);
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }
        body {
            margin: 0;
            padding: 20px;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            color: var(--color-text-primary);
            font-family: var(--font-sans);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            border: 1px solid #000;
            background-color: #f7f7f7;
            max-width: 100%;
            height: auto;
        }
        #gameInfo {
            margin-top: 10px;
            font-size: 18px;
            text-align: center;
            color: var(--color-text-primary);
        }
        #weatherInfo {
            margin-top: 5px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        #groundTexture, #dinoSpriteSheet, #coinImage, #flyImage, #xrzImage { display: none; }
        /* 触屏按钮 */
        #touchBtns {
            display: none;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .touch-btn {
            padding: 10px 18px;
            font-size: 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-bg-glass);
            color: var(--color-text-primary);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all var(--duration-instant) var(--spring-default);
        }
        .touch-btn:active {
            background: var(--color-bg-hover);
            transform: scale(0.95);
        }
        @media (max-width: 850px) {
            #touchBtns { display: flex; }
        }

    <script>
        // ====================== 导航栏 JS ======================
        KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        // 主题切换
        const themeBtn = document.getElementById('themeBtn');

        KJ.onSystemThemeChange(updateThemeUI);
        updateThemeUI();

        // 退出登录
        var logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) logoutBtn.addEventListener('click', async function() {
          if (!confirm('确定退出登录？')) return;
          try { if (sb) await sb.auth.signOut(); } catch(e) {}
          window.location.href = '/';
        });

    <script>
        // ====================== 云同步 + 游戏逻辑 ======================
        // Supabase 初始化
        let sb = null;
        try { if (window.supabase) sb = window.supabase.createClient('https://vzqspcuxnwpakofwumat.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6cXNwY3V4bndwYWtvZnd1bWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4ODI4MTUsImV4cCI6MjA5OTQ1ODgxNX0.AlV_3gWTWTrFBO-_nYD_8RaKoC-m5p-7VpZwbnPp-Pg', { auth: { persistSession: true, storage: { getItem: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }, setItem: function(k,v) { try { localStorage.setItem(k,v); } catch(e) {} }, removeItem: function(k) { try { localStorage.removeItem(k); } catch(e) {} } } } }); } catch(e) { console.warn('Supabase init failed, score saving disabled'); }
        if (!sb) sb = KJ.createSupabase();
        if (sb) KJ.initMessageBanner(sb);

        function getStoredUser() {
          try {
            var now3 = Date.now();
            for (var i3 = 0; i3 < localStorage.length; i3++) {
              var key3 = localStorage.key(i3);
              if (key3 && key3.indexOf('sb-') === 0 && key3.indexOf('auth-token') !== -1) {
                var val3 = JSON.parse(localStorage.getItem(key3));
                if (val3 && val3.user && val3.expires_at) {
                  if (val3.expires_at * 1000 > now3) return val3.user;
                  try { localStorage.removeItem(key3); } catch(e) {}
                }
              }
            }
          } catch(e) {}
          return null;
        }

        function updateAuthUI(user) {
          var hint = document.getElementById('authHint');
          if (!hint) return;
          if (user) {
            var nick = user.user_metadata?.nick || user.email?.split('@')[0] || '用户';
            hint.innerHTML = '<span style="color:var(--color-success)"><i class="fas fa-check"></i></span> 已登录：' + KJ.escapeHtml(nick) + ' · 记录将自动同步云端';
          } else {
            hint.innerHTML = '<a href="/login/?redirect=/game/dino/" style="color:var(--color-accent);text-decoration:none">登录</a> 以同步游戏记录到云端';
          }
        }

        updateAuthUI(getStoredUser());

        if (sb) {
          sb.auth.onAuthStateChange(function(event, session) {
            updateAuthUI(session?.user || null);
          });
          sb.auth.getSession().then(function(r) {
            updateAuthUI(r?.data?.session?.user || null);
          }).catch(function() {});
        }
        const GAME_NAME = 'dino';

        async function saveScore(finalScore) {
          if (!sb) return;
          try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { KJ.toast('请先登录以同步游戏记录'); return; }
            const userId = session.user.id;

            const { error: insErr } = await sb.from('game_scores').insert({
              user_id: userId, game: GAME_NAME, score: finalScore
            });
            if (insErr) { KJ.toast('云端同步失败: '+KJ.formatSupabaseError(insErr)); return; }

            const { data: cloudBest } = await sb
              .from('game_scores').select('score').eq('game', GAME_NAME)
              .order('score', { ascending: false }).limit(1).maybeSingle();
            const { data: myBest } = await sb
              .from('game_scores').select('score').eq('user_id', userId).eq('game', GAME_NAME)
              .order('score', { ascending: false }).limit(1).maybeSingle();

            if (cloudBest) document.getElementById('dinoCloudBest').textContent = cloudBest.score;
            if (myBest) document.getElementById('dinoMyBest').textContent = myBest.score;
          } catch(e) { console.warn('Save score failed:', e); KJ.toast('云端同步失败，请检查网络连接'); }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const coinsElement = document.getElementById('coins');
        const weatherTextElement = document.getElementById('weatherText');
        const windTextElement = document.getElementById('windText');
        // --- 获取预加载的图像 ---
        const groundTextureImg = document.getElementById('groundTexture');
        const dinoSpriteSheetImg = document.getElementById('dinoSpriteSheet');
        const coinImg = document.getElementById('coinImage');
        const flyImg = document.getElementById('flyImage');
        const xrzImg = document.getElementById('xrzImage');

        // --- 添加一个加载计数器，确保所有图片都加载完成后再开始游戏 ---
        let imagesToLoad = 3; // coin, fly, xrz
        let allImagesLoaded = false;
		
		let fps = 60;
		let fpsInterval = 1000 / fps;
		let lastDrawTime = performance.now();

        function onImageLoad() {
            imagesToLoad--;
            if (imagesToLoad <= 0) {
                imagesToLoad = 0;
                allImagesLoaded = true;
                console.log("All images loaded, ready to start game.");
                if (typeof gameLoop === 'function' && !window.gameStarted) {
                    window.gameStarted = true;
                    resetGame();
                }
            }
        }
        
        function onImageError(img, name) {
            if (img && img.dataset && img.dataset.loaded === 'done') return;
            if (img && img.dataset) img.dataset.loaded = 'done';
            console.warn('Image ' + name + ' failed to load, using fallback');
            onImageLoad();
        }
        
        // 超时兜底：5秒后强制开始（即使图片未加载完成）
        setTimeout(function() {
            if (!allImagesLoaded) {
                console.warn('Image load timeout, forcing game start');
                imagesToLoad = 0;
                allImagesLoaded = true;
                if (typeof gameLoop === 'function' && !window.gameStarted) {
                    window.gameStarted = true;
                    resetGame();
                }
            }
        }, 5000);

        // 游戏状态
        let gameSpeed = 5;
        let score = 0;
        let coinsCollected = 0;
        let isGameOver = false;
        let scoreSaved = false; // 防止重复保存云端分数
        let isJumping = false;
        let gravity = 0.5;
        let jumpVelocity = -12;
        let baseJumpVelocity = -12;
        let velocity = 0;
        let dinoY = canvas.height - 60;
        // --- 新的恐龙尺寸 ---
        let dinoHeight = 47;
        let dinoWidth = 44;
        // --- 地面贴图相关 ---
        const GROUND_HEIGHT = 20;
        const GROUND_TILE_WIDTH = 1200;
        const ORIGINAL_GROUND_Y = canvas.height - GROUND_HEIGHT; // 原始地面贴图的Y坐标
        const GROUND_Y = ORIGINAL_GROUND_Y - 6; // 地面贴图上移6个像素
        const DINO_GROUND_Y = ORIGINAL_GROUND_Y - dinoHeight; // 恐龙站在地面上时的Y坐标，基于原始位置
        let groundX = 0; // 地面贴图的X坐标偏移
		let obstacleDistance=233;
		let obstacleDistanceCur=0;

        // 天气系统
        let currentWeather = 'sunny';
        let windDirection = 0;
        let windEffect = 0;
        let rainDrops = [];

        // --- 手动天气召唤新增 ---
        let weatherCooldown = 0; // 冷却时间计数器 (以帧为单位)
        const cooldownDuration = 10 * 60; // 10秒冷却时间，假设每秒60帧
        let manualWeatherActive = false; // 标记是否是手动触发的天气

        // --- 风粒子系统 ---
        let windParticles = [];
        const maxParticles = 100; // 最大粒子数量
        const particleSpawnRate = 0.1; // 每帧生成粒子的概率


        // 游戏对象数组
        let obstacles = []; // 包含所有障碍物 (仙人掌, 翼龙, 沟壑)
        let coins = [];

        // --- 恐龙动画相关 ---
        let dinoAnimationFrame = 0;
        let dinoAnimationTimer = 0;
        const dinoAnimationInterval = 150; // 每150毫秒切换一次帧

        // --- 恐龙对象 ---
        const dino = {
            x: 50,
            y: DINO_GROUND_Y, // 初始化在地面 (基于原始位置)
            width: dinoWidth, // --- 使用新宽度 ---
            height: dinoHeight, // --- 使用新高度 ---
            jump: function() {
                if (!isJumping) {
                    isJumping = true;
                        const effectiveJumpVel = currentWeather === 'rainy' && manualWeatherActive ? baseJumpVelocity * 0.7 : baseJumpVelocity;
                        velocity = effectiveJumpVel;
                }
            },
            update: function() {
                if (isJumping) {
                    this.y += velocity;
                    velocity += gravity;
                    if (this.y >= DINO_GROUND_Y) { // 检查是否回到地面 (基于原始位置)
                        this.y = DINO_GROUND_Y; // 确保精确地停在地面上 (基于原始位置)
                        isJumping = false;
                        velocity = 0;
                    }
                }

                // --- 更新动画 ---
                if (!isJumping) { // 只有在地面奔跑时才播放奔跑动画
                    dinoAnimationTimer += 16.67; // 假设每帧大约16.67ms (60fps)
                    if (dinoAnimationTimer >= dinoAnimationInterval) {
                        dinoAnimationTimer = 0;
                        // 循环播放前4帧 (索引 0, 1, 2, 3)，每帧宽50px -> 现在是44px
                        dinoAnimationFrame = (dinoAnimationFrame + 1) % 4;
                    }
                }
            },
            draw: function() {
                // --- 绘制动画 ---
                if (isGameOver) {
                    // 游戏结束时，绘制失败帧 (第5帧和第6帧，索引为4和5)
                    // 这里我们选择绘制第5帧作为失败画面 (索引4)
                    // --- 调整源尺寸为 44x47 ---
                    ctx.drawImage(
                        dinoSpriteSheetImg,
                        176, // (frameIndex * frameWidth) -> 4 * 44
                        0,
                        44, // frameWidth
                        47, // frameHeight
                        this.x,
                        this.y,
                        this.width, // 目标宽度
                        this.height // 目标高度
                    );
                } else {
                    // 正常奔跑时，绘制当前奔跑帧 (前4帧，索引 0, 1, 2, 3)
                    // --- 调整源尺寸为 44x47 ---
                    ctx.drawImage(
                        dinoSpriteSheetImg,
                        dinoAnimationFrame * 44, // 根据当前帧索引计算源X坐标 (44px per frame)
                        0, // 源Y坐标始终为0
                        44, // 每帧的宽度
                        47, // 每帧的高度
                        this.x,
                        this.y,
                        this.width, // 目标宽度
                        this.height // 目标高度
                    );
                }
            }
        };


        // 输入处理
        document.addEventListener('keydown', function(e) {
            if ((e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') && !isGameOver) {
                dino.jump();
            }
            // --- 修改：R键改为S键召唤雨天 ---
            if (e.code === 'KeyS' && !isGameOver&&currentWeather!='rainy') { // 移除了 && weatherCooldown === 0
                // S键召唤雨天
                currentWeather = 'rainy';
                manualWeatherActive = true; // 标记为手动天气
                weatherTextElement.textContent = '下雨';
                windTextElement.textContent = '无';
                windEffect = 0;
                windDirection = 0;
                weatherCooldown = cooldownDuration; // 设置冷却时间 -> 立即重置
                rainDrops = []; // 清空可能存在的旧雨滴
                windParticles = []; // 清空风粒子
            }
            if (e.code === 'KeyA' && !isGameOver&&windDirection!=-1) { // 移除了 && weatherCooldown === 0
                // A键召唤左方向风
                currentWeather = 'windy';
                manualWeatherActive = true; // 标记为手动天气
                weatherTextElement.textContent = '刮风';
                windTextElement.textContent = '向左';
                windDirection = -1;
                windEffect = windDirection * 1.5;
                weatherCooldown = cooldownDuration; // 设置冷却时间 -> 立即重置
                rainDrops = []; // 清空可能存在的旧雨滴
                windParticles = []; // 清空风粒子
            }
            if (e.code === 'KeyD' && !isGameOver&&windDirection!=1) { // 移除了 && weatherCooldown === 0
                // D键召唤右方向风
                currentWeather = 'windy';
                manualWeatherActive = true; // 标记为手动天气
                weatherTextElement.textContent = '刮风';
                windTextElement.textContent = '向右';
                windDirection = 1;
                windEffect = windDirection * 1.5;
                weatherCooldown = cooldownDuration; // 设置冷却时间 -> 立即重置
                rainDrops = []; // 清空可能存在的旧雨滴
                windParticles = []; // 清空风粒子
            }
            if ((e.code === 'KeyR' || e.code === 'KeyS') && isGameOver) { // 按 R 或 S 键都可以重新开始
                resetGame();
            }
        });

        // --- 重写沟壑掉落判断 ---
        function checkPitFall(dinoObj, pitList) {
            // 关键：只有在恐龙**不跳跃**（即在原始地面）时才检查
            if (!isJumping) {
                // 计算恐龙的 X 范围 (X1 到 X2)
                const dinoX1 = dinoObj.x;
                const dinoX2 = dinoObj.x + dinoObj.width;

                // 遍历所有沟壑 (Z1 到 Z2)
                for (const pit of pitList) {
                    if (pit.type === 'pit') {
                        const pitZ1 = pit.x;
                        const pitZ2 = pit.x + pit.width;

                        // 判断条件：X1 > Z1 且 X2 < Z2
                        // 即恐龙的整个身体都在沟壑内部
                        if (dinoX1 >= pitZ1 && dinoX2 <= pitZ2) {
                             console.log("恐龙完全踏入沟壑！"); // 调试信息
                             // 使用原始地面位置进行判断，确保逻辑一致
                             return true; // 判定失败
                        }
                    }
                }
            }
            // 如果恐龙在跳跃，或者不在任何沟壑内部，则不会失败
            return false;
        }


        // --- 标准碰撞检测 ---
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // --- 新增：生成障碍物 ---
        function spawnObstacle() {
            const obstacleTypes = ['cactus', 'ptera', 'pit'];
            // --- 调整翼龙出现概率 ---
            // 生成一个随机数，决定是生成普通障碍物还是翼龙
            const rand = Math.random();
            let type;
            if (rand < 0.3) { // 30% 概率考虑翼龙
                if (Math.random() < 0.3) { // 在这30%里，再有30%概率是翼龙 -> 总体 0.3 * 0.3 = 0.09 = 9%
                    type = 'ptera';
                } else {
                    type = obstacleTypes[0]; // 默认仙人掌
                }
            } else if (rand < 0.7) { // 40% 概率仙人掌
                type = 'cactus';
            } else { // 30% 概率沟壑
                type = 'pit';
            }

            // 限制障碍物生成频率，避免过于密集
            const spawnChance = 0.5 + score * 0.00001; // 基础概率随分数缓慢增长
            if (Math.random() > spawnChance) {
                return; // 未达到生成概率，直接返回
            }

            let obstacle;
            switch (type) {
                case 'cactus':
                    obstacle = {
                        x: canvas.width,
                        y: ORIGINAL_GROUND_Y - 30, // 高度基于原始地面位置
                        width: 20, // --- 判定宽度 ---
                        height: 30, // --- 判定高度 ---
                        type: 'cactus',
                        img: xrzImg // --- 引用图片 ---
                    };
                    break;
                case 'ptera':
                    // --- 调整翼龙碰撞体积 ---
                    const pteraWidth = 45; // 
                    const pteraHeight =30; // 
                    obstacle = {
                        x: canvas.width,
                        y: ORIGINAL_GROUND_Y - 60 - Math.random() * 60, // Y坐标在地面以上一定范围内随机
                        width: pteraWidth, // --- 判定宽度 ---
                        height: pteraHeight, // --- 判定高度 ---
                        type: 'ptera',
                        img: flyImg // --- 引用图片 ---
                    };
                    break;
                case 'pit':
                    const pitWidth = 60 + Math.random() * 60; // 沟壑宽度在60到120之间
                    obstacle = {
                        x: canvas.width,
                        y: ORIGINAL_GROUND_Y, // 沟壑的Y坐标就是地面贴图的位置
                        width: pitWidth,
                        height: GROUND_HEIGHT, // 沟壑深度等于地面贴图高度
                        type: 'pit'
                    };
                    break;
                default:
                    return; // 如果类型未知，不生成
            }
            obstacles.push(obstacle);
        }

        function spawnCoin() {
            // 提高基础生成率以便更容易看到效果
            const baseCoinRate = 0.015; // 从 0.008 提高到 0.015
            const coinDifficultyFactor = 1 + score * 0.00002;
            if (Math.random() < baseCoinRate * coinDifficultyFactor) {
                // --- 调整金币碰撞体积 ---
                const coinRadius = 8 * 1.5; // --- 半径增加50% ---
                coins.push({
                    x: canvas.width,
                    y: ORIGINAL_GROUND_Y - Math.random() * 150, // 金币的Y坐标也基于原始地面位置
                    radius: coinRadius, // --- 判定半径 ---
                    type: 'coin',
                    img: coinImg // --- 引用图片 ---
                });
            }
        }

        // 更新天气和雨滴 (仅在手动天气模式下)
        function updateWeatherAndEffects() {
            // 更新冷却时间
            if (weatherCooldown > 0) {
                weatherCooldown--;
                // 如果冷却结束，自动恢复到晴天
                if (weatherCooldown === 0) {
                    currentWeather = 'sunny';
                    weatherTextElement.textContent = '晴朗';
                    windTextElement.textContent = '无';
                    windEffect = 0;
                    windDirection = 0;
                    rainDrops = []; // 清空雨滴
                    windParticles = []; // 清空风粒子
                    manualWeatherActive = false; // 重置手动标记
                }
            }
            // 注意：如果冷却时间 > 0，但用户又按了新的天气键，
            // 那么在按键事件中会立即设置新的天气状态并重置冷却时间。
            // 因此，这里不需要做其他特殊处理。

            // 如果是手动触发的雨天，则生成雨滴
            if (currentWeather === 'rainy' && manualWeatherActive) {
                if (Math.random() < 0.3) {
                    rainDrops.push({
                        x: Math.random() * canvas.width,
                        y: -10,
                        length: 10 + Math.random() * 10,
                        speed: 5 + Math.random() * 5
                    });
                }
                for (let i = rainDrops.length - 1; i >= 0; i--) {
                    const drop = rainDrops[i];
                    drop.y += drop.speed;
                    if (drop.y > canvas.height) {
                        rainDrops.splice(i, 1);
                    }
                }
            }

            // 如果是手动触发的风天，则更新和生成风粒子
            if (currentWeather === 'windy' && manualWeatherActive) {
                // --- 更新现有粒子 ---
                for (let i = windParticles.length - 1; i >= 0; i--) {
                    const p = windParticles[i];
                    p.x += p.vx; // 根据粒子自身的速度移动
                    p.y += p.vy; // 粒子也有垂直速度（可选，可以更自然）

                    // 如果粒子移出屏幕边界，则移除它
                    if (p.x < -10 || p.x > canvas.width + 10 || p.y < -10 || p.y > canvas.height + 10) {
                        windParticles.splice(i, 1);
                    }
                }

                // --- 生成新粒子 ---
                // 根据风向决定生成位置
                let spawnX = windDirection > 0 ? -10 : canvas.width + 10; // 从右边或左边进入
                let spawnY = Math.random() * canvas.height; // Y轴随机

                if (windParticles.length < maxParticles && Math.random() < particleSpawnRate) {
                    windParticles.push({
                        x: spawnX,
                        y: spawnY,
                        vx: windDirection * (2 + Math.random() * 3), // 粒子水平速度与风向一致
                        vy: Math.random() * 1 - 0.5, // 粒子垂直速度随机，范围 [-0.5, 0.5]
                        size: 1 + Math.random() * 2 // 粒子大小随机，范围 [1, 3]
                    });
                }
            }
        }

        // 游戏主循环
        function gameLoop(currentTime) {
            if (isGameOver) {
                if (!scoreSaved && score > 0) {
                  scoreSaved = true;
                  saveScore(score);
                }
                drawGameOver();
                return;
            }
			requestAnimationFrame(gameLoop);
			let elapsed = currentTime - lastDrawTime;
			if (elapsed > fpsInterval) {
				// 减去余数以修正误差，保持时间步长稳定
		        lastDrawTime = currentTime - (elapsed % fpsInterval);

           	ctx.clearRect(0, 0, canvas.width, canvas.height);

            gameSpeed = 5 + score * 0.0005 + windEffect;

            updateWeatherAndEffects(); // 更新天气和所有效果

            // --- 绘制地面贴图 ---
            // 更新地面贴图位置
            groundX -= gameSpeed;
            // 如果第一张图完全移出屏幕左侧，则重置位置，利用第二张图继续显示
            if (groundX <= -GROUND_TILE_WIDTH) {
                groundX = 0;
            }

            // 绘制两张地面贴图，一张衔接另一张，形成无缝滚动
            ctx.drawImage(groundTextureImg, groundX, GROUND_Y, GROUND_TILE_WIDTH, GROUND_HEIGHT); // 绘制在新的Y位置
            ctx.drawImage(groundTextureImg, groundX + GROUND_TILE_WIDTH, GROUND_Y, GROUND_TILE_WIDTH, GROUND_HEIGHT); // 绘制在新的Y位置

            // --- 绘制风粒子 ---
            if (currentWeather === 'windy' && manualWeatherActive) {
                ctx.fillStyle = 'DarkKhaki'; // --- 设置粒子颜色 ---
                for (const p of windParticles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
			obstacleDistanceCur+=gameSpeed;
			if(obstacleDistanceCur>obstacleDistance)
			{
				obstacleDistanceCur=0;
	            // --- 生成新的障碍物 ---
	            spawnObstacle();	
			}

            spawnCoin(); // 调用生成金币的函数

            // --- 绘制和更新所有障碍物 ---
            // 为了绘制沟壑覆盖效果，我们需要先处理非沟壑障碍物，再处理沟壑
            let pits = [];
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];

                // --- 移动障碍物 ---
                o.x -= gameSpeed;

                // --- 处理不同类型的障碍物 ---
                if (o.type === 'pit') {
                    pits.push(o); // 收集沟壑用于后续处理
                    // 不在这里绘制沟壑，因为我们要先画其他障碍物，再用沟壑“擦除”地面
                } else {
                    // --- 绘制非沟壑障碍物 (使用图片) ---
                    if (o.type === 'cactus') {
                        // --- 绘制仙人掌图片，缩放到判定框的大小 ---
                        ctx.drawImage(xrzImg, o.x-o.width/2, o.y-o.height, o.width*2, o.height*2);
                    } else if (o.type === 'ptera') {
                        // --- 绘制翼龙图片，缩放到判定框的大小 (增加50%) ---
                        ctx.drawImage(flyImg, o.x-o.width/2, o.y-o.height/2, o.width*2, o.height*2);
                    }

                    // --- 检测与其他障碍物的碰撞 ---
                    const dinoRect = {
                        x: dino.x,
                        y: dino.y,
                        width: dino.width,
                        height: dino.height
                    };
                    if (checkCollision(dinoRect, o)) {
                        console.log("碰撞到障碍物！"); // 调试信息
                        isGameOver = true;
                    }
                }

                // --- 移除移出屏幕的障碍物 ---
                if (o.x + o.width < 0) {
                    obstacles.splice(i, 1); // 从数组中移除
                }
            }

            // --- 现在处理沟壑：绘制并覆盖地面 ---
            for (const pit of pits) {
                // 绘制沟壑的背景色（露出画布的浅灰色背景），使其看起来像一个洞
                // 为了清晰看到效果，我们用浅蓝色表示沟壑
                // ctx.fillStyle = '#f7f7f7';
                // ctx.fillRect(pit.x, pit.y, pit.width, pit.height);

                // 更优雅的方式：绘制一个矩形来“擦除”该区域的地面贴图
                // 沟壑的位置仍然基于原始地面，但视觉上它会出现在移动后的地面贴图之上
                ctx.fillStyle = '#f7f7f7'; // 使用画布背景色
                ctx.fillRect(pit.x, pit.y, pit.width, pit.height);

                // 检测是否掉入沟壑 - 关键调用位置
                // 将整个pit数组传入，以便函数内部循环检查
                if (checkPitFall(dino, pits)) {
                    isGameOver = true;
                }
            }


            // --- 绘制和更新金币 ---
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.x -= gameSpeed;

                // --- 绘制金币图片，缩放到直径为 radius*2 的大小 (增加50%) ---
                ctx.drawImage(coinImg, c.x - c.radius, c.y - c.radius, c.radius * 2, c.radius * 2);

                const dx = dino.x + dino.width/2 - c.x;
                const dy = dino.y + dino.height/2 - c.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < dino.width/2 + c.radius) {
                    coins.splice(i, 1);
                    coinsCollected++;
                    score += 100;
                    scoreElement.textContent = score;
                    coinsElement.textContent = coinsCollected;
                }

                if (c.x + c.radius < 0) {
                    coins.splice(i, 1);
                }
            }

            // --- 绘制雨滴 ---
            if (currentWeather === 'rainy' && manualWeatherActive) {
                ctx.strokeStyle = 'blue'; // --- 设置雨滴颜色为蓝色 ---
                ctx.lineWidth = 1;
                for(const drop of rainDrops) {
                    ctx.beginPath();
                    ctx.moveTo(drop.x, drop.y);
                    ctx.lineTo(drop.x - 5, drop.y + drop.length);
                    ctx.stroke();
                }
            }

            // --- 绘制冷却进度条 ---
            if (weatherCooldown > 0) {
                const barX = 10;
                const barY = 10;
                const barWidth = 100;
                const barHeight = 10;
                const fillWidth = (weatherCooldown / cooldownDuration) * barWidth;

                // 背景
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                // 填充
                ctx.fillStyle = 'rgba(0, 128, 255, 0.7)';
                ctx.fillRect(barX, barY, fillWidth, barHeight);
                // 边框
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
            }

            // --- 更新和绘制恐龙 ---
            dino.update();
            dino.draw(); // 调用新的draw方法

            // --- 更新分数 ---
            score++;
            scoreElement.textContent = score;


			}


            //requestAnimationFrame(gameLoop);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '40px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 40);

            ctx.font = '20px Arial';
            ctx.fillText(`最终分数: ${score}`, canvas.width / 2, canvas.height / 2);
            ctx.fillText(`收集金币: ${coinsCollected}`, canvas.width / 2, canvas.height / 2 + 30);
            ctx.fillText('按 R 键或 S 键重新开始', canvas.width / 2, canvas.height / 2 + 60);
        }

        function resetGame() {
            // 等待图片加载完成再开始
            if (!allImagesLoaded) {
                 console.log("Waiting for images to load...");
                 setTimeout(resetGame, 100); // 100ms后再次尝试
                 return;
            }
            
            isGameOver = false;
            score = 0;
            coinsCollected = 0;
            // --- 基础速度降低50% ---
            gameSpeed = 2.5;
            obstacles = []; // 重置障碍物数组
            coins = [];
            dino.y = DINO_GROUND_Y; // 重置到地面 (基于原始位置)
            isJumping = false;
            velocity = 0;

            // --- 重置天气状态 ---
            currentWeather = 'sunny';
            windDirection = 0;
            windEffect = 0;
            rainDrops = [];
            windParticles = []; // 重置风粒子数组
            weatherTextElement.textContent = '晴朗';
            windTextElement.textContent = '无';

            // 重置手动天气变量
            weatherCooldown = 0;
            manualWeatherActive = false;

            // 重置动画状态
            dinoAnimationFrame = 0;
            dinoAnimationTimer = 0;

            // 重置地面贴图位置
            groundX = 0;

            scoreElement.textContent = score;
            coinsElement.textContent = coinsCollected;
            window.gameStarted = true; // 标记游戏已开始
            gameLoop();
        }

        // 开始游戏
        // 处理已缓存的图片（onload 不会再次触发），必须在所有 let 变量声明之后
        [coinImg, flyImg, xrzImg].forEach(function(img) {
            if (img.complete && img.naturalWidth > 0) onImageLoad();
        });
        resetGame(); // 使用resetGame来初始化并启动游戏
    </script>

<div id="toast" class="toast hidden"></div>
