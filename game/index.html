<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 游戏中心 | 精选小游戏合集">
  <title>游戏中心 · KJLLin</title>
  <style>
    html {
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent; outline: none;
      transition: inherit; -webkit-transition: inherit;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255, 255, 255, 0.85);
      --bg-mica-scroll: rgba(255, 255, 255, 0.92);
      --bg-mica-hover: rgba(255, 255, 255, 0.9);
      --border-mica: rgba(0, 0, 0, 0.06);
      --border-mica-hover: rgba(0, 120, 212, 0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.1);
      --accent-glow-weak: rgba(0, 120, 212, 0.05);
      --shadow-rest: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.09);
      --shadow-scroll: 0 4px 12px rgba(0, 0, 0, 0.08);
      --scroll-bar: #c4c4c4;
    }
    [data-theme="dark"]:root {
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20, 20, 20, 0.85);
      --bg-mica-scroll: rgba(20, 20, 20, 0.92);
      --bg-mica-hover: rgba(26, 26, 26, 0.9);
      --border-mica: rgba(255, 255, 255, 0.07);
      --border-mica-hover: rgba(0, 120, 212, 0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.15);
      --accent-glow-weak: rgba(0, 120, 212, 0.07);
      --shadow-rest: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-scroll: 0 4px 12px rgba(0, 0, 0, 0.3);
      --scroll-bar: #4a4a4a;
    }

    html, body {
      width: 100%; min-height: 100vh; overflow-x: hidden;
      position: relative; touch-action: pan-y;
    }
    body { background: var(--bg-body); color: var(--text-primary); }

    .bg-base {
      position: fixed; inset: 0; background: var(--bg-body);
      z-index: -3; pointer-events: none;
    }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%;
      width: 55%; height: 55%; border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
      -webkit-animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%;
      width: 60%; height: 60%; border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
      -webkit-animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }
    @-webkit-keyframes micaFloat {
      0%, 100% { -webkit-transform: translate(0, 0) scale(1); }
      50% { -webkit-transform: translate(4%, 4%) scale(1.05); }
    }

    .mica {
      background: var(--bg-mica);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
    }

    .container {
      max-width: 960px; margin: 0 auto;
      padding: 28px 16px; position: relative; z-index: 1;
    }

    /* 导航栏 */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-radius: var(--radius-md);
      margin-bottom: 30px; box-shadow: var(--shadow-rest);
      position: sticky; top: 16px; z-index: 90;
    }
    .navbar.scrolled {
      background: var(--bg-mica-scroll);
      box-shadow: var(--shadow-scroll);
      transform: translateY(-2px);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      border: none; background: rgba(220, 220, 220, 0.4);
      color: var(--text-primary); font-size: 18px; cursor: pointer;
      display: grid; place-items: center;
    }
    [data-theme="dark"] .back-btn { background: rgba(40, 40, 40, 0.4); }
    .back-btn:hover { background: rgba(220, 220, 220, 0.6); }
    [data-theme="dark"] .back-btn:hover { background: rgba(50, 50, 50, 0.6); }
    .back-btn:active { transform: scale(0.95); }
    .logo {
      font-size: 20px; font-weight: 600; color: var(--accent);
      letter-spacing: 0.2px;
    }

    .theme-btn {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      border: none; font-size: 18px;
      background: rgba(220, 220, 220, 0.4);
      color: var(--text-primary); cursor: pointer;
      display: grid; place-items: center;
    }
    [data-theme="dark"] .theme-btn { background: rgba(40, 40, 40, 0.4); }
    .theme-btn:hover { background: rgba(220, 220, 220, 0.6); }
    [data-theme="dark"] .theme-btn:hover { background: rgba(50, 50, 50, 0.6); }
    .theme-btn:active { transform: scale(0.95); }

    /* 页头 */
    .page-header {
      text-align: center; margin-bottom: 50px;
      animation: fadeUp 0.8s var(--win-ease) forwards;
      will-change: transform, opacity;
    }
    .header-icon { font-size: 64px; margin-bottom: 16px; }
    .header-title {
      font-size: 32px; font-weight: 700;
      background: linear-gradient(90deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text; background-clip: text;
      color: transparent; display: inline-block; margin-bottom: 8px;
    }
    .header-desc { font-size: 15px; color: var(--text-secondary); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @-webkit-keyframes fadeUp {
      from { opacity: 0; -webkit-transform: translateY(24px); }
      to { opacity: 1; -webkit-transform: translateY(0); }
    }

    /* 游戏卡片网格 */
    .section-title {
      font-size: 20px; font-weight: 600; margin-bottom: 20px;
      opacity: 0; animation: fadeUp 0.7s var(--win-ease) forwards 0.2s;
      -webkit-animation: fadeUp 0.7s var(--win-ease) forwards 0.2s;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; margin-bottom: 60px;
    }
    .game-card {
      display: block; padding: 28px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest);
      text-decoration: none; color: inherit; cursor: pointer;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s var(--win-ease) forwards;
      -webkit-animation: fadeUp 0.7s var(--win-ease) forwards;
      user-select: none; -webkit-user-select: none;
      z-index: 1; will-change: transform, box-shadow;
    }
    .game-card:nth-child(1) { animation-delay: 0.3s; -webkit-animation-delay: 0.3s; }
    .game-card:nth-child(2) { animation-delay: 0.4s; -webkit-animation-delay: 0.4s; }
    .game-card:nth-child(3) { animation-delay: 0.5s; -webkit-animation-delay: 0.5s; }

    .card-shine {
      position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transition: left 0.7s var(--win-ease); pointer-events: none; z-index: 0;
    }
    .game-card:hover {
      transform: translateY(-6px); -webkit-transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-mica-hover);
      background: var(--bg-mica-hover);
    }
    .game-card:hover .card-shine { left: 100%; }

    .card-icon {
      font-size: 42px; margin-bottom: 14px; position: relative; z-index: 2;
      pointer-events: none;
      transition: transform var(--transition-fast);
      -webkit-transition: transform var(--transition-fast);
    }
    .game-card:hover .card-icon {
      transform: scale(1.12); -webkit-transform: scale(1.12);
    }
    .card-title {
      font-size: 18px; font-weight: 600; margin-bottom: 8px;
      color: var(--accent); position: relative; z-index: 2; pointer-events: none;
    }
    .card-desc {
      font-size: 13px; color: var(--text-tertiary); line-height: 1.5;
      position: relative; z-index: 2; pointer-events: none;
    }
    .card-tags {
      display: flex; gap: 6px; margin-top: 12px;
      position: relative; z-index: 2; pointer-events: none;
    }
    .tag {
      font-size: 11px; padding: 3px 10px; border-radius: 12px;
      background: var(--accent-glow); color: var(--accent);
      font-weight: 500;
    }

    /* 页脚 */
    .footer {
      text-align: center; padding: 30px 20px;
      font-size: 13px; color: var(--text-tertiary);
      border-top: 1px solid var(--border-mica);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
      .navbar { padding: 12px 16px; margin-bottom: 24px; top: 12px; }
      .card-grid { grid-template-columns: 1fr; gap: 16px; }
      .header-icon { font-size: 52px; }
      .header-title { font-size: 26px; }
      .game-card { padding: 24px 20px; }
      .bg-mica-glow-1, .bg-mica-glow-2 {
        animation: none; -webkit-animation: none;
      }
    }

    * { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>

  <div class="container">
    <!-- 导航栏 -->
    <nav class="navbar mica" id="navbar">
      <div class="nav-left">
        <button class="back-btn" onclick="goHome()" aria-label="返回主页">←</button>
        <span class="logo">游戏中心</span>
      </div>
      <button id="themeBtn" class="theme-btn" aria-label="切换深色/浅色模式">🌙</button>
    </nav>

    <!-- 页头 -->
    <header class="page-header">
      <div class="header-icon">🎮</div>
      <h1 class="header-title">游戏中心</h1>
      <p class="header-desc">精选小游戏合集，随时开玩</p>
    </header>

    <!-- 游戏列表 -->
    <section>
      <h2 class="section-title">全部游戏</h2>
      <div class="card-grid">

        <a href="/game/dino/" class="game-card mica">
          <div class="card-shine"></div>
          <div class="card-icon">🦖</div>
          <h3 class="card-title">恐龙快跑升级版</h3>
          <p class="card-desc">Chrome 经典小恐龙跑酷游戏，支持触屏滑动操作。躲避障碍、收集金币、召唤天气，挑战更高分数！</p>
          <div class="card-tags">
            <span class="tag">跑酷</span>
            <span class="tag">触屏</span>
            <span class="tag">天气系统</span>
          </div>
        </a>

      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      © 2026 KJLLin · 游戏中心
    </footer>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const root = document.documentElement;
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const themeBtn = document.getElementById('themeBtn');
    const navbar = document.getElementById('navbar');
    let isScrolling = false;
    let touchStartData = {};

    function goHome() {
      window.location.href = '/';
    }

    // 触摸点击判定
    function handleTouchStart(e) {
      touchStartData = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
    function handleTouchEnd(e, callback) {
      const t = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, time: Date.now() };
      const dx = Math.abs(t.x - touchStartData.x);
      const dy = Math.abs(t.y - touchStartData.y);
      const dt = t.time - touchStartData.time;
      if (dx < 10 && dy < 10 && dt < 300) {
        e.preventDefault(); e.stopPropagation(); callback();
      }
    }

    // 主题
    function initTheme() {
      try {
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const localDark = localStorage.getItem('theme') === 'dark';
        if (localDark || sysDark) {
          root.dataset.theme = 'dark';
          themeBtn.textContent = '☀️';
          metaTheme.content = '#0f0f0f';
        } else {
          themeBtn.textContent = '🌙';
          metaTheme.content = '#f3f3f3';
        }
      } catch(e) { themeBtn.textContent = '🌙'; }
    }

    function toggleTheme() {
      const isDark = root.dataset.theme === 'dark';
      if (isDark) {
        root.dataset.theme = '';
        localStorage.removeItem('theme');
        themeBtn.textContent = '🌙';
        metaTheme.content = '#f3f3f3';
      } else {
        root.dataset.theme = 'dark';
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '☀️';
        metaTheme.content = '#0f0f0f';
      }
    }

    function handleScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        navbar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    }

    window.addEventListener('DOMContentLoaded', initTheme);
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchstart', handleTouchStart);
    themeBtn.addEventListener('touchend', e => handleTouchEnd(e, toggleTheme));
    window.addEventListener('scroll', handleScroll);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', initTheme);
  </script>
</body>
</html>
