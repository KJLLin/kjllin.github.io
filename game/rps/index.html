<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f3f3f3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>石头剪刀布 · KJLLin</title>
  <meta name="description" content="石头剪刀布 - KJLLin 猜拳游戏，支持人机与双人联机">
    <style>
        :root {
          --accent: var(--color-accent, #0071e3);
          --bg-glass: var(--color-bg-glass, rgba(255,255,255,0.7));
          --border: var(--color-border, rgba(0,0,0,0.08));
          --text: var(--color-text-primary, #1d1d1f);
          --text2: var(--color-text-secondary, #86868b);
          --text3: var(--color-text-tertiary, #aeaeb2);
          --danger: #ff3b30;
          --success: #34c759;
          --warning: #ff9500;
          --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body {
            margin: 0; padding: 20px; padding-top: 80px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background: var(--color-bg, #f5f5f7);
            color: var(--text);
            font-family: var(--font-sans, system-ui);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .container { max-width: 480px; width: 100%; }
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            text-align: center;
        }

        .loading-shield {
            position: fixed; inset: 0; z-index: 999;
            background: var(--color-bg, #f5f5f7);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px;
        }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .mode-tab {
            flex: 1; padding: 12px; border-radius: 14px; border: 1px solid var(--border);
            background: transparent; color: var(--text2); font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .mode-tab:hover { border-color: var(--accent); color: var(--accent); }
        .mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .choices { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
        .choice-btn {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--border);
            background: var(--bg-glass); font-size: 32px; cursor: pointer; transition: all .2s var(--spring);
            display: flex; align-items: center; justify-content: center; color: var(--text);
        }
        .choice-btn:hover { transform: scale(1.1); border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,113,227,0.25); }
        .choice-btn:active { transform: scale(0.92); transition: all .08s; }
        .choice-btn.disabled { pointer-events: none; opacity: 0.45; transform: none; }

        .battle-area { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .player-side { text-align: center; }
        .player-emoji { font-size: 64px; transition: transform .3s var(--spring); color: var(--text); }
        .player-emoji.winner { animation: bounce .5s ease; color: var(--accent); }
        .player-emoji.pop-in { animation: popIn .35s var(--spring); }
        .player-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
        .player-name { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 2px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
        .vs { font-size: 24px; font-weight: 900; color: var(--text3); }
        .result-text { font-size: 22px; font-weight: 700; margin: 8px 0; min-height: 32px; }
        .result-text.win { color: var(--success); }
        .result-text.lose { color: var(--danger); }
        .result-text.draw { color: var(--warning); }

        @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
        @keyframes popIn { 0%{transform:scale(0.4);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

        .scoreboard { display: flex; justify-content: center; gap: 28px; margin: 10px 0; }
        .score-item { text-align: center; min-width: 48px; }
        .score-num { font-size: 28px; font-weight: 700; }
        .score-label { font-size: 11px; color: var(--text3); }
        .score-item .score-num.win-color { color: var(--success); }
        .score-item .score-num.lose-color { color: var(--danger); }

        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 8px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 12px;
            background: var(--accent-glow-weak, rgba(0,113,227,0.05));
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.waiting { background: var(--warning); animation: pulse 1.5s infinite; }
        .status-dot.ready { background: var(--success); }
        .status-dot.locked { background: var(--accent); }
        .status-dot.expired { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .room-setup { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .room-header {
            display: flex; align-items: center; gap: 8px; justify-content: center;
            margin-bottom: 4px;
        }
        .room-code {
            font-size: 36px; font-weight: 900; letter-spacing: 6px; color: var(--accent);
            font-family: 'Courier New', monospace;
        }
        .copy-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-glass); color: var(--text2); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            transition: all .15s;
        }
        .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
        .copy-btn.copied { background: var(--success); color: #fff; border-color: var(--success); }

        .btn {
            padding: 10px 24px; border-radius: 12px; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
        .btn:disabled { opacity: 0.5; pointer-events: none; transform: none; }
        .input {
            padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
            font-size: 16px; text-align: center; background: var(--bg-glass); color: var(--text);
            width: 120px; letter-spacing: 4px; font-family: 'Courier New', monospace;
            outline: none; transition: border-color .2s;
        }
        .input:focus { border-color: var(--accent); }
        .waiting-text { color: var(--text2); font-size: 14px; }
        .waiting-dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }

        .history { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        .history-dot { width: 10px; height: 10px; border-radius: 50%; }
        .history-dot.win { background: var(--success); }
        .history-dot.lose { background: var(--danger); }
        .history-dot.draw { background: var(--warning); }

        .connect-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .connect-tab {
            flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border);
            background: transparent; color: var(--text2); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .connect-tab:hover { border-color: var(--accent); color: var(--accent); }
        .connect-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .invite-section {
            display: flex; flex-direction: column; gap: 12px; align-items: center;
        }
        .invite-search-box {
            position: relative; width: 100%; max-width: 280px;
        }
        .invite-input {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border); font-size: 14px;
            background: var(--bg-glass); color: var(--text); outline: none;
            box-sizing: border-box;
        }
        .invite-input:focus { border-color: var(--accent); }
        .invite-results {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 10px; margin-top: 4px;
            max-height: 200px; overflow-y: auto; display: none;
        }
        .invite-results.show { display: block; }
        .invite-result-item {
            padding: 10px 14px; cursor: pointer; display: flex; align-items: center;
            gap: 10px; font-size: 13px; transition: background .15s;
        }
        .invite-result-item:hover { background: var(--accent-glow-weak); }
        .invite-result-item .invite-avatar {
            width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; flex-shrink: 0;
        }
        .invite-result-item .invite-info { overflow: hidden; text-align: left; }
        .invite-result-item .invite-nick { font-weight: 600; color: var(--text); }
        .invite-result-item .invite-email { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .invite-hint { font-size: 12px; color: var(--text3); }

        .conv-list-inline { width: 100%; max-width: 300px; }
        .conv-list-inline .conv-item-inline {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 10px; cursor: pointer; transition: background .15s;
        }
        .conv-list-inline .conv-item-inline:hover { background: var(--accent-glow-weak); }
        .conv-list-inline .conv-item-inline.sent { opacity: 0.6; pointer-events: none; }
        .conv-list-inline .conv-item-inline .conv-name { font-weight: 600; font-size: 14px; }
        .conv-list-inline .conv-item-inline .conv-email { font-size: 11px; color: var(--text3); }

        .sent-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
        .sent-tag {
            font-size: 12px; padding: 4px 10px; border-radius: 8px;
            background: var(--success); color: #fff; display: flex; align-items: center; gap: 4px;
        }
        .timeout-bar {
            font-size: 12px; color: var(--text3); margin-top: 4px;
        }
        .timeout-bar.expiring { color: var(--danger); }

        /* 活跃房间卡片 */
        .active-room-card {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px;
            cursor: pointer; transition: all .15s; background: var(--bg-glass);
        }
        .active-room-card:hover { border-color: var(--accent); background: var(--accent-glow-weak); }
        .active-room-card .room-type-icon { font-size: 18px; color: var(--accent); width: 32px; text-align: center; flex-shrink: 0; }
        .active-room-card .room-info { flex: 1; min-width: 0; }
        .active-room-card .room-info-title { font-size: 13px; font-weight: 600; color: var(--text); }
        .active-room-card .room-info-detail { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-room-card .room-status-badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
        .room-status-badge.waiting { background: rgba(255,149,0,0.15); color: var(--warning); }
        .room-status-badge.playing { background: rgba(52,199,89,0.15); color: var(--success); }
        .my-rooms-header { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .my-rooms-header .count { font-size: 11px; font-weight: 400; color: var(--text3); }

        /* 邀请确认弹窗 */
        .invite-modal {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
        }
        .invite-modal-card {
            background: var(--bg-glass); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 32px 28px; max-width: 340px; width: 90%;
            text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.15);
            animation: modalIn .3s var(--spring);
        }
        @keyframes modalIn { from { opacity:0;transform:scale(0.9) translateY(20px) } to { opacity:1;transform:scale(1) translateY(0) } }
        .invite-modal-icon { font-size: 36px; margin-bottom: 12px; color: var(--accent); }

        .divider-text {
            display: flex; align-items: center; gap: 10px; color: var(--text3);
            font-size: 13px; margin: 4px 0; width: 200px;
        }
        .divider-text::before, .divider-text::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        @media (max-width: 420px) {
            .choice-btn { width: 68px; height: 68px; font-size: 28px; }
            .player-emoji { font-size: 52px; }
            .room-code { font-size: 28px; letter-spacing: 4px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js" integrity="sha384-EyR2P0dlmjnEGcm9xcjdAn0VedZpRHEwDLP9oSS6wYMvzHBHkUrvgonveazJ/sSx" crossorigin="anonymous"></script>
    <script src="/common.js"></script>
</head>
<body>

<div class="loading-shield" id="authShield">
  <div class="loading-spinner"></div>
  <span style="color:var(--text2);font-size:14px">正在验证身份...</span>
</div>

<div class="bg-base"></div>

<header class="top-menu">
  <nav class="menu-bar mica" id="menuBar">
    <span class="menu-logo">KJLLin</span>
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item active"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
    <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
    <span id="userTag" class="menu-user-tag"></span>
    <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
    <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
  </nav>
  <div class="mobile-menu-dropdown mica" id="mobileMenu">
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item active"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
    <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
  </div>
</header>

<div class="container" id="mainContent" style="display:none">
  <h2 style="text-align:center"><i class="fas fa-hand-back-fist"></i> <i class="fas fa-hand"></i> <i class="fas fa-hand-scissors"></i> 石头剪刀布</h2>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabAI" onclick="switchMode('ai')"><i class="fas fa-robot"></i> 人机对战</button>
    <button class="mode-tab" id="tabOnline" onclick="switchMode('online')"><i class="fas fa-globe"></i> 双人联机</button>
  </div>

  <!-- ========== AI 模式 ========== -->
  <div id="aiMode">
    <div class="card">
      <div class="scoreboard">
        <div class="score-item"><div class="score-num win-color" id="aiMyScore">0</div><div class="score-label">胜</div></div>
        <div class="score-item"><div class="score-num" id="aiDrawScore" style="color:var(--warning)">0</div><div class="score-label">平</div></div>
        <div class="score-item"><div class="score-num lose-color" id="aiBotScore">0</div><div class="score-label">负</div></div>
      </div>
      <div class="battle-area">
        <div class="player-side">
          <div class="player-emoji" id="aiMyEmoji"><i class="fas fa-circle-question"></i></div>
          <div class="player-label">你</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-side">
          <div class="player-emoji" id="aiBotEmoji"><i class="fas fa-robot"></i></div>
          <div class="player-label">AI</div>
        </div>
      </div>
      <div class="result-text" id="aiResult"></div>
      <div class="choices">
        <button class="choice-btn" onclick="playAI('rock')"><i class="fas fa-hand-back-fist"></i></button>
        <button class="choice-btn" onclick="playAI('paper')"><i class="fas fa-hand"></i></button>
        <button class="choice-btn" onclick="playAI('scissors')"><i class="fas fa-hand-scissors"></i></button>
      </div>
      <div class="history" id="aiHistory"></div>
    </div>
  </div>

  <!-- ========== 联机模式 ========== -->
  <div id="onlineMode" style="display:none">
    <div class="card" id="onlineSetup">
      <h3 style="margin-top:0"><i class="fas fa-globe"></i> 双人联机对战</h3>

      <!-- 你创建的活跃房间 -->
      <div id="myActiveRooms" style="display:none;margin-bottom:16px;text-align:left"></div>

      <div class="connect-tabs">
        <button class="connect-tab active" id="tabCode" onclick="switchConnect('code')"><i class="fas fa-key"></i> 房间号</button>
        <button class="connect-tab" id="tabInvite" onclick="switchConnect('invite')"><i class="fas fa-paper-plane"></i> 邀请卡片</button>
      </div>

      <!-- 方式一：房间号 -->
      <div id="connectCode">
        <div class="room-setup">
          <button class="btn btn-primary" onclick="createRoom()" style="width:200px"><i class="fas fa-plus"></i> 创建房间</button>
          <div class="divider-text">— 或 —</div>
          <input type="text" class="input" id="roomCodeInput" placeholder="房间号" maxlength="4" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
          <button class="btn btn-outline" onclick="joinRoom()" style="width:200px"><i class="fas fa-door-open"></i> 加入房间</button>
        </div>
      </div>

      <!-- 方式二：邀请卡片 -->
      <div id="connectInvite" style="display:none">
        <div class="invite-section">
          <p class="invite-hint">向站内信好友发送对战邀请卡片，好友通过卡片链接加入</p>
          <button class="btn btn-primary" id="createInviteBtn" onclick="createInviteRoom()" style="width:220px"><i class="fas fa-plus"></i> 创建房间并发起邀请</button>
          <div id="inviteAfterCreate" style="display:none">
            <!-- 隐藏房间号，仅后端持有 -->
            <div class="divider-text" style="font-size:12px">选择好友发送邀请</div>

            <!-- 站内信最近联系人 -->
            <div class="conv-list-inline" id="convListInline">
              <div style="color:var(--text3);font-size:13px;padding:8px">加载最近联系人...</div>
            </div>

            <!-- 搜索更多 -->
            <div class="invite-search-box" style="margin-top:8px">
              <input type="text" class="invite-input" id="inviteInput" placeholder="搜索其他用户邮箱..." autocomplete="off">
              <div class="invite-results" id="inviteResults"></div>
            </div>
            <div class="sent-list" id="sentList"></div>

            <!-- 跳转按钮 -->
            <button class="btn btn-outline btn-sm" id="enterGameBtn" style="display:none;margin-top:8px" onclick="enterGameFromInvite()"><i class="fas fa-gamepad"></i> 进入游戏房间等待</button>
            <div class="timeout-bar" id="inviteTimeout"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="onlineGame" style="display:none">
      <div class="room-header">

</div>

<script>
// ====================== 导航栏 ======================
KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
var themeBtn = document.getElementById('themeBtn');
function updateThemeUI() {
  var state = KJ.applyTheme('#f5f5f7', '#0a0a0a');
  themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
}
themeBtn.addEventListener('click', function() {
  KJ.toggleTheme(); updateThemeUI();
});
KJ.onSystemThemeChange(updateThemeUI);
updateThemeUI();

// ====================== Supabase ======================
var sb = KJ.createSupabase();
if (sb) KJ.initNav(sb, { homeUrl: '/' });
else KJ.initNav(null, { homeUrl: '/' });

// ====================== 常量 ======================
var CHOICE_ICON = { rock: '<i class="fas fa-hand-back-fist"></i>', paper: '<i class="fas fa-hand"></i>', scissors: '<i class="fas fa-hand-scissors"></i>' };
var PLACEHOLDER_ICON = '<i class="fas fa-circle-question"></i>';
var WIN_MAP = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

function getResult(a, b) {
  if (a === b) return 'draw';
  return WIN_MAP[a] === b ? 'win' : 'lose';
}

// ====================== 服务端房间管理 ======================
async function createRoomInDB(code, inviteOnly, invitedIds) {
  if (!sb || !myUserId) return false;
  // 顺手清理旧房间（懒清理，零额外开销）
  sb.rpc('clean_expired_rps_rooms').then(function(){}).catch(function(){});
  var { error } = await sb.from('rps_rooms').insert({
    code: code,
    host_id: myUserId,
    host_nick: myNick,
    invite_only: inviteOnly || false,
    invited_users: invitedIds || [],
    expires_at: new Date(Date.now() + 15 * 60 * 1000).toISOString()
  });
  return !error;
}

async function validateRoomInDB(code) {
  if (!sb) return { ok: false, reason: 'network' };
  var { data, error } = await sb.from('rps_rooms')
    .select('*').ilike('code', code).maybeSingle();
  if (error || !data) return { ok: false, reason: 'not_found' };
  if (data.status === 'closed') return { ok: false, reason: 'closed' };
  if (new Date(data.expires_at) < new Date()) {
    await sb.from('rps_rooms').update({ status: 'closed' }).ilike('code', code);
    return { ok: false, reason: 'expired' };
  }
  if (data.status === 'playing' && data.joined_by && data.joined_by !== myUserId) {
    return { ok: false, reason: 'full' };
  }
  return { ok: true, room: data };
}

async function joinRoomInDB(code) {
  if (!sb || !myUserId) { KJ.toast('加入失败，请重试'); return false; }
  var { error } = await sb.from('rps_rooms')
    .update({ joined_by: myUserId, status: 'playing' })
    .ilike('code', code).eq('status', 'waiting');
  if (error) { KJ.toast('加入失败，请重试'); return false; }
  // 回读校验：并发加入时后到者的 update 匹配 0 行，需确认真正写入的是自己
  var { data: room } = await sb.from('rps_rooms')
    .select('code,status,joined_by').ilike('code', code).maybeSingle();
  if (!room || room.joined_by !== myUserId) {
    KJ.toast('房间已被其他玩家加入');
    return false;
  }
  return true;
}

async function closeRoomInDB(code) {
  if (!sb) return;
  await sb.from('rps_rooms').update({ status: 'closed' }).ilike('code', code).eq('host_id', myUserId);
}

// 监听房间状态变化（服务端关闭通知 + 双方出拳判断）
function subscribeRoomChanges(code, onClosed, onBothMoved) {
  if (!sb) return null;
  return sb.channel('rps-db-' + code)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rps_rooms', filter: 'code=eq.' + code }, function(payload) {
      if (!payload.new) return;
      if (payload.new.status === 'closed') { onClosed(); return; }
      // 双方都已出拳 → 服务端触发揭晓
      if (payload.new.host_move && payload.new.guest_move && payload.new.round_status === 'waiting') {
        if (onBothMoved) onBothMoved(payload.new.host_move, payload.new.guest_move);
      }
    }).subscribe();
}

// ====================== 登录门控 ======================
var myUserId = null;
var myNick = '玩家';

function showMain() {
  document.getElementById('authShield').style.display = 'none';
  document.getElementById('mainContent').style.display = '';
}

function redirectLogin() {
  document.getElementById('authShield').style.display = 'none';
  document.getElementById('loginPrompt').style.display = '';
  setTimeout(function() {
    window.location.href = '/login/?redirect=/game/rps/';
  }, 3000);
}

if (sb) {
  sb.auth.getSession().then(function(r) {
    if (r && r.data && r.data.session) {
      myUserId = r.data.session.user.id;
      myNick = r.data.session.user.user_metadata && r.data.session.user.user_metadata.nick
        || (r.data.session.user.email ? r.data.session.user.email.split('@')[0] : '玩家');
      showMain();
      checkUrlRoom();
      loadMyActiveRooms();
    } else {
      redirectLogin();
    }
  }).catch(function() { redirectLogin(); });

  sb.auth.onAuthStateChange(function(event) {
    if (event === 'SIGNED_OUT') redirectLogin();
  });
} else {
  redirectLogin();
}

// ====================== URL 房间号自动加入 ======================
function checkUrlRoom() {
  var params = new URLSearchParams(window.location.search);
  var invite = params.get('invite');
  var room   = params.get('room');

  // 邀请链接（专属参数 ?invite=TOKEN，无法通过删除参数降级为 room 加入）
  if (invite && invite.length >= 8) {
    fromInvite = true;
    switchMode('online');
    switchConnect('code');
    // 清除 URL 参数防重复
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, '', '/game/rps/');
    }
    showInviteConfirm(invite.toUpperCase());
    return;
  }

  // 标准房间号链接
  if (room && room.length === 4) {
    switchMode('online');
    document.getElementById('roomCodeInput').value = room.toUpperCase();
    setTimeout(function() { joinRoom(); }, 500);
  }
}

// ====================== 邀请确认弹窗 ======================
var pendingInviteCode = null;

function showInviteConfirm(code) {
  pendingInviteCode = code;
  // 从 DB 获取邀请者昵称
  document.getElementById('inviteModalTitle').textContent = '石头剪刀布对战邀请';
  document.getElementById('inviteModalMsg').textContent = '有人邀请你进行对战，是否接受？';
  document.getElementById('inviteModal').style.display = '';
  // 异步获取邀请者信息
  if (sb) {
    sb.from('rps_rooms').select('host_nick').ilike('code', code).maybeSingle().then(function(r) {
      if (r && r.data && r.data.host_nick) {
        document.getElementById('inviteModalMsg').textContent = r.data.host_nick + ' 邀请你进行石头剪刀布对战，是否接受？';
      }
    }).catch(function() {});
  }
}

function acceptInvite() {
  document.getElementById('inviteModal').style.display = 'none';
  if (!pendingInviteCode) return;
  document.getElementById('roomCodeInput').value = pendingInviteCode;
  joinRoom();
  pendingInviteCode = null;
}

function declineInvite() {
  document.getElementById('inviteModal').style.display = 'none';
  pendingInviteCode = null;
  fromInvite = false;
  switchMode('ai');
}

// ====================== 联机变量 ======================
var currentRoom = null;
var onlineChannel = null;
var dbChannel = null;           // 服务端房间状态监听
var myOnlineChoice = null;
var oppOnlineChoice = null;
var isHost = false;
var onScores = { win: 0, draw: 0, lose: 0 };
var onlineRoundTimer = null;
var joinTimeoutId = null;
var inviteRoomCode = null;      // 邀请模式下隐藏的房间号
var inviteSentUsers = [];
var fromInvite = false;         // 是否来自邀请模式（隐藏房间号）

// ====================== 加载活跃房间 ======================
async function loadMyActiveRooms() {
  var el = document.getElementById('myActiveRooms');
  if (!sb || !myUserId) { el.style.display = 'none'; return; }
  try {
    var { data, error } = await sb.from('rps_rooms')
      .select('*').eq('host_id', myUserId)
      .in('status', ['waiting', 'playing'])
      .gt('expires_at', new Date().toISOString())
      .order('created_at', { ascending: false });
    if (error || !data || !data.length) { el.style.display = 'none'; return; }

    var html = '<div class="my-rooms-header"><i class="fas fa-door-open"></i> 你的房间 <span class="count">(' + data.length + ')</span></div>';
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var typeIcon = r.invite_only ? '<i class="fas fa-paper-plane"></i>' : '<i class="fas fa-key"></i>';
      var typeLabel = r.invite_only ? '邀请房间' : '房间号';
      var statusClass = r.status === 'playing' ? 'playing' : 'waiting';
      var statusLabel = r.status === 'playing' ? '对战中' : '等待中';
      var codeDisplay = r.invite_only ? '仅受邀可加入' : r.code;
      // 计算剩余时间
      var remaining = Math.max(0, new Date(r.expires_at) - new Date());
      var rm = Math.floor(remaining / 60000);
      var timeStr = rm > 0 ? rm + ' 分钟后过期' : '即将过期';
      html += '<div class="active-room-card" onclick="rejoinRoom(\'' + r.code + '\', ' + r.invite_only + ')" data-code="' + r.code + '">'
        + '<div class="room-type-icon">' + typeIcon + '</div>'
        + '<div class="room-info">'
        + '<div class="room-info-title">' + typeLabel + ' ' + KJ.escapeHtml(codeDisplay) + '</div>'
        + '<div class="room-info-detail">' + timeStr + '</div>'
        + '</div>'
        + '<div class="room-status-badge ' + statusClass + '">' + statusLabel + '</div>'
        + '</div>';
    }
    el.innerHTML = html;
    el.style.display = '';
  } catch(e) { el.style.display = 'none'; }
}

async function rejoinRoom(code, isInvite) {
  if (!sb) { KJ.toast('网络错误'); return; }
  fromInvite = isInvite;
  if (isInvite) {
    inviteRoomCode = code;
    // 加载受邀列表
    try {
      var { data } = await sb.from('rps_rooms').select('invited_users').ilike('code', code).maybeSingle();
      if (data && data.invited_users) {
        inviteSentUsers = data.invited_users.map(function(id) { return { id: id, nick: '' }; });
      }
    } catch(e) {}
    await openHostChannel(code);
    enterGameRoom(code, null);
  } else {
    await setupOnlineRoom(code, true);
  }
}

// ====================== 联机方式切换 ======================
var currentConnect = 'code';
function switchConnect(method) {
  currentConnect = method;
  document.getElementById('tabCode').classList.toggle('active', method === 'code');
  document.getElementById('tabInvite').classList.toggle('active', method === 'invite');
  document.getElementById('connectCode').style.display = method === 'code' ? '' : 'none';
  document.getElementById('connectInvite').style.display = method === 'invite' ? '' : 'none';
}

// ====================== 模式切换 ======================
var currentMode = 'ai';
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabAI').classList.toggle('active', mode === 'ai');
  document.getElementById('tabOnline').classList.toggle('active', mode === 'online');
  document.getElementById('aiMode').style.display = mode === 'ai' ? '' : 'none';
  document.getElementById('onlineMode').style.display = mode === 'online' ? '' : 'none';
  if (mode === 'online' && currentRoom) leaveRoom();
  if (mode === 'online') loadMyActiveRooms();
}

// ====================== AI 模式 ======================
var aiScores = { win: 0, draw: 0, lose: 0 };
var aiHistory = [];
var aiLocked = false;

function playAI(playerChoice) {
  if (aiLocked) return;
  aiLocked = true;
  var choices = ['rock', 'paper', 'scissors'];
  var botChoice = choices[Math.floor(Math.random() * 3)];
  var result = getResult(playerChoice, botChoice);
  var myEl = document.getElementById('aiMyEmoji');
  var botEl = document.getElementById('aiBotEmoji');

  myEl.innerHTML = CHOICE_ICON['rock']; botEl.innerHTML = CHOICE_ICON['rock'];
  var tick = 0;
  var interval = setInterval(function() {
    myEl.innerHTML = CHOICE_ICON[choices[tick % 3]];
    botEl.innerHTML = CHOICE_ICON[choices[(tick + 1) % 3]];
    tick++;
  }, 100);

  setTimeout(function() {
    clearInterval(interval);
    myEl.innerHTML = CHOICE_ICON[playerChoice];
    botEl.innerHTML = CHOICE_ICON[botChoice];
    myEl.classList.add('pop-in'); botEl.classList.add('pop-in');
    setTimeout(function() { myEl.classList.remove('pop-in'); botEl.classList.remove('pop-in'); }, 350);

    var resEl = document.getElementById('aiResult');
    if (result === 'win') {
      resEl.innerHTML = '<span class="win"><i class="fas fa-trophy"></i> 你赢了！</span>';
      myEl.classList.add('winner');
      aiScores.win++;
    } else if (result === 'lose') {
      resEl.innerHTML = '<span class="lose"><i class="fas fa-face-frown"></i> AI 赢了</span>';
      botEl.classList.add('winner');
      aiScores.lose++;
    } else {
      resEl.innerHTML = '<span class="draw"><i class="fas fa-handshake"></i> 平局</span>';
      aiScores.draw++;
    }
    setTimeout(function() { myEl.classList.remove('winner'); botEl.classList.remove('winner'); }, 500);

    document.getElementById('aiMyScore').textContent = aiScores.win;
    document.getElementById('aiDrawScore').textContent = aiScores.draw;
    document.getElementById('aiBotScore').textContent = aiScores.lose;
    aiHistory.push(result);
    updateAIHistory();
    aiLocked = false;
  }, 800);
}

function updateAIHistory() {
  var el = document.getElementById('aiHistory');
  el.innerHTML = aiHistory.slice(-30).map(function(r) {
    return '<span class="history-dot ' + r + '" title="' + (r === 'win' ? '胜' : r === 'lose' ? '负' : '平') + '"></span>';
  }).join('');
}

// ====================== 联机模式：创建/加入 ======================

function genRoomCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// 邀请专用：生成不可猜测的长令牌
function genInviteToken() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var tok = '';
  for (var i = 0; i < 12; i++) tok += chars[Math.floor(Math.random() * chars.length)];
  return tok;
}

// 生成未占用的房间码：先查重，撞码则重新生成，最多重试 5 次
async function genUniqueRoomCode(genFn) {
  if (!sb) return genFn();
  var code = genFn();
  for (var i = 0; i < 5; i++) {
    var { data } = await sb.from('rps_rooms').select('code').eq('code', code).maybeSingle();
    if (!data) return code; // 未被占用
    code = genFn();         // 撞码 → 重新生成
  }
  return code; // 兜底：仍撞码则交由插入环节报错
}

async function createRoom() {
  if (!sb) { KJ.toast('网络错误，请刷新重试'); return; }
  var code = await genUniqueRoomCode(genRoomCode);
  if (!(await createRoomInDB(code, false, []))) { KJ.toast('创建房间失败，请重试'); return; }
  await setupOnlineRoom(code, true);
}

async function joinRoom() {
  if (!sb) { KJ.toast('网络错误，请刷新重试'); return; }
  var code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (code.length !== 4 && code.length !== 12) { KJ.toast('请输入4位房间号'); return; }
  var valid = await validateRoomInDB(code);
  if (!valid.ok) {
    KJ.toast(valid.reason === 'expired' ? '房间已过期' : valid.reason === 'closed' ? '房间已关闭' : valid.reason === 'full' ? '房间已满' : '房间不存在或已过期');
    return;
  }
  // 不能加入自己创建的房间（避免 host 把自己写成 guest）
  if (valid.room && valid.room.host_id === myUserId) {
    KJ.toast('不能加入自己创建的房间');
    return;
  }
  if (!(await joinRoomInDB(code))) return; // 失败原因已在 joinRoomInDB 内提示
  await setupOnlineRoom(code, false);
}

// ====================== 邀请模式 ======================

var inviteConvLoaded = false;

async function createInviteRoom() {
  if (!sb) { KJ.toast('网络错误，请刷新重试'); return; }
  var code = await genUniqueRoomCode(genInviteToken);
  inviteRoomCode = code;
  inviteSentUsers = [];

  if (!(await createRoomInDB(code, true, []))) { KJ.toast('创建房间失败，请重试'); return; }

  document.getElementById('createInviteBtn').style.display = 'none';
  document.getElementById('inviteAfterCreate').style.display = '';
  document.getElementById('sentList').innerHTML = '';
  document.getElementById('enterGameBtn').style.display = 'none';
  document.getElementById('inviteInput').value = '';
  document.getElementById('inviteResults').classList.remove('show');

  if (!inviteConvLoaded) { loadConversationList(); inviteConvLoaded = true; }
  else { resetConvListSent(); }

  await openHostChannel(code);
}

async function openHostChannel(code) {
  // 关闭旧 channel
  if (onlineChannel) {
    try { sb.removeChannel(onlineChannel); } catch(e) {}
    onlineChannel = null;
  }
  currentRoom = code;
  isHost = true;

  onlineChannel = sb.channel('rps-' + code, { config: { broadcast: { self: false } } });

  onlineChannel.on('broadcast', { event: 'join' }, function(payload) {
    // ★ 邀请模式：校验加入者是否在受邀名单中
    if (fromInvite || inviteRoomCode === code) {
      var joinUid = payload.payload.uid;
      var invited = false;
      for (var i = 0; i < inviteSentUsers.length; i++) {
        if (inviteSentUsers[i].id === joinUid) { invited = true; break; }
      }
      if (!invited) {
        // 非受邀用户 → 发送拒绝
        try {
          onlineChannel.send({ type: 'broadcast', event: 'reject', payload: { reason: 'not_invited' } });
        } catch(e) {}
        return;
      }
    }
    // 有人加入 → 进入游戏
    var oppName = payload.payload.name || '玩家';
    enterGameRoom(code, oppName);
  });

  onlineChannel.subscribe(async function(status) {
    if (status === 'SUBSCRIBED') {
      try {
        var sessionRes = await sb.auth.getSession();
        var uid = (sessionRes && sessionRes.data && sessionRes.data.session) ? sessionRes.data.session.user.id : '';
        var name = (sessionRes && sessionRes.data && sessionRes.data.session)
          ? (sessionRes.data.session.user.user_metadata && sessionRes.data.session.user.user_metadata.nick)
            || (sessionRes.data.session.user.email ? sessionRes.data.session.user.email.split('@')[0] : '玩家')
          : '玩家';
        onlineChannel.send({ type: 'broadcast', event: 'join', payload: { name: name, uid: uid } });
      } catch(e) {}
    }
  });
}

// ====================== 站内信联系人列表 ======================

async function loadConversationList() {
  var el = document.getElementById('convListInline');
  if (!sb || !myUserId) { el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:8px">无法加载</div>'; return; }

  try {
    // 获取最近私信联系人
    var { data: msgs, error } = await sb.from('private_messages')
      .select('sender_id, recipient_id')
      .or('sender_id.eq.' + myUserId + ',recipient_id.eq.' + myUserId)
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) throw error;

    // 去重提取 partner ID
    var partnerIds = [];
    var seen = {};
    for (var i = 0; i < (msgs || []).length; i++) {
      var pid = msgs[i].sender_id === myUserId ? msgs[i].recipient_id : msgs[i].sender_id;
      if (!seen[pid]) { seen[pid] = true; partnerIds.push(pid); }
    }

    if (!partnerIds.length) {
      el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:8px">暂无联系人，使用下方搜索查找好友</div>';
      return;
    }

    // 获取用户信息
    var { data: users, error: ue } = await sb.from('users')
      .select('id, nick, email').in('id', partnerIds.slice(0, 15));

    if (ue) throw ue;
    renderConvList(users || []);
  } catch(e) {
    console.warn('加载联系人失败:', e);
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:8px">加载失败，使用下方搜索</div>';
  }
}

function renderConvList(users) {
  var el = document.getElementById('convListInline');
  if (!users.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:8px">暂无联系人</div>';
    return;
  }
  el.innerHTML = users.map(function(u) {
    var nick = u.nick || (u.email ? u.email.split('@')[0] : '用户');
    return '<div class="conv-item-inline" data-uid="' + u.id + '" data-nick="' + KJ.escapeHtml(nick) + '" onclick="inviteFromConv(this)">'
      + '<div class="invite-avatar">' + KJ.escapeHtml((nick[0] || '?').toUpperCase()) + '</div>'
      + '<div class="invite-info"><div class="conv-name">' + KJ.escapeHtml(nick) + '</div><div class="conv-email">' + KJ.escapeHtml(u.email || '') + '</div></div>'
      + '<i class="fas fa-paper-plane" style="margin-left:auto;color:var(--accent);font-size:13px"></i>'
      + '</div>';
  }).join('');
}

function resetConvListSent() {
  document.querySelectorAll('.conv-item-inline').forEach(function(el) { el.classList.remove('sent'); });
}

async function inviteFromConv(el) {
  if (el.classList.contains('sent')) return;
  if (!inviteRoomCode) { KJ.toast('房间已过期，请重新创建'); return; }
  var uid = el.dataset.uid;
  var nick = el.dataset.nick;
  await sendInviteMsg(uid, nick);
  el.classList.add('sent');
}

// 搜索
var inviteTimer = null;
var inviteLock = false;

document.getElementById('inviteInput').addEventListener('input', function() {
  clearTimeout(inviteTimer);
  var val = this.value.trim();
  if (!val || val.length < 2) {
    document.getElementById('inviteResults').classList.remove('show');
    return;
  }
  inviteTimer = setTimeout(function() { searchUsers(val); }, 400);
});

async function searchUsers(query) {
  if (inviteLock || !sb) return;
  inviteLock = true;
  try {
    var { data, error } = await sb.from('users')
      .select('id, nick, email').ilike('email', '%' + query + '%')
      .neq('id', myUserId).limit(5);
    if (error) { console.warn('搜索失败:', error); return; }
    renderInviteResults(data || []);
  } catch(e) { console.warn('搜索异常:', e); }
  finally { inviteLock = false; }
}

function renderInviteResults(users) {
  var el = document.getElementById('inviteResults');
  if (!users.length) {
    el.innerHTML = '<div class="invite-result-item" style="color:var(--text3);cursor:default"><i class="fas fa-search"></i> 未找到用户</div>';
    el.classList.add('show');
    return;
  }
  el.innerHTML = users.map(function(u) {
    var nick = u.nick || (u.email ? u.email.split('@')[0] : '用户');
    return '<div class="invite-result-item" data-uid="' + u.id + '" data-nick="' + KJ.escapeHtml(nick) + '" data-email="' + KJ.escapeHtml(u.email || '') + '">'
      + '<div class="invite-avatar">' + KJ.escapeHtml((nick[0] || '?').toUpperCase()) + '</div>'
      + '<div class="invite-info"><div class="invite-nick">' + KJ.escapeHtml(nick) + '</div><div class="invite-email">' + KJ.escapeHtml(u.email || '') + '</div></div>'
      + '<i class="fas fa-paper-plane" style="margin-left:auto;color:var(--accent)"></i>'
      + '</div>';
  }).join('');
  el.classList.add('show');
}

document.getElementById('inviteResults').addEventListener('click', function(e) {
  var item = e.target.closest('.invite-result-item');
  if (!item) return;
  var uid = item.dataset.uid;
  var nick = item.dataset.nick;
  if (uid && nick) sendInviteMsg(uid, nick);
});

async function sendInviteMsg(userId, nick) {
  if (!inviteRoomCode) { KJ.toast('房间已过期，请重新创建'); return; }
  if (!sb) { KJ.toast('网络错误'); return; }

  var inviteLink = window.location.origin + '/game/rps/?invite=' + inviteRoomCode;
  var inviteText = '[游戏邀请] ' + myNick + ' 邀请你进行石头剪刀布对战！\n点击链接加入：' + inviteLink;

  try {
    var { error } = await sb.from('private_messages').insert({
      sender_id: myUserId, recipient_id: userId, text: inviteText
    });
    if (error) { KJ.toast('发送失败，请重试'); return; }
    KJ.toast('已向 ' + nick + ' 发送对战邀请！');
    document.getElementById('inviteInput').value = '';
    document.getElementById('inviteResults').classList.remove('show');

    if (inviteSentUsers.indexOf(userId) === -1) {
      inviteSentUsers.push({ id: userId, nick: nick });
      updateSentList();
      // 同步到数据库
      var ids = inviteSentUsers.map(function(u) { return u.id; });
      sb.from('rps_rooms').update({ invited_users: ids }).ilike('code', inviteRoomCode).then(function() {}).catch(function() {});
    }
    document.getElementById('enterGameBtn').style.display = '';
  } catch(e) { KJ.toast('发送失败'); }
}

function updateSentList() {
  var el = document.getElementById('sentList');
  el.innerHTML = inviteSentUsers.map(function(u) {
    return '<span class="sent-tag"><i class="fas fa-check"></i> ' + KJ.escapeHtml(u.nick) + '</span>';
  }).join('');
}

function enterGameFromInvite() {
  if (!inviteRoomCode) { KJ.toast('房间已过期'); return; }
  fromInvite = true;
  enterGameRoom(inviteRoomCode, null);
}

// ====================== 进入游戏房间 ======================

function enterGameRoom(code, oppName) {
  isHost = true;
  currentRoom = code;
  myOnlineChoice = null;
  oppOnlineChoice = null;
  onScores = { win: 0, draw: 0, lose: 0 };
  if (onlineRoundTimer) { clearTimeout(onlineRoundTimer); onlineRoundTimer = null; }

  // 隐藏设置页/邀请页，显示游戏
  document.getElementById('onlineSetup').style.display = 'none';
  document.getElementById('inviteAfterCreate').style.display = 'none';
  document.getElementById('createInviteBtn').style.display = '';
  document.getElementById('onlineGame').style.display = '';

  // 显示/隐藏房间号标题
  var roomHeader = document.querySelector('#onlineGame .room-header');
  if (fromInvite) {
    roomHeader.style.display = 'none';
  } else {
    roomHeader.style.display = '';
    document.getElementById('roomDisplay').textContent = code;
    // 复制按钮
    var copyBtn = document.getElementById('copyRoomBtn');
    copyBtn.onclick = function() {
      navigator.clipboard.writeText(code).then(function() {
        copyBtn.classList.add('copied'); copyBtn.innerHTML = '<i class="fas fa-check"></i>';
        KJ.toast('房间号已复制：' + code);
        setTimeout(function() { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '<i class="fas fa-copy"></i>'; }, 2000);
      }).catch(function() { KJ.toast('复制失败'); });
    };
  }

  document.getElementById('onMyEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onOppEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onResult').textContent = '';
  document.getElementById('onMyName').textContent = myNick;
  document.getElementById('oppReadyHint').style.display = 'none';
  document.getElementById('rematchBtn').style.display = 'none';
  document.getElementById('closeRoomBtn').style.display = isHost ? '' : 'none';
  updateOnlineScores();

  if (oppName) {
    document.getElementById('onOppLabel').textContent = oppName;
    document.getElementById('onOppName').textContent = oppName;
    setStatus('ready', '对手已就绪，请出拳！');
    enableChoices();
  } else {
    document.getElementById('onOppLabel').textContent = '对手';
    document.getElementById('onOppName').textContent = '等待中...';
    setStatus('waiting', '等待对方接受邀请...');
  }

  // 房间过期倒计时 - 由服务端管理
  document.getElementById('gameTimeout').style.display = 'none';

  // 设置 channel 事件监听（如果是从 invite 模式进入，channel 已存在且已订阅）
  if (onlineChannel && currentRoom === code) {
    // 重绑事件（choice 不再通过广播，改用服务端 DB）
    onlineChannel.on('broadcast', { event: 'join' }, function(payload) {
      // ★ 邀请模式 Host：校验加入者身份
      if (fromInvite) {
        var juid = payload.payload.uid;
        var ok = false;
        for (var i = 0; i < inviteSentUsers.length; i++) {
          if (inviteSentUsers[i].id === juid) { ok = true; break; }
        }
        if (!ok) {
          try { onlineChannel.send({ type: 'broadcast', event: 'reject', payload: {} }); } catch(e) {}
          return;
        }
      }
      var name = payload.payload.name || '玩家';
      document.getElementById('onOppLabel').textContent = name;
      document.getElementById('onOppName').textContent = name;
      setStatus('ready', '对手已就绪，请出拳！');
      enableChoices();
    });
    onlineChannel.on('broadcast', { event: 'leave' }, function() {
      setStatus('waiting', '对手已离开，可等待新玩家加入');
      document.getElementById('onOppName').textContent = '等待中...';
      document.getElementById('onOppEmoji').innerHTML = PLACEHOLDER_ICON;
      document.getElementById('oppReadyHint').style.display = 'none';
      oppOnlineChoice = null; myOnlineChoice = null;
      document.getElementById('onResult').textContent = '';
      document.getElementById('onMyEmoji').innerHTML = PLACEHOLDER_ICON;
      document.getElementById('rematchBtn').style.display = 'none';
  document.getElementById('closeRoomBtn').style.display = isHost ? '' : 'none';
      enableChoices();
      // ★ host 收到 guest 离开 → 重置数据库房间，否则 status/joined_by 残留导致房间被判满永久锁死
      if (isHost && currentRoom) {
        sb.from('rps_rooms')
          .update({ status: 'waiting', joined_by: null, host_move: null, guest_move: null, round_status: 'waiting' })
          .ilike('code', currentRoom).eq('host_id', myUserId)
          .then(function(){}).catch(function(){});
        KJ.toast('对手已离开，可等待新玩家加入');
      }
    });
    onlineChannel.on('broadcast', { event: 'reset' }, function() { resetRoundState(); });
    onlineChannel.on('broadcast', { event: 'reject' }, function() {
      // 当前用户为 guest 时被拒
    });
  }
}

// ====================== 服务端房间关闭处理 ======================
function onRoomClosed() {
  setStatus('expired', '房间已过期或关闭');
  document.getElementById('gameTimeout').textContent = '房间已过期';
  document.getElementById('gameTimeout').style.display = '';
  document.getElementById('gameTimeout').className = 'timeout-bar expiring';
  KJ.toast('房间已过期');
}

// ====================== 标准房间（房间号方式） ======================

async function setupOnlineRoom(code, _isHost) {
  isHost = _isHost;
  currentRoom = code;
  myOnlineChoice = null;
  oppOnlineChoice = null;
  onScores = { win: 0, draw: 0, lose: 0 };
  if (onlineRoundTimer) { clearTimeout(onlineRoundTimer); onlineRoundTimer = null; }
  if (joinTimeoutId) { clearTimeout(joinTimeoutId); joinTimeoutId = null; }

  document.getElementById('onlineSetup').style.display = 'none';
  document.getElementById('onlineGame').style.display = '';

  // 显示/隐藏房间号标题
  var roomHeader2 = document.querySelector('#onlineGame .room-header');
  if (fromInvite) {
    roomHeader2.style.display = 'none';
  } else {
    roomHeader2.style.display = '';
    document.getElementById('roomDisplay').textContent = code;
    var copyBtn2 = document.getElementById('copyRoomBtn');
    copyBtn2.onclick = function() {
      navigator.clipboard.writeText(code).then(function() {
        copyBtn2.classList.add('copied'); copyBtn2.innerHTML = '<i class="fas fa-check"></i>';
        KJ.toast('房间号已复制：' + code);
        setTimeout(function() { copyBtn2.classList.remove('copied'); copyBtn2.innerHTML = '<i class="fas fa-copy"></i>'; }, 2000);
      }).catch(function() { KJ.toast('复制失败'); });
    };
  }
  document.getElementById('onMyEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onOppEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onResult').textContent = '';
  document.getElementById('onOppLabel').textContent = '对手';
  document.getElementById('onOppName').textContent = '等待中...';
  document.getElementById('onMyName').textContent = myNick;
  document.getElementById('oppReadyHint').style.display = 'none';
  document.getElementById('rematchBtn').style.display = 'none';
  document.getElementById('closeRoomBtn').style.display = isHost ? '' : 'none';
  document.getElementById('gameTimeout').style.display = 'none';
  updateOnlineScores();
  setStatus('waiting', '等待对手加入');
  enableChoices();

  // 关闭旧 channel
  if (onlineChannel) { try { sb.removeChannel(onlineChannel); } catch(e) {} onlineChannel = null; }
  if (dbChannel) { try { sb.removeChannel(dbChannel); } catch(e) {} dbChannel = null; }

  // 订阅服务端房间状态变化
  dbChannel = subscribeRoomChanges(code, onRoomClosed, onBothMoved);

  onlineChannel = sb.channel('rps-' + code, { config: { broadcast: { self: false } } });

  // choice 已改用服务端 DB，不再通过广播

  onlineChannel.on('broadcast', { event: 'join' }, function(payload) {
    // 收到 join → 房间存在
    if (joinTimeoutId) { clearTimeout(joinTimeoutId); joinTimeoutId = null; }
    var oppName = payload.payload.name || '玩家';
    document.getElementById('onOppLabel').textContent = oppName;
    document.getElementById('onOppName').textContent = oppName;
    setStatus('ready', '对手已就绪，请出拳！');
    enableChoices();
  });

  onlineChannel.on('broadcast', { event: 'leave' }, function() {
    setStatus('waiting', '对手离开了，等待中...');
    document.getElementById('onOppLabel').textContent = '对手';
    document.getElementById('onOppName').textContent = '等待中...';
    document.getElementById('onOppEmoji').innerHTML = PLACEHOLDER_ICON;
    document.getElementById('oppReadyHint').style.display = 'none';
    oppOnlineChoice = null; myOnlineChoice = null;
    document.getElementById('onResult').textContent = '';
    document.getElementById('onMyEmoji').innerHTML = PLACEHOLDER_ICON;
    document.getElementById('rematchBtn').style.display = 'none';
  document.getElementById('closeRoomBtn').style.display = isHost ? '' : 'none';
    if (onlineRoundTimer) { clearTimeout(onlineRoundTimer); onlineRoundTimer = null; }
    enableChoices();
    // ★ host 收到 guest 离开 → 重置数据库房间，否则 status/joined_by 残留导致房间被判满永久锁死
    if (isHost) {
      sb.from('rps_rooms')
        .update({ status: 'waiting', joined_by: null, host_move: null, guest_move: null, round_status: 'waiting' })
        .ilike('code', code).eq('host_id', myUserId)
        .then(function(){}).catch(function(){});
      setStatus('waiting', '对手已离开，可等待新玩家加入');
      KJ.toast('对手已离开，可等待新玩家加入');
    }
  });

  onlineChannel.on('broadcast', { event: 'reset' }, function() { resetRoundState(); });

  onlineChannel.on('broadcast', { event: 'reject' }, function() {
    // 被 Host 拒绝（非受邀用户）
    KJ.toast('你未被邀请加入此房间');
    setTimeout(function() { leaveRoom(); }, 1500);
  });

  onlineChannel.subscribe(async function(status) {
    if (status === 'SUBSCRIBED') {
      try {
        var sessionRes = await sb.auth.getSession();
        var sid = (sessionRes && sessionRes.data && sessionRes.data.session) ? sessionRes.data.session.user.id : '';
        var name = (sessionRes && sessionRes.data && sessionRes.data.session)
          ? (sessionRes.data.session.user.user_metadata && sessionRes.data.session.user.user_metadata.nick)
            || (sessionRes.data.session.user.email ? sessionRes.data.session.user.email.split('@')[0] : '玩家')
          : '玩家';
        onlineChannel.send({ type: 'broadcast', event: 'join', payload: { name: name, uid: sid } });
      } catch(e) {}

      // guest 方：设置房间存在性检测
      if (!isHost) {
        joinTimeoutId = setTimeout(function() {
          // 10 秒内没收到 host 的 join 回复 → 房间不存在
          setStatus('expired', '房间不存在或已过期');
          KJ.toast('房间不存在或已过期');
          joinTimeoutId = null;
          setTimeout(function() { leaveRoom(); }, 3000);
        }, 10000);
      }

      // host 方：服务端管理房间过期，不再启动客户端计时器
    }
  });
}

// ====================== 对战逻辑 ======================

// ====================== 服务端胜负判断 ======================
function onBothMoved(hostMove, guestMove) {
  var myMove = isHost ? hostMove : guestMove;
  var oppMove = isHost ? guestMove : hostMove;
  if (!myMove || !oppMove) return;

  // 揭晓对方选择（从服务端获取，无法作弊）
  document.getElementById('onOppEmoji').innerHTML = CHOICE_ICON[oppMove];
  document.getElementById('onOppEmoji').classList.add('pop-in');
  setTimeout(function() { document.getElementById('onOppEmoji').classList.remove('pop-in'); }, 350);

  var result = getResult(myMove, oppMove);
  var el = document.getElementById('onResult');
  if (result === 'win') {
    el.innerHTML = '<span class="win"><i class="fas fa-trophy"></i> 你赢了！</span>';
    document.getElementById('onMyEmoji').classList.add('winner');
    onScores.win++;
  } else if (result === 'lose') {
    el.innerHTML = '<span class="lose"><i class="fas fa-face-frown"></i> 你输了</span>';
    document.getElementById('onOppEmoji').classList.add('winner');
    onScores.lose++;
  } else {
    el.innerHTML = '<span class="draw"><i class="fas fa-handshake"></i> 平局</span>';
    onScores.draw++;
  }
  setTimeout(function() {
    document.getElementById('onMyEmoji').classList.remove('winner');
    document.getElementById('onOppEmoji').classList.remove('winner');
  }, 500);

  updateOnlineScores();
  setStatus('ready', '结果已出');
  document.getElementById('rematchBtn').style.display = '';

  onlineRoundTimer = setTimeout(function() {
    if (currentRoom && onlineChannel) {
      onlineChannel.send({ type: 'broadcast', event: 'reset', payload: {} });
      resetRoundState();
    }
    onlineRoundTimer = null;
  }, 2500);
}

function playOnline(choice) {
  if (!onlineChannel || myOnlineChoice || !currentRoom) return;
  myOnlineChoice = choice;

  // 显示自己的选择
  document.getElementById('onMyEmoji').innerHTML = CHOICE_ICON[choice];
  document.getElementById('onMyEmoji').classList.add('pop-in');
  setTimeout(function() { document.getElementById('onMyEmoji').classList.remove('pop-in'); }, 350);

  // 禁用按钮
  document.querySelectorAll('#onlineGame .choice-btn').forEach(function(b) { b.classList.add('disabled'); });

  setStatus('locked', '等待对方出拳...');

  // ★ 存储到服务端，不直接广播给对方（防止作弊）
  var moveField = isHost ? 'host_move' : 'guest_move';
  sb.from('rps_rooms').update(JSON.parse('{"' + moveField + '":"' + choice + '"}')).ilike('code', currentRoom).then(function(r) {
    if (r.error) { KJ.toast('出拳失败，请重试'); enableChoices(); }
  }).catch(function() { KJ.toast('出拳失败'); enableChoices(); });
}

function resetRound() {
  if (onlineChannel) onlineChannel.send({ type: 'broadcast', event: 'reset', payload: {} });
  resetRoundState();
}

function resetRoundState() {
  if (onlineRoundTimer) { clearTimeout(onlineRoundTimer); onlineRoundTimer = null; }
  myOnlineChoice = null; oppOnlineChoice = null;
  document.getElementById('onMyEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onOppEmoji').innerHTML = PLACEHOLDER_ICON;
  document.getElementById('onResult').textContent = '';
  document.getElementById('oppReadyHint').style.display = 'none';
  document.getElementById('rematchBtn').style.display = 'none';
  document.getElementById('closeRoomBtn').style.display = isHost ? '' : 'none';
  setStatus('ready', '新回合，请出拳！');
  enableChoices();
  // 清除服务端出拳记录
  if (currentRoom) {
    sb.from('rps_rooms').update({ host_move: null, guest_move: null }).ilike('code', currentRoom).then(function(){}).catch(function(){});
  }
}

function updateOnlineScores() {
  document.getElementById('onMyScore').textContent = onScores.win;
  document.getElementById('onDrawScore').textContent = onScores.draw;
  document.getElementById('onOppScore').textContent = onScores.lose;
}

function setStatus(state, text) {
  var dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = text;
}

function enableChoices() {
  document.querySelectorAll('#onlineGame .choice-btn').forEach(function(b) { b.classList.remove('disabled'); });
  myOnlineChoice = null;
}

function closeCurrentRoom() {
  if (currentRoom && isHost) {
    if (confirm('确定关闭此房间吗？房间关闭后对方将无法继续游戏。')) {
      closeRoomInDB(currentRoom);
      leaveRoom();
    }
  }
}

function leaveRoom() {
  if (onlineChannel) {
    try { onlineChannel.send({ type: 'broadcast', event: 'leave', payload: {} }); } catch(e) {}
    try { sb.removeChannel(onlineChannel); } catch(e) {}
    onlineChannel = null;
  }
  if (dbChannel) { try { sb.removeChannel(dbChannel); } catch(e) {} dbChannel = null; }
  if (onlineRoundTimer) { clearTimeout(onlineRoundTimer); onlineRoundTimer = null; }
  if (joinTimeoutId) { clearTimeout(joinTimeoutId); joinTimeoutId = null; }
  currentRoom = null;
  inviteRoomCode = null;
  fromInvite = false;
  inviteSentUsers = [];
  document.getElementById('sentList').innerHTML = '';
  document.getElementById('createInviteBtn').style.display = '';
  document.getElementById('inviteAfterCreate').style.display = 'none';
  document.getElementById('enterGameBtn').style.display = 'none';
  document.getElementById('inviteInput').value = '';
  document.getElementById('inviteResults').classList.remove('show');
  document.getElementById('onlineSetup').style.display = '';
  document.getElementById('onlineGame').style.display = 'none';
  document.getElementById('gameTimeout').style.display = 'none';
  loadMyActiveRooms();
  inviteConvLoaded = false;
}

// 点击空白关闭搜索
document.addEventListener('click', function(e) {
  if (!e.target.closest('.invite-search-box')) {
    document.getElementById('inviteResults').classList.remove('show');
  }
});
</script>

<!-- 邀请确认弹窗 -->
<div id="inviteModal" class="invite-modal" style="display:none">
  <div class="invite-modal-card">
    <div class="invite-modal-icon"><i class="fas fa-hand-back-fist"></i> <i class="fas fa-hand"></i> <i class="fas fa-hand-scissors"></i></div>
