<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; media-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3f3f3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/theme.css">
  <title>石头剪刀布 · KJLLin</title>
    <style>
        :root {
          --accent: var(--color-accent, #0071e3);
          --bg-glass: var(--color-bg-glass, rgba(255,255,255,0.7));
          --border: var(--color-border, rgba(0,0,0,0.08));
          --text: var(--color-text-primary, #1d1d1f);
          --text2: var(--color-text-secondary, #86868b);
        }
        body {
            margin: 0; padding: 20px; padding-top: 80px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background: var(--color-bg, #f5f5f7);
            color: var(--text);
            font-family: var(--font-sans, system-ui);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .container { max-width: 480px; width: 100%; }
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            text-align: center;
        }

        /* 模式选择 */
        .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .mode-tab {
            flex: 1; padding: 12px; border-radius: 14px; border: 1px solid var(--border);
            background: transparent; color: var(--text2); font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* 出手按钮 */
        .choices { display: flex; gap: 12px; justify-content: center; margin: 20px 0; }
        .choice-btn {
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--border);
            background: #fff; font-size: 36px; cursor: pointer; transition: all .15s;
            display: flex; align-items: center; justify-content: center;
        }
        .choice-btn:hover { transform: scale(1.08); border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,113,227,0.2); }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn.selected { border-color: var(--accent); background: rgba(0,113,227,0.08); }
        .choice-btn.disabled { pointer-events: none; opacity: 0.5; }

        /* 结果区 */
        .battle-area { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .player-side { text-align: center; }
        .player-emoji { font-size: 64px; transition: transform .3s; }
        .player-emoji.winner { animation: bounce .5s ease; }
        .player-label { font-size: 13px; color: var(--text2); margin-top: 4px; }
        .vs { font-size: 28px; font-weight: 900; color: var(--text2); }
        .result-text { font-size: 24px; font-weight: 700; margin: 12px 0; min-height: 36px; }
        .result-text.win { color: #34c759; }
        .result-text.lose { color: #ff3b30; }
        .result-text.draw { color: #ff9500; }

        /* 分数 */
        .scoreboard { display: flex; justify-content: center; gap: 32px; margin: 12px 0; }
        .score-item { text-align: center; }
        .score-num { font-size: 28px; font-weight: 700; }
        .score-label { font-size: 11px; color: var(--text2); }

        /* 联机房 */
        .room-setup { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .room-code {
            font-size: 40px; font-weight: 900; letter-spacing: 8px; color: var(--accent);
            font-family: 'Courier New', monospace;
        }
        .btn {
            padding: 10px 24px; border-radius: 12px; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .input {
            padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border);
            font-size: 16px; text-align: center; background: var(--bg-glass); color: var(--text);
            width: 120px; letter-spacing: 4px; font-family: 'Courier New', monospace;
        }
        .waiting-text { color: var(--text2); font-size: 14px; }
        .waiting-dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
        @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

        .history { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        .history-dot {
            width: 10px; height: 10px; border-radius: 50%;
        }
        .history-dot.win { background: #34c759; }
        .history-dot.lose { background: #ff3b30; }
        .history-dot.draw { background: #ff9500; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/common.js"></script>
</head>
<body>
<div class="bg-base"></div>

<header class="top-menu">
  <nav class="menu-bar mica" id="menuBar">
    <span class="menu-logo">KJLLin</span>
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item active"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
    <a href="/settings/" class="menu-item"><i class="fas fa-gear"></i> 设置</a>
    <button id="themeBtn" class="menu-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
    <span id="userTag" class="menu-user-tag"></span>
    <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
    <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
  </nav>
  <div class="mobile-menu-dropdown mica" id="mobileMenu">
    <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
    <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
    <a href="/game/" class="menu-item active"><i class="fas fa-gamepad"></i> 游戏</a>
    <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
    <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
    <a href="/settings/" class="menu-item"><i class="fas fa-gear"></i> 设置</a>
  </div>
</header>

<div class="container">
  <h2 style="text-align:center">🪨 📄 ✂️ 石头剪刀布</h2>

  <!-- 模式选择 -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabAI" onclick="switchMode('ai')"><i class="fas fa-robot"></i> 人机对战</button>
    <button class="mode-tab" id="tabOnline" onclick="switchMode('online')"><i class="fas fa-globe"></i> 双人联机</button>
  </div>

  <!-- ========== AI 模式 ========== -->
  <div id="aiMode">
    <div class="card">
      <div class="scoreboard">
        <div class="score-item"><div class="score-num" id="aiMyScore">0</div><div class="score-label">我</div></div>
        <div class="score-item"><div class="score-num" id="aiDrawScore">0</div><div class="score-label">平</div></div>
        <div class="score-item"><div class="score-num" id="aiBotScore">0</div><div class="score-label">AI</div></div>
      </div>
      <div class="battle-area">
        <div class="player-side">
          <div class="player-emoji" id="aiMyEmoji">🤔</div>
          <div class="player-label">你</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-side">
          <div class="player-emoji" id="aiBotEmoji">🤖</div>
          <div class="player-label">AI</div>
        </div>
      </div>
      <div class="result-text" id="aiResult"></div>
      <div class="choices">
        <button class="choice-btn" onclick="playAI('rock')">✊</button>
        <button class="choice-btn" onclick="playAI('paper')">✋</button>
        <button class="choice-btn" onclick="playAI('scissors')">✌️</button>
      </div>
      <div class="history" id="aiHistory"></div>
    </div>
  </div>

  <!-- ========== 联机模式 ========== -->
  <div id="onlineMode" style="display:none">
    <div class="card" id="onlineSetup">
      <h3>双人联机对战</h3>
      <div class="room-setup">
        <button class="btn btn-primary" onclick="createRoom()" style="width:200px"><i class="fas fa-plus"></i> 创建房间</button>
        <div style="color:var(--text2);margin:8px 0">— 或 —</div>
        <input type="text" class="input" id="roomCodeInput" placeholder="房间号" maxlength="4" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
        <button class="btn btn-outline" onclick="joinRoom()" style="width:200px"><i class="fas fa-door-open"></i> 加入房间</button>
      </div>
    </div>

    <div class="card" id="onlineGame" style="display:none">
      <div class="room-code" id="roomDisplay"></div>
      <div class="waiting-text waiting-dots" id="waitingText">等待对手加入</div>
      <div class="battle-area">
        <div class="player-side">
          <div class="player-emoji" id="onMyEmoji">🤔</div>
          <div class="player-label">你</div>
        </div>
        <div class="vs">VS</div>
        <div class="player-side">
          <div class="player-emoji" id="onOppEmoji">🤔</div>
          <div class="player-label" id="onOppLabel">对手</div>
        </div>
      </div>
      <div class="result-text" id="onResult"></div>
      <div class="choices">
        <button class="choice-btn" id="onRock" onclick="playOnline('rock')">✊</button>
        <button class="choice-btn" id="onPaper" onclick="playOnline('paper')">✋</button>
        <button class="choice-btn" id="onScissors" onclick="playOnline('scissors')">✌️</button>
      </div>
      <button class="btn btn-outline" onclick="leaveRoom()" style="margin-top:12px"><i class="fas fa-sign-out-alt"></i> 离开房间</button>
    </div>
  </div>
</div>

<script>
// ====================== 导航栏 ======================
KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
const themeBtn = document.getElementById('themeBtn');
function updateThemeUI() {
  var state = KJ.applyTheme('#f5f5f7', '#0a0a0a');
  themeBtn.innerHTML = KJ.getThemeIcon(state.mode);
}
themeBtn.addEventListener('click', function() {
  KJ.toggleTheme(); updateThemeUI();
});
KJ.onSystemThemeChange(updateThemeUI);
updateThemeUI();

// ====================== Supabase ======================
let sb = KJ.createSupabase();
if (sb) KJ.initNav(sb, { homeUrl: '/' });
else KJ.initNav(null, { homeUrl: '/' });

// ====================== 常量 ======================
const EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
const WIN_MAP = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

function getResult(a, b) {
  if (a === b) return 'draw';
  return WIN_MAP[a] === b ? 'win' : 'lose';
}

// ====================== 联机模式（变量提前声明） ======================
let currentRoom = null;
let onlineChannel = null;
let myOnlineChoice = null;
let oppOnlineChoice = null;
let isHost = false;

// ====================== 模式切换 ======================
let currentMode = 'ai';
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tabAI').classList.toggle('active', mode === 'ai');
  document.getElementById('tabOnline').classList.toggle('active', mode === 'online');
  document.getElementById('aiMode').style.display = mode === 'ai' ? '' : 'none';
  document.getElementById('onlineMode').style.display = mode === 'online' ? '' : 'none';
  if (mode === 'online' && currentRoom) leaveRoom();
}

// ====================== AI 模式 ======================
let aiScores = { win: 0, draw: 0, lose: 0 };
let aiHistory = [];
let aiLocked = false;

function playAI(playerChoice) {
  if (aiLocked) return;
  aiLocked = true;

  const choices = ['rock', 'paper', 'scissors'];
  const botChoice = choices[Math.floor(Math.random() * 3)];
  const result = getResult(playerChoice, botChoice);

  const myEl = document.getElementById('aiMyEmoji');
  const botEl = document.getElementById('aiBotEmoji');

  // 动画序列
  myEl.textContent = '✊'; botEl.textContent = '✊';
  let tick = 0;
  const interval = setInterval(() => {
    myEl.textContent = EMOJI[choices[tick % 3]];
    botEl.textContent = EMOJI[choices[(tick + 1) % 3]];
    tick++;
  }, 100);

  setTimeout(() => {
    clearInterval(interval);
    myEl.textContent = EMOJI[playerChoice];
    botEl.textContent = EMOJI[botChoice];

    const resEl = document.getElementById('aiResult');
    if (result === 'win') {
      resEl.innerHTML = '<span class="win">你赢了！🎉</span>';
      myEl.classList.add('winner');
      aiScores.win++;
    } else if (result === 'lose') {
      resEl.innerHTML = '<span class="lose">AI 赢了 😅</span>';
      botEl.classList.add('winner');
      aiScores.lose++;
    } else {
      resEl.innerHTML = '<span class="draw">平局 🤝</span>';
      aiScores.draw++;
    }
    setTimeout(() => { myEl.classList.remove('winner'); botEl.classList.remove('winner'); }, 500);

    document.getElementById('aiMyScore').textContent = aiScores.win;
    document.getElementById('aiDrawScore').textContent = aiScores.draw;
    document.getElementById('aiBotScore').textContent = aiScores.lose;

    aiHistory.push(result);
    updateAIHistory();

    aiLocked = false;
  }, 800);
}

function updateAIHistory() {
  const el = document.getElementById('aiHistory');
  el.innerHTML = aiHistory.slice(-30).map(r =>
    '<span class="history-dot ' + r + '" title="' + (r === 'win' ? '胜' : r === 'lose' ? '负' : '平') + '"></span>'
  ).join('');
}

// ====================== 联机模式 ======================

function genRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

async function createRoom() {
  if (!sb) { KJ.toast('网络错误，请刷新重试'); return; }
  const code = genRoomCode();
  await setupOnlineRoom(code, true);
  document.getElementById('roomDisplay').textContent = code;
}

async function joinRoom() {
  if (!sb) { KJ.toast('网络错误，请刷新重试'); return; }
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (code.length !== 4) { KJ.toast('请输入4位房间号'); return; }
  await setupOnlineRoom(code, false);
  document.getElementById('roomDisplay').textContent = code;
}

async function setupOnlineRoom(code, _isHost) {
  isHost = _isHost;
  currentRoom = code;
  myOnlineChoice = null;
  oppOnlineChoice = null;

  document.getElementById('onlineSetup').style.display = 'none';
  document.getElementById('onlineGame').style.display = '';
  document.getElementById('roomDisplay').textContent = code;
  document.getElementById('waitingText').textContent = '等待对手加入';
  document.getElementById('waitingText').style.display = '';
  document.getElementById('onMyEmoji').textContent = '🤔';
  document.getElementById('onOppEmoji').textContent = '🤔';
  document.getElementById('onResult').textContent = '';
  document.getElementById('onOppLabel').textContent = '对手';
  enableChoices();

  // 订阅 Realtime channel
  onlineChannel = sb.channel('rps-' + code);
  onlineChannel.on('broadcast', { event: 'choice' }, (payload) => {
    oppOnlineChoice = payload.payload.choice;
    document.getElementById('onOppEmoji').textContent = EMOJI[oppOnlineChoice];
    checkOnlineResult();
  }).on('broadcast', { event: 'join' }, (payload) => {
    document.getElementById('onOppLabel').textContent = payload.payload.name || '对手';
    document.getElementById('waitingText').style.display = 'none';
    enableChoices();
  }).on('broadcast', { event: 'leave' }, () => {
    document.getElementById('waitingText').textContent = '对手离开了，等待新对手...';
    document.getElementById('waitingText').style.display = '';
    document.getElementById('onOppEmoji').textContent = '🤔';
    oppOnlineChoice = null;
    document.getElementById('onResult').textContent = '';
    enableChoices();
  }).subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      // 广播自己的加入
      try {
        var { data: { session } } = await sb.auth.getSession();
        var name = session?.user?.user_metadata?.nick || session?.user?.email?.split('@')[0] || '玩家';
        onlineChannel.send({ type: 'broadcast', event: 'join', payload: { name } });
      } catch(e) {}
    }
  });
}

function playOnline(choice) {
  if (!onlineChannel || myOnlineChoice) return;
  myOnlineChoice = choice;
  document.getElementById('onMyEmoji').textContent = EMOJI[choice];
  document.querySelectorAll('#onlineGame .choice-btn').forEach(b => b.classList.add('disabled'));
  onlineChannel.send({ type: 'broadcast', event: 'choice', payload: { choice } });
  checkOnlineResult();
}

function checkOnlineResult() {
  if (!myOnlineChoice || !oppOnlineChoice) return;
  const result = getResult(myOnlineChoice, oppOnlineChoice);
  const el = document.getElementById('onResult');
  if (result === 'win') el.innerHTML = '<span class="win">你赢了！🎉</span>';
  else if (result === 'lose') el.innerHTML = '<span class="lose">你输了 😅</span>';
  else el.innerHTML = '<span class="draw">平局 🤝</span>';

  setTimeout(() => {
    myOnlineChoice = null; oppOnlineChoice = null;
    document.getElementById('onMyEmoji').textContent = '🤔';
    document.getElementById('onOppEmoji').textContent = '🤔';
    document.getElementById('onResult').textContent = '';
    enableChoices();
  }, 2000);
}

function enableChoices() {
  document.querySelectorAll('#onlineGame .choice-btn').forEach(b => b.classList.remove('disabled'));
  myOnlineChoice = null;
}

function leaveRoom() {
  if (onlineChannel) {
    try { onlineChannel.send({ type: 'broadcast', event: 'leave', payload: {} }); } catch(e) {}
    sb.removeChannel(onlineChannel);
    onlineChannel = null;
  }
  currentRoom = null;
  document.getElementById('onlineSetup').style.display = '';
  document.getElementById('onlineGame').style.display = 'none';
}
</script>
<div id="toast" class="toast hidden"></div>
</body>
</html>
