<style>
/* ========== CSS Variables ========== */
html {
  --win-ease: var(--spring-default);
  --bounce: var(--spring-bounce);
  --transition-fast: 150ms var(--win-ease);
  --transition-normal: 250ms var(--win-ease);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --tile-gap: 10px; --tile-radius: 8px;
}

:root {
  --bg-body: var(--color-bg);
  --bg-mica: var(--color-bg-glass);
  --bg-mica-hover: var(--color-bg-glass-hover);
  --border-mica: var(--color-border);
  --text-primary: var(--color-text-primary);
  --text-secondary: var(--color-text-secondary);
  --text-tertiary: var(--color-text-tertiary);
  --accent: var(--color-accent);
  --accent-light: var(--color-accent-light);
  --accent-glow: var(--color-accent-glow);
  --shadow-rest: var(--shadow-sm);
  --board-bg: rgba(0,0,0,0.03);
  --cell-bg: rgba(0,0,0,0.05);
  --score-bg: rgba(0,0,0,0.03);
  --overlay-bg: rgba(255,255,255,0.7);
  --btn-bg: rgba(0,0,0,0.45);
}
[data-theme="dark"] {
  --bg-body: var(--color-bg);
  --bg-mica: var(--color-bg-glass);
  --bg-mica-hover: var(--color-bg-glass-hover);
  --border-mica: var(--color-border);
  --text-primary: var(--color-text-primary);
  --text-secondary: var(--color-text-secondary);
  --text-tertiary: var(--color-text-tertiary);
  --accent-glow: var(--color-accent-glow);
  --shadow-rest: var(--shadow-sm);
  --board-bg: rgba(255,255,255,0.02);
  --cell-bg: rgba(255,255,255,0.04);
  --score-bg: rgba(255,255,255,0.03);
  --overlay-bg: rgba(20,20,20,0.75);
  --btn-bg: rgba(255,255,255,0.25);
}

/* ========== Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { transition: background-color var(--transition-normal); }

html, body {
  width: 100%; min-height: 100vh; overflow: hidden;
}

body {
  font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-body); color: var(--text-primary);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}

pre, code, .mono, .tile, .score-val {
  font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace;
}

/* Background glow */
.bg-glow-1, .bg-glow-2 { position: fixed; border-radius: 50%; z-index: -2; pointer-events: none; }
.bg-glow-1 {
  top: -20%; left: -10%; width: 60%; height: 60%;
  background: radial-gradient(circle, var(--accent-glow), transparent 70%);
}
.bg-glow-2 {
  bottom: -20%; right: -10%; width: 60%; height: 60%;
  background: radial-gradient(circle, rgba(0,120,212,0.04), transparent 70%);
}

/* ========== Container (Mica Card) ========== */
.container {
  position: relative; z-index: 1;
  background: var(--bg-mica);
  background-image: var(--iridescent);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-mica);
  border-radius: 20px; box-shadow: var(--shadow-rest), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  padding: 28px 24px 24px;
  width: min(440px, 94vw);
  display: flex; flex-direction: column; gap: 14px;
  animation: fadeUp 0.5s var(--win-ease);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Header ========== */
.header {
  display: flex; align-items: center; gap: 12px;
}

/* ── 顶部导航栏 — Fluent Mica 磨砂 ── */
.top-menu {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.menu-bar {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-mica);
  box-shadow: var(--shadow-rest);
  pointer-events: all;
  background: var(--bg-mica);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  transition: all var(--transition-normal);
}
.menu-logo {
  font-size: 18px; font-weight: 700; color: var(--accent);
  padding: 6px 14px; letter-spacing: 0.2px; margin-right: 4px;
}
.menu-divider {
  width: 1px; height: 22px; background: var(--border-mica); margin: 0 5px; border-radius: 1px;
}
.menu-item {
  padding: 7px 14px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
  text-decoration: none; cursor: pointer;
  border: none; background: none;
  transition: all var(--transition-fast);
  white-space: nowrap; position: relative;
  letter-spacing: 0.3px;
}
.menu-item:hover { color: var(--accent); background: var(--accent-glow); }
.menu-item.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; }
.menu-item.active::after {
  content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  width: 18px; height: 2px; border-radius: 1px; background: var(--accent);
}
.menu-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
  font-size: 16px; cursor: pointer;
  background: var(--bg-mica-hover); color: var(--text-primary);
  display: grid; place-items: center;
  transition: all var(--transition-fast);
}
.menu-btn:hover { background: var(--accent-glow); color: var(--accent); }
.menu-btn:active { transform: scale(0.92); }
/* ── 移动端汉堡菜单 ── */
.hamburger { display: none; }
.mobile-menu-dropdown {
  display: none; position: fixed; top: calc(56px + env(safe-area-inset-top, 0px) + 8px);
  left: 16px; right: 16px;
  padding: 8px; border-radius: var(--radius-md);
  border: 1px solid var(--border-mica);
  box-shadow: var(--shadow-hover);
  background: var(--bg-mica-scroll);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  flex-direction: column; gap: 2px;
  pointer-events: all; z-index: 101;
}
.mobile-menu-dropdown.open { display: flex; }
.mobile-menu-dropdown .menu-item {
  display: block; width: 100%; text-align: left; pointer-events: auto;
}

.title-block { flex: 1; min-width: 0; }
.game-title {
  font-size: 28px; font-weight: 800; color: var(--accent);
  letter-spacing: -0.5px; line-height: 1.1;
}
.game-subtitle {
  font-size: 11px; font-weight: 500; color: var(--text-tertiary);
  letter-spacing: 1px; text-transform: uppercase;
}

/* Three-mode theme toggle */

/* ========== Scores Row ========== */
.scores { display: flex; gap: 10px; }
.score-box {
  flex: 1; background: var(--score-bg);
  border-radius: var(--radius-sm); padding: 10px 14px; text-align: center;
}
.score-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-tertiary);
}
.score-val {
  font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.1;
}
.score-pop { animation: scorePop 0.3s var(--bounce); }
@keyframes scorePop {
  0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
}

.new-game-btn {
  background: var(--accent); border: none; border-radius: var(--radius-sm);
  padding: 10px 18px; color: #fff; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; cursor: pointer; transition: var(--transition-fast);
  white-space: nowrap; font-family: inherit;
}
.new-game-btn:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
.new-game-btn:active { transform: scale(0.98); }

/* ========== Board ========== */
.board-wrapper { position: relative; width: 100%; aspect-ratio: 1; }
.board {
  position: absolute; inset: 0;
  background: var(--board-bg);
  border: 1px solid var(--border-mica);
  border-radius: var(--radius-md);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--tile-gap); padding: var(--tile-gap);
}
.cell {
  background: var(--cell-bg); border-radius: var(--tile-radius);
}

.tile-container {
  position: absolute; inset: var(--tile-gap); pointer-events: none; z-index: 1;
}

/* ========== Tiles ========== */
.tile {
  position: absolute; border-radius: var(--tile-radius);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  /* Smooth slide animation — position is driven by JS setting left/top */
  transition: left 0.12s ease-in-out, top 0.12s ease-in-out;
  will-change: left, top;
  z-index: 1;
}
.tile.tile-new { animation: tileAppear 0.25s var(--bounce); z-index: 2; }
.tile.tile-merge { animation: tileMerge 0.25s var(--bounce); z-index: 3; }
.tile.tile-moving { z-index: 2; }
@keyframes tileAppear {
  0% { transform: scale(0); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes tileMerge {
  0% { transform: scale(1); }
  30% { transform: scale(1.28); }
  60% { transform: scale(0.92); }
  100% { transform: scale(1); }
}

/* Tile Colors */
.tile-2    { background: #eee4da; color: #776e65; }
.tile-4    { background: #ede0c8; color: #776e65; }
.tile-8    { background: #f2b179; color: #f9f6f2; }
.tile-16   { background: #f59563; color: #f9f6f2; }
.tile-32   { background: #f67c5f; color: #f9f6f2; }
.tile-64   { background: #f65e3b; color: #f9f6f2; }
.tile-128  { background: #edcf72; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.2); }
.tile-256  { background: #edcc61; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.3); }
.tile-512  { background: #edc850; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.4); }
.tile-1024 { background: #edc53f; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.5); }
.tile-2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243,215,116,0.6); }
.tile-super { background: #3c3a32; color: #f9f6f2; }

/* ========== Overlay ========== */
.overlay {
  position: absolute; inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: var(--radius-md);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; z-index: 10; animation: fadeIn 0.3s var(--win-ease);
}
.overlay.hidden { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay-title { font-size: 28px; font-weight: 800; color: var(--text-primary); }
.overlay-sub { font-size: 13px; color: var(--text-secondary); }
.overlay-btn {
  margin-top: 6px; padding: 10px 28px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: var(--transition-fast); font-family: inherit;
}
.overlay-btn:hover { background: var(--accent-light); transform: translateY(-1px); }
.overlay-btn:active { transform: scale(0.98); }

/* ========== Hint ========== */
.hint { text-align: center; font-size: 12px; color: var(--text-tertiary); font-weight: 500; }

@media (max-width: 768px) {
  .menu-bar .menu-item { display: none; }
  .menu-bar .menu-divider { display: none; }
  .menu-bar .theme-toggle { display: none; }
  .hamburger { display: grid !important; }
}
@media (max-width: 440px) {
  .container { padding: 20px 16px 16px; border-radius: 16px; }
  .game-title { font-size: 24px; }
  .score-val { font-size: 18px; }
  .overlay-title { font-size: 24px; }
}
</style>

<script>
(function() {
  'use strict';

  const $ = s => document.querySelector(s);
  const html = document.documentElement;
  const metaTheme = $('meta[name="theme-color"]');
  const boardEl = $('#board');
  const tileContainer = $('#tileContainer');
  const scoreEl = $('#score');
  const bestScoreEl = $('#bestScore');
  const overlay = $('#gameOverlay');
  const overlayTitle = $('#overlayTitle');
  const overlaySub = $('#overlaySub');
  const overlayBtn = $('#overlayBtn');
  const boardWrapper = $('#boardWrapper');

  // 汉堡菜单
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburgerBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    mobileMenu.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
      mobileMenu.classList.remove('open');
    }
  });

  // ==================== Theme ====================
  function initTheme() {
    const state = KJ.applyTheme('#f3f3f3', '#0f0f0f');
    updateThemeBtnUI(state.mode);
  }

  function updateThemeBtnUI(mode) {
    $('#themeToggle').querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === mode);
    });
  }

  $('#themeToggle').addEventListener('click', function(e) {
    const btn = e.target.closest('.theme-btn');
    if (!btn) return;
    const t = btn.dataset.theme;
    if (t === 'auto') KJ.safeStorage.removeItem('theme');
    else KJ.safeStorage.setItem('theme', t);
    initTheme();
  });

  KJ.onSystemThemeChange(initTheme);

  // ==================== Auth Check ====================
  let supabase = KJ.createSupabase();
  if (supabase) KJ.initMessageBanner(supabase);

  // 同步检查 localStorage 中的 session（无网络延迟，立即响应）
  function getStoredUser() {
    try {
      var now = Date.now();
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf('sb-') === 0 && key.indexOf('auth-token') !== -1) {
          var val = JSON.parse(localStorage.getItem(key));
          if (val && val.user && val.expires_at) {
            if (val.expires_at * 1000 > now) return val.user;
            try { localStorage.removeItem(key); } catch(e) {}
          }
        }
      }
    } catch(e) {}
    return null;
  }

  function updateAuthUI(user) {
    var hint = $('#authHint');
    if (!hint) return;
    if (user) {
      var nick = user.user_metadata?.nick || user.email?.split('@')[0] || '用户';
      hint.innerHTML = '<span style="color:var(--success)">✓</span> 已登录：' + KJ.escapeHtml(nick) + ' · 记录将自动同步云端';
    } else {
      hint.innerHTML = '<a href="/login/?redirect=/game/tfe/" style="color:var(--accent);text-decoration:none">登录</a> 以同步游戏记录到云端';
    }
  }

  // 先用 localStorage 立即显示状态（无闪烁）
  updateAuthUI(getStoredUser());

  if (supabase) {
    supabase.auth.onAuthStateChange(function(event, session) {
      updateAuthUI(session?.user || null);
    });
    supabase.auth.getSession().then(function(r) {
      updateAuthUI(r?.data?.session?.user || null);
    }).catch(function() {
      // 网络请求失败时，保持 localStorage 的检测结果不变
    });
  }

  // ==================== Game State ====================

  const GAME_NAME = 'tfe';

  async function saveScore(finalScore) {
    if (!supabase) return;
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { KJ.toast('请先登录以同步游戏记录'); return; }
      const userId = session.user.id;
      const userEmail = session.user.email || '';
      const nick = userEmail.split('@')[0] || userId.substring(0, 8);

      const { error: insErr } = await supabase.from('game_scores').insert({
        user_id: userId, nick: nick, game: GAME_NAME, score: finalScore
      });
      if (insErr) { console.warn('Save score insert error:', insErr); return; }

      const { data: cloudBest } = await supabase
        .from('game_scores').select('score').eq('game', GAME_NAME)
        .order('score', { ascending: false }).limit(1).maybeSingle();
      const { data: myBest } = await supabase
        .from('game_scores').select('score').eq('user_id', userId).eq('game', GAME_NAME)
        .order('score', { ascending: false }).limit(1).maybeSingle();

      if (cloudBest) $('#cloudBest').textContent = cloudBest.score;
      if (myBest) $('#myBest').textContent = myBest.score;
    } catch(e) { console.warn('Save score failed:', e); }
  }

  const SIZE = 4;
  let grid = new Array(SIZE * SIZE).fill(0);
  let tileIds = new Array(SIZE * SIZE).fill(0); // unique IDs for animation tracking
  let tileIdSeq = 0;
  let tileEls = new Map(); // tid -> DOM element (persistent across re-renders)
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('best2048') || '0', 10);
  let gameOver = false;
  let gameWon = false;
  let winShown = false;

  // ==================== Board Grid ====================
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    boardEl.appendChild(cell);
  }

  // ==================== Score ====================
  function updateScore() {
    scoreEl.textContent = score;
    scoreEl.classList.add('score-pop');
    setTimeout(() => scoreEl.classList.remove('score-pop'), 300);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('best2048', bestScore);
    }
    bestScoreEl.textContent = bestScore;
  }

  // ==================== Tile Rendering ====================
  function getTileSize() {
    const rect = boardEl.getBoundingClientRect();
    const gap = parseFloat(getComputedStyle(html).getPropertyValue('--tile-gap'));
    const totalGap = gap * (SIZE + 1);
    const size = (rect.width - totalGap) / SIZE;
    return { size, gap };
  }

  function getTileClass(v) {
    return v <= 2048 ? 'tile-' + v : 'tile-super';
  }

  function getTileFont(v, sz) {
    if (v < 100) return sz * 0.42;
    if (v < 1000) return sz * 0.35;
    if (v < 10000) return sz * 0.28;
    return sz * 0.22;
  }

  function createTileEl(tid, value, row, col, size, gap) {
    const tile = document.createElement('div');
    tile.className = 'tile ' + getTileClass(value);
    tile.textContent = value;
    tile.style.width = size + 'px';
    tile.style.height = size + 'px';
    tile.style.left = (col * (size + gap)) + 'px';
    tile.style.top = (row * (size + gap)) + 'px';
    tile.style.lineHeight = size + 'px';
    tile.style.fontSize = getTileFont(value, size) + 'px';
    return tile;
  }

  function updateTilePos(tile, row, col, size, gap) {
    tile.style.left = (col * (size + gap)) + 'px';
    tile.style.top = (row * (size + gap)) + 'px';
  }

  function renderTilesAnimated(mergedSet) {
    const { size, gap } = getTileSize();
    const newEls = new Map(); // new grid tid -> element

    for (let i = 0; i < SIZE * SIZE; i++) {
      if (grid[i] === 0) continue;
      const tid = tileIds[i];
      const row = Math.floor(i / SIZE);
      const col = i % SIZE;
      const isMerged = mergedSet && mergedSet.has(i);

      let tile = tileEls.get(tid);
      if (tile) {
        // Existing tile — may have moved. CSS transition handles the slide.
        tile.classList.remove('tile-new', 'tile-merge', 'tile-moving');
        tile.className = 'tile ' + getTileClass(grid[i]);
        tile.textContent = grid[i];
        tile.style.fontSize = getTileFont(grid[i], size) + 'px';

        if (isMerged) {
          tile.classList.add('tile-merge');
          // Value update after animation
          setTimeout(() => {
            tile.textContent = grid[i];
            tile.className = 'tile ' + getTileClass(grid[i]);
          }, 200);
        }

        updateTilePos(tile, row, col, size, gap);
        tileEls.delete(tid);
        newEls.set(tid, tile);
      } else {
        // New tile (just spawned or result of merge)
        tile = createTileEl(tid, grid[i], row, col, size, gap);
        tile.classList.add(isMerged ? 'tile-merge' : 'tile-new');
        tileEls.delete(tid);
        newEls.set(tid, tile);
      }
    }

    // Remove stale tile elements that are no longer on the grid
    for (const [staleTid, staleEl] of tileEls) {
      staleEl.style.opacity = '0';
      staleEl.style.transform = 'scale(0.3)';
      staleEl.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
      setTimeout(() => { if (staleEl.parentNode) staleEl.parentNode.removeChild(staleEl); }, 150);
    }

    // Add any new tile elements to the DOM
    for (const [tid, el] of newEls) {
      if (!el.parentNode) tileContainer.appendChild(el);
    }

    tileEls = newEls;
  }

  // Non-animated render for init / resize
  function renderTiles() {
    tileContainer.innerHTML = '';
    tileEls.clear();
    const { size, gap } = getTileSize();

    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === 0) continue;
      const row = Math.floor(i / SIZE);
      const col = i % SIZE;
      const tile = createTileEl(tileIds[i], grid[i], row, col, size, gap);
      tile.classList.add('tile-new');
      tileContainer.appendChild(tile);
      tileEls.set(tileIds[i], tile);
    }
  }

  // ==================== Game Logic ====================
  function emptyCells() {
    const empty = [];
    for (let i = 0; i < grid.length; i++) { if (grid[i] === 0) empty.push(i); }
    return empty;
  }

  function addRandomTile() {
    const empty = emptyCells();
    if (empty.length === 0) return false;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
    tileIds[idx] = ++tileIdSeq;
    return true;
  }

  function processLine(line, idLine) {
    let arr = line.filter(v => v !== 0);
    let idArr = idLine.filter(v => v !== 0);
    const merged = [];
    const scoreGain = [];
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        scoreGain.push(arr[i]);
        idArr[i] = ++tileIdSeq; // merged tile gets a brand new ID
        merged.push(i);
        arr.splice(i + 1, 1);
        idArr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) { arr.push(0); idArr.push(0); }
    const moved = !line.every((v, i) => v === arr[i]);
    return { line: arr, idLine: idArr, moved, merged, scoreGain };
  }

  function moveGrid(dir) {
    let moved = false;
    const mergedSet = new Set();

    for (let r = 0; r < SIZE; r++) {
      let line = [], idLine = [], indices = [];

      if (dir === 0) {
        for (let c = 0; c < SIZE; c++) { line.push(grid[r * SIZE + c]); idLine.push(tileIds[r * SIZE + c]); indices.push(r * SIZE + c); }
      } else if (dir === 1) {
        for (let c = SIZE - 1; c >= 0; c--) { line.push(grid[r * SIZE + c]); idLine.push(tileIds[r * SIZE + c]); indices.push(r * SIZE + c); }
      } else if (dir === 2) {
        for (let c = 0; c < SIZE; c++) { line.push(grid[c * SIZE + r]); idLine.push(tileIds[c * SIZE + r]); indices.push(c * SIZE + r); }
      } else {
        for (let c = SIZE - 1; c >= 0; c--) { line.push(grid[c * SIZE + r]); idLine.push(tileIds[c * SIZE + r]); indices.push(c * SIZE + r); }
      }

      const result = processLine(line, idLine);
      if (result.moved) moved = true;
      if (result.scoreGain.length > 0) score += result.scoreGain.reduce((a, b) => a + b, 0);
      for (const m of result.merged) { mergedSet.add(indices[m]); }
      for (let i = 0; i < SIZE; i++) { grid[indices[i]] = result.line[i]; tileIds[indices[i]] = result.idLine[i]; }
    }
    return { moved, mergedSet };
  }

  function canMove() {
    for (let i = 0; i < grid.length; i++) { if (grid[i] === 0) return true; }
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        if (c < SIZE - 1 && grid[idx] === grid[idx + 1]) return true;
        if (r < SIZE - 1 && grid[idx] === grid[idx + SIZE]) return true;
      }
    }
    return false;
  }

  function hasWon() {
    for (let i = 0; i < grid.length; i++) { if (grid[i] >= 2048) return true; }
    return false;
  }

  function checkOverlay() {
    if (hasWon() && !winShown) {
      winShown = true;
      overlayTitle.textContent = '你赢了！';
      overlaySub.textContent = '太厉害了！继续挑战更高分？';
      overlayBtn.textContent = '再来一局';
      overlay.classList.remove('hidden');
      gameOver = true;
      if (score > 0) saveScore(score);
    } else if (!canMove()) {
      overlayTitle.textContent = '游戏结束';
      overlaySub.textContent = '没有可用移动了';
      overlayBtn.textContent = '重新开始';
      overlay.classList.remove('hidden');
      gameOver = true;
      if (score > 0) saveScore(score);
    }
  }

  function doMove(dir) {
    if (gameOver) return;
    const { moved, mergedSet } = moveGrid(dir);
    if (moved) {
      addRandomTile();
      updateScore();
      renderTilesAnimated(mergedSet);
      checkOverlay();
    }
  }

  // ==================== Init / Restart ====================
  function initGame() {
    // Remove all old tile elements
    tileContainer.innerHTML = '';
    tileEls.clear();
    grid = new Array(SIZE * SIZE).fill(0);
    tileIds = new Array(SIZE * SIZE).fill(0);
    tileIdSeq = 0;
    score = 0;
    gameOver = false;
    gameWon = false;
    winShown = false;
    overlay.classList.add('hidden');
    addRandomTile();
    addRandomTile();
    updateScore();
    renderTiles();
  }

  // ==================== Keyboard ====================
  document.addEventListener('keydown', function(e) {
    if (gameOver) return;
    const map = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3 };
    if (map[e.key] !== undefined) { e.preventDefault(); doMove(map[e.key]); }
  });

  // ==================== Touch Swipe ====================
  let tsX = 0, tsY = 0;
  boardWrapper.addEventListener('touchstart', function(e) {
    if (gameOver) return;
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, { passive: true });

  boardWrapper.addEventListener('touchend', function(e) {
    if (gameOver) return;
    if (tsX === 0 && tsY === 0) return;
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? 1 : 0);
    else doMove(dy > 0 ? 3 : 2);
    tsX = tsY = 0;
  });

  // ==================== Buttons ====================
  $('#newGameBtn').addEventListener('click', initGame);
  overlayBtn.addEventListener('click', initGame);

  // ==================== Resize ====================
  let resizeTO;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTO);
    resizeTO = setTimeout(() => renderTiles(), 100);
  });

  // ==================== Start ====================
  initTheme();
  updateScore();
  initGame();
})();
</script>
</body>
</html>
