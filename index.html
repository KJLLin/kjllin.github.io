<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 的个人主页 | 在线聊天系统 | 恐龙快跑升级版">
  <title>KJLLin · 个人主页</title>
  <style>
    /* ====================== Win11 25H2 全局规范 ====================== */
    html {
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent; outline: none;
      transition: inherit; -webkit-transition: inherit;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    :root {
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255, 255, 255, 0.85);
      --bg-mica-scroll: rgba(255, 255, 255, 0.92);
      --bg-mica-hover: rgba(255, 255, 255, 0.9);
      --border-mica: rgba(0, 0, 0, 0.06);
      --border-mica-hover: rgba(0, 120, 212, 0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.1);
      --accent-glow-weak: rgba(0, 120, 212, 0.05);
      --shadow-rest: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.09);
      --shadow-scroll: 0 4px 12px rgba(0, 0, 0, 0.08);
      --scroll-bar: #c4c4c4;
    }
    [data-theme="dark"]:root {
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20, 20, 20, 0.85);
      --bg-mica-scroll: rgba(20, 20, 20, 0.92);
      --bg-mica-hover: rgba(26, 26, 26, 0.9);
      --border-mica: rgba(255, 255, 255, 0.07);
      --border-mica-hover: rgba(0, 120, 212, 0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.15);
      --accent-glow-weak: rgba(0, 120, 212, 0.07);
      --shadow-rest: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.35);
      --shadow-scroll: 0 4px 12px rgba(0, 0, 0, 0.3);
      --scroll-bar: #4a4a4a;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }
    #loader {
      position: fixed; inset: 0; background: var(--bg-body);
      display: grid; place-items: center; z-index: 9999;
      transition: opacity var(--transition-normal);
    }
    .loader-spin {
      width: 40px; height: 40px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mica {
      background: var(--bg-mica);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
    }
    .container { max-width: 960px; margin: 0 auto; padding: 28px 16px; position: relative; z-index: 1; }
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-radius: var(--radius-md); margin-bottom: 50px;
      box-shadow: var(--shadow-rest); position: sticky; top: 16px; z-index: 90;
    }
    .navbar.scrolled {
      background: var(--bg-mica-scroll); box-shadow: var(--shadow-scroll);
      transform: translateY(-2px);
    }
    .logo { font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: 0.2px; }
    .win-btn {
      width: 40px; height: 40px; border-radius: var(--radius-sm); border: none;
      font-size: 18px; background: rgba(220, 220, 220, 0.4);
      color: var(--text-primary); display: grid; place-items: center; cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    [data-theme="dark"] .win-btn { background: rgba(40, 40, 40, 0.4); }
    .win-btn:hover { background: rgba(220, 220, 220, 0.6); }
    [data-theme="dark"] .win-btn:hover { background: rgba(50, 50, 50, 0.6); }
    .win-btn:active { transform: scale(0.95); }
    .profile { text-align: center; margin-bottom: 70px; animation: fadeUp 0.8s var(--win-ease) forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .avatar-box { width: 104px; height: 104px; margin: 0 auto 22px; position: relative; }
    .avatar {
      width: 100%; height: 100%; border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff; font-size: 40px; font-weight: 700;
      display: grid; place-items: center;
      box-shadow: 0 8px 24px var(--accent-glow); position: relative; z-index: 2;
    }
    .avatar-box::after, .avatar-box::before {
      content: ''; position: absolute; inset: -6px; border-radius: var(--radius-full);
      background: var(--accent); z-index: 1; opacity: 0.2; pointer-events: none;
    }
    .avatar-box::after { animation: pulse 3s ease-in-out infinite; }
    .avatar-box::before { animation: pulse 3s ease-in-out 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.08); opacity: 0.1; } }
    .name {
      font-size: 36px; font-weight: 600; margin-bottom: 12px;
      background: linear-gradient(90deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block;
    }
    .desc { font-size: 16px; color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.7; }
    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 28px; text-align: center; opacity: 0; animation: fadeUp 0.7s var(--win-ease) forwards 0.2s; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 80px; }
    .project-card {
      display: block; padding: 32px 28px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest); text-decoration: none; color: inherit;
      cursor: pointer; position: relative; overflow: hidden;
      opacity: 0; animation: fadeUp 0.7s var(--win-ease) forwards;
      -webkit-user-select: none; user-select: none; z-index: 1;
    }
    .project-card:nth-child(1) { animation-delay: 0.3s; }
    .project-card:nth-child(2) { animation-delay: 0.4s; }
    .card-shine {
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transition: left 0.7s var(--win-ease); pointer-events: none; z-index: 0;
    }
    .project-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); border-color: var(--border-mica-hover); background: var(--bg-mica-hover); }
    .project-card:hover .card-shine { left: 100%; }
    .card-icon { font-size: 36px; margin-bottom: 18px; position: relative; z-index: 2; pointer-events: none; transition: transform var(--transition-fast); }
    .project-card:hover .card-icon { transform: scale(1.1); }
    .card-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; color: var(--accent); position: relative; z-index: 2; pointer-events: none; }
    .card-desc { font-size: 14px; color: var(--text-tertiary); line-height: 1.6; position: relative; z-index: 2; pointer-events: none; }
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    .footer { text-align: center; padding: 30px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
      .navbar { padding: 14px 18px; margin-bottom: 40px; top: 12px; }
      .name { font-size: 30px; }
      .card-grid { grid-template-columns: 1fr; gap: 18px; }
      .avatar-box { width: 96px; height: 96px; }
      .avatar { font-size: 36px; }
      .project-card { padding: 28px 24px; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    * { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-mica-glow-1"></div>
  <div class="bg-mica-glow-2"></div>
  <div id="loader"><div class="loader-spin"></div></div>

  <div class="container">
    <nav class="navbar mica" id="navbar">
      <div class="logo">KJLLin</div>
      <button id="themeBtn" class="win-btn mica" aria-label="切换深色/浅色模式">🌙</button>
    </nav>

    <section class="profile">
      <div class="avatar-box"><div class="avatar">K</div></div>
      <h1 class="name">KJLLin</h1>
      <p class="desc">独立前端开发者 | 创意创作者<br>专注开发简洁、稳定、流畅的 Web 应用</p>
    </section>

    <section>
      <h2 class="section-title">我的作品</h2>
      <div class="card-grid">
        <a href="/chat" class="project-card mica" id="cardChat">
          <div class="card-shine"></div>
          <div class="card-icon">💬</div>
          <h3 class="card-title">在线聊天系统</h3>
          <p class="card-desc">Windows11 风格实时聊天平台，内置账号系统、管理员后台、敏感词过滤、深色模式，全端兼容稳定运行。</p>
        </a>
        <a href="/game/" class="project-card mica" id="cardGame">
          <div class="card-shine"></div>
          <div class="card-icon">🎮</div>
          <h3 class="card-title">游戏中心</h3>
          <p class="card-desc">精选小游戏合集，包含恐龙快跑升级版、舒尔特方格等经典游戏，支持触屏操作，随时随地畅玩。</p>
        </a>
      </div>
    </section>

    <footer class="footer">© 2026 KJLLin · All Rights Reserved</footer>
  </div>

  <button id="backTop" class="win-btn mica" aria-label="返回顶部">↑</button>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const root = document.documentElement;
    const metaTheme = $('meta[name="theme-color"]');
    const themeBtn = $('#themeBtn');
    const loader = $('#loader');
    const backTop = $('#backTop');
    const navbar = $('#navbar');
    const cardChat = $('#cardChat');
    const cardGame = $('#cardGame');
    let isScrolling = false;
    let touchStartData = {};

    function handleTouchStart(e) {
      touchStartData = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
    function handleTouchEnd(e, callback) {
      const t = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, time: Date.now() };
      const dx = Math.abs(t.x - touchStartData.x);
      const dy = Math.abs(t.y - touchStartData.y);
      const dt = t.time - touchStartData.time;
      if (dx < 10 && dy < 10 && dt < 300) { e.preventDefault(); e.stopPropagation(); callback(); }
    }

    function initTheme() {
      try {
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const localDark = localStorage.getItem('theme') === 'dark';
        if (localDark || sysDark) { root.dataset.theme = 'dark'; themeBtn.textContent = '☀️'; metaTheme.content = '#0f0f0f'; }
        else { themeBtn.textContent = '🌙'; metaTheme.content = '#f3f3f3'; }
      } catch(e) { themeBtn.textContent = '🌙'; }
    }
    function toggleTheme() {
      try {
        const isDark = root.dataset.theme === 'dark';
        if (isDark) { root.dataset.theme = ''; localStorage.removeItem('theme'); themeBtn.textContent = '🌙'; metaTheme.content = '#f3f3f3'; }
        else { root.dataset.theme = 'dark'; localStorage.setItem('theme', 'dark'); themeBtn.textContent = '☀️'; metaTheme.content = '#0f0f0f'; }
      } catch(e) {}
    }
    function handleScroll() {
      if (isScrolling) return;
      isScrolling = true;
      requestAnimationFrame(() => {
        backTop.classList.toggle('show', window.scrollY > 300);
        navbar.classList.toggle('scrolled', window.scrollY > 20);
        isScrolling = false;
      });
    }
    function goToChat() { window.location.href = '/chat'; }
    function goToGame() { window.location.href = '/game/'; }
    function goToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      setTimeout(() => { loader.style.opacity = 0; setTimeout(() => loader.remove(), 300); }, 400);
    });
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchstart', handleTouchStart);
    themeBtn.addEventListener('touchend', e => handleTouchEnd(e, toggleTheme));
    cardChat.addEventListener('click', goToChat);
    cardChat.addEventListener('touchstart', handleTouchStart);
    cardChat.addEventListener('touchend', e => handleTouchEnd(e, goToChat));
    cardGame.addEventListener('click', goToGame);
    cardGame.addEventListener('touchstart', handleTouchStart);
    cardGame.addEventListener('touchend', e => handleTouchEnd(e, goToGame));
    backTop.addEventListener('click', goToTop);
    backTop.addEventListener('touchstart', handleTouchStart);
    backTop.addEventListener('touchend', e => handleTouchEnd(e, goToTop));
    window.addEventListener('scroll', handleScroll);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', initTheme);
    window.addEventListener('beforeunload', () => {
      window.removeEventListener('scroll', handleScroll);
      themeBtn.removeEventListener('click', toggleTheme);
      cardChat.removeEventListener('click', goToChat);
      cardGame.removeEventListener('click', goToGame);
      backTop.removeEventListener('click', goToTop);
    });
  </script>
</body>
</html>
