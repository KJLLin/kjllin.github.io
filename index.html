  <style>
    /* ====================== 首页专属样式 — 基于 theme.css 设计系统 ====================== */

    /* ── 背景光晕 ── */
    .bg-base {
      position: fixed; inset: 0; background: var(--color-bg); z-index: -3; pointer-events: none;
    }
    .bg-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--color-accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: glowFloat 14s ease-in-out infinite;
    }
    .bg-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,113,227,0.06), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: glowFloat 16s ease-in-out infinite reverse;
    }
    @keyframes glowFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── 加载遮罩 ── */
    #loader {
      position: fixed; inset: 0; background: var(--color-bg); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.4s var(--ease-out);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--color-accent-glow);
      border-top: 3px solid var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      font-size: 14px; color: var(--color-text-tertiary);
      animation: loaderPulse 2s ease-in-out infinite;
    }
    @keyframes loaderPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ── 布局容器 ── */
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px 28px; position: relative; z-index: 1; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }

    /* ── Hero 区域 — Apple 风格大留白 + 渐变标题 ── */
    .hero {
      text-align: center;
      padding: 120px 0 80px;
      animation: fadeUp 0.9s var(--spring-smooth) forwards;
    }
    .hero-greeting {
      font-size: 14px; font-weight: 500; color: var(--color-text-secondary);
      letter-spacing: 0.4px; margin-bottom: 12px;
      text-transform: uppercase;
      opacity: 0; animation: fadeUp 0.6s var(--spring-default) 0.1s forwards;
    }
    .hero-name {
      font-size: clamp(40px, 7vw, 56px); font-weight: 700; margin-bottom: 20px;
      line-height: 1.08;
      background: linear-gradient(135deg, var(--color-text-primary) 0%, var(--color-accent) 50%, var(--color-accent-light) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      display: inline-block;
      letter-spacing: var(--tracking-tight);
      font-optical-sizing: auto;
    }
    .hero-name .cursor {
      display: inline-block; width: 3px; height: 0.85em;
      background: var(--color-accent); margin-left: 4px; vertical-align: text-bottom;
      animation: cursorBlink 0.8s step-end infinite;
      border-radius: 1px;
    }
    @keyframes cursorBlink { 50% { opacity: 0; } }
    .hero-subtitle {
      font-size: 18px; color: var(--color-text-secondary);
      max-width: 560px; margin: 0 auto;
      line-height: 1.6;
      opacity: 0; animation: fadeUp 0.6s var(--spring-default) 0.25s forwards;
    }

    /* ── 区块标题 ── */
    .section {
      margin-bottom: 64px;
      opacity: 0; animation: slideUp 0.7s var(--spring-default) 0.2s forwards;
    }
    .section-header {
      text-align: center; margin-bottom: 40px;
    }
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--color-accent);
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(28px, 4vw, 34px); font-weight: 700;
      color: var(--color-text-primary);
      line-height: 1.15;
      letter-spacing: var(--tracking-tight);
      font-optical-sizing: auto;
    }
    .section-title::after {
      content: ''; display: block; width: 40px; height: 3px; border-radius: 2px;
      background: var(--color-accent); margin: 14px auto 0;
    }

    /* ── 卡片网格 ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    .project-card {
      display: block; padding: 36px 32px; border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      background: var(--color-bg-glass);
      background-image: var(--iridescent);
      backdrop-filter: var(--blur-card);
      -webkit-backdrop-filter: var(--blur-card);
      border-top: 1px solid var(--color-border-glass);
      box-shadow: var(--glass-shadow);
      text-decoration: none; color: inherit;
      cursor: pointer; position: relative; overflow: hidden;
      opacity: 0; animation: slideUp 0.6s var(--spring-default) forwards;
      user-select: none;
      transition: transform 0.4s var(--spring-bounce), box-shadow 0.4s var(--spring-smooth), border-color var(--transition-fast), background 0.4s var(--spring-smooth), backdrop-filter 0.4s var(--spring-smooth);
      will-change: transform;
    }
    .project-card:nth-child(1) { animation-delay: 0.25s; }
    .project-card:nth-child(2) { animation-delay: 0.35s; }
    .project-card:nth-child(3) { animation-delay: 0.45s; }

    /* ── 扫光效果 ── */
    .card-shine {
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 55%, transparent 60%);
      transition: left 0.8s var(--spring-smooth); pointer-events: none; z-index: 0;
    }
    [data-theme="dark"] .card-shine {
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.02) 45%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 55%, transparent 60%);
    }
    .project-card:hover {
      transform: translateY(-6px);
      border-color: var(--color-border-hover);
      box-shadow: var(--glass-shadow-hover);
      background: var(--color-bg-glass-hover);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
    }
    .project-card:hover .card-shine { left: 100%; }
    /* Apple 按压反馈：物理弹簧瞬时缩小 */
    .project-card:active {
      transform: translateY(-2px) scale(0.98);
      transition: transform var(--duration-instant) var(--spring-default);
    }

    .card-icon {
      font-size: 44px; margin-bottom: 20px; position: relative; z-index: 2;
      pointer-events: none;
      transition: transform 0.5s var(--spring-bounce);
      display: inline-block;
      color: var(--color-accent);
      will-change: transform;
    }
    .project-card:hover .card-icon {
      transform: scale(1.14) rotate(-4deg);
    }
    .card-title {
      font-size: 22px; font-weight: 600; margin-bottom: 10px;
      color: var(--color-text-primary); position: relative; z-index: 2; pointer-events: none;
    }
    .card-desc {
      font-size: 14px; color: var(--color-text-tertiary); line-height: 1.65;
      position: relative; z-index: 2; pointer-events: none;
      font-family: var(--font-sans);
    }
    .card-tags {
      display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
      position: relative; z-index: 2; pointer-events: none;
    }
    .tag {
      font-size: 11px; padding: 4px 12px; border-radius: var(--radius-full);
      background: var(--color-accent-glow); color: var(--color-accent);
      font-weight: 500;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .project-card:hover .tag {
      background: rgba(0,113,227,0.18);
    }

    /* ── 涟漪效果 ── */
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(0,113,227,0.15); transform: scale(0);
      animation: rippleAnim 0.6s ease-out forwards; pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* ── 返回顶部 ── */
    #backTop {
      position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: 1px solid var(--color-border);
      font-size: 17px; cursor: pointer;
      background: var(--color-bg-glass);
      backdrop-filter: var(--blur-button);
      -webkit-backdrop-filter: var(--blur-button);
      color: var(--color-text-primary);
      opacity: 0; pointer-events: none; z-index: 80;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-accent);
    }

    /* ── 页脚 ── */
    .footer {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      flex-wrap: wrap;
      padding: 40px 20px; font-size: 13px;
      color: var(--color-text-tertiary);
      border-top: 1px solid var(--color-border);
      margin-top: 24px;
    }
    .footer a {
      color: var(--color-accent); text-decoration: none; font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }
    .footer .footer-sep { opacity: 0.4; }

    /* ── 用户选择限制 ── */
    body * { -webkit-user-select: none; user-select: none; }
    input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }

    /* ── 响应式 ── */
    @media (max-width: 768px) {
      .hero { padding: 90px 0 56px; }
      .hero-name { font-size: 36px; }
      .hero-subtitle { font-size: 16px; }
      .section-title { font-size: 26px; }
      .card-grid { grid-template-columns: 1fr; gap: 16px; }
      .project-card { padding: 28px 24px; }
      .bg-glow-1, .bg-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .hero { padding: 80px 0 48px; }
      .hero-name { font-size: 30px; }
      .section-title { font-size: 24px; }
    }
  </style>

  <style>
    /* ==================== 首页 · iCloud 小组件桌面 ==================== */
    .home-shell {
      position: relative;
      padding-top: 108px;
      padding-bottom: 40px;
      min-height: 100vh;
    }
    /* 背景光斑（不依赖图片） */
    .home-shell::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(46% 38% at 12% 8%, rgba(10,132,255,.34), transparent 62%),
        radial-gradient(40% 34% at 88% 0%, rgba(191,90,242,.28), transparent 62%),
        radial-gradient(44% 40% at 74% 90%, rgba(48,209,88,.24), transparent 62%),
        radial-gradient(36% 36% at 4% 94%, rgba(255,159,10,.24), transparent 62%),
        radial-gradient(30% 26% at 46% 52%, rgba(90,200,250,.18), transparent 66%);
    }
    html[data-theme="dark"] .home-shell::before {
      background:
        radial-gradient(46% 38% at 12% 8%, rgba(10,132,255,.36), transparent 62%),
        radial-gradient(40% 34% at 88% 0%, rgba(191,90,242,.30), transparent 62%),
        radial-gradient(44% 40% at 74% 90%, rgba(48,209,88,.22), transparent 62%),
        radial-gradient(36% 36% at 4% 94%, rgba(255,159,10,.18), transparent 62%),
        radial-gradient(30% 26% at 46% 52%, rgba(90,200,250,.16), transparent 66%);
    }

    .home-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
    }
    .home-hello { min-width: 0; flex: 1; }
    .home-date {
      font-size: 12px; letter-spacing: .04em;
      color: var(--color-text-tertiary);
      margin-bottom: 2px;
    }
    .home-title {
      font-size: clamp(22px, 3.4vw, 30px);
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--color-text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .home-sub {
      font-size: 13px;
      color: var(--color-text-tertiary);
      margin-top: 4px;
    }
    .home-login {
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--color-accent);
      color: var(--color-text-on-accent);
      font-size: 14px; font-weight: 600;
      text-decoration: none;
      flex-shrink: 0;
    }

    /* 网格 */
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 156px;
      gap: 16px;
    }
    .widget {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      border-radius: 24px;
      background: var(--color-bg-glass);
      backdrop-filter: var(--blur-button);
      -webkit-backdrop-filter: var(--blur-button);
      border: 1px solid var(--color-border);
      box-shadow: 0 8px 26px rgba(0,0,0,.06);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform .28s var(--spring-default, cubic-bezier(.2,.8,.2,1)),
                  box-shadow .28s ease, border-color .28s ease;
    }
    .widget::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity .28s ease;
      background: radial-gradient(120% 90% at 0% 0%, var(--w-tint, transparent), transparent 62%);
      pointer-events: none;
    }
    .widget:hover {
      transform: translateY(-3px) scale(1.012);
      box-shadow: 0 16px 38px rgba(0,0,0,.12);
      border-color: var(--color-border-strong, var(--color-border));
    }
    .widget:hover::after { opacity: 1; }
    .widget:active { transform: translateY(-1px) scale(.998); }

    .widget--chat { grid-column: span 2; grid-row: span 2; justify-content: flex-start; }
    .widget--chat .w-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      margin-top: 16px;
    }
    .widget--chat .w-foot { margin-top: auto; }

    .w-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .w-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: grid; place-items: center;
      color: #fff; font-size: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,.14);
      flex-shrink: 0;
    }
    .w-icon--chat    { background: linear-gradient(135deg, #0a84ff, #5ac8fa); }
    .w-icon--notif   { background: linear-gradient(135deg, #ff453a, #ff9f0a); }
    .w-icon--game    { background: linear-gradient(135deg, #bf5af2, #5e5ce6); }
    .w-icon--cloud   { background: linear-gradient(135deg, #64d2ff, #0a84ff); }
    .w-icon--discuss { background: linear-gradient(135deg, #30d158, #64d2ff); }
    .w-icon--profile { background: linear-gradient(135deg, #ff375f, #bf5af2); }
    .w-icon--settings{ background: linear-gradient(135deg, #8e8e93, #636366); }
    .w-icon--docs    { background: linear-gradient(135deg, #5e5ce6, #0a84ff); }
    .w-icon--news    { background: linear-gradient(135deg, #ff9f0a, #ff375f); }

    .widget--chat .w-icon { width: 48px; height: 48px; font-size: 21px; border-radius: 14px; }

    .w-title {
      font-size: 14px; font-weight: 600;
      color: var(--color-text-primary);
      letter-spacing: -.01em;
    }
    .w-body { margin-top: 10px; }
    .w-big {
      display: flex; align-items: baseline; gap: 6px;
      margin-top: 6px;
    }
    .w-big span {
      font-size: 46px; line-height: 1;
      font-weight: 700; letter-spacing: -.03em;
      color: var(--color-text-primary);
      font-variant-numeric: tabular-nums;
    }
    .w-big small, .w-num small {
      font-size: 12px; color: var(--color-text-tertiary);
    }
    .w-num { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
    .w-num span {
      font-size: 26px; font-weight: 700;
      letter-spacing: -.02em;
      color: var(--color-text-primary);
      font-variant-numeric: tabular-nums;
    }
    .w-src {
      display: inline-block; margin-right: 5px; padding: 1px 6px;
      border-radius: 5px; font-size: 10px; font-weight: 600;
      background: rgba(10, 132, 255, .12); color: var(--color-accent);
      vertical-align: 1px;
    }
    .w-preview {
      margin-top: 10px;
      font-size: 12px;
      color: var(--color-text-tertiary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    .w-foot {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px;
      color: var(--color-text-tertiary);
      margin-top: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .w-foot i { font-size: 9px; opacity: .55; margin-left: auto; }

    .w-badge {
      min-width: 22px; height: 22px; padding: 0 7px;
      border-radius: 999px;
      background: #ff453a; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 22px;
      text-align: center;
    }
    .w-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #ff453a;
      box-shadow: 0 0 0 4px rgba(255,69,58,.15);
    }

    /* 时钟组件 */
    .widget--clock {
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: linear-gradient(150deg, rgba(10,132,255,.14), rgba(191,90,242,.12));
      border-color: transparent;
    }
    .clock-time {
      font-size: 34px; font-weight: 700;
      letter-spacing: -.03em;
      color: var(--color-text-primary);
      font-variant-numeric: tabular-nums;
    }
    .clock-hint {
      font-size: 11px; color: var(--color-text-tertiary);
      letter-spacing: .08em;
    }

    /* 每类组件的轻微色染 */
    .widget--chat    { --w-tint: rgba(10,132,255,.10); }
    .widget--notif   { --w-tint: rgba(255,69,58,.09); }
    .widget--game    { --w-tint: rgba(191,90,242,.09); }
    .widget--cloud   { --w-tint: rgba(100,210,255,.10); }
    .widget--discuss { --w-tint: rgba(48,209,88,.09); }
    .widget--profile { --w-tint: rgba(255,55,95,.09); }
    .widget--settings{ --w-tint: rgba(142,142,147,.10); }
    .widget--docs    { --w-tint: rgba(94,92,230,.09); }

    @media (max-width: 900px) {
      .widget-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 158px; }
      .widget--chat { grid-column: span 2; grid-row: span 1; }
      .widget--chat .w-body { justify-content: flex-start; margin-top: 6px; }
      .widget--chat .w-preview,
      .widget--chat .w-foot { display: none; }
      .widget--chat .w-big span { font-size: 36px; }
    }

    function typeGreeting(userName) {
      var typeEl = document.getElementById('typeName');
      if (!typeEl || typeEl.dataset.typed) return;
      typeEl.dataset.typed = '1';
      var cursor = typeEl.querySelector('.cursor');
      var greeting = userName ? '欢迎回来，' + userName : '欢迎回来';
      var pos = 0;
      typeEl.textContent = '';
      if (cursor) typeEl.appendChild(cursor);
      function type() {
        if (pos < greeting.length) {
          typeEl.textContent = greeting.substring(0, pos + 1);
          if (cursor) typeEl.appendChild(cursor);
          pos++;
          setTimeout(type, 100 + Math.random() * 60);
        }
      }
      setTimeout(type, 300);
    }

  function ensureNewsIn(order) {
    try {
      if (!Array.isArray(order)) return order;
      if (order.indexOf('news') >= 0) return order;
      if (localStorage.getItem('kj_news_dismissed_v1')) return order;

    }
    if (id === 'game') {
      return '<div class="w-title">游戏中心</div><div class="w-num"><span>5</span><small>款游戏</small></div>';
    }
    if (id === 'cloud') {
      return '<div class="w-title">资源云盘</div><div class="w-num"><span>∞</span><small>云端空间</small></div>';
    }
    if (id === 'discuss') {
      return '<div class="w-title">文章广场</div><div class="w-num"><span>' + statText(s.posts) + '</span><small>篇我的文章</small></div>';
    }
    if (id === 'news') {
      var nit = d.news;
      return '<div class="w-title">资讯</div>' +
        '<div class="w-num"><span>' + statText(s.newsTotal) + '</span><small>条资讯</small></div>' +
        (nit && nit.title
          ? '<div class="w-preview">' +
            (nit.source_name ? '<span class="w-src">' + esc(nit.source_name) + '</span>' : '') +
            esc(nit.title) + '</div>'
          : '');
    }
    if (id === 'profile') {
      return '<div class="w-title">个人主页</div><div class="w-num"><span>查看</span><small>我的动态</small></div>';
    }
    if (id === 'settings') {
      return '<div class="w-title">设置</div>';
    }
    if (id === 'docs') {
      return '<div class="w-title">帮助文档</div>';
    }
    if (id === 'recentChats') {
      if (!d.convs.length) return '<div class="w-title">最近对话</div><div class="w-empty">暂无对话</div>';
      var ci = d.convs.slice(0, 3).map(function(c) {
        return '<div class="w-list-item"><span class="dot"></span>' +
          '<span class="txt">' + esc(c.nick || '用户') + '</span>' +
          (c.unread > 0 ? '<span class="meta">' + c.unread + ' 条</span>' : '') + '</div>';
      }).join('');
      return '<div class="w-title">最近对话</div><div class="w-list">' + ci + '</div>';
    }
    if (id === 'recentPosts') {
      if (!d.posts.length) return '<div class="w-title">最近文章</div><div class="w-empty">还没有发布文章</div>';
      var pi = d.posts.map(function(p) {
        return '<div class="w-list-item"><span class="dot"></span>' +
          '<span class="txt">' + esc(p.title || '无标题') + '</span>' +
          '<span class="meta">' + shortDate(p.created_at) + '</span></div>';
      }).join('');
      return '<div class="w-title">最近文章</div><div class="w-list">' + pi + '</div>';
    }
    if (id === 'games') {
      var gi = GAMES.map(function(g) {
        return '<a class="w-game" href="' + g[0] + '"><i class="fas ' + g[2] + '"></i>' + g[1] + '</a>';
      }).join('');
      return '<div class="w-title">快捷游戏</div><div class="w-games">' + gi + '</div>';
    }
    if (id === 'announce') {
      if (!d.announce) return '<div class="w-title">最新公告</div><div class="w-empty">暂无公告</div>';
      var t = d.announce.title || '';
      var body = d.announce.content ? truncate(d.announce.content, 46) : '';
      return '<div class="w-title">最新公告</div>' +
        '<div class="w-announce-text"><strong>' + esc(t) + '</strong>' +
        (body ? '<br>' + esc(body) : '') + '</div>';
    }
    return '';
  }

  function footHtml(id) {
    switch (id) {
      case 'chat':     return '<span>' + statText(STATE.stats.chatPartners) + '</span> 个对话 <i class="fas fa-arrow-right"></i>';
      case 'notif':    return '查看全部 <i class="fas fa-arrow-right"></i>';
      case 'game':     return '恐龙快跑 · 2048 · 贪吃蛇 <i class="fas fa-arrow-right"></i>';
      case 'cloud':    return '上传 · 分享 · 私有空间 <i class="fas fa-arrow-right"></i>';
      case 'discuss':  return '看看大家在聊什么 <i class="fas fa-arrow-right"></i>';
      case 'news':     return 'IT 之家 · 定时同步 <i class="fas fa-arrow-right"></i>';
      case 'profile':  return '查看主页 <i class="fas fa-arrow-right"></i>';
      case 'settings': return '账号 · 隐私 · 外观 <i class="fas fa-arrow-right"></i>';
      case 'docs':     return '使用指南与常见问题 <i class="fas fa-arrow-right"></i>';
      case 'recentChats': return '进入站内信 <i class="fas fa-arrow-right"></i>';
      case 'recentPosts': return '进入文章广场 <i class="fas fa-arrow-right"></i>';
      case 'games':       return '全部游戏 <i class="fas fa-arrow-right"></i>';
      case 'announce':    return '查看通知 <i class="fas fa-arrow-right"></i>';
      default: return '';
    }
  }

  function renderGrid() {
    var grid = $('widgetGrid');
    if (!grid) return;

    var html = STATE.layout.map(function(id) {
      var w = WIDGETS[id];
      if (!w) return '';
      var size = w.size === 'lg' ? ' widget--lg' : (w.size === 'md' ? ' widget--md' : '');
      var attrs = w.href ? ' data-href="' + w.href + '" role="link" tabindex="0"' : '';
      // 每个组件一个随机负延迟，让抖动相位错开（iOS 也是这样各不相同）
      var delay = (-(Math.random() * 0.4)).toFixed(2) + 's';
      var delBtn = w.fixed ? '' :
        '<button type="button" class="wt-btn wt-del" data-remove="' + id + '" aria-label="移除' + esc(w.title) + '">×</button>';
      var moveBtns = '<span class="widget-move">' +
        '<button type="button" class="wt-btn" data-move="-1" data-id="' + id + '" aria-label="' + esc(w.title) + ' 前移">‹</button>' +
        '<button type="button" class="wt-btn" data-move="1" data-id="' + id + '" aria-label="' + esc(w.title) + ' 后移">›</button>' +
        '</span>';
      return '<div class="widget' + size + ' widget--' + w.color +
        (w.fixed ? ' widget--fixed' : '') + '" data-w="' + id + '"' +
        ' style="--wiggle-delay:' + delay + '"' + attrs + '>' +
        topHtml(id) +
        '<div class="w-body">' + bodyHtml(id) + '</div>' +
        (footHtml(id) ? '<div class="w-foot">' + footHtml(id) + '</div>' : '') +
        delBtn + moveBtns +
        '</div>';
    }).join('');

    if (STATE.editing) {
      html += '<button type="button" class="widget widget--add" id="addWidgetBtn" aria-label="添加组件">＋</button>';
    }
    grid.innerHTML = html;
    updateClock();
  }

  function updateClock() {
    var d = new Date();
    var t = $('clockTime');
    if (t) t.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var dateEl = $('homeDate');
    if (dateEl) {
      dateEl.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 · 星期' + '日一二三四五六'[d.getDay()];
    }
  }

  // ---------------- 编辑操作 ----------------
  function setEditing(on) {
    STATE.editing = !!on;
    document.body.classList.toggle('home-editing', STATE.editing);
    var btn = $('editWidgetsBtn');
    if (btn) {
      btn.classList.toggle('active', STATE.editing);
      btn.setAttribute('aria-pressed', STATE.editing ? 'true' : 'false');
      btn.innerHTML = STATE.editing
        ? '<i class="fas fa-check"></i><span>完成</span>'
        : '<i class="fas fa-sliders"></i><span>编辑</span>';
    }
    if (!STATE.editing) { closeCatalog(); saveLayout(true); }   // 点「完成」立即落库
    renderGrid();
  }

  function moveWidget(id, dir) {
    var i = STATE.layout.indexOf(id);
    var j = i + dir;
    if (i < 0 || j < 0 || j >= STATE.layout.length) return;
    var tmp = STATE.layout[i];
    STATE.layout[i] = STATE.layout[j];
    STATE.layout[j] = tmp;
    saveLayout();
    renderGrid();
  }

  function removeWidget(id) {
    if (FIXED.indexOf(id) >= 0) return;
    if (id === 'news') { try { localStorage.setItem('kj_news_dismissed_v1', '1'); } catch (e) {} }
    STATE.layout = STATE.layout.filter(function(x) { return x !== id; });
    saveLayout();
    renderGrid();
  }

  // ---------------- 组件选择器 ----------------
  function openCatalog() {
    if ($('catalogOverlay')) return;
    var items = ADDABLE.map(function(id) {
      var w = WIDGETS[id];
      var added = STATE.layout.indexOf(id) >= 0;
      return '<div class="catalog-item">' +
        '<span class="ci-icon w-icon--' + w.color + '"><i class="fas ' + w.icon + '"></i></span>' +
        '<span class="ci-body"><span class="ci-title">' + esc(w.title) + '</span>' +
        '<span class="ci-desc">' + esc(w.desc || '') + '</span></span>' +
        '<button type="button" class="catalog-add" data-add="' + id + '"' +
        (added ? ' disabled' : '') + '>' + (added ? '已添加' : '添加') + '</button>' +
        '</div>';
    }).join('');

    var html = '<div class="catalog-overlay" id="catalogOverlay">' +
      '<div class="catalog-sheet" role="dialog" aria-modal="true" aria-label="添加组件">' +
        '<div class="catalog-head"><h3>添加小组件</h3>' +
          '<button type="button" class="catalog-close" id="catalogClose" aria-label="关闭">×</button></div>' +
        '<p class="catalog-tip">选择要放到桌面上的组件。按住组件可拖动排序，排版会自动同步到你的账号。</p>' +
        items +
        '<div class="catalog-foot">' +
          '<button type="button" class="catalog-reset" id="catalogReset">恢复默认布局</button>' +
          '<button type="button" class="catalog-done" id="catalogDone">完成</button>' +
        '</div>' +
      '</div></div>';
    document.body.insertAdjacentHTML('beforeend', html);

    var ov = $('catalogOverlay');
    ov.addEventListener('click', function(e) { if (e.target === ov) closeCatalog(); });
    $('catalogClose').addEventListener('click', closeCatalog);
    $('catalogDone').addEventListener('click', closeCatalog);
    $('catalogReset').addEventListener('click', function() {
      STATE.layout = DEFAULT_LAYOUT.slice();
      saveLayout(true);
      renderGrid();
      closeCatalog();
    });
    var adds = ov.querySelectorAll('[data-add]');
    for (var i = 0; i < adds.length; i++) {
      adds[i].addEventListener('click', function() {
        var id = this.getAttribute('data-add');
        if (STATE.layout.indexOf(id) >= 0) return;
        if (id === 'news') { try { localStorage.removeItem('kj_news_dismissed_v1'); } catch (e) {} }
        STATE.layout.push(id);
        saveLayout();
        renderGrid();
        this.disabled = true;
        this.textContent = '已添加';
      });
    }
  }

  function closeCatalog() {
    var el = $('catalogOverlay');
    if (el) el.remove();
  }

  // ---------------- 事件绑定 ----------------
  function bindGrid() {
    var grid = $('widgetGrid');
    if (!grid) return;

    var drag = null;
    var suppressClick = false;

    function killDrag(animateBack) {
      if (!drag) return;
      var el = drag.el;
      clearTimeout(drag.longPress);
      document.body.classList.remove('dragging-widget');
      var t = grid.querySelector('.is-drop-target');
      if (t) t.classList.remove('is-drop-target');

      if (drag.started) {
        suppressClick = true;
        setTimeout(function() { suppressClick = false; }, 60);
        if (animateBack) {
          el.style.transition = 'transform .18s cubic-bezier(.2,.8,.2,1)';
          el.style.transform = 'translate3d(0,0,0)';
          setTimeout(function() {
            el.classList.remove('is-dragging');
            el.style.transition = '';
            el.style.transform = '';
          }, 180);
        } else {
          el.classList.remove('is-dragging');
          el.style.transform = '';
        }
      }
      drag = null;
    }

    function startDrag() {
      if (!drag || drag.started) return;
      drag.started = true;
      drag.el.classList.add('is-dragging');
      document.body.classList.add('dragging-widget');
      drag.el.style.transform = 'translate3d(0,0,0) scale(1.04)';
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (_) {} }
    }

    // 按下：桌面端拖 6px 即起，触摸端需先长按 300ms（把普通滑动留给页面滚动）
    grid.addEventListener('pointerdown', function(e) {
      if (!STATE.editing) return;
      if (e.target.closest('button, a[href]')) return;
      var el = e.target.closest('.widget[data-w]');
      if (!el || el.classList.contains('widget--add')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      drag = {
        el: el, id: el.getAttribute('data-w'), pid: e.pointerId,
        x0: e.clientX, y0: e.clientY, dx: 0, dy: 0,
        started: false, touch: e.pointerType !== 'mouse', longPress: null
      };
      if (drag.touch) {
        drag.longPress = setTimeout(function() {
          if (drag && !drag.started) startDrag();
        }, 300);
      }
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });

    grid.addEventListener('pointermove', function(e) {
      if (!drag || e.pointerId !== drag.pid) return;
      drag.dx = e.clientX - drag.x0;
      drag.dy = e.clientY - drag.y0;

      if (!drag.started) {
        var dist = Math.sqrt(drag.dx * drag.dx + drag.dy * drag.dy);
        if (drag.touch) {
          if (dist > 10) { clearTimeout(drag.longPress); drag = null; }  // 判定为滚动
          return;
        }
        if (dist < 6) return;
        startDrag();
      }

      if (e.cancelable) e.preventDefault();
      drag.el.style.transform =
        'translate3d(' + drag.dx + 'px,' + drag.dy + 'px,0) scale(1.04)';

      var under = document.elementFromPoint(e.clientX, e.clientY);
      var t = under && under.closest ? under.closest('.widget[data-w]') : null;
      if (t === drag.el) t = null;
      var prev = grid.querySelector('.is-drop-target');
      if (prev && prev !== t) prev.classList.remove('is-drop-target');
      if (t) t.classList.add('is-drop-target');
    });

    grid.addEventListener('pointerup', function(e) {
      if (!drag || e.pointerId !== drag.pid) return;
      var d = drag;
      var target = grid.querySelector('.is-drop-target');

      if (!d.started || !target) { killDrag(true); return; }

      var from = STATE.layout.indexOf(d.id);
      var to = STATE.layout.indexOf(target.getAttribute('data-w'));
      killDrag(false);
      if (from < 0 || to < 0 || from === to) return;

      STATE.layout.splice(to, 0, STATE.layout.splice(from, 1)[0]);
      saveLayout();
      renderGrid();
    });

    grid.addEventListener('pointercancel', function() { killDrag(true); });

    // 拖拽中锁住页面滚动（触摸端长按后）
    document.addEventListener('touchmove', function(e) {
      if (drag && drag.started && e.cancelable) e.preventDefault();
    }, { passive: false });

    grid.addEventListener('click', function(e) {
      if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
      var move = e.target.closest('[data-move]');
      if (move) {
        e.preventDefault();
        e.stopPropagation();
        moveWidget(move.getAttribute('data-id'), Number(move.getAttribute('data-move')));
        return;
      }
      var del = e.target.closest('[data-remove]');
      if (del) {
        e.preventDefault();
        e.stopPropagation();
        removeWidget(del.getAttribute('data-remove'));
        return;
      }
      if (e.target.closest('#addWidgetBtn')) {
        e.preventDefault();
        openCatalog();
        return;
      }
      if (STATE.editing) return;
      // 组件内部的链接（快捷游戏）交给浏览器
      if (e.target.closest('a[href]')) return;
      var w = e.target.closest('.widget[data-href]');
      if (w) window.location.href = w.getAttribute('data-href');
    });

    grid.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (STATE.editing) return;
      var w = e.target.closest('.widget[data-href]');
      if (w) {
        e.preventDefault();
        window.location.href = w.getAttribute('data-href');
      }
    });
  }

  // ---------------- 数据 ----------------
  function loadData(user) {
    var sb = null;
    try { sb = KJ.createSupabase(); } catch (e) {}
    if (!sb) { renderGrid(); return; }

    var empty = Promise.resolve({ data: [], count: null, error: null });
    // 未登录时这两个 RPC 会 401，直接跳过，避免控制台报错与无谓请求
    var tasks = [
      user ? sb.rpc('chat_conversations') : empty,
      user ? sb.rpc('notif_stats') : empty,
      user ? sb.from('posts')
        .select('id,title,created_at', { count: 'exact' })
        .eq('user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(3) : empty,
      sb.from('announcements')
        .select('id,title,content,created_at')
        .eq('active', true)
        .order('created_at', { ascending: false })
        .limit(1),
      sb.rpc('news_stats'),
      sb.rpc('news_list', { p_limit: 1 })
    ];

    Promise.allSettled(tasks).then(function(res) {
      // 会话
      try {
        if (res[0].status === 'fulfilled' && res[0].value && !res[0].value.error) {
          var rows = res[0].value.data || [];
          STATE.data.convs = rows.map(function(r) {
            return { nick: r.nick || '用户', unread: Number(r.unread) || 0 };
          });
          STATE.stats.chatUnread = rows.reduce(function(a, c) { return a + (Number(c.unread) || 0); }, 0);
          STATE.stats.chatPartners = rows.length;
          STATE.stats.chatPreview = rows[0] && rows[0].latest_text
            ? truncate(rows[0].latest_text, 30) : '';
        }
      } catch (e) {}

      // 通知
      try {
        if (res[1].status === 'fulfilled' && res[1].value && !res[1].value.error &&
            res[1].value.data && res[1].value.data.length) {
          STATE.stats.notifUnread = Number(res[1].value.data[0].unread) || 0;
        }
      } catch (e) {}

      // 文章
      try {
        if (res[2].status === 'fulfilled' && res[2].value && !res[2].value.error) {
          STATE.data.posts = res[2].value.data || [];
          STATE.stats.posts = typeof res[2].value.count === 'number'
            ? res[2].value.count : STATE.data.posts.length;
        }
      } catch (e) {}

      // 公告
      try {
        if (res[3].status === 'fulfilled' && res[3].value && !res[3].value.error) {
          STATE.data.announce = (res[3].value.data || [])[0] || null;
        }
      } catch (e) {}

      // 资讯
      try {
        if (res[4] && res[4].status === 'fulfilled' && res[4].value && !res[4].value.error &&
            res[4].value.data && res[4].value.data.length) {
          STATE.stats.newsTotal = Number(res[4].value.data[0].total) || 0;
        }
      } catch (e) {}
      try {
        if (res[5] && res[5].status === 'fulfilled' && res[5].value && !res[5].value.error) {
          STATE.data.news = (res[5].value.data || [])[0] || null;
        }
      } catch (e) {}

      renderGrid();
    });
  }

  // ---------------- 用户状态 ----------------
  function setGuest() {
    var g = $('homeGreet');
    if (g) g.textContent = greetingWord();
    var sub = $('homeSub');
    if (sub) sub.textContent = '登录后查看你的消息与动态';
    var login = $('homeLogin');
    if (login) login.hidden = false;
    clearTimeout(syncTimer);
    syncTimer = null;
    setSyncHint('', '');
    STATE.stats = { chatUnread: null, chatPartners: null, chatPreview: '', notifUnread: null, posts: null, newsTotal: null };
    STATE.data = { convs: [], posts: [], announce: null, news: null };
    renderGrid();
    loadData(null);
  }

  function applyUser(user) {
    STATE.user = user;
    var nick = nickOf(user);
    var nameEl = $('homeGreet');
    if (nameEl) nameEl.textContent = greetingWord() + '，' + nick;
    var login = $('homeLogin');
    if (login) login.hidden = true;

    STATE.layout = loadLayout();
    renderGrid();
    loadData(user);
    refreshLayoutFromCloud();      // 云端排版晚到则覆盖重绘
  }

  function waitForSupabase(cb, tries) {
    tries = tries || 0;
    var sb = null;
    try { sb = KJ.createSupabase(); } catch (e) {}
    if (sb) return cb(sb);
    if (tries > 80) return cb(null);
    setTimeout(function() { waitForSupabase(cb, tries + 1); }, 150);
  }

  // ---------------- 启动 ----------------
  function boot() {
    updateClock();
    setInterval(updateClock, 30000);

    var editBtn = $('editWidgetsBtn');
    if (editBtn) {
      editBtn.addEventListener('click', function() { setEditing(!STATE.editing); });
    }

    bindGrid();

    // 先按访客布局渲染，避免空白
    STATE.layout = loadLayout();
    renderGrid();

    waitForSupabase(function(sb) {
      if (!sb) { setGuest(); return; }
      sb.auth.getSession().then(function(r) {
        var user = r && r.data && r.data.session && r.data.session.user;
        if (user) applyUser(user); else setGuest();
      }).catch(setGuest);

      sb.auth.onAuthStateChange(function(event, session) {
        if (event === 'SIGNED_IN' && session && session.user) applyUser(session.user);
        else if (event === 'SIGNED_OUT') { STATE.user = null; setGuest(); }
      });
    });

    // ESC 退出编辑 / 关闭选择器
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      if ($('catalogOverlay')) { closeCatalog(); return; }
      if (STATE.editing) setEditing(false);
    });

    // 切回标签页时对齐云端排版（另一台设备可能刚改过）
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && !STATE.editing) refreshLayoutFromCloud();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

  </script>
