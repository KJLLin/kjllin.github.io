<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 的个人主页 | 站内信 | 游戏中心 | 资源云盘">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>KJLLin · 个人主页</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ====================== Win11 全局规范 ====================== */
    html {
      --win-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --transition-slow: 400ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      -webkit-transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent; outline: none;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    pre, code, .mono, .file-name, .preview-content pre, .msg-bubble, .card-desc {
      font-family: "Consolas", "Cascadia Code", "SF Mono", "Fira Code", monospace;
    }
    :root {
      --bg-body: #f3f3f3;
      --bg-mica: rgba(255, 255, 255, 0.85);
      --bg-mica-scroll: rgba(255, 255, 255, 0.92);
      --bg-mica-hover: rgba(255, 255, 255, 0.9);
      --border-mica: rgba(0, 0, 0, 0.06);
      --border-mica-hover: rgba(0, 120, 212, 0.12);
      --text-primary: #1a1a1a;
      --text-secondary: #5e5e5e;
      --text-tertiary: #8e8e8e;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0, 120, 212, 0.1);
      --accent-glow-weak: rgba(0, 120, 212, 0.05);
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.09);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.08);
      --scroll-bar: #c4c4c4;
    }
    [data-theme="dark"]:root {
      --bg-body: #0f0f0f;
      --bg-mica: rgba(20,20,20,0.85);
      --bg-mica-scroll: rgba(20,20,20,0.92);
      --bg-mica-hover: rgba(26,26,26,0.9);
      --border-mica: rgba(255,255,255,0.07);
      --border-mica-hover: rgba(0,120,212,0.2);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --accent: #0078d4;
      --accent-light: #0099ff;
      --accent-glow: rgba(0,120,212,0.15);
      --accent-glow-weak: rgba(0,120,212,0.07);
      --shadow-rest: 0 2px 8px rgba(0,0,0,0.25);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-scroll: 0 4px 12px rgba(0,0,0,0.3);
      --scroll-bar: #4a4a4a;
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; position: relative; touch-action: pan-y; }
    body { background: var(--bg-body); color: var(--text-primary); }

    /* ====================== 粒子背景 ====================== */
    #particlesCanvas {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .bg-base { position: fixed; inset: 0; background: var(--bg-body); z-index: -3; pointer-events: none; }
    .bg-mica-glow-1 {
      position: fixed; top: -15%; left: -10%; width: 55%; height: 55%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 14s ease-in-out infinite;
    }
    .bg-mica-glow-2 {
      position: fixed; bottom: -15%; right: -10%; width: 60%; height: 60%;
      border-radius: var(--radius-full);
      background: radial-gradient(circle, var(--accent-glow-weak), transparent 70%);
      z-index: -2; pointer-events: none;
      animation: micaFloat 16s ease-in-out infinite reverse;
    }
    @keyframes micaFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 4%) scale(1.05); }
    }

    /* ====================== 加载遮罩 ====================== */
    #loader {
      position: fixed; inset: 0; background: var(--bg-body); z-index: 9999;
      display: grid; place-items: center;
      transition: opacity 0.5s var(--win-ease);
    }
    .loader-content { text-align: center; }
    .loader-spin {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 3px solid var(--accent-glow); border-top: 3px solid var(--accent);
      border-radius: var(--radius-full);
      animation: spin 0.8s linear infinite;
    }
    .loader-text { font-size: 14px; color: var(--text-tertiary); animation: fadePulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* ====================== 云母组件 ====================== */
    .mica {
      background: var(--bg-mica);
      -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--border-mica);
    }

    /* ====================== 顶部菜单栏 ====================== */
    .top-menu {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 8px 16px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .menu-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-rest);
      pointer-events: all;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }
    .menu-bar.scrolled {
      background: var(--bg-mica-scroll);
      box-shadow: var(--shadow-scroll);
      transform: translateY(-2px);
    }
    .menu-logo {
      font-size: 18px; font-weight: 700; color: var(--accent);
      padding: 6px 14px; letter-spacing: 0.2px;
      margin-right: 4px;
    }
    .menu-item {
      padding: 7px 14px; border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; cursor: pointer;
      border: none; background: none;
      transition: all var(--transition-fast);
      white-space: nowrap; position: relative;
      letter-spacing: 0.3px;
    }
    .menu-item:hover { color: var(--accent); background: var(--accent-glow); }
    .menu-item.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; }
    .menu-item.active::after {
      content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 16px; height: 2px; border-radius: 1px; background: var(--accent);
    }
    .menu-divider { width: 1px; height: 20px; background: var(--border-mica); margin: 0 4px; }
    .menu-btn {
      width: 34px; height: 34px; border-radius: var(--radius-sm); border: none;
      font-size: 16px; cursor: pointer;
      background: rgba(220,220,220,0.4); color: var(--text-primary);
      display: grid; place-items: center;
      transition: all var(--transition-fast);
    }
    [data-theme="dark"] .menu-btn { background: rgba(40,40,40,0.4); }
    .menu-btn:hover { background: var(--accent-glow); color: var(--accent); }
    .menu-btn:active { transform: scale(0.92); }
    .nav-user-area { display: flex; align-items: center; }
    .unread-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #e74c3c; margin-left: -2px; margin-right: 4px;
      animation: dotPulse 2s ease-in-out infinite;
      vertical-align: middle;
    }

    /* 移动端汉堡菜单 */
    .hamburger { display: none; }
    .mobile-menu-dropdown {
      display: none; position: absolute; top: 100%; left: 16px; right: 16px;
      margin-top: 8px; padding: 8px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-hover); flex-direction: column; gap: 2px;
      pointer-events: all; z-index: 101;
    }
    .mobile-menu-dropdown.open { display: flex; }

    /* ====================== 布局 ====================== */
    .container { max-width: 960px; margin: 0 auto; padding: 80px 16px 28px; position: relative; z-index: 1; }

    /* ====================== 个人信息 ====================== */
    .profile { text-align: center; margin-bottom: 70px; animation: fadeUp 0.8s var(--win-ease) forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .avatar-box { width: 104px; height: 104px; margin: 0 auto 22px; position: relative; }
    .avatar {
      width: 100%; height: 100%; border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff; font-size: 40px; font-weight: 700;
      display: grid; place-items: center;
      box-shadow: 0 8px 24px var(--accent-glow); position: relative; z-index: 2;
      animation: scaleIn 0.6s var(--bounce) 0.1s both;
    }
    .avatar-box::after, .avatar-box::before {
      content: ''; position: absolute; inset: -6px; border-radius: var(--radius-full);
      background: var(--accent); z-index: 1; opacity: 0.2; pointer-events: none;
    }
    .avatar-box::after { animation: pulse 3s ease-in-out infinite; }
    .avatar-box::before { animation: pulse 3s ease-in-out 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.08); opacity: 0.1; } }

    .name {
      font-size: 36px; font-weight: 600; margin-bottom: 12px;
      background: linear-gradient(90deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block;
    }
    .name .cursor {
      display: inline-block; width: 3px; height: 0.9em;
      background: var(--accent); margin-left: 2px; vertical-align: text-bottom;
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 50% { opacity: 0; } }
    .desc { font-size: 16px; color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.7; }

    /* 状态标签 */
    .status-row {
      display: flex; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap;
    }
    .status-badge {
      font-size: 12px; padding: 5px 14px; border-radius: 20px;
      background: var(--accent-glow); color: var(--accent);
      font-weight: 500; display: flex; align-items: center; gap: 5px;
      animation: fadeUp 0.6s var(--win-ease) 0.5s both;
    }
    .status-badge:nth-child(2) { animation-delay: 0.6s; }
    .status-badge:nth-child(3) { animation-delay: 0.7s; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #34c88a; animation: dotPulse 2s ease-in-out infinite; }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ====================== 区块标题 ====================== */
    .section-title {
      font-size: 24px; font-weight: 600; margin-bottom: 28px; text-align: center;
      opacity: 0; animation: slideUp 0.7s var(--win-ease) forwards 0.2s;
    }
    .section-title::after {
      content: ''; display: block; width: 40px; height: 3px; border-radius: 2px;
      background: var(--accent); margin: 10px auto 0;
    }

    /* ====================== 卡片网格 ====================== */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 80px; }
    .project-card {
      display: block; padding: 32px 28px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-rest); text-decoration: none; color: inherit;
      cursor: pointer; position: relative; overflow: hidden;
      opacity: 0; animation: slideUp 0.7s var(--win-ease) forwards;
      -webkit-user-select: none; user-select: none; z-index: 1;
      transition: transform 0.35s var(--bounce), box-shadow 0.35s var(--win-ease), border-color 0.35s var(--win-ease);
    }
    .project-card:nth-child(1) { animation-delay: 0.25s; }
    .project-card:nth-child(2) { animation-delay: 0.35s; }
    .project-card:nth-child(3) { animation-delay: 0.45s; }

    /* 扫光效果 */
    .card-shine {
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 55%, transparent 60%);
      transition: left 0.7s var(--win-ease); pointer-events: none; z-index: 0;
    }
    .project-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-mica-hover);
      background: var(--bg-mica-hover);
    }
    .project-card:hover .card-shine { left: 100%; }

    .card-icon {
      font-size: 40px; margin-bottom: 18px; position: relative; z-index: 2;
      pointer-events: none; transition: transform 0.35s var(--bounce);
      display: inline-block;
    }
    .project-card:hover .card-icon {
      transform: scale(1.15) rotate(-5deg);
    }
    .card-title {
      font-size: 20px; font-weight: 600; margin-bottom: 10px;
      color: var(--accent); position: relative; z-index: 2; pointer-events: none;
    }
    .card-desc {
      font-size: 14px; color: var(--text-tertiary); line-height: 1.6;
      position: relative; z-index: 2; pointer-events: none;
    }

    /* 卡片标签 */
    .card-tags {
      display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap;
      position: relative; z-index: 2; pointer-events: none;
    }
    .tag {
      font-size: 11px; padding: 3px 10px; border-radius: 12px;
      background: var(--accent-glow); color: var(--accent); font-weight: 500;
    }

    /* ====================== 返回顶部 ====================== */
    #backTop {
      position: fixed; right: 24px; bottom: 24px; width: 46px; height: 46px;
      border-radius: var(--radius-sm); border: none; font-size: 17px;
      cursor: pointer; opacity: 0; pointer-events: none; z-index: 80;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }
    #backTop.show { opacity: 1; pointer-events: all; }
    #backTop:active { transform: scale(0.95); }
    #backTop:hover { transform: translateY(-2px); }

    /* ====================== 页脚 ====================== */
    .footer { text-align: center; padding: 30px 20px; font-size: 13px; color: var(--text-tertiary); border-top: 1px solid var(--border-mica); }

    /* ====================== 滚动条 ====================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-bar); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ====================== 涟漪效果 ====================== */
    .ripple { position: absolute; border-radius: 50%; background: rgba(0,120,212,0.2); transform: scale(0); animation: rippleAnim 0.6s ease-out forwards; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* ====================== 响应式 ====================== */
    @media (max-width: 768px) {
      .top-menu { padding: 6px 10px; }
      .menu-bar { padding: 4px 6px; gap: 0; }
      .menu-item { padding: 6px 10px; font-size: 12px; }
      .menu-logo { font-size: 16px; padding: 6px 10px; }
      .menu-divider { display: none; }
      .container { padding: 72px 16px 28px; }
      .name { font-size: 30px; }
      .card-grid { grid-template-columns: 1fr; gap: 16px; }
      .avatar-box { width: 96px; height: 96px; }
      .avatar { font-size: 36px; }
      .project-card { padding: 28px 24px; }
      .bg-mica-glow-1, .bg-mica-glow-2 { animation: none; }
    }
    @media (max-width: 520px) {
      .menu-bar .menu-item { display: none; }
      .menu-bar .menu-item.mobile-show { display: block; }
      .hamburger { display: grid; }
      .menu-divider { display: none; }
    }
    @media (min-width: 521px) {
      .hamburger { display: none !important; }
      .mobile-menu-dropdown { display: none !important; }
    }

    * { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="bg-base"></div>
