<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f3f3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <title>CPOAuth 授权 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/common.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f5f5f7;--card-bg:rgba(255,255,255,0.72);
      --border:rgba(0,0,0,0.06);--text:#1d1d1f;--text-secondary:#6e6e73;--text-tertiary:#86868b;
      --accent:#0071e3;--accent-ring:rgba(0,113,227,0.15);--success:#34c759;--danger:#ff3b30;
      --shadow:0 4px 24px rgba(0,0,0,0.06);--radius:14px;--radius-btn:24px;
      font-family:"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    [data-theme="dark"]{
      --bg:#000;--card-bg:rgba(28,28,30,0.78);
      --border:rgba(255,255,255,0.08);--text:#f5f5f7;--text-secondary:#a1a1a6;--text-tertiary:#6e6e73;
      --accent:#2997ff;--accent-ring:rgba(41,151,255,0.18);
      --shadow:0 4px 24px rgba(0,0,0,0.3);
    }
    html,body{width:100%;min-height:100vh}
    body{
      background:var(--bg);color:var(--text);
      display:flex;align-items:center;justify-content:center;padding:24px;
      transition:background .4s ease;
    }
    .container{z-index:1;width:100%;max-width:420px;text-align:center}
    .card{
      background:var(--card-bg);-webkit-backdrop-filter:blur(40px) saturate(180%);
      backdrop-filter:blur(40px) saturate(180%);
      border:1px solid var(--border);border-radius:var(--radius);
      padding:44px 36px 36px;box-shadow:var(--shadow);
      animation:slideUp .6s var(--spring-default);
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    .spinner{
      width:48px;height:48px;margin:0 auto 24px;border-radius:50%;
      border:3px solid var(--border);border-top-color:var(--accent);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-icon{font-size:48px;margin-bottom:16px}
    .status-icon.success{color:var(--success)}
    .status-icon.error{color:var(--danger)}
    .status-icon.warning{color:#ff9500}
    h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.2px}
    p{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px}
    .btn{
      display:inline-block;padding:12px 32px;border-radius:var(--radius-btn);border:none;
      font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
      background:var(--accent);color:#fff;transition:all .2s ease;margin:4px 8px;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-ring)}
    .btn:active{transform:scale(0.96);transition:transform 80ms ease}
    .btn-outline{
      background:transparent;color:var(--text);border:1.5px solid var(--border);
    }
    .btn-outline:hover{color:var(--accent);border-color:var(--accent)}
    .cpoauth-user-preview{
      display:flex;align-items:center;gap:10px;padding:12px 16px;margin:12px 0;
      background:var(--bg);border-radius:var(--radius);
      border:1px solid var(--border);text-align:left;
    }
    .cpoauth-user-preview .avatar{
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:grid;place-items:center;color:#fff;font-size:18px;flex-shrink:0;
    }
    .cpoauth-user-preview .info{font-size:13px}
    .cpoauth-user-preview .info .name{font-weight:600;color:var(--text)}
    .cpoauth-user-preview .info .detail{color:var(--text-tertiary);font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h2 id="statusTitle">正在验证授权...</h2>
      <p id="statusMsg">请稍候，正在通过 CPOAuth 安全网关完成验证</p>
      <div id="extraContent"></div>
      <div id="actionArea"></div>
    </div>
  </div>

  <script>
    (function(){
      const $=s=>document.querySelector(s);
      const SUPABASE_URL='https://vzqspcuxnwpakofwumat.supabase.co';
      const EDGE_FN=SUPABASE_URL+'/functions/v1/cpoauth-gate';
      const CPOAUTH_CLIENT_ID='2bbbe6cf-b13c-4181-8958-61184a2c799e';
      const STORAGE_KEY='kjllin_cpoauth';
      const VERIFIER_KEY='cpoauth_code_verifier';
      const STATE_KEY='cpoauth_oauth_state';
      const ACTION_KEY='cpoauth_action';

      let sb;
      try{sb=KJ.createSupabase()}catch(e){}

      function setStatus(icon, iconClass, title, msg, showSpinner){
        $('#spinner').style.display=showSpinner?'block':'none';
        if(!$('#statusTitle').querySelector('.status-icon')){
          const si=document.createElement('div');
          si.className='status-icon '+iconClass;si.innerHTML=icon;
          $('#statusTitle').parentNode.insertBefore(si,$('#statusTitle'));
        }
        $('#statusTitle').textContent=title;
        $('#statusMsg').textContent=msg;
      }

      function showError(title, msg, backLink){
        setStatus('<i class="fas fa-times-circle"></i>','error',title,msg,false);
        const link=backLink||'/login/';
        const label=backLink?'返回':'返回登录';
        $('#actionArea').innerHTML='<a href="'+link+'" class="btn">'+label+'</a>';
      }

      function showCpoauthUserPreview(userInfo){
        const name=userInfo.username||userInfo.display_name||userInfo.email||'CPOAuth 用户';
        const detail=userInfo.email||'';
        const initial=(name||'?').charAt(0).toUpperCase();
        $('#extraContent').innerHTML=
          '<div class="cpoauth-user-preview">'+
          '<div class="avatar">'+initial+'</div>'+
          '<div class="info"><div class="name">'+KJ.escapeHtml(name)+'</div>'+
          (detail?'<div class="detail">'+KJ.escapeHtml(detail)+'</div>':'')+
          '</div></div>';
      }

      async function handleCallback(){
        const params=new URLSearchParams(window.location.search);
        const error=params.get('error');
        const errorDesc=params.get('error_description');
        const code=params.get('code');
        const state=params.get('state');

        // 用户拒绝授权
        if(error){
          showError('授权已取消',errorDesc||'你取消了 CPOAuth 授权');
          return;
        }

        if(!code){
          showError('授权失败','未收到授权码，请返回登录页重试');
          return;
        }

        // 验证 state（防 CSRF）
        const savedState=sessionStorage.getItem(STATE_KEY);
        if(!savedState||savedState!==state){
          showError('安全校验失败','请求状态不匹配，可能是 CSRF 攻击，请重试');
          sessionStorage.removeItem(STATE_KEY);
          return;
        }
        sessionStorage.removeItem(STATE_KEY);

        // 获取 PKCE code_verifier
        const codeVerifier=sessionStorage.getItem(VERIFIER_KEY);
        if(!codeVerifier){
          showError('会话已过期','PKCE 验证信息丢失，请返回重新开始');
          return;
        }
        sessionStorage.removeItem(VERIFIER_KEY);

        // 获取 action（login 或 link）
        const action=sessionStorage.getItem(ACTION_KEY)||'login';
        sessionStorage.removeItem(ACTION_KEY);

        try{
          // 构建请求体
          // redirect_uri 必须与授权请求中的一致
          const redirectUri=sessionStorage.getItem('cpoauth_redirect_uri')||
            (window.location.origin+'/login/callback/');
          sessionStorage.removeItem('cpoauth_redirect_uri');

          const requestBody={
            code:code,
            code_verifier:codeVerifier,
            redirect_uri:redirectUri,
            action:action
          };

          // action=link 时附带 Supabase 会话 token
          if(action==='link'&&sb){
            try{
              const{data:{session}}=await sb.auth.getSession();
              if(session?.access_token){
                requestBody.supabase_token=session.access_token;
              }
            }catch(e){}
          }

          // ── 调用 cpoauth-gate Edge Function（服务端验证） ──
          const res=await fetch(EDGE_FN,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(requestBody)
          });
          const data=await res.json();

          if(!data.success){
            // 未绑定错误 → 特殊处理
            if(data.error==='cpoauth_not_bound'){
              setStatus('<i class="fas fa-exclamation-triangle"></i>','warning',
                '账号未绑定','该 CPOAuth 账号尚未关联本站账号，请先用邮箱密码登录后在设置中绑定',false);
              if(data.cpoauth_user){
                showCpoauthUserPreview(data.cpoauth_user);
              }
              $('#actionArea').innerHTML=
                '<a href="/settings/" class="btn">前往设置</a>'+
                '<a href="/login/" class="btn btn-outline">返回登录</a>';
              return;
            }

            showError('授权失败',data.message||data.error||'服务端验证失败');
            return;
          }

          // ── 成功处理 ──
          if(action==='link'){
            // 绑定成功
            setStatus('<i class="fas fa-check-circle"></i>','success',
              '绑定成功','CPOAuth 账号已关联到你的账号',false);
            if(data.cpoauth_user){
              showCpoauthUserPreview(data.cpoauth_user);
            }

            // 同时保存到 localStorage
            try{
              localStorage.setItem(STORAGE_KEY,JSON.stringify({
                provider:'cpoauth',
                sub:data.cpoauth_user.sub,
                username:data.cpoauth_user.username,
                email:data.cpoauth_user.email,
                linked_at:new Date().toISOString()
              }));
            }catch(e){}

            setTimeout(()=>{window.location.href='/settings/'},1200);
            return;
          }

          // action=login → 跳转到 Supabase 生成的一次性登录链接
          // (cpoauth-gate 已通过 Admin API 为绑定用户生成了 magiclink session)
          if(!data.action_link){
            showError('登录失败','服务端未返回有效的会话链接');
            return;
          }

          // 保存 CPOAuth 信息到 localStorage
          try{
            localStorage.setItem(STORAGE_KEY,JSON.stringify({
              provider:'cpoauth',
              sub:data.cpoauth_user.sub,
              username:data.cpoauth_user.username,
              email:data.cpoauth_user.email,
              linked_at:new Date().toISOString()
            }));
          }catch(e){}

          setStatus('<i class="fas fa-check-circle"></i>','success',
            '验证通过','正在创建会话...',false);

          // 跳转到 Supabase 生成的 action_link（自动创建会话+跳转首页）
          setTimeout(()=>{window.location.href=data.action_link},600);

        }catch(e){
          console.error('CPOAuth callback error:',e);
          showError('验证失败',e.message||'无法连接安全网关，请稍后重试');
        }
      }

      handleCallback();
    })();
  </script>
</body>
</html>
