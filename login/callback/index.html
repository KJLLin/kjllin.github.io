<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>OAuth 授权 · KJLLin</title>
  <meta name="description" content="登录回调 - KJLLin">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js" integrity="sha384-EyR2P0dlmjnEGcm9xcjdAn0VedZpRHEwDLP9oSS6wYMvzHBHkUrvgonveazJ/sSx" crossorigin="anonymous"></script>
  <script src="/common.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f5f5f7;--card-bg:rgba(255,255,255,0.72);
      --border:rgba(0,0,0,0.06);--text:#1d1d1f;--text-secondary:#6e6e73;--text-tertiary:#86868b;
      --accent:#0071e3;--accent-ring:rgba(0,113,227,0.15);--success:#34c759;--danger:#ff3b30;
      --shadow:0 4px 24px rgba(0,0,0,0.06);--radius:14px;--radius-btn:24px;
      font-family:"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    [data-theme="dark"]{
      --bg:#000;--card-bg:rgba(28,28,30,0.78);
      --border:rgba(255,255,255,0.08);--text:#f5f5f7;--text-secondary:#a1a1a6;--text-tertiary:#6e6e73;
      --accent:#2997ff;--accent-ring:rgba(41,151,255,0.18);
      --shadow:0 4px 24px rgba(0,0,0,0.3);
    }
    html,body{width:100%;min-height:100vh}
    body{
      background:var(--bg);color:var(--text);
      display:flex;align-items:center;justify-content:center;padding:24px;
      transition:background .4s ease;
    }
    .container{z-index:1;width:100%;max-width:420px;text-align:center}
    .card{
      background:var(--card-bg);-webkit-backdrop-filter:blur(40px) saturate(180%);
      backdrop-filter:blur(40px) saturate(180%);
      border:1px solid var(--border);border-radius:var(--radius);
      padding:44px 36px 36px;box-shadow:var(--shadow);
      animation:slideUp .6s var(--spring-default);
    }
    @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
    .spinner{
      width:48px;height:48px;margin:0 auto 24px;border-radius:50%;
      border:3px solid var(--border);border-top-color:var(--accent);
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-icon{font-size:48px;margin-bottom:16px}
    .status-icon.success{color:var(--success)}
    .status-icon.error{color:var(--danger)}
    .status-icon.warning{color:#ff9500}
    h2{font-size:22px;font-weight:700;margin-bottom:8px;letter-spacing:-.2px}
    p{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px}
    .btn{
      display:inline-block;padding:12px 32px;border-radius:var(--radius-btn);border:none;
      font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
      background:var(--accent);color:#fff;transition:all .2s ease;margin:4px 8px;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-ring)}
    .btn:active{transform:scale(0.96);transition:transform 80ms ease}
    .btn-outline{
      background:transparent;color:var(--text);border:1.5px solid var(--border);
    }
    .btn-outline:hover{color:var(--accent);border-color:var(--accent)}
    .cpoauth-user-preview{
      display:flex;align-items:center;gap:10px;padding:12px 16px;margin:12px 0;
      background:var(--bg);border-radius:var(--radius);
      border:1px solid var(--border);text-align:left;
    }
    .cpoauth-user-preview .avatar{
      width:40px;height:40px;border-radius:50%;
      background:linear-gradient(135deg,#667eea,#764ba2);
      display:grid;place-items:center;color:#fff;font-size:18px;flex-shrink:0;
    }
    .cpoauth-user-preview .info{font-size:13px}
    .cpoauth-user-preview .info .name{font-weight:600;color:var(--text)}
    .cpoauth-user-preview .info .detail{color:var(--text-tertiary);font-size:12px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h2 id="statusTitle">正在验证授权...</h2>
      <p id="statusMsg">请稍候，正在通过 CPOAuth 安全网关完成验证</p>
      <div id="extraContent"></div>
      <div id="actionArea"></div>
    </div>
  </div>

  <script>
    (function(){
      // 主题初始化
      KJ.applyTheme('#f5f5f7', '#000');

      // Supabase Custom OIDC Provider 回调处理
      // 注意：OAuth 的 code 交换已在 Supabase 服务端完成，
      // 此页面仅处理到达后的会话恢复和跳转
      const $=s=>document.querySelector(s);
      
      let sb = KJ.createSupabase();
      
      function setStatus(icon, title, msg, showSpinner){
        $('#spinner').style.display = showSpinner ? 'block' : 'none';
        $('#statusTitle').textContent = title;
        $('#statusMsg').textContent = msg;
      }

      async function handleCallback(){
        try {
          setStatus('', '正在完成登录...', '请稍候', true);
          
          if (!sb) {
            setStatus('', '初始化失败', '网络错误，请刷新重试', false);
            $('#actionArea').innerHTML = '<a href="/login/" class="btn">返回登录</a>';
            return;
          }

          // Supabase 会自动从 URL hash 中提取 session
          // getSessionFromUrl 已废弃，改用 getSession 检查
          var { data: { session } } = await sb.auth.getSession();
          
          if (session) {
            // 从 URL 读取 redirect 参数（默认 '/'），登录成功后跳转到安全校验后的地址
            var redirect = KJ.safeRedirect(new URLSearchParams(window.location.search).get('redirect'));
            setStatus('', '登录成功', '正在跳转...', false);
            $('#actionArea').innerHTML = '<a href="' + KJ.escapeHtml(redirect) + '" class="btn">进入首页</a>';
            setTimeout(function(){ window.location.href = redirect; }, 800);
          } else {
            // 检查是否有 error 参数
            var params = new URLSearchParams(window.location.search);
            var err = params.get('error_description') || params.get('error') || '';
            setStatus('', err ? '授权失败' : '会话已过期', 
              err || '请返回登录页重试', false);
            $('#actionArea').innerHTML = '<a href="/login/" class="btn">返回登录</a>';
          }
        } catch(e) {
          console.error('OAuth callback error:', e);
          setStatus('', '验证失败', e.message || '请返回重试', false);
          $('#actionArea').innerHTML = '<a href="/login/" class="btn">返回登录</a>';
        }
      }

      handleCallback();
    })();
  </script>
</body>
</html>
