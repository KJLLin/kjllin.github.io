<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org; frame-src 'self'; media-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 通知中心">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>通知 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js" integrity="sha384-EyR2P0dlmjnEGcm9xcjdAn0VedZpRHEwDLP9oSS6wYMvzHBHkUrvgonveazJ/sSx" crossorigin="anonymous"></script>
  <style>
    html {
      --win-ease: var(--spring-default);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    body { font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--color-bg); color: var(--color-text-primary); }
    :root {
      --bg-mica: var(--color-bg-glass);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-glow: var(--color-accent-glow);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
    }
    .container { max-width: 720px; margin: 0 auto; padding: 80px 20px 80px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .page-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #deskNotifBtn.active { background: var(--color-accent); border-color: transparent; color: var(--color-text-on-accent); }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica); background: var(--bg-mica);
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; font-family: inherit;
      transition: all var(--transition-fast);
    }
    .btn:hover { background: var(--bg-mica-hover); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ====================== 通知项 ====================== */
    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-item {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: var(--radius-md);
      background: var(--bg-mica); cursor: pointer;
      transition: background var(--transition-fast);
      animation: fadeUp 0.4s var(--win-ease) both;
    }
    .notif-item:hover { background: var(--bg-mica-hover); }
    .notif-item.read { opacity: 0.62; }
    .notif-icon {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 15px;
      background: var(--accent-glow); color: var(--accent);
    }
    .notif-icon.pm { background: rgba(10,132,255,0.12); color: #0a84ff; }
    .notif-icon.like { background: rgba(255,59,48,0.12); color: var(--danger); }
    .notif-icon.follow { background: rgba(100,210,255,0.14); color: #0a84ff; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: 14px; font-weight: 500; line-height: 1.5; word-break: break-word; }
    .notif-time { margin-top: 3px; font-size: 12px; color: var(--text-tertiary); }
    .unread-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); box-shadow: 0 0 6px var(--accent-glow);
    }
    .notif-del {
      border: none; background: transparent; color: var(--text-tertiary);
      cursor: pointer; font-size: 14px; padding: 0;
      width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast); flex-shrink: 0;
    }
    .notif-del:active { transform: scale(0.88); transition: transform var(--duration-instant) var(--spring-default); }
    .notif-del:hover { background: rgba(255,59,48,0.12); color: var(--danger); }
    .notif-announce { background: linear-gradient(180deg, rgba(255,159,10,0.14), rgba(255,107,26,0.08)); border: 1px solid rgba(255,159,10,0.35); }
    .notif-announce .notif-icon.system { background: rgba(255,159,10,0.18); color: #ff9f0a; }
    .ann-badge {
      display: inline-block; vertical-align: 2px; margin-right: 6px;
      padding: 1px 8px; border-radius: var(--radius-full);
      background: linear-gradient(90deg, #ff9f0a, #ff6b1a); color: #fff; font-size: 11px; font-weight: 600;
    }
    .notif-announce .notif-title a { color: inherit; text-decoration: none; }
    .notif-announce .notif-title a:hover { text-decoration: underline; }
    .ann-content { margin-top: 4px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .notif-sep { height: 1px; background: var(--color-border); margin: 4px 0; }

    .empty-state { text-align: center; padding: 56px 20px; color: var(--text-tertiary); background: var(--bg-mica); border-radius: var(--radius-md); }
    .empty-state i { font-size: 34px; margin-bottom: 12px; display: block; opacity: 0.5; }
    .skeleton { height: 68px; border-radius: var(--radius-md); background: var(--bg-mica); animation: pulse 1.4s ease infinite; margin-bottom: 10px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (max-width: 560px) { .container { padding: 72px 14px 60px; } }
  </style>
</head>
<body>
  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container" id="main">
    <div class="page-head">
      <h1 class="page-title"><i class="fas fa-bell"></i> 通知</h1>
      <div class="head-actions">
        <button class="btn" id="deskNotifBtn" title="在后台收到新通知时弹出系统桌面通知"><i class="far fa-bell"></i> 开启桌面通知</button>
        <button class="btn" id="markAllBtn" style="display:none"><i class="fas fa-check-double"></i> 全部已读</button>
      </div>
    </div>
    <div id="notifList">
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </div>
    <div style="text-align:center;margin-top:18px">
      <button class="btn" id="loadMoreBtn" style="display:none"><i class="fas fa-chevron-down"></i> 加载更多</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function() {
      var $ = function(s) { return document.querySelector(s); };
      var sb = KJ.createSupabase();
      var currentUser = null;
      var PAGE_SIZE = 30;
      var loaded = 0;
      var hasMore = false;
      var _marking = false;

      // 主题
      var themeBtn = $('#themeBtn');
      function updateThemeUI() { var s = KJ.applyTheme('#f3f3f3', '#000'); themeBtn.innerHTML = KJ.getThemeIcon(s.mode); }
      themeBtn.addEventListener('click', function() { KJ.toggleTheme(); updateThemeUI(); });
      KJ.onSystemThemeChange(updateThemeUI); updateThemeUI();

      KJ.setupMobileMenu('#hamburgerBtn', '#mobileMenu');
      KJ.initNav(sb, { homeUrl: '/' });

      function esc(s) { return KJ.escapeHtml(s); }

      // 桌面通知开关
      var deskNotifBtn = document.getElementById('deskNotifBtn');
      function refreshDeskNotifBtn() {
        if (!deskNotifBtn) return;
        var on = KJ.isBrowserNotificationEnabled && KJ.isBrowserNotificationEnabled();
        deskNotifBtn.classList.toggle('active', !!on);
        deskNotifBtn.innerHTML = on
          ? '<i class="fas fa-bell"></i> 已开启桌面通知'
          : '<i class="far fa-bell"></i> 开启桌面通知';
      }
      if (deskNotifBtn) {
        deskNotifBtn.addEventListener('click', async function() {
          if (!KJ.rateLimit('desknotif', 1000, 1)) return;
          if (KJ.isBrowserNotificationEnabled && KJ.isBrowserNotificationEnabled()) {
            KJ.disableBrowserNotification();
            refreshDeskNotifBtn();
            return;
          }
          var r = await KJ.requestBrowserNotification();
          if (r && r.ok) {
            refreshDeskNotifBtn();
            KJ.toast('已开启桌面通知');
          } else if (r && r.reason === 'denied') {
            refreshDeskNotifBtn();
            KJ.toast('浏览器已拒绝通知权限，请在浏览器设置中允许');
          } else {
            refreshDeskNotifBtn();
            KJ.toast('当前浏览器不支持桌面通知');
          }
        });
        refreshDeskNotifBtn();
      }

      var TYPE_META = {
        pm: { icon: 'fa-envelope', label: '站内信' },
        like: { icon: 'fa-heart', label: '点赞' },
        follow: { icon: 'fa-user-plus', label: '关注' },
        system: { icon: 'fa-bullhorn', label: '系统' },
        announce: { icon: 'fa-bullhorn', label: '公告' }
      };

      function fmtDate(iso) {
        if (!iso) return '--';
        return KJ.formatDate(iso);
      }

      function notifHtml(n, i) {
        var meta = TYPE_META[n.type] || TYPE_META.system;
        var isAnnounce = n.type === 'announce';
        // 公告：独立橙色样式 + 公告徽标，系统级通知不提供删除按钮
        var badge = isAnnounce ? '<span class="ann-badge">公告</span>' : '';
        var deleteBtn = isAnnounce ? '' :
          '<button class="notif-del" data-del="' + esc(n.id) + '" title="删除" aria-label="删除通知"><i class="fas fa-times"></i></button>';
        var titleEl = isAnnounce
          ? '<div class="notif-title">' + badge + esc(n.title) + '</div>'
          : '<div class="notif-title">' + esc(n.title) + '</div>';
        return '<div class="notif-item' + (n.read ? ' read' : '') + (isAnnounce ? ' notif-announce' : '') + '" data-id="' + esc(n.id) + '" data-link="' + esc(n.link || '') + '" data-read="' + (n.read ? '1' : '0') + '" style="animation-delay:' + (0.03 + i * 0.025).toFixed(2) + 's" role="button" tabindex="0">' +
          '<div class="notif-icon ' + (isAnnounce ? 'system' : esc(n.type)) + '"><i class="fas ' + meta.icon + '"></i></div>' +
          '<div class="notif-body">' +
            titleEl +
            '<div class="notif-time"><i class="fas ' + meta.icon + '"></i> ' + meta.label + ' · ' + fmtDate(n.created_at) + '</div>' +
          '</div>' +
          (n.read ? '' : '<span class="unread-dot" title="未读"></span>') +
          deleteBtn +
        '</div>';
      }

      // 公告已由后端同步为真实通知（type='announce'），无需单独拉取公告表；
      // 发布/停用/删除的同步与自动清理由数据库触发器与 pg_cron 完成（迁移 15）
      async function loadNotifications(append) {
        if (!sb || !currentUser) return;
        var listEl = $('#notifList');
        try {
          var res = await sb.from('notifications')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false })
            .range(loaded, loaded + PAGE_SIZE - 1);
          if (res.error) throw res.error;
          var items = res.data || [];
          loaded += items.length;
          hasMore = items.length === PAGE_SIZE;

          if (!append) {
            if (items.length === 0) {
              listEl.innerHTML = '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both"><i class="fas fa-bell-slash"></i>暂无通知<br><span style="font-size:12px">站内信、点赞、关注和公告会出现在这里</span></div>';
            } else {
              listEl.className = 'notif-list';
              listEl.innerHTML = items.map(notifHtml).join('');
            }
          } else if (items.length > 0) {
            listEl.insertAdjacentHTML('beforeend', items.map(notifHtml).join(''));
          }
          $('#loadMoreBtn').style.display = hasMore ? '' : 'none';
          // 有未读时显示"全部已读"
          var anyUnread = false;
          try {
            var c = await sb.from('notifications').select('*', { count: 'exact', head: true })
              .eq('user_id', currentUser.id).eq('read', false);
            anyUnread = (c.count || 0) > 0;
          } catch(e) {}
          $('#markAllBtn').style.display = anyUnread ? '' : 'none';
        } catch(e) {
          console.warn('Load notifications failed:', e);
          listEl.innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>通知加载失败，请刷新重试</div>';
        }
      }

      async function markRead(id) {
        if (!sb) return;
        try { await sb.from('notifications').update({ read: true }).eq('id', id).eq('user_id', currentUser.id); } catch(e) {}
      }

      function bindList() {
        var listEl = $('#notifList');
        listEl.addEventListener('click', async function(e) {
          var delBtn = e.target.closest('.notif-del');
          if (delBtn) {
            e.stopPropagation();
            var id = delBtn.dataset.del;
            try {
              var res = await sb.from('notifications').delete().eq('id', id).eq('user_id', currentUser.id);
              if (res.error) throw res.error;
              var item = listEl.querySelector('.notif-item[data-id="' + id + '"]');
              if (item) item.remove();
              KJ.toast('已删除');
            } catch(err) { KJ.toast('删除失败'); }
            return;
          }
          var item = e.target.closest('.notif-item');
          if (!item) return;
          // 标记已读后跳转
          if (item.dataset.read !== '1') {
            item.classList.add('read');
            item.dataset.read = '1';
            var dot = item.querySelector('.unread-dot');
            if (dot) dot.remove();
            await markRead(item.dataset.id);
          }
          var link = item.dataset.link;
          if (link) {
            try {
              var u = new URL(link, location.origin);
              if (u.origin === location.origin) { location.href = u.pathname + u.search; return; }
              // 站外链接（如公告外链）：新标签页打开
              window.open(link, '_blank', 'noopener,noreferrer');
            } catch(_) {}
          }
        });
      }

      $('#markAllBtn').addEventListener('click', async function() {
        if (_marking || !sb || !currentUser) return;
        _marking = true;
        var btn = $('#markAllBtn');
        btn.disabled = true;
        try {
          var res = await sb.from('notifications').update({ read: true })
            .eq('user_id', currentUser.id).eq('read', false);
          if (res.error) throw res.error;
          document.querySelectorAll('.notif-item').forEach(function(el) {
            el.classList.add('read');
            el.dataset.read = '1';
            var dot = el.querySelector('.unread-dot');
            if (dot) dot.remove();
          });
          btn.style.display = 'none';
          KJ.toast('已全部标记为已读');
        } catch(e) {
          KJ.toast('操作失败，请重试');
        } finally {
          _marking = false;
          btn.disabled = false;
        }
      });

      $('#loadMoreBtn').addEventListener('click', function() {
        if (!KJ.rateLimit('notif_loadmore', 800, 1)) return;
        loadNotifications(true);
      });

      // ====================== 启动 ======================
      (async function init() {
        var main = $('#main');
        if (!sb) {
          main.innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>网络错误，请刷新后重试</div>';
          return;
        }
        var r = await sb.auth.getSession().catch(function() { return null; });
        currentUser = (r && r.data && r.data.session && r.data.session.user) || null;
        if (!currentUser) {
          main.innerHTML = '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both"><i class="fas fa-user-lock"></i>登录后查看通知<div style="margin-top:16px"><a href="/login/?redirect=' + encodeURIComponent(location.pathname + location.search) + '" class="btn" style="text-decoration:none;display:inline-flex">前往登录</a></div></div>';
          return;
        }
        bindList();
        await loadNotifications(false);
      })();
    })();
  </script>
</body>
</html>
