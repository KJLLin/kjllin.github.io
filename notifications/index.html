<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    html {
      --win-ease: var(--spring-default);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    body { font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--color-bg); color: var(--color-text-primary); }
    :root {
      --bg-mica: var(--color-bg-glass);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-glow: var(--color-accent-glow);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
    }
    .container { max-width: 720px; margin: 0 auto; padding: 80px 20px 80px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .page-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #deskNotifBtn.active { background: var(--color-accent); border-color: transparent; color: var(--color-text-on-accent); }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica); background: var(--bg-mica);
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; font-family: inherit;
      transition: background var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform var(--duration-instant) var(--spring-default);
    }
    .btn:hover { background: var(--bg-mica-hover); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ====================== 通知项 ====================== */
    .notif-list { display: flex; flex-direction: column; gap: 10px; }
    .notif-item {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: var(--radius-md);
      background: var(--bg-mica); cursor: pointer;
      transition: background var(--transition-fast);
      animation: fadeUp 0.4s var(--win-ease) both;
    }
    .notif-item:hover { background: var(--bg-mica-hover); }
    .notif-item:active { transform: scale(0.985); transition: transform var(--duration-instant) var(--spring-default); }
    .notif-item.read { opacity: 0.62; }
    .notif-icon {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-size: 15px;
      background: var(--accent-glow); color: var(--accent);
    }
    .notif-icon.pm { background: rgba(10,132,255,0.12); color: #0a84ff; }
    .notif-icon.like { background: rgba(255,59,48,0.12); color: var(--danger); }
    .notif-icon.follow { background: rgba(100,210,255,0.14); color: #0a84ff; }
    .notif-body { flex: 1; min-width: 0; }
    .notif-title { font-size: 14px; font-weight: 500; line-height: 1.5; word-break: break-word; }
    .notif-time { margin-top: 3px; font-size: 12px; color: var(--text-tertiary); }
    .unread-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); box-shadow: 0 0 6px var(--accent-glow);
    }
    .notif-del {
      border: none; background: transparent; color: var(--text-tertiary);
      cursor: pointer; font-size: 14px; padding: 0;
      width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      transition: background var(--transition-fast), color var(--transition-fast), transform var(--transition-fast); flex-shrink: 0;
    }
    .notif-del:active { transform: scale(0.88); transition: transform var(--duration-instant) var(--spring-default); }
    .notif-del:hover { background: rgba(255,59,48,0.12); color: var(--danger); }
    .notif-announce { background: linear-gradient(180deg, rgba(255,159,10,0.14), rgba(255,107,26,0.08)); border: 1px solid rgba(255,159,10,0.35); }
    .notif-announce .notif-icon.system { background: rgba(255,159,10,0.18); color: #ff9f0a; }
    .ann-badge {
      display: inline-block; vertical-align: 2px; margin-right: 6px;
      padding: 1px 8px; border-radius: var(--radius-full);
      background: linear-gradient(90deg, #ff9f0a, #ff6b1a); color: #fff; font-size: 11px; font-weight: 600;
    }
    .notif-announce .notif-title a { color: inherit; text-decoration: none; }
    .notif-announce .notif-title a:hover { text-decoration: underline; }
    .ann-content { margin-top: 4px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .notif-sep { height: 1px; background: var(--color-border); margin: 4px 0; }

    .empty-state { text-align: center; padding: 56px 20px; color: var(--text-tertiary); background: var(--bg-mica); border-radius: var(--radius-md); }
    .empty-state i { font-size: 34px; margin-bottom: 12px; display: block; opacity: 0.5; }
    .skeleton { height: 68px; border-radius: var(--radius-md); background: var(--bg-mica); animation: pulse 1.4s ease infinite; margin-bottom: 10px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (max-width: 560px) { .container { padding: 72px 14px 60px; } }

    /* ===== 通知中心重构新增 ===== */
    .head-unread { font-size: 13px; font-weight: 500; color: var(--accent, #0071e3); margin-left: 8px; }
    .notif-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
    .notif-tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--color-border); background: var(--bg-mica);
      color: var(--text-secondary); font-size: 13px;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .notif-tab:hover { background: var(--bg-mica-hover, var(--bg-mica)); }
    .notif-tab.active { background: var(--accent, #0071e3); color: #fff; border-color: transparent; }
    .tab-badge {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
      background: rgba(255,255,255,.25); color: inherit;
      font-size: 11px; line-height: 18px; text-align: center;
    }
    .notif-tab:not(.active) .tab-badge { background: var(--accent, #0071e3); color: #fff; }
    .tab-badge:empty { display: none; }
    .notif-day { margin: 14px 0 6px; text-align: center; font-size: 12px; color: var(--text-tertiary); }
    .notif-day span { padding: 2px 10px; border-radius: 999px; background: var(--bg-mica); border: 1px solid var(--color-border); }
    .list-status { text-align: center; font-size: 12px; color: var(--text-tertiary); padding: 14px 0; }
    .notif-item { cursor: pointer; }
    .notif-item:focus-visible { outline: 2px solid var(--accent, #0071e3); outline-offset: 2px; }
  </style>

</head>

  <div class="container" id="main">
    <div class="page-head">
      <h1 class="page-title"><i class="fas fa-bell"></i> 通知<span class="head-unread" id="headUnread"></span></h1>
      <div class="head-actions">
        <button class="btn" id="deskNotifBtn" title="在后台收到新通知时弹出系统桌面通知"><i class="far fa-bell"></i> 开启桌面通知</button>
        <button class="btn" id="markAllBtn" style="display:none"><i class="fas fa-check-double"></i> 全部已读</button>
        <button class="btn" id="clearReadBtn" style="display:none"><i class="fas fa-broom"></i> 清空已读</button>
      </div>
    </div>

    <div class="notif-tabs" id="notifTabs" role="tablist" aria-label="通知筛选">
      <button class="notif-tab active" data-filter="all" role="tab" aria-selected="true">全部</button>
      <button class="notif-tab" data-filter="unread" role="tab" aria-selected="false">未读 <span class="tab-badge" id="badgeUnread"></span></button>
      <button class="notif-tab" data-filter="pm" role="tab" aria-selected="false">站内信 <span class="tab-badge" id="badgePm"></span></button>
      <button class="notif-tab" data-filter="interaction" role="tab" aria-selected="false">互动 <span class="tab-badge" id="badgeInteraction"></span></button>
      <button class="notif-tab" data-filter="announce" role="tab" aria-selected="false">公告</button>
    </div>

    <div id="notifList" role="list" aria-live="polite">
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </div>
    <div id="notifSentinel" style="height:1px"></div>
    <div class="list-status" id="listStatus"></div>
  </div>

  <script src="/common.js"></script>
  <script>
  (function() {
    var $ = function(s) { return document.querySelector(s); };
    var sb = KJ.createSupabase();
    var PAGE = 30;

    var S = {
      user: null,
      filter: 'all',
      items: [],
      cursorTime: null,
      cursorId: null,
      hasMore: false,
      loading: false,
      seq: 0,
      channel: null,
      reloadTimer: null
    };

    var TYPE_META = {
      pm: { icon: 'fa-envelope', label: '站内信', cls: 'pm' },
      like: { icon: 'fa-heart', label: '点赞', cls: 'like' },
      follow: { icon: 'fa-user-plus', label: '关注', cls: 'follow' },
      system: { icon: 'fa-bullhorn', label: '系统', cls: 'system' },
      announce: { icon: 'fa-bullhorn', label: '公告', cls: 'system' }
    };

    var FILTERS = {
      all:         { type: null,          unreadOnly: false },
      unread:      { type: null,          unreadOnly: true  },
      pm:          { type: 'pm',          unreadOnly: false },
      interaction: { type: 'interaction', unreadOnly: false },
      announce:    { type: 'announce',    unreadOnly: false }
    };

    function esc(s) { return KJ.escapeHtml(s == null ? '' : String(s)); }

    function dayLabel(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return '';
      var now = new Date();
      var diff = Math.floor(
        (new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
         new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000
      );
      if (diff === 0) return '今天';
      if (diff === 1) return '昨天';
      if (diff < 7) return diff + ' 天前';
      if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '月' + d.getDate() + '日';
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    function itemHtml(n, i) {
      var meta = TYPE_META[n.type] || TYPE_META.system;
      var isAnnounce = n.type === 'announce';
      var badge = isAnnounce ? '<span class="ann-badge">公告</span>' : '';
      var delBtn = isAnnounce ? '' :
        '<button class="notif-del" data-del="' + esc(n.id) + '" title="删除" aria-label="删除通知"><i class="fas fa-times"></i></button>';
      return '<div class="notif-item' + (n.read ? ' read' : '') + (isAnnounce ? ' notif-announce' : '') + '"' +
        ' data-id="' + esc(n.id) + '" data-link="' + esc(n.link || '') + '" data-read="' + (n.read ? '1' : '0') + '"' +
        ' role="listitem" tabindex="0" style="animation-delay:' + (0.02 + Math.min(i, 12) * 0.02).toFixed(2) + 's">' +
        '<div class="notif-icon ' + (isAnnounce ? 'system' : meta.cls) + '"><i class="fas ' + meta.icon + '"></i></div>' +
        '<div class="notif-body">' +
          '<div class="notif-title">' + badge + esc(n.title) + '</div>' +
          '<div class="notif-time"><i class="fas ' + meta.icon + '"></i> ' + meta.label + ' · ' + esc(KJ.formatDate(n.created_at)) + '</div>' +
        '</div>' +
        (n.read ? '' : '<span class="unread-dot" title="未读"></span>') +
        delBtn +
      '</div>';
    }

    function emptyHtml() {
      var map = {
        all: ['fa-bell-slash', '暂无通知', '站内信、点赞、关注和公告会出现在这里'],
        unread: ['fa-check-double', '没有未读通知', '所有通知都已读过了'],
        pm: ['fa-envelope-open', '暂无站内信通知', '收到新私信时会出现在这里'],
        interaction: ['fa-heart', '暂无互动通知', '有人点赞或关注你时会出现在这里'],
        announce: ['fa-bullhorn', '暂无公告', '管理员发布公告后会出现在这里']
      };
      var m = map[S.filter] || map.all;
      return '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both"><i class="fas ' + m[0] + '"></i>' +
        m[1] + '<br><span style="font-size:12px">' + m[2] + '</span></div>';
    }

    function render() {
      var el = $('#notifList');
      if (!S.items.length) { el.className = ''; el.innerHTML = emptyHtml(); return; }
      el.className = 'notif-list';
      var html = '', lastDay = '';
      for (var i = 0; i < S.items.length; i++) {
        var n = S.items[i];
        var d = dayLabel(n.created_at);
        if (d !== lastDay) {
          html += '<div class="notif-day"><span>' + esc(d) + '</span></div>';
          lastDay = d;
        }
        html += itemHtml(n, i);
      }
      el.innerHTML = html;
    }

    function setStatus(t) { var el = $('#listStatus'); if (el) el.textContent = t || ''; }

    function setBadge(sel, n) {
      var el = $(sel);
      if (!el) return;
      el.textContent = n > 99 ? '99+' : (n > 0 ? String(n) : '');
    }

    function matchesFilter(n) {
      var f = S.filter;
      if (f === 'all') return true;
      if (f === 'unread') return !n.read;
      if (f === 'interaction') return n.type === 'like' || n.type === 'follow';
      return n.type === f;
    }

    async function load(reset) {
      if (!sb || !S.user || S.loading) return;
      if (reset) { S.items = []; S.cursorTime = null; S.cursorId = null; S.hasMore = false; }
      S.loading = true;
      setStatus('加载中...');
      var seq = ++S.seq;
      try {
        var f = FILTERS[S.filter] || FILTERS.all;
        var r = await sb.rpc('notif_list', {
          p_before: reset ? null : S.cursorTime,
          p_before_id: reset ? null : S.cursorId,
          p_limit: PAGE,
          p_type: f.type,
          p_unread_only: f.unreadOnly
        });
        if (seq !== S.seq) return;
        if (r.error) throw r.error;
        var rows = r.data || [];
        if (reset) {
          S.items = rows;
        } else {
          var seen = {};
          S.items.forEach(function(x) { seen[x.id] = 1; });
          rows.forEach(function(x) { if (!seen[x.id]) { S.items.push(x); seen[x.id] = 1; } });
        }
        S.hasMore = rows.length === PAGE;
        if (rows.length) {
          var last = rows[rows.length - 1];
          S.cursorTime = last.created_at;
          S.cursorId = last.id;
        }
        render();
        setStatus(S.hasMore ? '' : (S.items.length ? '已经到底了' : ''));
      } catch (e) {
        if (seq !== S.seq) return;
        console.warn('load notifications failed:', e);
        if (reset) $('#notifList').innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>通知加载失败，请刷新重试</div>';
        setStatus('加载失败');
      } finally {
        if (seq === S.seq) { S.loading = false; }
      }
    }

    async function updateStats() {
      if (!sb || !S.user) return;
      try {
        var r = await sb.rpc('notif_stats');
        if (r.error || !r.data || !r.data.length) return;
        var s = r.data[0];
        var unread = Number(s.unread) || 0;
        var total = Number(s.total) || 0;
        setBadge('#badgeUnread', unread);
        setBadge('#badgePm', s.unread_pm);
        setBadge('#badgeInteraction', s.unread_interaction);
        var head = $('#headUnread');
        if (head) head.textContent = unread > 0 ? unread + ' 条未读' : '';
        $('#markAllBtn').style.display = unread > 0 ? '' : 'none';
        $('#clearReadBtn').style.display = (total - unread) > 0 ? '' : 'none';
      } catch (e) { /* 忽略统计失败 */ }
    }

    async function markRead(id) {
      try {
        await sb.from('notifications').update({ read: true }).eq('id', id).eq('user_id', S.user.id);
      } catch (e) {}
    }

    async function deleteOne(id) {
      try {
        var r = await sb.from('notifications').delete().eq('id', id).eq('user_id', S.user.id);
        if (r.error) throw r.error;
        S.items = S.items.filter(function(x) { return x.id !== id; });
        render(); updateStats();
        KJ.toast('已删除');
      } catch (e) { KJ.toast('删除失败'); }
    }

    function bindList() {
      var listEl = $('#notifList');
      listEl.addEventListener('click', async function(e) {
        var delBtn = e.target.closest('.notif-del');
        if (delBtn) {
          e.stopPropagation();
          await deleteOne(delBtn.dataset.del);
          return;
        }
        var item = e.target.closest('.notif-item');
        if (!item) return;
        if (item.dataset.read !== '1') {
          item.classList.add('read');
          item.dataset.read = '1';
          var dot = item.querySelector('.unread-dot');
          if (dot) dot.remove();
          await markRead(item.dataset.id);
          updateStats();
        }
        var link = item.dataset.link;
        if (!link) return;
        try {
          var u = new URL(link, location.origin);
          if (u.origin === location.origin) { location.href = u.pathname + u.search; return; }
          window.open(link, '_blank', 'noopener,noreferrer');
        } catch (_) {}
      });

      listEl.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var item = e.target.closest('.notif-item');
        if (item) { e.preventDefault(); item.click(); }
      });
    }

    function bindTabs() {
      $('#notifTabs').addEventListener('click', function(e) {
        var btn = e.target.closest('.notif-tab');
        if (!btn) return;
        var f = btn.dataset.filter;
        if (f === S.filter) return;
        S.filter = f;
        document.querySelectorAll('.notif-tab').forEach(function(b) {
          var on = b === btn;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        load(true);
      });
    }

    function bindActions() {
      $('#markAllBtn').addEventListener('click', async function() {
        var btn = this;
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          var r = await sb.rpc('notif_mark_all_read');
          if (r.error) throw r.error;
          KJ.toast('已全部标记为已读');
          await load(true);
          await updateStats();
        } catch (e) { KJ.toast('操作失败，请重试'); }
        finally { btn.disabled = false; }
      });

      $('#clearReadBtn').addEventListener('click', async function() {
        if (!confirm('清空所有已读通知？公告会保留。')) return;
        var btn = this;
        if (btn.disabled) return;
        btn.disabled = true;
        try {
          var r = await sb.rpc('notif_delete_read');
          if (r.error) throw r.error;
          KJ.toast('已清空已读通知');
          await load(true);
          await updateStats();
        } catch (e) { KJ.toast('操作失败，请重试'); }
        finally { btn.disabled = false; }
      });
    }

    function bindInfiniteScroll() {
      if (!('IntersectionObserver' in window)) return;
      var io = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && S.hasMore && !S.loading) load(false);
      }, { rootMargin: '200px' });
      io.observe($('#notifSentinel'));
    }

    function subscribe() {
      if (!sb || !S.user) return;
      if (S.channel) { try { sb.removeChannel(S.channel); } catch (_) {} S.channel = null; }
      S.channel = sb.channel('notif_page_' + S.user.id)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + S.user.id },
          function(payload) {
            var n = payload.new;
            if (!n) return;
            updateStats();
            if (!matchesFilter(n)) return;
            if (S.items.some(function(x) { return x.id === n.id; })) return;
            S.items.unshift(n);
            render();
            KJ.toast(n.title || '收到新通知');
          })
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + S.user.id },
          function() {
            clearTimeout(S.reloadTimer);
            S.reloadTimer = setTimeout(function() { load(true); updateStats(); }, 400);
          })
        .subscribe();
    }

    function setupTheme() {
      var btn = $('#themeBtn');
      if (!btn) return;
      function upd() { var s = KJ.applyTheme('#f3f3f3', '#000'); btn.innerHTML = KJ.getThemeIcon(s.mode); }
      btn.addEventListener('click', function() { KJ.toggleTheme(); upd(); });
      KJ.onSystemThemeChange(upd);
      upd();
    }

    function setupDesktopBtn() {
      var btn = $('#deskNotifBtn');
      if (!btn) return;
      function refresh() {
        var on = KJ.isBrowserNotificationEnabled && KJ.isBrowserNotificationEnabled();
        btn.classList.toggle('active', !!on);
        btn.innerHTML = on ? '<i class="fas fa-bell"></i> 已开启桌面通知' : '<i class="far fa-bell"></i> 开启桌面通知';
      }
      btn.addEventListener('click', async function() {
        if (KJ.rateLimit && !KJ.rateLimit('desknotif', 1000, 1)) return;
        if (KJ.isBrowserNotificationEnabled && KJ.isBrowserNotificationEnabled()) {
          KJ.disableBrowserNotification(); refresh(); return;
        }
        var r = await KJ.requestBrowserNotification();
        refresh();
        if (r && r.ok) KJ.toast('已开启桌面通知');
        else if (r && r.reason === 'denied') KJ.toast('浏览器已拒绝通知权限，请在浏览器设置中允许');
        else KJ.toast('当前浏览器不支持桌面通知');
      });
      refresh();
    }

    (async function init() {
      setupTheme();
      setupDesktopBtn();
      KJ.setupMobileMenu('#hamburgerBtn', '#mobileMenu');
      KJ.initNav(sb, { homeUrl: '/' });

      if (!sb) {
        $('#main').innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>网络错误，请刷新后重试</div>';
        return;
      }
      var r = await sb.auth.getSession().catch(function() { return null; });
      S.user = (r && r.data && r.data.session && r.data.session.user) || null;
      if (!S.user) {
        $('#main').innerHTML = '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both"><i class="fas fa-user-lock"></i>登录后查看通知<div style="margin-top:16px"><a href="/login/?redirect=' + encodeURIComponent(location.pathname + location.search) + '" class="btn" style="text-decoration:none;display:inline-flex">前往登录</a></div></div>';
        return;
      }

      bindTabs();
      bindActions();
      bindList();
      bindInfiniteScroll();

      await load(true);
      await updateStats();
      subscribe();
    })();
  })();
  </script>
</body>
</html>
