<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com https://*.hcaptcha.com https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>设置 · KJLLin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── 布局 ── */
    .container{max-width:680px;margin:0 auto;padding:86px 16px 40px;position:relative;z-index:1;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

    /* ── 页面标题 ── */
    .page-header{text-align:center;margin-bottom:36px;animation:appleFadeUp 0.6s var(--spring-default) forwards}
    .page-header .icon{font-size:42px;margin-bottom:10px;display:block;color:var(--color-accent)}
    .page-header h1{font-size:28px;font-weight:700;color:var(--color-text-primary);letter-spacing:var(--tracking-tight)}

    /* ── 用户概览头 ── */
    .user-summary{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--radius-lg);margin-bottom:28px;animation:appleFadeUp 0.5s var(--spring-default) 0.08s both}
    .user-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-light));color:var(--color-text-on-accent);display:grid;place-items:center;font-size:24px;font-weight:700;flex-shrink:0;box-shadow:0 4px 16px var(--color-accent-glow)}
    .user-info{flex:1;min-width:0}
    .user-info .name{font-size:18px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .user-info .email{font-size:13px;color:var(--color-text-tertiary);font-family:var(--font-mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
    .user-info .status{font-size:12px;color:var(--color-success);margin-top:4px;display:flex;align-items:center;gap:4px}
    .user-info .status .dot{width:6px;height:6px;border-radius:50%;background:var(--color-success)}
    .admin-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:var(--radius-full);background:var(--color-accent-glow);color:var(--color-accent);font-size:12px;font-weight:600;letter-spacing:0.5px}

    /* ── 登录提示 ── */
    .login-prompt{text-align:center;padding:48px 24px;border-radius:var(--radius-lg);animation:appleFadeUp 0.5s var(--spring-default) 0.08s both}
    .login-prompt p{color:var(--color-text-tertiary);margin-bottom:16px}
    .login-prompt a{display:inline-flex;align-items:center;gap:6px;padding:10px 28px;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;text-decoration:none;transition:all var(--transition-fast)}
    .login-prompt a:hover{background:var(--color-accent-hover);transform:translateY(-1px);box-shadow:0 4px 14px var(--color-accent-glow)}

    /* ── 设置分组 ── */
    .settings-group{margin-bottom:24px}
    .group-label{font-size:12px;font-weight:600;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.8px;padding:0 4px;margin-bottom:8px}
    .settings-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--radius-md);text-decoration:none;color:var(--color-text-primary);cursor:pointer;transition:all var(--transition-fast);position:relative;overflow:hidden}
    .settings-item:hover{background:var(--color-bg-hover)}
    .settings-item:active{transform:scale(0.985);transition:transform var(--duration-instant) var(--spring-default)}
    .settings-item + .settings-item{margin-top:2px}
    .settings-item .s-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:17px;flex-shrink:0}
    .settings-item .s-body{flex:1;min-width:0}
    .settings-item .s-title{font-size:15px;font-weight:500;line-height:1.3}
    .settings-item .s-desc{font-size:12px;color:var(--color-text-tertiary);margin-top:1px;line-height:1.4}
    .settings-item .s-chevron{color:var(--color-text-tertiary);font-size:13px;flex-shrink:0;transition:transform var(--transition-fast)}
    .settings-item:hover .s-chevron{transform:translateX(2px);color:var(--color-accent)}

    /* ── 图标颜色 ── */
    .s-icon-profile{background:rgba(0,113,227,0.12);color:var(--color-accent)}
    .s-icon-security{background:rgba(255,159,10,0.12);color:var(--color-warning)}
    .s-icon-admin{background:rgba(0,113,227,0.12);color:var(--color-accent)}
    .s-icon-device{background:rgba(48,209,88,0.12);color:var(--color-success)}
    .s-icon-password{background:rgba(94,92,230,0.12);color:#5e5ce6}
    .s-icon-appearance{background:rgba(175,82,222,0.12);color:#af52de}
    .s-icon-logout{background:rgba(255,59,48,0.10);color:var(--color-danger)}

    /* ── 内联开关 ── */
    .theme-toggle-row{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .theme-chip{padding:5px 14px;border-radius:var(--radius-full);border:1.5px solid var(--color-border);background:transparent;color:var(--color-text-secondary);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);font-family:var(--font-sans);flex-shrink:0;white-space:nowrap;line-height:1.3}
    .theme-chip:hover{border-color:var(--color-accent);color:var(--color-accent);background:var(--color-accent-glow)}
    .theme-chip:active{transform:scale(0.95);transition:transform var(--duration-instant) var(--spring-default)}
    .theme-chip.active{background:var(--color-accent);color:var(--color-text-on-accent);border-color:var(--color-accent);box-shadow:0 2px 8px var(--color-accent-glow)}

    /* ── 退出按钮 ── */
    .logout-item{color:var(--color-danger)!important}
    .logout-item:hover{background:var(--color-danger-bg)!important}

    /* ── 动画 ── */
    .anim-1{animation:appleFadeUp 0.5s var(--spring-default) 0.10s both}
    .anim-2{animation:appleFadeUp 0.5s var(--spring-default) 0.14s both}
    .anim-3{animation:appleFadeUp 0.5s var(--spring-default) 0.18s both}
    .anim-4{animation:appleFadeUp 0.5s var(--spring-default) 0.22s both}
    .anim-5{animation:appleFadeUp 0.5s var(--spring-default) 0.26s both}
    .anim-6{animation:appleFadeUp 0.5s var(--spring-default) 0.30s both}

    /* ── 响应式 ── */
    @media(max-width:520px){
      .container{padding:72px 12px calc(28px + env(safe-area-inset-bottom,0px))}
      .page-header h1{font-size:22px}.page-header .icon{font-size:34px}
      .user-summary{padding:16px;gap:12px}
      .user-avatar{width:48px;height:48px;font-size:20px}
      .user-info .name{font-size:16px}
      .settings-item{padding:12px 14px;gap:10px;flex-wrap:wrap}
      .settings-item .s-icon{width:32px;height:32px;font-size:15px}
      .settings-item .s-title{font-size:14px}
      .settings-item .s-desc{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .theme-toggle-row{flex-basis:100%;justify-content:flex-start;margin-top:6px;gap:8px}
      .theme-chip{padding:5px 12px;font-size:11px}
    }
  </style>
</head>

      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>

  <div class="container">
    <!-- 页面标题 -->
    <div class="page-header">
      <span class="icon"><i class="fas fa-gear"></i></span>
      <h1>设置</h1>
    </div>

    <!-- 用户概览 / 登录提示 -->
    <div id="loginPrompt" class="login-prompt card-glass">
      <p id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/settings/" id="loginLink" hidden>前往登录</a>
    </div>

    <div id="settingsContent" style="display:none">
      <!-- 用户概览 -->
      <div class="user-summary card-glass anim-1" id="userSummary">
        <div class="user-avatar" id="avatarEl">U</div>
        <div class="user-info">
          <div class="name"><span id="nameEl">--</span><span class="admin-badge" id="adminBadge" style="display:none"><i class="fas fa-shield-halved"></i> 管理员</span></div>
          <div class="email" id="emailEl">--</div>
          <div class="status"><span class="dot"></span> 已登录</div>
        </div>
      </div>

      <!-- 账号相关 -->
      <div class="settings-group anim-2">
        <div class="group-label">账号</div>
        <a href="/settings/account/" class="settings-item card-glass">
          <span class="s-icon s-icon-security"><i class="fas fa-shield-halved"></i></span>
          <span class="s-body"><span class="s-title">账号安全中心</span><span class="s-desc">安全概览、登录记录、设备管理、第三方绑定</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
        <a href="/settings/profile/" class="settings-item card-glass">
          <span class="s-icon s-icon-profile"><i class="fas fa-user-pen"></i></span>
          <span class="s-body"><span class="s-title">个人资料</span><span class="s-desc">昵称、邮箱、个人信息</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
        <a href="/settings/password/" class="settings-item card-glass">
          <span class="s-icon s-icon-password"><i class="fas fa-key"></i></span>
          <span class="s-body"><span class="s-title">修改密码</span><span class="s-desc">更新登录密码</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
        <a href="/settings/devices/" class="settings-item card-glass">
          <span class="s-icon s-icon-device"><i class="fas fa-mobile-screen"></i></span>
          <span class="s-body"><span class="s-title">设备管理</span><span class="s-desc">已登录设备、登录历史</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
        <div class="settings-item card-glass" id="privacyRow" style="flex-wrap:wrap">
          <span class="s-icon" style="background:rgba(0,200,150,0.12);color:#0ac8a0"><i class="fas fa-envelope-open-text"></i></span>
          <span class="s-body" style="flex-basis:0">
            <span class="s-title">私信接收设置</span>
            <span class="s-desc">哪些人可以给你发送站内信</span>
          </span>
          <span class="theme-toggle-row" id="privacyChips" style="flex-basis:100%;justify-content:flex-start;margin:6px 0 0;flex-wrap:wrap">
            <button class="theme-chip" data-privacy="admin"><i class="fas fa-shield-halved"></i> 仅限管理员</button>
            <button class="theme-chip" data-privacy="follows"><i class="fas fa-user-group"></i> 关注的人与管理员</button>
            <button class="theme-chip" data-privacy="everyone"><i class="fas fa-earth-asia"></i> 所有人（拉黑除外）</button>
          </span>
        </div>
        <a href="/admin/" class="settings-item card-glass" id="adminEntry" style="display:none">
          <span class="s-icon s-icon-admin"><i class="fas fa-shield-halved"></i></span>
          <span class="s-body"><span class="s-title">管理后台</span><span class="s-desc">用户功能权限管理</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
      </div>

      <!-- 外观 -->
      <div class="settings-group anim-3">
        <div class="group-label">外观</div>
        <div class="settings-item card-glass" id="themeRow">
          <span class="s-icon s-icon-appearance"><i class="fas fa-circle-half-stroke"></i></span>
          <span class="s-body"><span class="s-title">主题</span><span class="s-desc">浅色、深色或跟随系统</span></span>
          <span class="theme-toggle-row">
            <button class="theme-chip" data-theme="light" id="chipLight"><i class="fas fa-sun"></i> 浅色</button>
            <button class="theme-chip" data-theme="dark" id="chipDark"><i class="fas fa-moon"></i> 深色</button>
            <button class="theme-chip" data-theme="auto" id="chipAuto"><i class="fas fa-circle-half-stroke"></i> 自动</button>
          </span>
        </div>
      </div>

      <!-- 其他 -->
      <div class="settings-group anim-4">
        <div class="group-label">其他</div>
        <a href="/settings/about/" class="settings-item card-glass">
          <span class="s-icon" style="background:rgba(100,120,255,0.12);color:#6478ff"><i class="fas fa-circle-info"></i></span>
          <span class="s-body"><span class="s-title">关于</span><span class="s-desc">版本信息、功能介绍、相关链接</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </a>
      </div>

      <!-- 退出 -->
      <div class="settings-group anim-5">
        <div class="group-label">会话</div>
        <button class="settings-item card-glass logout-item" id="logoutAllBtn" style="width:100%;text-align:left;font-family:var(--font-sans);border:none">
          <span class="s-icon s-icon-logout"><i class="fas fa-arrow-right-from-bracket"></i></span>
          <span class="s-body"><span class="s-title">退出登录</span><span class="s-desc">登出当前账号</span></span>
          <span class="s-chevron"><i class="fas fa-chevron-right"></i></span>
        </button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
  (function(){
    var $=function(s){return document.querySelector(s);};
    var sb,user;

    try{sb=KJ.createSupabase();}catch(e){}
    if(sb) KJ.initMessageBanner(sb);

    function showLoginPrompt(){
      $('#loginPrompt').style.display='';$('#settingsContent').style.display='none';
      $('#loginMsg').textContent='请登录后管理设置';$('#loginLink').hidden=false;
    }

    function fmtDate(iso){if(!iso)return'--';var d=new Date(iso);return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}

    async function loadUser(){
      if(!sb)return;
      try{
        var r=await sb.auth.getSession();
        if(!r.data.session||!r.data.session.user){showLoginPrompt();return}
        user=r.data.session.user;
        $('#loginPrompt').style.display='none';$('#settingsContent').style.display='block';

        var nick=user.user_metadata&&user.user_metadata.nick||(user.email||'').split('@')[0]||'用户';
        $('#avatarEl').textContent=nick.charAt(0).toUpperCase();
        $('#nameEl').textContent=nick;
        $('#emailEl').textContent=user.email||'';
        // 管理员标识：查询 users 表 is_admin 字段
        try{
          var ra=await sb.from('users').select('is_admin').eq('id',user.id).limit(1);
          if(ra.data&&ra.data.length&&ra.data[0].is_admin===true){var b=$('#adminBadge');if(b)b.style.display='';var ae=$('#adminEntry');if(ae)ae.style.display='';}
        }catch(e){}
        loadPrivacy();
      }catch(e){console.error('loadUser:',e);showLoginPrompt();}
    }

    // 主题切换芯片（使用统一的 'theme' 键，与全站一致）
    function updateThemeChips(){
      var mode=KJ.getThemeState().mode;
      document.querySelectorAll('.theme-chip').forEach(function(c){
        c.classList.toggle('active',c.dataset.theme===mode);
      });
    }
    document.querySelectorAll('.theme-chip').forEach(function(c){
      c.addEventListener('click',function(){
        var t=c.dataset.theme;
        if(t==='auto'){KJ.safeStorage.removeItem('theme');}
        else{KJ.safeStorage.setItem('theme',t);}
        KJ.applyTheme('#f5f5f7','#0a0a0a');
        updateThemeChips();
        var tb=$('#themeBtn');if(tb)tb.innerHTML=KJ.getThemeIcon(t);
      });
    });

    // 私信接收设置：加载当前值
    async function loadPrivacy(){
      try{
        var r=await sb.from('users').select('message_privacy').eq('id',user.id).maybeSingle();
        var val=(r.data&&r.data.message_privacy)||'everyone';
        document.querySelectorAll('#privacyChips .theme-chip').forEach(function(c){
          c.classList.toggle('active',c.dataset.privacy===val);
        });
      }catch(e){}
    }
    // 保存私信接收设置
    document.querySelectorAll('#privacyChips .theme-chip').forEach(function(c){
      c.addEventListener('click',async function(){
        var val=c.dataset.privacy;
        if(!sb||!user)return;
        if(!KJ.rateLimit('privacy_save',800,1,'操作太快'))return;
        try{
          var r=await sb.from('users').update({message_privacy:val}).eq('id',user.id);
          if(r.error)throw r.error;
          document.querySelectorAll('#privacyChips .theme-chip').forEach(function(x){x.classList.toggle('active',x.dataset.privacy===val);});
          KJ.toast('已更新私信接收设置');
        }catch(e){
          KJ.toast('保存失败：'+(e.message||'未知错误'));
        }
      });
    });

    // 退出登录
    $('#logoutAllBtn').addEventListener('click',async function(){
      if(!confirm('确定退出登录？'))return;
      if(!sb){window.location.href='/';return}
      var btn=$('#logoutAllBtn');btn.style.opacity='0.5';btn.style.pointerEvents='none';
      try{await sb.auth.signOut();}catch(e){console.warn('Sign out:',e);}
      window.location.href='/';
    });

    // 主题
    function initTheme(){updateThemeChips();KJ.applyTheme('#f5f5f7','#0a0a0a');var tb=$('#themeBtn');if(tb)tb.innerHTML=KJ.getThemeIcon();}
    $('#themeBtn').addEventListener('click',function(){
      var state=KJ.toggleTheme();
      KJ.applyTheme('#f5f5f7','#0a0a0a');
      updateThemeChips();
      var tb=$('#themeBtn');if(tb)tb.innerHTML=KJ.getThemeIcon(state.mode);
    });
    KJ.onSystemThemeChange(function(){if(KJ.getThemeState().mode==='auto')KJ.applyTheme('#f5f5f7','#0a0a0a');});
    initTheme();

    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        KJ.initNav(null, { homeUrl: '/' });

    if(!sb){$('#loginMsg').textContent='网络错误，请刷新后重试';return}

    var authReady=false;
    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){authReady=true;if(session&&session.user){loadUser();return}showLoginPrompt();}
      else if(event==='SIGNED_OUT'){authReady=true;showLoginPrompt();}
      else if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session&&session.user)loadUser();}
    });
    setTimeout(function(){if(!authReady)loadUser();},3000);
    setTimeout(function(){if($('#loginMsg').textContent==='加载中...'){$('#loginMsg').textContent='加载超时，请检查网络后刷新页面';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}},8000);
  })();
  </script>
  <div id="toast" class="toast hidden"></div>
</body>
