<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com https://*.hcaptcha.com https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="通知接收设置 - KJLLin">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>通知设置 · 设置 · KJLLin</title>
  <link rel="canonical" href="https://kjllin.dpdns.org/settings/notifications/">
  <script src="/vendor/supabase.min.js"></script>
  <style>
    .container{max-width:560px;margin:0 auto;padding:80px 16px calc(40px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-accent);text-decoration:none;font-size:13px;font-weight:500}
    .crumb{color:var(--color-text-tertiary);font-size:13px;margin:0 6px}
    .crumb-cur{color:var(--color-text-secondary);font-size:13px}
    .page-header{text-align:center;margin:14px 0 28px;animation:appleFadeUp .55s var(--spring-default) forwards}
    .page-header .icon{font-size:42px;margin-bottom:8px;display:block;color:var(--color-accent)}
    .page-header h1{font-size:24px;font-weight:700;color:var(--color-text-primary)}
    .page-header p{font-size:13px;color:var(--color-text-tertiary);margin-top:6px}

    .card{padding:20px 22px;border-radius:var(--radius-xl);margin-bottom:16px;animation:appleFadeUp .5s var(--spring-default) both}
    .card:nth-of-type(2){animation-delay:.06s}
    .card:nth-of-type(3){animation-delay:.12s}
    .card h2{font-size:15px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .card h2 .cnt{margin-left:auto;font-size:12px;font-weight:500;color:var(--color-text-tertiary)}
    .card .hint{font-size:12px;color:var(--color-text-tertiary);line-height:1.6;margin-bottom:10px}

    .pref-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--color-border)}
    .pref-row:last-child{border-bottom:none;padding-bottom:2px}
    .pref-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
    .pref-ico.pm{background:rgba(10,132,255,.12);color:#0a84ff}
    .pref-ico.like{background:rgba(255,69,58,.12);color:#ff453a}
    .pref-ico.follow{background:rgba(48,209,88,.14);color:#30d158}
    .pref-ico.announce{background:rgba(255,159,10,.14);color:#ff9f0a}
    .pref-ico.system{background:rgba(120,120,128,.16);color:var(--color-text-secondary)}
    .pref-main{flex:1;min-width:0}
    .pref-name{display:block;font-size:14.5px;font-weight:500;color:var(--color-text-primary)}
    .pref-desc{display:block;font-size:12px;color:var(--color-text-tertiary);margin-top:2px;line-height:1.4}

    .switch{position:relative;width:46px;height:28px;border-radius:999px;background:rgba(120,120,128,.3);flex-shrink:0;transition:background .22s ease;border:0;padding:0;cursor:pointer}
    .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
    .switch[aria-checked="true"]{background:#34c759}
    .switch[aria-checked="true"]::after{transform:translateX(18px)}
    .switch:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
    .switch[disabled]{opacity:.5;cursor:not-allowed}
    .switch.is-busy::after{animation:kjPulse .8s ease-in-out infinite}
    @keyframes kjPulse{0%,100%{opacity:1}50%{opacity:.5}}

    .skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--color-bg-hover) 25%,var(--color-bg-active) 50%,var(--color-bg-hover) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

    .status-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 12px;border-radius:var(--radius-md);background:var(--color-bg-hover);margin-bottom:12px}
    .status-line .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .status-line.ok{color:var(--color-success)} .status-line.ok .dot{background:var(--color-success)}
    .status-line.off{color:var(--color-text-tertiary)} .status-line.off .dot{background:var(--color-text-tertiary)}
    .status-line.warn{color:var(--color-warning)} .status-line.warn .dot{background:var(--color-warning)}

    .switch-row{display:flex;align-items:center;gap:12px;padding-top:4px}
    .switch-row .grow{flex:1;min-width:0}
    .switch-row .t{font-size:14px;color:var(--color-text-primary);font-weight:500}
    .switch-row .d{font-size:12px;color:var(--color-text-tertiary);margin-top:2px;line-height:1.5}

    .foot-note{font-size:12px;color:var(--color-text-tertiary);line-height:1.7;text-align:center;padding:4px 8px}
    .foot-note a{color:var(--color-accent);text-decoration:none}

    .login-prompt{text-align:center;padding:48px 24px;border-radius:var(--radius-lg)}
    .login-prompt p{color:var(--color-text-tertiary);margin-bottom:16px}
    .login-prompt a{display:inline-flex;padding:10px 28px;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;text-decoration:none}

    @media(max-width:520px){
      .container{padding:72px 12px calc(30px + env(safe-area-inset-bottom,0px))}
      .card{padding:16px 16px}
      .page-header h1{font-size:20px}
      .page-header .icon{font-size:34px}
      .pref-name{font-size:14px}
      .switch{width:44px;height:26px}
      .switch::after{width:20px;height:20px}
      .switch[aria-checked="true"]::after{transform:translateX(18px)}
    }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <nav aria-label="breadcrumb" style="margin-bottom:6px">
      <a href="/settings/" class="back-link"><i class="fas fa-arrow-left"></i> 设置</a>
      <span class="crumb">›</span>
      <span class="crumb-cur">通知设置</span>
    </nav>

    <div class="page-header">
      <span class="icon"><i class="fas fa-bell"></i></span>
      <h1>通知接收设置</h1>
      <p>决定哪些事情值得打扰你</p>
    </div>

    <div id="loginPrompt" class="login-prompt card-glass" style="display:none">
      <p id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/settings/notifications/" id="loginLink" hidden>前往登录</a>
    </div>

    <div id="content" style="display:none">
      <div class="card card-glass">
        <h2><i class="fas fa-sliders"></i> 通知类型 <span class="cnt" id="prefCount"></span></h2>
        <p class="hint">关掉后不再产生这类新通知，已经收到的会保留。改动立即生效。</p>
        <div id="prefList">
          <div class="pref-row"><span class="pref-ico pm"></span><span class="pref-main"><span class="skeleton" style="width:40%"></span></span></div>
          <div class="pref-row"><span class="pref-ico like"></span><span class="pref-main"><span class="skeleton" style="width:55%"></span></span></div>
          <div class="pref-row"><span class="pref-ico follow"></span><span class="pref-main"><span class="skeleton" style="width:48%"></span></span></div>
        </div>
      </div>

      <div class="card card-glass">
        <h2><i class="fas fa-desktop"></i> 浏览器通知</h2>
        <p class="hint">开启后，页面在后台时会在系统通知栏提醒你；前台仍然只用站内铃铛，避免重复打扰。</p>
        <div class="status-line off" id="browserStatus"><span class="dot"></span><span id="browserStatusText">检测中…</span></div>
        <div class="switch-row">
          <span class="grow">
            <span class="t">桌面通知</span>
            <span class="d" id="browserHint">需要浏览器授权</span>
          </span>
          <button type="button" class="switch" id="browserSwitch" role="switch" aria-checked="false" aria-label="桌面通知"></button>
        </div>
      </div>

      <p class="foot-note">通知会汇总在 <a href="/notifications/">通知中心</a>，随时可以整体标记已读。<br>邮件类通知暂未开启。</p>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
  (function(){
    var $=function(s){return document.querySelector(s);};
    var sb,user;
    try{sb=KJ.createSupabase();}catch(e){}

    var PREFS=[
      {key:'pm',       name:'站内信', desc:'收到新的私信时提醒',   cls:'pm',       icon:'fa-envelope'},
      {key:'like',     name:'点赞',   desc:'你的文章被点赞',       cls:'like',     icon:'fa-heart'},
      {key:'follow',   name:'关注',   desc:'有人关注你',           cls:'follow',   icon:'fa-user-plus'},
      {key:'announce', name:'公告',   desc:'管理员发布的全站公告', cls:'announce', icon:'fa-bullhorn'},
      {key:'system',   name:'系统',   desc:'平台通知与账号提醒',   cls:'system',   icon:'fa-gear'}
    ];
    var state=null;
    var saving=false;

    function showLoginPrompt(msg){
      $('#loginPrompt').style.display='';
      $('#content').style.display='none';
      $('#loginMsg').textContent=msg||'请登录后管理通知';
      $('#loginLink').hidden=false;
    }

    function paintCount(){
      if(!state) return;
      var off=0;
      for(var i=0;i<PREFS.length;i++){ if(state[PREFS[i].key]===false) off++; }
      $('#prefCount').textContent = off===0 ? '全部开启' : ('已关闭 '+off+' 项');
    }

    function renderPrefs(){
      var html='';
      for(var i=0;i<PREFS.length;i++){
        var p=PREFS[i];
        var on=state[p.key]!==false;
        html+='<div class="pref-row">'+
          '<span class="pref-ico '+p.cls+'"><i class="fas '+p.icon+'"></i></span>'+
          '<span class="pref-main">'+
            '<span class="pref-name">'+p.name+'</span>'+
            '<span class="pref-desc">'+p.desc+'</span>'+
          '</span>'+
          '<button type="button" class="switch" role="switch" data-key="'+p.key+'" aria-checked="'+(on?'true':'false')+'" aria-label="'+p.name+'通知"></button>'+
        '</div>';
      }
      $('#prefList').innerHTML=html;
      $('#prefList').querySelectorAll('.switch').forEach(function(btn){
        btn.addEventListener('click',function(){ togglePref(btn); });
      });
      paintCount();
    }

    async function togglePref(btn){
      if(saving||!sb) return;
      var key=btn.getAttribute('data-key');
      var next=btn.getAttribute('aria-checked')!=='true';
      var prev=!next;
      if(!KJ.rateLimit('notif_pref',200)) return;

      btn.setAttribute('aria-checked',next?'true':'false');
      btn.classList.add('is-busy');
      state[key]=next;
      paintCount();

      var payload={};
      for(var i=0;i<PREFS.length;i++) payload[PREFS[i].key]=state[PREFS[i].key]!==false;

      saving=true;
      try{
        var r=await sb.rpc('save_notif_prefs',{p_prefs:payload});
        if(r.error) throw r.error;
      }catch(e){
        btn.setAttribute('aria-checked',prev?'true':'false');
        state[key]=prev;
        paintCount();
        KJ.toast('保存失败，请稍后重试');
      }finally{
        saving=false;
        btn.classList.remove('is-busy');
      }
    }

    // ── 浏览器通知 ──
    function browserSupported(){ return typeof window.Notification!=='undefined'; }

    function paintBrowser(){
      if(!browserSupported()){
        $('#browserStatus').className='status-line warn';
        $('#browserStatusText').textContent='当前浏览器不支持桌面通知';
        $('#browserSwitch').disabled=true;
        $('#browserHint').textContent='可换用 Chrome / Edge / Safari';
        return;
      }
      var perm=Notification.permission;
      var enabled=KJ.isBrowserNotificationEnabled()===true;
      var sw=$('#browserSwitch');

      if(perm==='denied'){
        $('#browserStatus').className='status-line warn';
        $('#browserStatusText').textContent='浏览器已禁止本站发送通知';
        $('#browserHint').textContent='需要在浏览器的站点设置里重新允许';
        sw.setAttribute('aria-checked','false');
        sw.disabled=true;
        return;
      }
      sw.disabled=false;
      if(perm==='granted'&&enabled){
        $('#browserStatus').className='status-line ok';
        $('#browserStatusText').textContent='已开启，页面在后台时会提醒';
        $('#browserHint').textContent='关闭后不再弹系统通知';
        sw.setAttribute('aria-checked','true');
      }else if(perm==='granted'){
        $('#browserStatus').className='status-line off';
        $('#browserStatusText').textContent='已授权，但当前处于关闭状态';
        $('#browserHint').textContent='打开后开始接收';
        sw.setAttribute('aria-checked','false');
      }else{
        $('#browserStatus').className='status-line off';
        $('#browserStatusText').textContent='尚未授权';
        $('#browserHint').textContent='打开时会请求浏览器授权';
        sw.setAttribute('aria-checked','false');
      }
    }

    $('#browserSwitch').addEventListener('click',async function(){
      var sw=this;
      if(sw.disabled) return;
      var next=sw.getAttribute('aria-checked')!=='true';
      sw.disabled=true;
      try{
        if(next){
          var r=await KJ.requestBrowserNotification();
          if(!r||!r.ok){
            if(r&&r.reason==='denied') KJ.toast('浏览器拒绝了通知权限，请在站点设置里允许',3200);
            else if(r&&r.reason==='unsupported') KJ.toast('当前浏览器不支持桌面通知');
            else KJ.toast('开启失败，请稍后重试');
          }else{
            KJ.toast('桌面通知已开启');
          }
        }else{
          KJ.disableBrowserNotification();
          KJ.toast('桌面通知已关闭');
        }
      }catch(e){
        KJ.toast('操作失败，请稍后重试');
      }finally{
        sw.disabled=false;
        paintBrowser();
      }
    });

    // ── 加载 ──
    async function loadUser(){
      if(!sb) return;
      try{
        var r=await sb.auth.getSession();
        if(!r.data.session||!r.data.session.user){ showLoginPrompt(); return; }
        user=r.data.session.user;
        $('#loginPrompt').style.display='none';
        $('#content').style.display='block';
        paintBrowser();

        var pr=await sb.rpc('notif_prefs');
        var obj=(!pr.error&&pr.data)?pr.data:{};
        state={};
        for(var i=0;i<PREFS.length;i++) state[PREFS[i].key]=obj[PREFS[i].key]!==false;
        renderPrefs();
      }catch(e){
        console.error('loadUser:',e);
        showLoginPrompt('加载失败，请刷新页面重试');
      }
    }

    // 主题
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
    KJ.initNav(null,{homeUrl:'/'});

    if(!sb){
      showLoginPrompt(KJ.sdkMissing()?'登录组件未加载，请刷新页面':'网络错误，请刷新后重试');
      return;
    }

    var authReady=false,loaded=false;
    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){
        authReady=true;
        if(session&&session.user){ if(!loaded){loaded=true;loadUser();} return; }
        if(!loaded){loaded=true;showLoginPrompt();}
      }else if(event==='SIGNED_OUT'){
        authReady=true;loaded=true;showLoginPrompt();
      }
    });
    setTimeout(function(){ if(!authReady&&!loaded){loaded=true;loadUser();} },3000);
    setTimeout(function(){
      if($('#loginMsg').textContent==='加载中...'){
        $('#loginMsg').textContent='加载超时，请检查网络后刷新页面';
        $('#loginLink').hidden=false;
        $('#loginLink').textContent='刷新页面';
        $('#loginLink').href='javascript:location.reload()';
      }
    },8000);
  })();
  </script>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
