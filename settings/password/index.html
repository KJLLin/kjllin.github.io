<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <title>修改密码 · 设置 · KJLLin</title>
  <style>
    .top-menu{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .menu-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);box-shadow:var(--glass-shadow);pointer-events:all;background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-nav);-webkit-backdrop-filter:var(--blur-nav)}
    .menu-logo{font-size:18px;font-weight:700;color:var(--color-accent);padding:6px 14px}
    .menu-item{padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--color-text-secondary);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
    .menu-item:hover,.menu-item.active{color:var(--color-accent);background:var(--color-accent-glow)}.menu-item.active{font-weight:600}
    .menu-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:none;font-size:16px;cursor:pointer;background:var(--color-bg-hover);color:var(--color-text-primary);display:grid;place-items:center;transition:all var(--transition-fast)}
    .menu-btn:hover{background:var(--color-accent-glow);color:var(--color-accent)}#themeBtn{border-radius:50%}
    .hamburger{display:none}
    .mobile-menu-dropdown{display:none;position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:16px;right:16px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);flex-direction:column;gap:2px;pointer-events:all;z-index:101;background:var(--color-bg-glass-solid);backdrop-filter:var(--blur-surface);-webkit-backdrop-filter:var(--blur-surface);max-height:calc(100vh - 80px - env(safe-area-inset-top,0px));overflow-y:auto}
    .mobile-menu-dropdown.open{display:flex}
    .mobile-menu-dropdown .menu-item{display:block;width:100%;text-align:left}

    .container{max-width:520px;margin:0 auto;padding:80px 16px 40px}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-tertiary);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--color-accent)}
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.6s var(--ease-out) forwards}
    .page-header .icon{font-size:44px;margin-bottom:8px;display:block}
    .page-header h1{font-size:24px;font-weight:700;color:var(--color-text-primary)}
    .card-glass-form{padding:32px 28px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);box-shadow:var(--glass-shadow);animation:fadeUp 0.6s var(--ease-out) 0.08s both}
    .card-glass-form h2{font-size:17px;font-weight:600;color:var(--color-text-primary);margin-bottom:24px;display:flex;align-items:center;gap:8px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px}
    .form-group input{width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg-input);color:var(--color-text-primary);font-size:15px;font-family:var(--font-sans);outline:none;transition:all var(--transition-fast)}
    .form-group input:focus{border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-glow)}
    .form-group input::placeholder{color:var(--color-text-tertiary)}
    .form-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:6px}
    .form-actions{margin-top:28px;display:flex;gap:12px}
    .btn-submit{padding:10px 28px;border:none;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition-fast)}
    .btn-submit:hover:not(:disabled){background:var(--color-accent-hover)}
    .btn-submit:disabled{opacity:0.5;cursor:not-allowed}
    .btn-cancel{padding:10px 28px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:transparent;color:var(--color-text-secondary);font-size:14px;cursor:pointer;text-decoration:none;text-align:center;transition:all var(--transition-fast)}
    .btn-cancel:hover{border-color:var(--color-accent);color:var(--color-accent)}

    @media(max-width:520px){.menu-item{display:none}.hamburger{display:grid}.card-glass-form{padding:24px 20px}.container{padding:72px 12px calc(28px + env(safe-area-inset-bottom, 0px))}.page-header h1{font-size:20px}.page-header .icon{font-size:36px}.form-actions{flex-direction:column}.btn-submit,.btn-cancel{width:100%;text-align:center}}
    @media(min-width:521px){.hamburger{display:none!important}.mobile-menu-dropdown{display:none!important}}
  </style>
</head>
<body>
  <div style="position:fixed;inset:0;background:var(--color-bg);z-index:-3;pointer-events:none"></div>
  <header class="top-menu">
    <nav class="menu-bar"><span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/settings/" class="menu-item active"><i class="fas fa-gear"></i> 设置</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/settings/" class="menu-item active"><i class="fas fa-gear"></i> 设置</a>
    </div>
  </header>

  <div class="container">
    <nav aria-label="breadcrumb" style="margin-bottom:12px">
      <a href="/settings/" style="color:var(--color-accent);text-decoration:none;font-size:13px;font-weight:500"><i class="fas fa-arrow-left"></i> 返回设置</a>
      <span style="color:var(--color-text-tertiary);font-size:13px;margin:0 6px">›</span>
      <span style="color:var(--color-text-secondary);font-size:13px">修改密码</span>
    </nav>
    <div class="page-header"><span class="icon">🔑</span><h1>修改密码</h1></div>
    <div id="loginPrompt" class="card-glass-form" style="text-align:center;padding:48px 24px">
      <p style="color:var(--color-text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/settings/password/" class="btn-submit" style="text-decoration:none" id="loginLink" hidden>前往登录</a>
    </div>
    <div id="formContent" style="display:none">
      <div class="card-glass-form">
        <h2><i class="fas fa-lock"></i> 修改登录密码</h2>
        <div class="form-group"><label>当前密码</label><input type="password" id="currentPassword" placeholder="输入当前密码" autocomplete="current-password"></div>
        <div class="form-group"><label>新密码</label><input type="password" id="newPassword" placeholder="至少 8 位，含字母与数字" autocomplete="new-password"><div class="form-hint">至少 8 个字符，建议包含大小写字母和数字</div></div>
        <div class="form-group"><label>确认新密码</label><input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password"></div>
        <div class="form-actions">
          <button class="btn-submit" id="submitBtn">更新密码</button>
          <a href="/settings/" class="btn-cancel">取消</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s);};
    var sb;try{sb=KJ.createSupabase();}catch(e){}
    if(sb) KJ.initMessageBanner(sb);

    function showLoginPrompt(){$('#formContent').style.display='none';$('#loginPrompt').style.display='';$('#loginMsg').textContent='请登录后修改密码';$('#loginLink').hidden=false;}

    // Theme
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    var hb=$('#hamburgerBtn'),mm=$('#mobileMenu');
    hb.addEventListener('click',function(e){e.stopPropagation();mm.classList.toggle('open');});
    document.addEventListener('click',function(e){if(!hb.contains(e.target)&&!mm.contains(e.target))mm.classList.remove('open');});

    if(!sb){$('#loginMsg').textContent='网络错误';return}

    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){
        if(session&&session.user){$('#loginPrompt').style.display='none';$('#formContent').style.display='block';return}
        showLoginPrompt();
      }else if(event==='SIGNED_OUT')showLoginPrompt();
    });

    $('#submitBtn').addEventListener('click',async function(){
      var cur=$('#currentPassword').value.trim(),np=$('#newPassword').value.trim(),cp=$('#confirmPassword').value.trim();
      if(!cur||!np||!cp){KJ.toast('请填写所有密码字段');return}
      if(np.length<8){KJ.toast('新密码至少 8 位');return}
      if(np!==cp){KJ.toast('两次输入的新密码不一致');return}
      var btn=$('#submitBtn');btn.disabled=true;btn.textContent='更新中...';
      try{var r=await sb.auth.getSession();if(!r.data.session){KJ.toast('登录已过期，请重新登录');return}
        var r2=await sb.rpc('update_password',{current_password:cur,new_password:np});
        if(r2.error)throw r2.error;
        KJ.toast('密码已更新')
        $('#currentPassword').value='';$('#newPassword').value='';$('#confirmPassword').value='';
      }catch(e){KJ.toast(KJ.formatSupabaseError(e)||'密码修改失败，请检查当前密码');}
      btn.disabled=false;btn.textContent='更新密码';
    });

    setTimeout(function(){if($('#loginPrompt').style.display!=='none'){$('#loginMsg').textContent='加载超时，请检查网络';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}},8000);
    })();
  </script>
</body>
</html>
