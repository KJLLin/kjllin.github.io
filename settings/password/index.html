<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com https://*.hcaptcha.com https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>修改密码 · 设置 · KJLLin</title>
  <meta name="description" content="修改密码 - KJLLin 账号安全">
  <style>
    .container{max-width:520px;margin:0 auto;padding:80px 16px 40px}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-tertiary);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--color-accent)}
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.6s var(--ease-out) forwards}
    .page-header .icon{font-size:44px;margin-bottom:8px;display:block}
    .page-header h1{font-size:24px;font-weight:700;color:var(--color-text-primary)}
    .card-glass-form{padding:32px 28px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);box-shadow:var(--glass-shadow);animation:fadeUp 0.6s var(--ease-out) 0.08s both}
    .card-glass-form h2{font-size:17px;font-weight:600;color:var(--color-text-primary);margin-bottom:24px;display:flex;align-items:center;gap:8px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px}
    .form-group input{width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg-input);color:var(--color-text-primary);font-size:15px;font-family:var(--font-sans);outline:none;transition:all var(--transition-fast)}
    .form-group input:focus{border-color:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-glow)}
    .form-group input::placeholder{color:var(--color-text-tertiary)}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:40px}
    .pw-wrap .pw-toggle{
      position:absolute;right:8px;top:12px;
      border:none;background:transparent;color:var(--color-text-tertiary);
      cursor:pointer;padding:6px;font-size:14px;line-height:1;
      transition:color var(--transition-fast);
    }
    .pw-wrap .pw-toggle:hover{color:var(--color-accent)}
    .form-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:6px}
    /* ── 密码强度指示器 ── */
    .pw-strength-bar{height:4px;border-radius:2px;margin-top:8px;background:var(--color-border);overflow:hidden}
    .pw-strength-fill{height:100%;border-radius:2px;width:0;transition:width 0.3s var(--spring-default), background 0.3s var(--spring-default)}
    .pw-strength-fill.weak{width:25%;background:var(--color-danger)}
    .pw-strength-fill.fair{width:50%;background:var(--color-warning)}
    .pw-strength-fill.good{width:75%;background:var(--color-accent)}
    .pw-strength-fill.strong{width:100%;background:var(--color-success)}
    .pw-strength-text{font-size:11px;font-weight:500;margin-top:4px;transition:color 0.3s}
    .pw-rules{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
    .pw-rule{font-size:11px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px;transition:color 0.2s}
    .pw-rule.pass{color:var(--color-success)}
    .pw-rule.pass i{opacity:1}
    .pw-rule i{font-size:10px;opacity:0.4}
    .form-actions{margin-top:28px;display:flex;gap:12px}
    .btn-submit{padding:10px 28px;border:none;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition-fast)}
    .btn-submit:hover:not(:disabled){background:var(--color-accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px var(--color-accent-glow)}
    .btn-submit:active:not(:disabled){transform:scale(0.96);transition:transform var(--duration-instant) var(--spring-default)}
    .btn-submit:disabled{opacity:0.5;cursor:not-allowed}
    .btn-cancel{padding:10px 28px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:transparent;color:var(--color-text-secondary);font-size:14px;cursor:pointer;text-decoration:none;text-align:center;transition:all var(--transition-fast)}
    .btn-cancel:hover{border-color:var(--color-accent);color:var(--color-accent)}
    .btn-cancel:active{transform:scale(0.96);transition:transform var(--duration-instant) var(--spring-default)}

    @media(max-width:520px){.card-glass-form{padding:24px 20px}.container{padding:72px 12px calc(28px + env(safe-area-inset-bottom, 0px))}.page-header h1{font-size:20px}.page-header .icon{font-size:36px}.form-actions{flex-direction:column}.btn-submit,.btn-cancel{width:100%;text-align:center}}
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <nav aria-label="breadcrumb" style="margin-bottom:12px">
      <a href="/settings/" style="color:var(--color-accent);text-decoration:none;font-size:13px;font-weight:500"><i class="fas fa-arrow-left"></i> 返回设置</a>
      <span style="color:var(--color-text-tertiary);font-size:13px;margin:0 6px">›</span>
      <span style="color:var(--color-text-secondary);font-size:13px">修改密码</span>
    </nav>
    <div class="page-header"><span class="icon"><i class="fas fa-key"></i></span><h1>修改密码</h1></div>
    <div id="loginPrompt" class="card-glass-form" style="text-align:center;padding:48px 24px">
      <p style="color:var(--color-text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/settings/password/" class="btn-submit" style="text-decoration:none" id="loginLink" hidden>前往登录</a>
    </div>
    <div id="formContent" style="display:none">
      <div class="card-glass-form">
        <h2><i class="fas fa-lock"></i> 修改登录密码</h2>
        <div class="form-group"><label>当前密码</label><div class="pw-wrap"><input type="password" id="currentPassword" placeholder="输入当前密码" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="currentPassword" aria-label="显示密码" title="显示/隐藏密码"><i class="fas fa-eye"></i></button></div></div>
        <div class="form-group"><label>新密码</label><div class="pw-wrap"><input type="password" id="newPassword" placeholder="至少 8 位，含字母与数字" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="newPassword" aria-label="显示密码" title="显示/隐藏密码"><i class="fas fa-eye"></i></button></div>
          <div class="pw-strength-bar"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
          <div class="pw-strength-text" id="pwStrengthText"></div>
          <div class="pw-rules" id="pwRules">
            <span class="pw-rule" data-rule="length"><i class="fas fa-circle"></i> 至少 8 个字符</span>
            <span class="pw-rule" data-rule="upper"><i class="fas fa-circle"></i> 含大写字母</span>
            <span class="pw-rule" data-rule="lower"><i class="fas fa-circle"></i> 含小写字母</span>
            <span class="pw-rule" data-rule="digit"><i class="fas fa-circle"></i> 含数字</span>
            <span class="pw-rule" data-rule="special"><i class="fas fa-circle"></i> 特殊字符</span>
          </div>
        </div>
        <div class="form-group"><label>确认新密码</label><div class="pw-wrap"><input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="显示密码" title="显示/隐藏密码"><i class="fas fa-eye"></i></button></div></div>
        <div class="form-actions">
          <button class="btn-submit" id="submitBtn">更新密码</button>
          <a href="/settings/" class="btn-cancel">取消</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s);};
    var sb;try{sb=KJ.createSupabase();}catch(e){}
    if(sb) KJ.initMessageBanner(sb);

    // recovery 流程（密码重置邮件跳转而来，URL 带 recovery=1）：已通过邮件验证身份，免校验当前密码
    var isRecovery=new URLSearchParams(location.search).get('recovery')==='1';
    if(isRecovery){var _curGroup=$('#currentPassword').parentNode;if(_curGroup)_curGroup.style.display='none';}

    function showLoginPrompt(){$('#formContent').style.display='none';$('#loginPrompt').style.display='';$('#loginMsg').textContent='请登录后修改密码';$('#loginLink').hidden=false;}

    // Theme
    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        KJ.initNav(null, { homeUrl: '/' });

    if(!sb){$('#loginMsg').textContent='加载中，请稍候...';return}

    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){
        if(session&&session.user){$('#loginPrompt').style.display='none';$('#formContent').style.display='block';return}
        showLoginPrompt();
      }else if(event==='SIGNED_OUT')showLoginPrompt();
    });

    $('#submitBtn').addEventListener('click',async function(){
      if(!KJ.rateLimit('pwd_change', 10000)) return; // 10秒内只能提交一次
      // 密码前后空格视为密码一部分，不做 trim；空值只判断 length===0
      var cur=$('#currentPassword').value,np=$('#newPassword').value,cp=$('#confirmPassword').value;
      if((!isRecovery&&!cur.length)||!np.length||!cp.length){KJ.toast('请填写所有密码字段');return}
      if(np.length<8){KJ.toast('新密码至少 8 位');return}
      if(np!==cp){KJ.toast('两次输入的新密码不一致');return}
      var btn=$('#submitBtn');btn.disabled=true;btn.textContent='更新中...';
      try{
        var r=await sb.auth.getSession();
        var session=r.data.session;
        if(!session){KJ.toast('登录已过期，请重新登录');return}
        // 先校验当前密码（recovery 流程已通过邮件验证身份，跳过校验）
        if(!isRecovery){
          var email=session.user&&session.user.email;
          if(!email){KJ.toast('无法获取账号邮箱，请重新登录');return}
          var {error:verifyErr}=await sb.auth.signInWithPassword({email:email,password:cur});
          if(verifyErr){KJ.toast('当前密码错误');return}
        }
        // 使用 Supabase Auth 标准 API 更新密码（不依赖 RPC）
        var {error:updateErr}=await sb.auth.updateUser({password:np});
        if(updateErr){
          // 如果会话过期需要重新验证,提示用户
          if(updateErr.message&&updateErr.message.indexOf('Auth session missing')!==-1){KJ.toast('会话已过期，请重新登录后再修改密码');return}
          KJ.toast(KJ.formatSupabaseError(updateErr)||'密码修改失败');
          return;
        }
        KJ.toast('密码已更新');
        $('#currentPassword').value='';$('#newPassword').value='';$('#confirmPassword').value='';
        $('#pwStrengthFill').className='pw-strength-fill';$('#pwStrengthText').textContent='';
        document.querySelectorAll('.pw-rule').forEach(function(r){r.classList.remove('pass');});
        // 带 redirect 参数时（recovery 流程）改完跳回
        var back=KJ.safeRedirect(new URLSearchParams(location.search).get('redirect'));
        if(back!=='/')setTimeout(function(){window.location.href=back;},1200);
      }catch(e){KJ.toast('操作失败，请检查网络连接');}
      finally{btn.disabled=false;btn.textContent='更新密码';}
    });

    // ── 实时密码强度检测 ──
    var rules={length:/.{8,}/,upper:/[A-Z]/,lower:/[a-z]/,digit:/\d/,special:/[^A-Za-z0-9]/};
    $('#newPassword').addEventListener('input',function(){
      var pw=this.value,score=0,details=[];
      document.querySelectorAll('.pw-rule').forEach(function(r){
        var key=r.dataset.rule,ok=rules[key]&&rules[key].test(pw);
        r.classList.toggle('pass',ok);r.querySelector('i').className=ok?'fas fa-check-circle':'fas fa-circle';
        if(ok){score++;if(key==='length')details.push('长度 ✓');}
      });
      var fill=$('#pwStrengthFill'),txt=$('#pwStrengthText'),level='',color='';
      fill.className='pw-strength-fill';
      if(pw.length===0){txt.textContent='';}
      else if(score<=1){fill.classList.add('weak');txt.textContent='弱 — 很容易被猜解';txt.style.color='var(--color-danger)';}
      else if(score===2){fill.classList.add('fair');txt.textContent='一般 — 可以进一步加强';txt.style.color='var(--color-warning)';}
      else if(score===3||score===4){fill.classList.add('good');txt.textContent='良好 — 安全性较高';txt.style.color='var(--color-accent)';}
      else{fill.classList.add('strong');txt.textContent='强 — 非常安全';txt.style.color='var(--color-success)';}
    });

    // ── 确认密码实时匹配提示 ──
    $('#confirmPassword').addEventListener('input',function(){
      var np=$('#newPassword').value;
      if(!this.value){this.style.borderColor='';return}
      if(this.value===np){this.style.borderColor='var(--color-success)';}
      else{this.style.borderColor='var(--color-danger)';}
    });

    // ── 密码显示/隐藏切换 ──
    document.querySelectorAll('.pw-toggle').forEach(function(btn){
      btn.addEventListener('click',function(){
        var target=document.getElementById(btn.dataset.target);if(!target)return;
        if(target.type==='password'){target.type='text';btn.innerHTML='<i class="fas fa-eye-slash"></i>';btn.setAttribute('aria-label','隐藏密码');}
        else{target.type='password';btn.innerHTML='<i class="fas fa-eye"></i>';btn.setAttribute('aria-label','显示密码');}
      });
    });

    setTimeout(function(){if($('#loginPrompt').style.display!=='none'){$('#loginMsg').textContent='加载超时，请检查网络';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}},8000);
    })();
  </script>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
