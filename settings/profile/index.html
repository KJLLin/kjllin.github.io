<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.hcaptcha.com https://hcaptcha.com https://newassets.hcaptcha.com https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://hcaptcha.com https://newassets.hcaptcha.com; frame-src 'self' https://hcaptcha.com https://newassets.hcaptcha.com https://*.hcaptcha.com https://*.hcaptcha.com; media-src 'self'; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>个人资料 · 设置 · KJLLin</title>
  <link rel="canonical" href="https://kjllin.dpdns.org/settings/profile/">

  <meta name="description" content="个人资料 - KJLLin 昵称头像设置">
  <script src="/vendor/supabase.min.js"></script>
  <style>
    .container{max-width:520px;margin:0 auto;padding:80px 16px 40px}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--color-text-tertiary);text-decoration:none;font-size:13px;margin-bottom:24px;transition:color var(--transition-fast)}
    .back-link:hover{color:var(--color-accent)}
    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp 0.6s var(--ease-out) forwards}
    .page-header .icon{font-size:44px;margin-bottom:8px;display:block}
    .page-header h1{font-size:24px;font-weight:700;color:var(--color-text-primary)}

    .card-glass-form{padding:32px 28px;border-radius:var(--radius-lg);border:1px solid var(--color-border);border-top:1px solid var(--color-border-glass);background:var(--color-bg-glass);background-image:var(--iridescent);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);box-shadow:var(--glass-shadow);animation:fadeUp 0.6s var(--ease-out) 0.08s both;margin-bottom:16px}
    .card-glass-form h2{font-size:17px;font-weight:600;color:var(--color-text-primary);margin-bottom:24px;display:flex;align-items:center;gap:8px}

    .avatar-section{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
    .avatar-pick{position:relative;width:88px;height:88px;padding:0;border:none;background:none;cursor:pointer;margin-bottom:10px;border-radius:50%;-webkit-tap-highlight-color:transparent}
    .avatar-large{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--color-accent),var(--color-accent-light));color:var(--color-text-on-accent);display:grid;place-items:center;font-size:36px;font-weight:700;box-shadow:0 6px 20px var(--color-accent-glow);overflow:hidden;position:relative;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease}
    .avatar-pick:hover .avatar-large{transform:scale(1.04);box-shadow:0 10px 26px var(--color-accent-glow)}
    .avatar-pick:active .avatar-large{transform:scale(.97)}
    .avatar-pick .badge{position:absolute;right:-1px;bottom:-1px;width:28px;height:28px;border-radius:50%;background:var(--color-accent);color:#fff;display:grid;place-items:center;font-size:12px;border:2.5px solid var(--color-bg);box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
    .avatar-pick.is-busy .badge i{animation:kjSpin 1s linear infinite}
    @keyframes kjSpin{to{transform:rotate(360deg)}}
    .avatar-actions{display:flex;gap:16px;margin-top:2px}
    .avatar-actions button{background:none;border:none;padding:2px 0;font-family:inherit;font-size:12px;color:var(--color-accent);cursor:pointer}
    .avatar-actions button.danger{color:#ff453a}
    .avatar-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:8px;text-align:center;line-height:1.5}

    .form-group{margin-bottom:16px}
    .form-group label{display:block;font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px}
    .form-group input{width:100%;padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-bg-input);color:var(--color-text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast)}
    .form-group input:focus{border-color:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-glow)}
    .form-group input:disabled{opacity:0.6;cursor:not-allowed}
    .form-hint{font-size:12px;color:var(--color-text-tertiary);margin-top:5px}
    .form-feedback{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
    .form-feedback.error{color:var(--color-danger)}
    .form-feedback.ok{color:var(--color-success)}

    .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:14px}
    .info-row:last-child{border-bottom:none}
    .info-row .label{color:var(--color-text-secondary)}
    .info-row .value{font-family:var(--font-mono);font-size:13px;color:var(--color-text-primary)}

    .btn-save{width:100%;padding:11px 24px;border:none;border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-text-on-accent);font-size:14px;font-weight:600;cursor:pointer;transition: background var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast), transform var(--duration-instant) var(--spring-default);display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn-save:hover:not(:disabled){background:var(--color-accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px var(--color-accent-glow)}
    .btn-save:active:not(:disabled){transform:scale(0.96);transition:transform var(--duration-instant) var(--spring-default)}
    .btn-save:disabled{opacity:0.5;cursor:not-allowed}

    @media(max-width:520px){.card-glass-form{padding:24px 20px}.container{padding:72px 12px calc(28px + env(safe-area-inset-bottom, 0px))}.page-header h1{font-size:20px}.page-header .icon{font-size:36px}.avatar-large{width:64px;height:64px;font-size:28px}.info-row .value{font-size:11px;word-break:break-all}}
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-book-open"></i> 文章广场</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container">
    <nav aria-label="breadcrumb" style="margin-bottom:12px">
      <a href="/settings/" style="color:var(--color-accent);text-decoration:none;font-size:13px;font-weight:500"><i class="fas fa-arrow-left"></i> 返回设置</a>
      <span style="color:var(--color-text-tertiary);font-size:13px;margin:0 6px">›</span>
      <span style="color:var(--color-text-secondary);font-size:13px">个人资料</span>
    </nav>
    <div class="page-header"><span class="icon"><i class="fas fa-user"></i></span><h1>编辑个人资料</h1></div>

    <div id="loginPrompt" class="card-glass-form" style="text-align:center;padding:48px 24px">
      <p style="color:var(--color-text-tertiary);margin-bottom:16px" id="loginMsg">加载中...</p>
      <a href="/login/?redirect=/settings/profile/" class="btn-save" style="text-decoration:none;width:auto;display:inline-flex" id="loginLink" hidden>前往登录</a>
    </div>

    <div id="profileContent" style="display:none">
      <div class="card-glass-form">
        <h2><i class="fas fa-user-edit"></i> 个人资料</h2>
        <div class="avatar-section">
          <button type="button" class="avatar-pick" id="avatarPick" aria-label="更换头像">
            <div class="avatar-large" id="profileAvatarLarge">U</div>
            <span class="badge"><i class="fas fa-camera"></i></span>
          </button>
          <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <div class="avatar-actions">
            <button type="button" id="avatarRemove" hidden>恢复默认头像</button>
          </div>
          <div class="avatar-hint" id="avatarHint">点按头像更换 · 支持 JPG / PNG / WebP · 自动裁成方形</div>
        </div>
        <div class="form-group"><label>昵称</label><input type="text" id="nickInput" placeholder="设置你的昵称" maxlength="20"><div class="form-feedback" id="nickFeedback"></div><div class="form-hint">1-20 个字符，支持中英文和数字</div></div>
        <div class="form-group"><label>邮箱</label><input type="email" id="emailShow" disabled><div class="form-hint">邮箱不可修改，如需更换请联系管理员</div></div>
        <button class="btn-save" id="saveBtn"><i class="fas fa-save"></i> 保存修改</button>
      </div>

      <div class="card-glass-form">
        <h2><i class="fas fa-clipboard"></i> 账号信息</h2>
        <div class="info-row"><span class="label">用户 ID</span><span class="value" id="infoUserId">--</span></div>
        <div class="info-row"><span class="label">注册时间</span><span class="value" id="infoCreated">--</span></div>
        <div class="info-row"><span class="label">邮箱验证</span><span class="value" id="infoVerified">--</span></div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function(){
    var $=function(s){return document.querySelector(s);};
    var sb,user;
    var currentNick='', currentAvatar='';
    try{sb=KJ.createSupabase();}catch(e){}
    if(sb) KJ.initMessageBanner(sb);

    function fmtDate(iso){if(!iso)return'--';var d=new Date(iso);return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}

    async function loadUser(){
      if(!sb)return;
      try{
        var r=await sb.auth.getSession();
        if(!r.data.session||!r.data.session.user){showLoginPrompt();return}
        user=r.data.session.user;
        $('#loginPrompt').style.display='none';$('#profileContent').style.display='block';
        var nick=user.user_metadata&&user.user_metadata.nick||(user.email||'').split('@')[0]||'用户';
        currentNick=nick;
        setAvatarUI('');
        $('#nickInput').value=nick;
        $('#emailShow').value=user.email||'';
        $('#infoUserId').textContent=user.id.substring(0,12)+'...';
        $('#infoCreated').textContent=fmtDate(user.created_at);
        if(user.email_confirmed_at){$('#infoVerified').textContent='已验证';$('#infoVerified').innerHTML='已验证 <i class="fas fa-check"></i>';$('#infoVerified').style.color='var(--color-success)';}
        else{$('#infoVerified').textContent='未验证';$('#infoVerified').style.color='var(--color-warning)';}
        loadAvatar();
      }catch(e){console.error('loadUser:',e);showLoginPrompt();}
    }

    // ---------------- 头像 ----------------
    function setAvatarUI(avatarUrl){
      currentAvatar=avatarUrl||'';
      KJ.paintAvatar($('#profileAvatarLarge'), { nick: currentNick, avatar_url: currentAvatar });
      $('#avatarRemove').hidden = !currentAvatar;
    }

    async function loadAvatar(){
      if(!sb||!user)return;
      try{
        var r=await sb.from('users').select('avatar_url').eq('id',user.id).maybeSingle();
        if(!r.error&&r.data) setAvatarUI(r.data.avatar_url||'');
      }catch(e){}
    }

    /** 居中裁成方形 + 缩到 512，输出 webp（不支持时退 jpeg） */
    function compressImage(file){
      return new Promise(function(resolve,reject){
        var img=new Image();
        var url=URL.createObjectURL(file);
        img.onload=function(){
          URL.revokeObjectURL(url);
          try{
            var side=Math.min(img.naturalWidth,img.naturalHeight);
            var sx=(img.naturalWidth-side)/2, sy=(img.naturalHeight-side)/2;
            var out=512;
            var cv=document.createElement('canvas');
            cv.width=out; cv.height=out;
            var ctx=cv.getContext('2d');
            ctx.imageSmoothingEnabled=true;
            ctx.imageSmoothingQuality='high';
            ctx.drawImage(img,sx,sy,side,side,0,0,out,out);
            cv.toBlob(function(b){
              if(b) return resolve(b);
              cv.toBlob(function(b2){
                b2?resolve(b2):reject(new Error('图片编码失败'));
              },'image/jpeg',0.88);
            },'image/webp',0.86);
          }catch(err){reject(err);}
        };
        img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('图片读取失败'));};
        img.src=url;
      });
    }

    var avatarBusy=false;
    async function uploadAvatar(file){
      if(!file||avatarBusy||!user)return;
      if(!/^image\//.test(file.type)){KJ.toast('请选择图片文件');return;}
      if(file.size>5*1024*1024){KJ.toast('图片不要超过 5MB');return;}
      avatarBusy=true;
      var pick=$('#avatarPick');
      pick.classList.add('is-busy');
      $('#avatarHint').textContent='处理中…';
      try{
        var blob=await compressImage(file);
        var ext=blob.type==='image/webp'?'webp':'jpg';
        var path=user.id+'/a-'+Date.now()+'.'+ext;
        var up=await sb.storage.from('avatars').upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false});
        if(up.error)throw up.error;
        var upd=await sb.from('users').update({avatar_url:path}).eq('id',user.id);
        if(upd.error){try{await sb.storage.from('avatars').remove([path]);}catch(_){} throw upd.error;}
        // 清掉旧文件（同目录下除当前这张）
        try{
          var ls=await sb.storage.from('avatars').list(user.id,{limit:100});
          var olds=(ls.data||[]).filter(function(o){return user.id+'/'+o.name!==path;})
                                 .map(function(o){return user.id+'/'+o.name;});
          if(olds.length)await sb.storage.from('avatars').remove(olds);
        }catch(_){}
        setAvatarUI(path);
        KJ.toast('头像已更新');
      }catch(e){
        console.warn('avatar upload:',e);
        KJ.toast((e&&e.message)?('头像上传失败：'+e.message):'头像上传失败');
        setAvatarUI(currentAvatar);
      }finally{
        avatarBusy=false;
        pick.classList.remove('is-busy');
        $('#avatarHint').textContent='点按头像更换 · 支持 JPG / PNG / WebP · 自动裁成方形';
        $('#avatarFile').value='';
      }
    }

    $('#avatarPick').addEventListener('click',function(){ if(!avatarBusy)$('#avatarFile').click(); });
    $('#avatarFile').addEventListener('change',function(e){ uploadAvatar(e.target.files&&e.target.files[0]); });

    $('#avatarRemove').addEventListener('click',async function(){
      if(avatarBusy)return;
      if(!confirm('恢复为昵称首字头像？当前上传的图片会被删除。'))return;
      avatarBusy=true;
      try{
        var r=await sb.rpc('clear_my_avatar');
        if(r.error)throw r.error;
        try{
          var ls=await sb.storage.from('avatars').list(user.id,{limit:100});
          var all=(ls.data||[]).map(function(o){return user.id+'/'+o.name;});
          if(all.length)await sb.storage.from('avatars').remove(all);
        }catch(_){}
        setAvatarUI('');
        KJ.toast('已恢复默认头像');
      }catch(e){KJ.toast('操作失败，请稍后再试');}
      finally{avatarBusy=false;}
    });

    // 支持拖拽图片到头像上
    ['dragover','dragenter'].forEach(function(ev){
      $('#avatarPick').addEventListener(ev,function(e){e.preventDefault();e.currentTarget.classList.add('is-over');});
    });
    ['dragleave','drop'].forEach(function(ev){
      $('#avatarPick').addEventListener(ev,function(e){e.preventDefault();e.currentTarget.classList.remove('is-over');});
    });
    $('#avatarPick').addEventListener('drop',function(e){
      var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f)uploadAvatar(f);
    });

    $('#saveBtn').addEventListener('click',async function(){
      if(!KJ.rateLimit('profile_save', 5000)) return; // 5秒内只能保存一次
      var nick=$('#nickInput').value.trim();
      if(!nick||nick.length>20){KJ.toast('昵称需1-20个字符');return}
      var btn=$('#saveBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 保存中...';
      try{
        var {error:usersErr}=await sb.from('users').update({nick:nick}).eq('id',user.id);
        if(usersErr){KJ.toast('资料更新失败（users 表）');console.warn('users update error:',usersErr);}
        await sb.auth.updateUser({data:{nick:nick}});
        // 强制从服务端刷新用户元数据，确保本地缓存同步，防止刷新后回退旧昵称
        try{await sb.auth.getUser()}catch(e){console.warn('getUser refresh failed:',e)}
        $('#profileAvatarLarge').textContent=nick.charAt(0).toUpperCase();
        $('#nickFeedback').textContent='';$('#nickFeedback').className='form-feedback';
        KJ.toast('资料已更新');
      }catch(e){KJ.toast('更新失败：'+e.message)}
      btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> 保存修改';
    });

    // ── 昵称实时校验 ──
    $('#nickInput').addEventListener('input',function(){
      var v=this.value.trim(),fb=$('#nickFeedback');
      if(!v){fb.textContent='';fb.className='form-feedback';return}
      if(v.length>20){fb.textContent='昵称不能超过20个字符';fb.className='form-feedback error';return}
      if(/[<>"']/.test(v)){fb.textContent='昵称不能包含特殊字符';fb.className='form-feedback error';return}
      fb.innerHTML='<i class="fas fa-check"></i> 格式正确';fb.className='form-feedback ok';
    });

    function showLoginPrompt(){$('#loginPrompt').style.display='';$('#profileContent').style.display='none';$('#loginMsg').textContent='请登录后管理账号';$('#loginLink').hidden=false;}

    var themeBtn=$('#themeBtn');
    function updateThemeUI(){var s=KJ.applyTheme('#f5f5f7','#0a0a0a');themeBtn.innerHTML=KJ.getThemeIcon(s.mode);}
    themeBtn.addEventListener('click',function(){KJ.toggleTheme();updateThemeUI();});
    KJ.onSystemThemeChange(updateThemeUI);updateThemeUI();

    KJ.setupMobileMenu('#hamburgerBtn','#mobileMenu');
        KJ.initNav(null, { homeUrl: '/' });

    if(!sb){$('#loginMsg').textContent='网络错误，请刷新后重试';return}

    var authReady=false;
    sb.auth.onAuthStateChange(function(event,session){
      if(event==='INITIAL_SESSION'||event==='SIGNED_IN'){authReady=true;if(session&&session.user){loadUser();return}showLoginPrompt();}
      else if(event==='SIGNED_OUT'){authReady=true;showLoginPrompt();}
      else if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session&&session.user)loadUser();}
    });
    setTimeout(function(){if(!authReady)loadUser();},3000);
    setTimeout(function(){if($('#loginMsg').textContent==='加载中...'){$('#loginMsg').textContent='加载超时，请检查网络';$('#loginLink').hidden=false;$('#loginLink').textContent='刷新页面';$('#loginLink').href='javascript:location.reload()';}},8000);
    })();
  </script>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
