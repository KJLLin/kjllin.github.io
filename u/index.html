<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.bootcdn.net https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdnjs.cloudflare.com https://cdn.bootcdn.net data:; connect-src 'self' https://vzqspcuxnwpakofwumat.supabase.co https://*.supabase.co wss://*.supabase.co https://api.ipify.org https://api.ip.sb https://httpbin.org; frame-src 'self'; media-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self' https://vzqspcuxnwpakofwumat.supabase.co; object-src 'none'; ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="KJLLin 个人主页">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>个人主页 · KJLLin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html {
      --win-ease: var(--spring-default);
      --transition-fast: 200ms var(--win-ease);
      --transition-normal: 300ms var(--win-ease);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 50%;
      transition: background-color var(--transition-normal);
      scroll-behavior: smooth;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    body { font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--color-bg); color: var(--color-text-primary); }
    :root {
      --bg-mica: var(--color-bg-glass);
      --bg-mica-hover: var(--color-bg-glass-hover);
      --border-mica: var(--color-border);
      --border-mica-hover: var(--color-border-hover);
      --text-primary: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-tertiary: var(--color-text-tertiary);
      --accent: var(--color-accent);
      --accent-glow: var(--color-accent-glow);
      --danger: var(--color-danger);
      --shadow-rest: var(--shadow-sm);
    }
    .container { max-width: 860px; margin: 0 auto; padding: 80px 20px 80px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* ====================== 资料卡 ====================== */
    .profile-card {
      padding: 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-rest);
      animation: fadeUp 0.5s var(--win-ease) both;
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6e8efb);
      color: #fff; font-size: 34px; font-weight: 700;
      display: grid; place-items: center; flex-shrink: 0;
      box-shadow: 0 4px 14px var(--accent-glow);
      user-select: none;
    }
    .profile-info { flex: 1; min-width: 220px; }
    .profile-name { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 999px; color: #fff;
      background: linear-gradient(135deg, #5e5ce6, #bf5af2);
      box-shadow: 0 2px 8px rgba(94,92,230,0.35);
    }
    .profile-meta { margin-top: 8px; font-size: 13px; color: var(--text-tertiary); display: flex; gap: 14px; flex-wrap: wrap; }
    .profile-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-mica); background: var(--bg-mica);
      color: var(--text-primary); font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; font-family: inherit;
      transition: all var(--transition-fast);
    }
    .btn:hover { background: var(--bg-mica-hover); }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      border-color: transparent; background: var(--accent); color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .btn-primary:hover { background: var(--color-accent-hover, var(--accent)); }
    .follow-btn.following { border-color: transparent; background: var(--accent-glow); color: var(--accent); }

    /* ====================== 统计 ====================== */
    .stat-grid {
      margin-top: 20px; display: grid;
      grid-template-columns: repeat(4, 1fr); gap: 12px;
    }
    .stat-item {
      padding: 16px 12px; text-align: center;
      border-radius: var(--radius-md); background: var(--bg-mica);
      animation: fadeUp 0.5s var(--win-ease) 0.1s both;
    }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { margin-top: 4px; font-size: 12px; color: var(--text-tertiary); }
    @media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ====================== 帖子列表 ====================== */
    .section-title {
      margin: 32px 0 14px; font-size: 17px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      animation: fadeUp 0.5s var(--win-ease) 0.15s both;
    }
    .post-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: var(--radius-md);
      background: var(--bg-mica); margin-bottom: 10px;
      text-decoration: none; transition: background var(--transition-fast);
      animation: fadeUp 0.5s var(--win-ease) both;
    }
    .post-item:hover { background: var(--bg-mica-hover); }
    .post-item .pi-title { flex: 1; color: var(--text-primary); font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .post-item .pi-likes { font-size: 12px; color: var(--danger); display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .post-item .pi-date { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }

    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--text-tertiary);
      background: var(--bg-mica); border-radius: var(--radius-md);
    }
    .empty-state i { font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.5; }
    .skeleton { height: 120px; border-radius: var(--radius-lg); background: var(--bg-mica); animation: pulse 1.4s ease infinite; margin-bottom: 16px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (max-width: 560px) { .container { padding: 72px 14px 60px; } .profile-card { padding: 22px; gap: 16px; } }
  </style>
</head>
<body>
  <!-- ================== 全局导航栏 ================== -->
  <header class="top-menu">
    <nav class="menu-bar mica" id="menuBar">
      <span class="menu-logo">KJLLin</span>
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="浅色/深色/自动"><i class="fas fa-circle-half-stroke"></i></button>
      <span id="userTag" class="menu-user-tag"></span>
      <button id="logoutBtn" class="menu-btn logout-btn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
      <button class="menu-btn hamburger" id="hamburgerBtn" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </nav>
    <div class="mobile-menu-dropdown mica" id="mobileMenu">
      <a href="/" class="menu-item"><i class="fas fa-home"></i> 首页</a>
      <a href="/chat" class="menu-item"><i class="fas fa-envelope"></i> 站内信</a>
      <a href="/game/" class="menu-item"><i class="fas fa-gamepad"></i> 游戏</a>
      <a href="/cloud/" class="menu-item"><i class="fas fa-cloud"></i> 云盘</a>
      <a href="/discuss/" class="menu-item"><i class="fas fa-comments"></i> 讨论</a>
      <a href="/u/" class="menu-item active"><i class="fas fa-circle-user"></i> 个人主页</a>
    </div>
  </header>

  <div class="container" id="main">
    <div class="skeleton" aria-hidden="true"></div>
    <div class="skeleton" aria-hidden="true" style="height:60px"></div>
  </div>

  <script src="/common.js"></script>
  <script>
    (function() {
      var $ = function(s) { return document.querySelector(s); };
      var sb = KJ.createSupabase();
      var currentUser = null;
      var profileUser = null;
      var following = false;

      // 主题
      var themeBtn = $('#themeBtn');
      function updateThemeUI() { var s = KJ.applyTheme('#f3f3f3', '#000'); themeBtn.innerHTML = KJ.getThemeIcon(s.mode); }
      themeBtn.addEventListener('click', function() { KJ.toggleTheme(); updateThemeUI(); });
      KJ.onSystemThemeChange(updateThemeUI); updateThemeUI();

      KJ.setupMobileMenu('#hamburgerBtn', '#mobileMenu');
      KJ.initNav(sb, { homeUrl: '/' });

      function esc(s) { return KJ.escapeHtml(s); }
      function fmtDate(iso) {
        if (!iso) return '--';
        var d = new Date(iso);
        return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function loginPrompt() {
        document.title = '登录后查看 · KJLLin';
        $('#main').innerHTML =
          '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both">' +
          '<i class="fas fa-user-lock"></i>' +
          '<div style="font-size:15px;margin-bottom:16px">登录后查看个人主页</div>' +
          '<a href="/login/?redirect=' + encodeURIComponent(location.pathname + location.search) + '" class="btn btn-primary">前往登录</a></div>';
      }

      function showNotFound(msg) {
        $('#main').innerHTML =
          '<div class="empty-state" style="animation:fadeUp .4s var(--win-ease) both">' +
          '<i class="fas fa-user-slash"></i>' +
          '<div style="font-size:15px;margin-bottom:8px">' + esc(msg || '用户不存在') + '</div>' +
          '<a href="/" class="btn">← 回到首页</a></div>';
      }

      async function resolveTargetId() {
        var params = new URLSearchParams(location.search);
        var id = (params.get('id') || '').trim();
        if (id) return id;
        // 未带 id：登录用户跳到自己的主页（形成独立网址）
        if (!sb) return null;
        try {
          var r = await sb.auth.getSession();
          var u = r && r.data && r.data.session && r.data.session.user;
          if (u) {
            // 规范化为独立网址，便于分享
            history.replaceState(null, '', '/u/?id=' + encodeURIComponent(u.id));
            return u.id;
          }
        } catch(e) {}
        return null;
      }

      async function loadProfile(targetId) {
        // 资料来自公开视图（匿名可读，不含邮箱）
        var pRes = await sb.from('profiles_public')
          .select('id,nick,is_admin,created_at')
          .eq('id', targetId).maybeSingle();
        if (pRes.error) throw pRes.error;
        if (!pRes.data) { showNotFound('找不到该用户'); return; }
        profileUser = pRes.data;

        // 统计：帖子数 / 获赞总数 / 粉丝 / 关注
        var stats = await Promise.all([
          sb.from('posts').select('id,likes_count').eq('user_id', targetId),
          sb.from('user_follows').select('follower_id', { count: 'exact', head: true }).eq('followed_id', targetId),
          sb.from('user_follows').select('followed_id', { count: 'exact', head: true }).eq('follower_id', targetId)
        ]);
        var posts = stats[0].data || [];
        var likesReceived = 0;
        posts.forEach(function(p) { likesReceived += (p.likes_count || 0); });
        var followers = stats[1].count || 0;
        var followingCount = stats[2].count || 0;

        // 我的关注状态
        var isSelf = currentUser && currentUser.id === targetId;
        if (currentUser && !isSelf) {
          try {
            var fRes = await sb.from('user_follows')
              .select('follower_id').eq('follower_id', currentUser.id).eq('followed_id', targetId).maybeSingle();
            following = !!(fRes && fRes.data);
          } catch(e) {}
        }

        var nick = profileUser.nick || '用户';
        document.title = nick + ' 的个人主页 · KJLLin';

        var html = '';

        // 资料卡
        html += '<div class="profile-card mica">' +
          '<div class="avatar">' + esc((nick || '?').charAt(0).toUpperCase()) + '</div>' +
          '<div class="profile-info">' +
            '<div class="profile-name">' + esc(nick) +
              (profileUser.is_admin === true ? '<span class="admin-badge"><i class="fas fa-shield-halved"></i> 管理员</span>' : '') +
            '</div>' +
            '<div class="profile-meta">' +
              '<span><i class="fas fa-calendar"></i> 注册于 ' + fmtDate(profileUser.created_at) + '</span>' +
              '<span><i class="fas fa-link"></i> <span class="mono">' + esc(targetId) + '</span></span>' +
            '</div>' +
          '</div>' +
          '<div class="profile-actions">' +
            (isSelf
              ? '<a href="/settings/" class="btn btn-primary"><i class="fas fa-gear"></i> 用户设置</a>' +
                '<a href="/settings/profile/" class="btn"><i class="fas fa-pen-to-square"></i> 编辑资料</a>'
              : (currentUser
                  ? '<button type="button" class="btn follow-btn' + (following ? ' following' : '') + '" id="followBtn">' +
                      (following ? '<i class="fas fa-check"></i> 已关注' : '<i class="fas fa-plus"></i> 关注') + '</button>'
                  : '')) +
            '<a href="/chat/" class="btn"><i class="fas fa-envelope"></i> 站内信</a>' +
          '</div>' +
        '</div>';

        // 统计
        html += '<div class="stat-grid">' +
          '<div class="stat-item"><div class="stat-value">' + posts.length + '</div><div class="stat-label">帖子</div></div>' +
          '<div class="stat-item"><div class="stat-value">' + likesReceived + '</div><div class="stat-label">获赞</div></div>' +
          '<div class="stat-item"><div class="stat-value">' + followers + '</div><div class="stat-label">粉丝</div></div>' +
          '<div class="stat-item"><div class="stat-value">' + followingCount + '</div><div class="stat-label">关注</div></div>' +
        '</div>';

        // 帖子区
        html += '<div class="section-title"><i class="fas fa-comments"></i> 最近发布的讨论</div>';
        html += '<div id="postList"></div>';

        $('#main').innerHTML = html;

        bindFollow(targetId, isSelf);
        await loadPosts(targetId);
      }

      async function loadPosts(targetId) {
        var listEl = $('#postList');
        try {
          var res = await sb.from('posts')
            .select('id,title,likes_count,created_at')
            .eq('user_id', targetId)
            .order('created_at', { ascending: false })
            .limit(20);
          if (res.error) throw res.error;
          var posts = res.data || [];
          if (posts.length === 0) {
            listEl.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>还没有发布过讨论</div>';
            return;
          }
          var html = '';
          posts.forEach(function(p, i) {
            html += '<a class="post-item" href="/discuss/view/?id=' + encodeURIComponent(p.id) + '" style="animation-delay:' + (0.05 + i * 0.03).toFixed(2) + 's">' +
              '<span class="pi-title">' + esc(p.title || '无标题') + '</span>' +
              '<span class="pi-likes"><i class="fas fa-heart"></i>' + (p.likes_count || 0) + '</span>' +
              '<span class="pi-date">' + fmtDate(p.created_at) + '</span>' +
            '</a>';
          });
          listEl.innerHTML = html;
        } catch(e) {
          listEl.innerHTML = '<div class="empty-state"><i class="fas fa-triangle-exclamation"></i>帖子加载失败，请刷新重试</div>';
        }
      }

      function bindFollow(targetId, isSelf) {
        if (isSelf || !currentUser) return;
        var btn = document.getElementById('followBtn');
        if (!btn) return;
        btn.addEventListener('click', async function() {
          if (!KJ.rateLimit('profile_follow', 800, 1)) return;
          var wasFollowing = following;
          following = !following;
          btn.classList.toggle('following', following);
          btn.innerHTML = following
            ? '<i class="fas fa-check"></i> 已关注'
            : '<i class="fas fa-plus"></i> 关注';
          try {
            var res = following
              ? await sb.from('user_follows').insert({ follower_id: currentUser.id, followed_id: targetId })
              : await sb.from('user_follows').delete().eq('follower_id', currentUser.id).eq('followed_id', targetId);
            if (res.error) throw res.error;
            // 刷新粉丝数
            var c = await sb.from('user_follows').select('follower_id', { count: 'exact', head: true }).eq('followed_id', targetId);
            var items = document.querySelectorAll('.stat-item');
            if (items[2] && c.count !== null && c.count !== undefined) items[2].querySelector('.stat-value').textContent = c.count;
          } catch(e) {
            following = wasFollowing;
            btn.classList.toggle('following', following);
            btn.innerHTML = following
              ? '<i class="fas fa-check"></i> 已关注'
              : '<i class="fas fa-plus"></i> 关注';
            KJ.toast('操作失败，请重试');
          }
        });
      }

      // ====================== 启动 ======================
      (async function init() {
        if (!sb) { loginPrompt(); return; }
        // 先确定登录态
        try {
          var r = await sb.auth.getSession();
          currentUser = (r && r.data && r.data.session && r.data.session.user) || null;
        } catch(e) { currentUser = null; }

        var targetId = await resolveTargetId();
        if (!targetId) { loginPrompt(); return; }
        if (!currentUser) {
          // 匿名访问他人主页：可用（公开数据），但关注按钮不渲染
        }
        try {
          await loadProfile(targetId);
        } catch(e) {
          console.warn('Load profile failed:', e);
          showNotFound('主页加载失败，请刷新重试');
        }
      })();
    })();
  </script>
</body>
</html>
